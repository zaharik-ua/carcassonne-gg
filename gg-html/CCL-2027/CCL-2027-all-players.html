<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- СТИЛІ -->
<style>
  :root {
    --main-bg-color: #15375c;
    --hover-bg-color: #0e2c4d;
    --accent-text-color: #fff;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Montserrat', sans-serif;
  }

  .group-section {
    margin: 5px 0;
  }

  .group-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 3px;
    color: #222;
  }

  .players-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .players-count {
    margin: 0;
  }

  .players-filters {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-label {
    font-size: 12px;
    font-weight: 600;
    color: #333;
  }

  .filter-chip-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-chip {
    border: 1px solid var(--main-bg-color);
    background-color: #fff;
    color: var(--main-bg-color);
    border-radius: 2px;
    padding: 1px 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .filter-chip.active {
    background-color: var(--hover-bg-color);
    border-color: var(--hover-bg-color);
    color: var(--accent-text-color);
  }

  .filter-chip:hover,
  .filter-chip:active {
    background-color: var(--hover-bg-color);
    border-color: var(--hover-bg-color);
    color: var(--accent-text-color);
  }

  .group-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;
    border-radius: 2px;
    box-shadow: 1.4px 1.4px 2px #b2b2b2;
    overflow: hidden;
  }

  .group-table th {
    background-color: var(--main-bg-color);
    color: var(--accent-text-color);
    font-weight: 600;
    padding: 6px;
    font-size: 15px;
    text-align: center;
  }

  .group-table tr:first-child th:nth-child(2) {
    text-align: left;
  }

  .group-table th.player-col,
  .group-table td.player-col {
    width: 1%;
    min-width: 160px;
    white-space: nowrap;
  }

  .group-table th.qualified-cell,
  .group-table td.qualified-cell {
    width: 28%;
    max-width: 220px;
  }

  .qualified-wrap {
    display: block;
    width: 100%;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  @media (max-width: 480px) {
    .group-table th.qualified-cell,
    .group-table td.qualified-cell {
      display: none;
    }
  }

  .group-table td {
    padding: 6px;
    font-size: 15px;
    line-height: 17px;
    border-top: 1px solid #ccc;
    text-align: center;
    background-color: #fff;
  }

  .group-table td a {
    color: #333;
    text-decoration: none;
    word-break: break-word;
  }

  .group-table td a:hover {
    color: #0277BD;
  }

  .players-name-wrap {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 2px 7px;
    flex-wrap: wrap;
    align-content: flex-start;
    width: 100%;
  }

  .country-wrap {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 2px 7px;
    flex-wrap: wrap;
    align-content: flex-start;
    width: 100%;
  }

  .players-name-wrap a {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 100%;
  }

  .players-name-wrap span {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 100%;
  }

  .country-flag {
    height: 18px;
    width: 22px;
    object-fit: cover;
  }

  .seeding-icon {
    width: 10px;
    height: auto;
    margin-left: 4px;
    display: inline-block;
  }

  .seeding-legend {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    margin-top: 6px;
    color: #333;
  }

  .seeding-legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .country-wrap span {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 100%;
    word-break: break-word;
    white-space: pre-line;
  }

  .player-logo {
    height: 18px;
    width: 18px;
    border: 0.5px solid #444;
    object-fit: contain;
    border-radius: 2px;
    vertical-align: middle;
  }

  .eliminated-row td {
    color: #9aa1ab;
  }

  .eliminated-row td img {
    opacity: 0.55;
  }

  .no-rating {
    color: #777;
    font-size: 12px;
    font-style: italic;
  }

  .elo-comment {
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.4;
  }
</style>

<!-- HTML -->
<div id="tab-players-content"></div>

<!-- СКРИПТ -->
<script>
  // --- DATA SOURCE: auth-server public API (CCL slots) ---
  const API_BASE = window.AUTH_BASE_URL || "https://api.carcassonne.gg";
  const currentTournamentId = "CCL-2027";
  let players = [];
  let phases = {};
  const PLAYER_STAGE_FILTERS = ["Main", "Q1", "Q2", "Q3"];
  const PLAYER_RESULT_FILTERS = [
    { value: "qualified", label: "Qualified" },
    { value: "eliminated", label: "Eliminated" }
  ];
  const playersFilterState = {
    registeredOnly: false,
    stages: new Set(),
    results: new Set()
  };

  function fetchTournamentsAndInit() {
    const dataUrl = `${API_BASE}/public/ccl/${encodeURIComponent(currentTournamentId)}/players`;

    fetch(dataUrl)
      .then(r => {
        if (!r.ok) throw new Error("Failed to fetch data");
        return r.json();
      })
      .then(data => {
        if (!data || !data.ok || !Array.isArray(data.all_players)) {
          const playersContainer = document.getElementById("tab-players-content");
          if (playersContainer) {
            playersContainer.textContent = "❌ Failed to load tournament data";
          }
          return;
        }

        // Rows come sorted by the server: association → stage → player; slots without association last.
        players = data.all_players;
        phases = data.phases || {};
        initAndRenderTournamentContent();
      })
      .catch(err => {
        console.error("❌ Failed to load tournament data", err);
        const playersContainer = document.getElementById("tab-players-content");
        if (playersContainer) {
          playersContainer.textContent = "❌ Failed to load tournament data";
        }
      });
  }

  function initAndRenderTournamentContent() {
    const playersContainer = document.getElementById("tab-players-content");
    if (playersContainer) {
      playersContainer.style.display = "block";
      renderPlayersTable();
    }

    return;
  }

  function formatEloDate(value) {
    const date = new Date(String(value || "").trim());
    if (!value || !Number.isFinite(date.getTime())) return "";
    const dd = String(date.getUTCDate()).padStart(2, "0");
    const mm = String(date.getUTCMonth() + 1).padStart(2, "0");
    return `${dd}.${mm}.${date.getUTCFullYear()}`;
  }

  function createFilterChip(label, isActive, onClick) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "filter-chip" + (isActive ? " active" : "");
    button.textContent = label;
    button.setAttribute("aria-pressed", isActive ? "true" : "false");
    button.addEventListener("click", onClick);
    return button;
  }

  function createChipFilterGroup(labelText, options, selected) {
    const group = document.createElement("div");
    group.className = "filter-group";
    const label = document.createElement("span");
    label.className = "filter-label";
    label.textContent = labelText;
    group.appendChild(label);

    const buttonsWrap = document.createElement("div");
    buttonsWrap.className = "filter-chip-group";
    options.forEach(option => {
      buttonsWrap.appendChild(createFilterChip(option.label, selected.has(option.value), () => {
        if (selected.has(option.value)) {
          selected.delete(option.value);
        } else {
          selected.add(option.value);
        }
        renderPlayersTable();
      }));
    });
    group.appendChild(buttonsWrap);
    return group;
  }

  function renderPlayersTable() {
    const playersContainer = document.getElementById("tab-players-content");
    if (!playersContainer) return;

    playersContainer.innerHTML = "";

    const tp = players || [];
    if (!tp.length) {
      playersContainer.textContent = "No registered players yet.";
      return;
    }

    const filtered = tp.filter(entry => {
      if (playersFilterState.registeredOnly && !(entry.player || "").trim()) {
        return false;
      }
      if (playersFilterState.stages.size > 0 && !playersFilterState.stages.has((entry.stage || "").trim())) {
        return false;
      }
      if (playersFilterState.results.size > 0 && !playersFilterState.results.has(entry.league_status || "")) {
        return false;
      }
      return true;
    });

    const totalCount = tp.length;
    const visibleCount = filtered.length;

    const section = document.createElement("div");
    section.className = "group-section";

    const headerRow = document.createElement("div");
    headerRow.className = "players-header-row";

    const title = document.createElement("div");
    title.className = "group-title players-count";
    title.textContent = totalCount === visibleCount
      ? `Players: ${visibleCount}`
      : `Players: ${visibleCount} / ${totalCount}`;
    headerRow.appendChild(title);

    const filtersWrapper = document.createElement("div");
    filtersWrapper.className = "players-filters";

    const registeredGroup = document.createElement("div");
    registeredGroup.className = "filter-group";
    registeredGroup.appendChild(createFilterChip("Registered", playersFilterState.registeredOnly, () => {
      playersFilterState.registeredOnly = !playersFilterState.registeredOnly;
      renderPlayersTable();
    }));
    filtersWrapper.appendChild(registeredGroup);

    filtersWrapper.appendChild(createChipFilterGroup(
      "Stage:",
      PLAYER_STAGE_FILTERS.map(stage => ({ value: stage, label: stage })),
      playersFilterState.stages
    ));

    // Qualification results appear once admins start marking them.
    if (tp.some(entry => entry.league_status) || playersFilterState.results.size > 0) {
      filtersWrapper.appendChild(createChipFilterGroup("Result:", PLAYER_RESULT_FILTERS, playersFilterState.results));
    }

    headerRow.appendChild(filtersWrapper);
    section.appendChild(headerRow);

    const table = document.createElement("table");
    table.className = "group-table";

    const headTr = document.createElement("tr");
    ["Country", "Player", "Elo *", "Qualified by", "Stage"].forEach(label => {
      const th = document.createElement("th");
      th.textContent = label;
      if (label === "Player" || label === "Qualified by" || label === "Country") {
        th.style.textAlign = "left";
      }
      if (label === "Player") {
        th.classList.add("player-col");
      }
      if (label === "Qualified by") {
        th.classList.add("qualified-cell");
      }
      headTr.appendChild(th);
    });
    table.appendChild(headTr);

    if (!filtered.length) {
      const emptyRow = document.createElement("tr");
      const emptyCell = document.createElement("td");
      emptyCell.colSpan = 5;
      emptyCell.style.textAlign = "center";
      emptyCell.style.padding = "12px";
      emptyCell.textContent = "No players match filters.";
      emptyRow.appendChild(emptyCell);
      table.appendChild(emptyRow);
      section.appendChild(table);
      playersContainer.appendChild(section);
      return;
    }

    // Slots without an association form the TBD group.
    const countryKeyOf = entry => entry.association_id || "";
    const countryCounts = filtered.reduce((acc, entry) => {
      const key = countryKeyOf(entry);
      acc[key] = (acc[key] || 0) + 1;
      return acc;
    }, {});
    const countryUsage = {};

    filtered.forEach(entry => {
      const tr = document.createElement("tr");
      if (entry.league_status === "eliminated") tr.className = "eliminated-row";

      const countryKey = countryKeyOf(entry);
      countryUsage[countryKey] = (countryUsage[countryKey] || 0) + 1;

      if (countryUsage[countryKey] === 1) {
        const countryTd = document.createElement("td");
        countryTd.style.padding = "4px 6px";
        countryTd.style.textAlign = "left";
        countryTd.style.verticalAlign = "middle";
        const countryWrap = document.createElement("div");
        countryWrap.className = "country-wrap";
        const countryName = countryKey ? (entry.country || countryKey) : "TBD";
        if (entry.flag) {
          const flagImg = document.createElement("img");
          flagImg.src = entry.flag;
          flagImg.className = "country-flag";
          flagImg.alt = countryName;
          countryWrap.appendChild(flagImg);
        }
        const countrySpan = document.createElement("span");
        countrySpan.textContent = countryName;
        countryWrap.appendChild(countrySpan);
        countryTd.appendChild(countryWrap);
        countryTd.rowSpan = countryCounts[countryKey] || 1;
        tr.appendChild(countryTd);
      }

      const playerTd = document.createElement("td");
      playerTd.style.textAlign = "left";
      playerTd.style.padding = "4px 6px";
      playerTd.classList.add("player-col");
      const playerWrap = document.createElement("div");
      playerWrap.className = "players-name-wrap";
      if (entry.avatar) {
        const avatarImg = document.createElement("img");
        avatarImg.src = entry.avatar;
        avatarImg.className = "player-logo";
        avatarImg.alt = entry.player || "";
        playerWrap.appendChild(avatarImg);
      }
      if (entry.player_id) {
        const playerLink = document.createElement("a");
        playerLink.href = `https://boardgamearena.com/player?id=${encodeURIComponent(entry.player_id)}`;
        playerLink.target = "_blank";
        playerLink.rel = "noopener";
        playerLink.textContent = entry.player || entry.player_id;
        playerWrap.appendChild(playerLink);
      } else {
        playerWrap.textContent = "-";
      }
      playerTd.appendChild(playerWrap);
      tr.appendChild(playerTd);

      // Elo is shown for Q slots once admins set it; the icon appears once pots are formed.
      const eloTd = document.createElement("td");
      eloTd.style.textAlign = "center";
      if (entry.elo_fixed) {
        const eloValue = document.createElement("span");
        if (entry.has_rating) {
          eloValue.textContent = String(Math.round(Number(entry.elo)));
        } else {
          eloValue.textContent = "no rating";
          eloValue.className = "no-rating";
        }
        eloTd.appendChild(eloValue);

        const seedingStatus = entry.seeding;
        if (seedingStatus === "Seeded" || seedingStatus === "Unseeded") {
          const seedingIcon = document.createElement("img");
          seedingIcon.src = seedingStatus === "Seeded"
            ? "https://carcassonne.gg/gallery/green-dot.png"
            : "https://carcassonne.gg/gallery/red-dot.png";
          seedingIcon.alt = `${seedingStatus} status icon`;
          seedingIcon.className = "seeding-icon";
          eloTd.appendChild(seedingIcon);
        }
      }
      tr.appendChild(eloTd);

      const qualifiedTd = document.createElement("td");
      qualifiedTd.style.textAlign = "left";
      qualifiedTd.style.padding = "4px 6px";
      qualifiedTd.classList.add("qualified-cell");
      const qualifiedWrap = document.createElement("div");
      qualifiedWrap.className = "qualified-wrap";
      const qualifiedName = entry.qualified_by_name || "";
      const qualifiedLink = entry.qualified_by_link || "";
      if (qualifiedName || qualifiedLink) {
        if (qualifiedLink) {
          const qualifiedAnchor = document.createElement("a");
          qualifiedAnchor.href = qualifiedLink;
          if (!qualifiedLink.includes("carcassonne.gg")) {
            qualifiedAnchor.target = "_blank";
            qualifiedAnchor.rel = "noopener";
          }
          qualifiedAnchor.textContent = qualifiedName || qualifiedLink;
          qualifiedWrap.appendChild(qualifiedAnchor);
        } else {
          qualifiedWrap.textContent = qualifiedName;
        }
      } else {
        qualifiedWrap.textContent = "-";
      }
      qualifiedTd.appendChild(qualifiedWrap);
      tr.appendChild(qualifiedTd);

      const stageTd = document.createElement("td");
      stageTd.textContent = entry.stage || "-";
      tr.appendChild(stageTd);

      table.appendChild(tr);
    });

    section.appendChild(table);
    playersContainer.appendChild(section);

    const eloDate = formatEloDate(phases?.qualification?.elo_set_at);
    const commentBlock = document.createElement("div");
    commentBlock.className = "elo-comment";
    commentBlock.textContent = eloDate
      ? `* player's GG Elo on ${eloDate}. Elo is shown for qualification players only.`
      : "* player's GG Elo. It is shown for qualification players once it is fixed for the draw.";
    playersContainer.appendChild(commentBlock);

    const legendBlock = document.createElement("div");
    legendBlock.className = "seeding-legend";

    const makeLegendItem = (iconSrc, text, altText) => {
      const item = document.createElement("div");
      item.className = "seeding-legend-item";
      const icon = document.createElement("img");
      icon.src = iconSrc;
      icon.alt = altText;
      icon.className = "seeding-icon";
      icon.style.marginLeft = "0";
      const label = document.createElement("span");
      label.textContent = text;
      item.appendChild(icon);
      item.appendChild(label);
      return item;
    };

    legendBlock.appendChild(makeLegendItem("https://carcassonne.gg/gallery/green-dot.png", "Seeded", "Seeded icon"));
    legendBlock.appendChild(makeLegendItem("https://carcassonne.gg/gallery/red-dot.png", "Unseeded", "Unseeded icon"));

    playersContainer.appendChild(legendBlock);
  }

  function runWhenReady(callback) {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", callback);
    } else {
      callback();
    }
  }

  runWhenReady(() => {
    fetchTournamentsAndInit();
  });

</script>
