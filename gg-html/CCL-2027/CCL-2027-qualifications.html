  function drawPlayoffLines(groupedByRound, sortedRounds, container) {
    const matchById = {};
    Object.values(groupedByRound).flat().forEach(m => {
      matchById[m.knockout_id] = m;
    });

    const playoffConnectors = [];
    sortedRounds.forEach(roundNum => {
      groupedByRound[roundNum].forEach(match => {
        if (!match.next_game_win) return;
        const from = matchById[match.knockout_id];
        const to = matchById[match.next_game_win];
        if (!from || !to) return;

        const fromLeft = from.cord_left;
        const fromTop = from.cord_top;
        const toLeft = to.cord_left;
        const toTop = to.cord_top;

        const yFrom = fromTop + MATCH_HEIGHT / 2 - 1;
        const yTo = toTop + MATCH_HEIGHT / 2 - 1;
        const xFrom = fromLeft + MATCH_WIDTH;
        const xTo = toLeft;

        const connector = {
          game_from: match.knockout_id,
          game_to: match.next_game_win,
          lines: []
        };

        if (yFrom === yTo) {
          connector.lines.push({
            x1: xFrom,
            y1: yFrom,
            x2: xTo,
            y2: yTo
          });
        } else {
          const midX = fromLeft + MATCH_WIDTH + HORIZONTAL_SPACING / 2;
          const preX = toLeft - HORIZONTAL_SPACING / 2;
          const adjustedY2 = fromTop > toTop ? yTo + 5 : yTo - 5;

          connector.lines.push({
            x1: xFrom,
            y1: yFrom,
            x2: midX + 2,
            y2: yFrom
          });
          connector.lines.push({
            x1: midX,
            y1: yFrom,
            x2: midX,
            y2: adjustedY2
          });
          connector.lines.push({
            x1: preX + 3,
            y1: yTo,
            x2: xTo,
            y2: yTo
          });
        }

        playoffConnectors.push(connector);
      });
    });

    playoffConnectors.forEach(connector => {
      connector.lines.forEach(lineCoords => {
        const isHorizontal = lineCoords.y1 === lineCoords.y2;
        const lineDiv = document.createElement("div");
        lineDiv.style.position = "absolute";
        lineDiv.style.backgroundColor = "#ccc";
        lineDiv.style.zIndex = "0";

        if (isHorizontal) {
          lineDiv.style.left = `${lineCoords.x1}px`;
          lineDiv.style.top = `${lineCoords.y1}px`;
          lineDiv.style.width = `${lineCoords.x2 - lineCoords.x1}px`;
          lineDiv.style.height = "2px";
        } else {
          lineDiv.style.left = `${lineCoords.x1}px`;
          lineDiv.style.top = `${Math.min(lineCoords.y1, lineCoords.y2)}px`;
          lineDiv.style.width = "2px";
          lineDiv.style.height = `${Math.abs(lineCoords.y2 - lineCoords.y1)}px`;
        }

        container.appendChild(lineDiv);
      });
    });

    // Render knockout_stage text centered on the incoming connector line
    const renderedInlineLabels = new Set();
    playoffConnectors.forEach(connector => {
      const target = matchById[connector.game_to];
      if (!isInlineKnockoutStageNode(target)) return;
      const key = String(target.knockout_id || "");
      if (!key || renderedInlineLabels.has(key)) return;

      const stageText = String(target.knockout_stage || "").trim();
      if (!stageText) return;
      const horizontalSegments = connector.lines.filter(line => line.y1 === line.y2);
      if (!horizontalSegments.length) return;
      const segment = horizontalSegments[horizontalSegments.length - 1];

      const label = document.createElement("div");
      label.className = "knockout-stage-inline-label";
      label.textContent = stageText;
      label.style.left = `${segment.x2 + 8}px`;
      label.style.top = `${segment.y1}px`;
      container.appendChild(label);
      renderedInlineLabels.add(key);
    });
  }
  function renderDoubleElimination(playoffMatches, containerOverride, tournamentType) {
    
    // Optionally override THIRD_PLACE_VERTICAL_OFFSET from currentTournament (ignore null/empty)
    if (currentTournament && currentTournament.hasOwnProperty('third_place_vertical_offset')) {
      const tpo = currentTournament.third_place_vertical_offset;
      if (tpo !== null && tpo !== "" && tpo !== undefined) {
        const parsed = Number(tpo);
        if (!Number.isNaN(parsed)) {
          THIRD_PLACE_VERTICAL_OFFSET = parsed;
        }
      }
    }

    // Optionally override MATCH_WIDTH from currentTournament (ignore null/empty)
    if (currentTournament && currentTournament.hasOwnProperty('match_width')) {
      const mw = currentTournament.match_width;
      if (mw !== null && mw !== "" && mw !== undefined) {
        const parsedMw = Number(mw);
        if (!Number.isNaN(parsedMw)) {
          MATCH_WIDTH = parsedMw;
        }
      }
    }
    // Build layout and UI for playoff bracket including match positions, labels, and connectors
    let container;
    let bracketDiv;
    if (containerOverride) {
      container = containerOverride;
      container.innerHTML = '';
      // Add a scrollable wrapper
      const scrollWrapper = document.createElement("div");
      scrollWrapper.className = "playoff-scroll-wrapper";
      // Add a wrapper for the bracket
      bracketDiv = document.createElement("div");
      bracketDiv.id = "playoff-bracket";
      bracketDiv.style.position = "relative";
      scrollWrapper.appendChild(bracketDiv);
      container.appendChild(scrollWrapper);
      container = bracketDiv;
      // Floating fullscreen button inside bracket
      const expandBtn = document.createElement("button");
      expandBtn.className = "expand-bracket-btn expand-bracket-floating";
      expandBtn.title = "Відкрити на весь екран";
      expandBtn.innerHTML = '<i class="fas fa-up-right-and-down-left-from-center"></i>';
      container.appendChild(expandBtn);
      expandBtn.addEventListener('click', () => openBracketFullscreen(scrollWrapper));
    } else {
      // fallback: legacy behavior
      container = document.getElementById("playoff-bracket");
      container.innerHTML = '';
      container.style.position = "relative";
    }

    // 1) Split matches by multiple_elimination_stage
    const stageGroups = {};
    (playoffMatches || []).forEach(m => {
      const key = (m.multiple_elimination_stage ?? '').toString();
      if (!stageGroups[key]) stageGroups[key] = [];
      stageGroups[key].push(m);
    });
    // 2) Sort groups alphabetically by stage key
    const stageOrder = Object.keys(stageGroups).sort((a, b) => a.localeCompare(b));
    // Track global sizing across all groups
    let cumulativeTopOffset = 0;
    let globalMaxLeft = 0;
    // 3) Process each group sequentially
    stageOrder.forEach(stageKey => {
      const stageMatches = stageGroups[stageKey];
      if (!stageMatches || !stageMatches.length) return;
      // Group by round within this stage
      const groupedByRound = {};
      stageMatches.forEach(match => {
        const roundNum = Number(match.round_order);
        if (!groupedByRound[roundNum]) groupedByRound[roundNum] = [];
        groupedByRound[roundNum].push(match);
      });
      const sortedRounds = Object.keys(groupedByRound).map(Number).sort((a, b) => a - b);
      const roundIndexMap = {};
      sortedRounds.forEach((r, i) => roundIndexMap[r] = i);

      // Compute coordinates for this stage
      calculatePlayoffMatchCoordinates(groupedByRound, sortedRounds, roundIndexMap, stageMatches, currentTournamentId);
      // Create a sub-container for this stage to apply vertical offset cleanly
      const stageContainer = document.createElement("div");
      stageContainer.style.position = "absolute";
      stageContainer.style.left = "0px";
      stageContainer.style.top = `${cumulativeTopOffset}px`;
      stageContainer.style.width = "max-content";
      container.appendChild(stageContainer);
      // Render matches and lines for this stage inside the sub-container
      renderPlayoffMatches(groupedByRound, sortedRounds, roundIndexMap, tournamentType, stageContainer);
      drawPlayoffLines(groupedByRound, sortedRounds, stageContainer);
      // Update global sizing info
      const allStageMatches = Object.values(groupedByRound).flat();
      const stageMaxBottom = Math.max(...allStageMatches.map(m => m.cord_bottom || 0));
      const stageMaxLeft = Math.max(...allStageMatches.map(m => m.cord_left || 0));

      globalMaxLeft = Math.max(globalMaxLeft, stageMaxLeft);
      cumulativeTopOffset += stageMaxBottom + BRACKET_MARGIN; // space between stages
    });

    // 4) After all groups, set container dimensions
    container.style.height = `${cumulativeTopOffset}px`;
    container.style.width = `${globalMaxLeft + MATCH_WIDTH + BRACKET_MARGIN}px`;

    // 5) Hover highlight across entire bracket container
    const playoffContainer = container;
    playoffContainer.querySelectorAll(".match-row-winner, .match-row-loser").forEach(row => {
      if (tournamentType !== "TEAM" && !row.hasAttribute("data-player-id")) return;

      const playerName = row.getAttribute("data-opponent-name");
      if (playerName !== null && playerName !== "") {
        const opponentSelector = `[data-opponent-name="${playerName}"]${tournamentType === "TEAM" ? "" : "[data-player-id]"}`;
        row.addEventListener("mouseenter", () => {
          playoffContainer.querySelectorAll(opponentSelector).forEach(el => {
            el.classList.add("highlight-player");
          });
        });

        row.addEventListener("mouseleave", () => {
          playoffContainer.querySelectorAll(opponentSelector).forEach(el => {
            el.classList.remove("highlight-player");
          });
        });
      }
    });
  }

  // === MATCH DETAILS POPUP (same as the duel popup in matches.html) ===
  const BGA_ICON_URL = "https://carcassonne.gg/gallery/bga-logo.png";
  const CARCASSONNE_LAB_ICON_URL = "https://carcassonne.gg/gallery/carcassonne-lab-icon.png";
  let duelDetailsPromise = null;

  // Games, streams and player data of the tournament's duels (the endpoint matches.html uses),
  // plus GG profiles for ratings. Failures leave the popup with the bracket data only.
  function loadDuelDetails() {
    if (duelDetailsPromise) return duelDetailsPromise;
    const fetchOptionalJson = (url) => fetch(url, { cache: "no-store" })
      .then(res => (res.ok ? res.json() : {}))
      .catch(() => ({}));
    duelDetailsPromise = Promise.all([
      fetchOptionalJson(`${API_BASE}/public/main-page-matches?tournament_id=${encodeURIComponent(currentTournamentId)}`),
      fetchOptionalJson(`${API_BASE}/profiles/public`),
      fetchOptionalJson(`${API_BASE}/teams`),
    ]).then(([matchesPayload, profilesPayload, teamsPayload]) => {
      const cclDuelsById = new Map();
      (Array.isArray(matchesPayload?.ccl_duels) ? matchesPayload.ccl_duels : []).forEach(duel => {
        const id = String(duel?.id || "").trim();
        if (id) cclDuelsById.set(id, duel);
      });
      return {
        cclDuelsById,
        playerDetailsById: buildChallengePlayerDetailsIndex(profilesPayload, teamsPayload),
      };
    });
    return duelDetailsPromise;
  }

  function buildBgaAvatarUrl(playerId, avatarValue) {
    const playerIdText = String(playerId || "").trim();
    const avatarText = String(avatarValue || "").trim();
    if (!avatarText) return "";
    if (/^https?:\/\//i.test(avatarText)) {
      // Repair saved BGA photo URLs that use the old 100-million folder boundary.
      return avatarText.replace(
        /^(https?:\/\/x\.boardgamearena\.net\/data\/avatar\/)\d+\/\d+\/\d+\/(\d+)(_\d+\.[a-z0-9]+)(?=[?#]|$)/i,
        (_match, base, photoPlayerId, imageSuffix) => {
          const id = Number(photoPlayerId);
          return `${base}${Math.floor(id / 1000000000)}/${Math.floor(id / 1000000)}/${Math.floor(id / 1000)}/${photoPlayerId}${imageSuffix}`;
        }
      );
    }
    if (avatarText === "x00000") return "https://x.boardgamearena.net/data/avatar/default_184.jpg";

    const defaultMatch = avatarText.match(/^_def_(\d+)$/);
    if (defaultMatch) {
      return `https://x.boardgamearena.net/data/avatar/defaults/default-${defaultMatch[1].padStart(4, "0")}.jpg`;
    }

    if (!/^\d+$/.test(playerIdText)) return "";
    const playerIdNumber = Number(playerIdText);
    if (!Number.isFinite(playerIdNumber)) return "";
    const firstFolder = String(Math.floor(playerIdNumber / 1000000000));
    const secondFolder = String(Math.floor(playerIdNumber / 1000000));
    const thirdFolder = String(Math.floor(playerIdNumber / 1000));
    return `https://x.boardgamearena.net/data/avatar/${firstFolder}/${secondFolder}/${thirdFolder}/${playerIdText}_184.jpg?h=${encodeURIComponent(avatarText)}`;
  }

  function buildChallengePlayerDetailsIndex(profilesPayload, teamsPayload) {
    const profiles = Array.isArray(profilesPayload?.profiles) ? profilesPayload.profiles : [];
    const teamList = Array.isArray(teamsPayload?.teams) ? teamsPayload.teams : [];
    const teamsById = new Map(
      teamList.map((team) => [String(team?.id || "").trim().toUpperCase(), team]).filter(([id]) => Boolean(id))
    );
    const profileId = (profile) => String(profile?.id ?? profile?.player_id ?? "").trim();
    const ratingProfiles = profiles.filter((profile) => {
      const rawElo = String(profile?.gg_elo ?? "").trim();
      return profileId(profile) && rawElo !== "" && Number.isFinite(Number(rawElo)) && Number(rawElo) > 0;
    });
    const fallbackRankById = new Map(
      ratingProfiles
        .slice()
        .sort((a, b) => Number(b.gg_elo) - Number(a.gg_elo))
        .map((profile, index) => [profileId(profile), index + 1])
    );
    const ratingsById = new Map();
    ratingProfiles.forEach((profile) => {
      const id = profileId(profile);
      const position = Number(profile?.gg_rating_position);
      ratingsById.set(id, {
        elo: Math.trunc(Number(profile.gg_elo)),
        rank: Number.isFinite(position) && position > 0
          ? Math.trunc(position)
          : fallbackRankById.get(id),
      });
    });

    return new Map(profiles.map((profile) => {
      const id = profileId(profile);
      const associationId = String(profile?.association || "").trim().toUpperCase();
      const team = teamsById.get(associationId) || null;
      const rating = ratingsById.get(id) || null;
      return [id, {
        id,
        nickname: String(profile?.bga_nickname || profile?.nickname || id).trim(),
        name: String(profile?.name || "").trim(),
        avatar: buildBgaAvatarUrl(id, profile?.avatar),
        flag: String(team?.flag || team?.logo || "").trim(),
        country: String(team?.name || associationId).trim(),
        elo: rating?.elo ?? null,
        rank: rating?.rank ?? null,
        bgaElo: Number.isFinite(Number(profile?.bga_elo)) && Number(profile.bga_elo) > 0
          ? Math.trunc(Number(profile.bga_elo))
          : null,
      }];
    }).filter(([id]) => Boolean(id)));
  }

  // Player of one side: GG profile first, then the duel row of main-page-matches, then the bracket.
  // The flag and country are the ones the bracket shows (the association the player plays for).
  function getBracketPlayerDetails(bracketDuel, cclDuel, side, playerDetailsById) {
    const id = String(bracketDuel?.[`player${side}_id`] || "").trim();
    const indexed = playerDetailsById.get(id) || null;
    const ccl = cclDuel && String(cclDuel[`player_${side}_id`] || "").trim() === id ? cclDuel : null;
    const bracketName = String(bracketDuel?.[`player${side}`] || "").trim();
    const bracketAvatar = players.find(pl => String(pl.player_id || "").trim() === id)?.avatar;
    const countryInfo = findPlayerCountryInfo(id, bracketName);
    return {
      id,
      nickname: String(indexed?.nickname || ccl?.[`player_${side}_name`] || bracketName || id).trim(),
      name: String(indexed?.name || ccl?.[`player_${side}_real_name`] || "").trim(),
      avatar: String(
        indexed?.avatar
        || buildBgaAvatarUrl(id, ccl?.[`player_${side}_avatar`])
        || buildBgaAvatarUrl(id, bracketAvatar)
        || ""
      ).trim(),
      flag: String(countryInfo?.flag || ccl?.[`player_${side}_association_flag`] || indexed?.flag || "").trim(),
      country: String(countryInfo?.country || ccl?.[`player_${side}_association_name`] || indexed?.country || "").trim(),
      elo: indexed?.elo ?? ccl?.[`player_${side}_gg_elo`] ?? null,
      rank: indexed?.rank ?? ccl?.[`player_${side}_gg_rank`] ?? null,
      bgaElo: indexed?.bgaElo ?? ccl?.[`player_${side}_bga_elo`] ?? null,
    };
  }

  // Popup model in the shape the matches.html popup uses.
  function buildPopupMatch(bracketDuel, details) {
    const cclDuel = details.cclDuelsById.get(String(bracketDuel.duel_id || "").trim()) || null;
    const hasBracketScore = String(bracketDuel.score1 ?? "").trim() !== "" && String(bracketDuel.score2 ?? "").trim() !== "";
    return {
      team1: bracketDuel.player1,
      team2: bracketDuel.player2,
      format: String(cclDuel?.duel_format || bracketDuel.duel_format || "").trim(),
      status: String(cclDuel?.status || bracketDuel.status || "").trim(),
      gw1: cclDuel ? cclDuel.dw1 : (hasBracketScore ? bracketDuel.score1 : null),
      gw2: cclDuel ? cclDuel.dw2 : (hasBracketScore ? bracketDuel.score2 : null),
      games: Array.isArray(cclDuel?.games) ? cclDuel.games.filter(Boolean) : [],
      ...normalizeStreamFields(cclDuel),
      player1Details: getBracketPlayerDetails(bracketDuel, cclDuel, 1, details.playerDetailsById),
      player2Details: getBracketPlayerDetails(bracketDuel, cclDuel, 2, details.playerDetailsById),
    };
  }

  function getPlayerInitials(player) {
    const source = String(player?.nickname || player?.name || "?").trim();
    const parts = source.split(/\s+/).filter(Boolean);
    return (parts.length > 1 ? `${parts[0][0]}${parts[1][0]}` : source.slice(0, 2)).toUpperCase();
  }

  function isTruthyOne(value) {
    return value === 1 || value === true || String(value || "").trim() === "1";
  }

  function getCarcassonneLabUrl(value) {
    const raw = String(value || "").trim();
    if (!raw) return "";
    try {
      const url = new URL(raw);
      if (url.protocol !== "https:" || url.hostname !== "www.carcassonnelab.com") return "";
      if (!url.hash.startsWith("#/")) return "";
      return url.href;
    } catch (_error) {
      return "";
    }
  }

  function createMatchFormatBadge(formatValue, badgeClass) {
    const rawFormat = typeof formatValue === "string" ? formatValue.trim() : "";
    const formatKey = rawFormat.toLowerCase();
    if (!rawFormat || !["bo1", "bo3", "bo5"].includes(formatKey)) return null;

    const badge = document.createElement("div");
    badge.className = `${badgeClass} ${formatKey}`;
    badge.textContent = rawFormat;
    return badge;
  }

  // Keep stream links, streamer icons and streamer names index-aligned.
  function normalizeStreamFields(source) {
    const links = Array.isArray(source?.streams) ? source.streams : [];
    const icons = Array.isArray(source?.streamers) ? source.streamers : [];
    const names = Array.isArray(source?.streamer_names) ? source.streamer_names : [];
    const result = { streams: [], streamers: [], streamer_names: [] };
    const count = Math.max(links.length, icons.length);
    for (let index = 0; index < count; index += 1) {
      const link = String(links[index] || "").trim();
      const icon = String(icons[index] || "").trim();
      if (!link && !icon) continue;
      result.streams.push(link);
      result.streamers.push(icon);
      result.streamer_names.push(String(names[index] || "").trim());
    }
    return result;
  }

  function createChallengePlayerCard(player, side) {
    const card = document.createElement("section");
    card.className = `challenge-match-player challenge-match-player--${side}`;
    const eloValue = Number(player?.elo);
    const hasRating = Number.isFinite(eloValue) && eloValue > 0;
    const bgaEloValue = Number(player?.bgaElo);
    const hasBgaRating = Number.isFinite(bgaEloValue) && bgaEloValue > 0;

    const rating = document.createElement("div");
    rating.className = "challenge-match-player__rating";
    const rank = document.createElement("span");
    rank.className = "challenge-match-player__rank";
    rank.textContent = hasRating && player?.rank ? `#${player.rank}` : "New";
    const ratings = document.createElement("span");
    ratings.className = "challenge-match-player__ratings";
    const elo = document.createElement("span");
    elo.className = "challenge-match-player__rating-line";
    if (hasRating) {
      const eloLabel = document.createElement("span");
      eloLabel.textContent = "GG Elo:";
      const eloRating = document.createElement("span");
      eloRating.className = "challenge-match-player__rating-value";
      eloRating.textContent = String(Math.trunc(eloValue));
      elo.appendChild(eloLabel);
      elo.appendChild(eloRating);
    } else {
      elo.classList.add("challenge-match-player__rating-value");
      elo.textContent = "Unrated";
    }
    ratings.appendChild(elo);

    const bgaElo = document.createElement("span");
    bgaElo.className = "challenge-match-player__rating-line";
    const bgaEloLabel = document.createElement("span");
    bgaEloLabel.textContent = "BGA Elo:";
    const bgaEloRating = document.createElement("span");
    bgaEloRating.className = "challenge-match-player__rating-value";
    bgaEloRating.textContent = hasBgaRating ? String(Math.trunc(bgaEloValue)) : "Unrated";
    bgaElo.appendChild(bgaEloLabel);
    bgaElo.appendChild(bgaEloRating);
    ratings.appendChild(bgaElo);
    rating.appendChild(rank);
    rating.appendChild(ratings);
    card.appendChild(rating);

    const profile = document.createElement("div");
    profile.className = "challenge-match-player__profile";
    if (player?.avatar) {
      const avatar = document.createElement("img");
      avatar.className = "challenge-match-player__avatar";
      avatar.src = player.avatar;
      avatar.alt = "";
      avatar.loading = "lazy";
      profile.appendChild(avatar);
    } else {
      const avatarFallback = document.createElement("span");
      avatarFallback.className = "challenge-match-player__avatar challenge-match-player__avatar-fallback";
      avatarFallback.textContent = getPlayerInitials(player);
      profile.appendChild(avatarFallback);
    }

    const info = document.createElement("div");
    info.className = "challenge-match-player__info";
    const nickname = document.createElement("a");
    nickname.className = "challenge-match-player__nickname";
    nickname.href = `https://carcassonne.gg/player/?id=${encodeURIComponent(String(player?.id || ""))}`;
    nickname.textContent = player?.nickname || player?.id || "Unknown player";
    info.appendChild(nickname);

    const realName = String(player?.name || "").trim();
    if (realName) {
      const name = document.createElement("span");
      name.className = "challenge-match-player__name";
      name.textContent = realName;
      info.appendChild(name);
    }

    const countryRow = document.createElement("div");
    countryRow.className = "challenge-match-player__country-row";
    if (player?.flag) {
      const flag = document.createElement("img");
      flag.className = "challenge-match-player__flag";
      flag.src = player.flag;
      flag.alt = "";
      countryRow.appendChild(flag);
    }
    const country = document.createElement("span");
    country.className = "challenge-match-player__country";
    country.textContent = player?.country || "—";
    countryRow.appendChild(country);
    info.appendChild(countryRow);

    // BGA profile link, as on player-card.html.
    const bgaId = String(player?.id || "").trim();
    if (bgaId) {
      const bgaLink = document.createElement("a");
      bgaLink.className = "challenge-match-player__bga-link";
      bgaLink.href = `https://boardgamearena.com/player?id=${encodeURIComponent(bgaId)}`;
      bgaLink.target = "_blank";
      bgaLink.rel = "noopener noreferrer";
      const bgaLogo = document.createElement("img");
      bgaLogo.src = BGA_ICON_URL;
      bgaLogo.alt = "BGA";
      bgaLink.appendChild(bgaLogo);
      bgaLink.appendChild(document.createTextNode("BGA profile"));
      info.appendChild(bgaLink);
    }
    profile.appendChild(info);
    card.appendChild(profile);

    return card;
  }

  function createChallengeMatchResult(match) {
    const normalizedStatus = String(match?.status || "").trim().toLowerCase();
    const isInProgress = normalizedStatus === "in progress";
    const isCompleted = normalizedStatus === "done" || normalizedStatus === "completed";
    if (!isInProgress && !isCompleted) return null;

    const games = (Array.isArray(match?.games) ? match.games : [])
      .map((game) => {
        const player1Score = game?.player_1_score;
        const player2Score = game?.player_2_score;
        const tableId = String(game?.bga_table_id || "").trim();
        const player1Clock = isTruthyOne(game?.player_1_clock);
        const player2Clock = isTruthyOne(game?.player_2_clock);
        const carcassonneLabUrl = getCarcassonneLabUrl(game?.carcassonne_lab_url);
        const hasPlayer1Score = player1Score !== null && player1Score !== undefined && String(player1Score).trim() !== "";
        const hasPlayer2Score = player2Score !== null && player2Score !== undefined && String(player2Score).trim() !== "";
        return hasPlayer1Score && hasPlayer2Score
          ? { player1Score, player2Score, player1Clock, player2Clock, tableId, carcassonneLabUrl }
          : null;
      })
      .filter(Boolean);

    const hasMatchScore = match?.gw1 !== null && match?.gw1 !== undefined && String(match.gw1).trim() !== ""
      && match?.gw2 !== null && match?.gw2 !== undefined && String(match.gw2).trim() !== "";
    if (!hasMatchScore && !games.length) return null;

    let score1 = hasMatchScore ? match.gw1 : 0;
    let score2 = hasMatchScore ? match.gw2 : 0;
    if (!hasMatchScore) {
      games.forEach((game) => {
        if (game.player1Clock !== game.player2Clock) {
          if (game.player1Clock) score2 += 1;
          if (game.player2Clock) score1 += 1;
          return;
        }
        const gameScore1 = Number(game.player1Score);
        const gameScore2 = Number(game.player2Score);
        if (!Number.isFinite(gameScore1) || !Number.isFinite(gameScore2)) return;
        if (gameScore1 > gameScore2) score1 += 1;
        if (gameScore2 > gameScore1) score2 += 1;
      });
    }

    const result = document.createElement("section");
    result.className = "challenge-match-result";

    const status = document.createElement("div");
    status.className = `challenge-match-result__status${isCompleted ? " challenge-match-result__status--completed" : ""}`;
    status.textContent = isCompleted ? "COMPLETED" : "IN PROGRESS";
    result.appendChild(status);

    const score = document.createElement("div");
    score.className = "challenge-match-result__score";
    score.textContent = `${score1} - ${score2}`;
    result.appendChild(score);

    if (games.length) {
      const gameScores = document.createElement("div");
      gameScores.className = "challenge-match-result__games";
      const bgaRow = document.createElement("div");
      const bgaLinks = document.createElement("div");
      const bgaIcon = document.createElement("img");
      bgaRow.className = "challenge-match-result__games-row";
      bgaLinks.className = "challenge-match-result__games-links";
      bgaIcon.className = "challenge-match-result__games-source-icon";
      bgaIcon.src = BGA_ICON_URL;
      bgaIcon.alt = "BGA";
      bgaIcon.loading = "lazy";
      bgaRow.appendChild(bgaIcon);
      bgaRow.appendChild(bgaLinks);

      const labRow = document.createElement("div");
      const labLinks = document.createElement("div");
      const labIcon = document.createElement("img");
      labRow.className = "challenge-match-result__games-row";
      labLinks.className = "challenge-match-result__games-links";
      labIcon.className = "challenge-match-result__games-source-icon";
      labIcon.src = CARCASSONNE_LAB_ICON_URL;
      labIcon.alt = "CarcassonneLab";
      labIcon.loading = "lazy";
      labRow.appendChild(labIcon);
      labRow.appendChild(labLinks);

      games.forEach((game) => {
        const badge = document.createElement(game.tableId ? "a" : "span");
        badge.className = "challenge-match-result__game";
        const hasClockLoss = game.player1Clock !== game.player2Clock;
        if (hasClockLoss) {
          badge.classList.add("challenge-match-result__game--clock");
          const clock = document.createElement("i");
          clock.className = "fa-regular fa-clock challenge-match-result__game-clock";
          const clockScore = document.createElement("span");
          clockScore.textContent = game.player1Clock ? "0:1" : "1:0";
          badge.appendChild(clock);
          badge.appendChild(clockScore);
        } else {
          const player1Score = Number(game.player1Score);
          const player2Score = Number(game.player2Score);
          if (Number.isFinite(player1Score) && Number.isFinite(player2Score)) {
            if (player1Score > player2Score) {
              badge.classList.add("challenge-match-result__game--player-1");
            } else if (player2Score > player1Score) {
              badge.classList.add("challenge-match-result__game--player-2");
            }
          }
          badge.textContent = `${game.player1Score}:${game.player2Score}`;
        }
        if (game.tableId) {
          badge.href = `https://boardgamearena.com/table?table=${encodeURIComponent(game.tableId)}`;
          badge.target = "_blank";
          badge.rel = "noopener noreferrer";
          badge.title = "Open game on Board Game Arena";
        }
        bgaLinks.appendChild(badge);

        if (game.carcassonneLabUrl) {
          const labBadge = document.createElement("a");
          labBadge.className = badge.className;
          Array.from(badge.childNodes).forEach((node) => {
            labBadge.appendChild(node.cloneNode(true));
          });
          labBadge.href = game.carcassonneLabUrl;
          labBadge.target = "_blank";
          labBadge.rel = "noopener noreferrer";
          labBadge.title = "Review game in CarcassonneLab";
          labBadge.setAttribute(
            "aria-label",
            `Review game ${badge.textContent.trim()} in CarcassonneLab`
          );
          labLinks.appendChild(labBadge);
        }
      });
      gameScores.appendChild(bgaRow);
      if (labLinks.childNodes.length) gameScores.appendChild(labRow);
      result.appendChild(gameScores);
    }

    return result;
  }

  // Streams of the duel, rendered like the main event streams in matches.html.
  function createChallengeMatchStreams(match) {
    if (!Array.isArray(match?.streamers)) return null;
    const streamUrls = Array.isArray(match?.streams) ? match.streams : [];
    const streamerNames = Array.isArray(match?.streamer_names) ? match.streamer_names : [];
    const section = document.createElement("section");
    section.className = "challenge-match-streams";
    match.streamers.forEach((iconUrl, index) => {
      const normalizedIconUrl = String(iconUrl || "").trim();
      const streamerName = String(streamerNames[index] || "").trim();
      if (!normalizedIconUrl && !streamerName) return;
      const streamUrl = String(streamUrls[index] || "").trim();
      const stream = document.createElement(streamUrl ? "a" : "span");
      stream.className = "challenge-match-stream";
      if (streamUrl) {
        stream.href = streamUrl;
        stream.target = "_blank";
        stream.rel = "noopener noreferrer";
      }
      if (normalizedIconUrl) {
        const icon = document.createElement("img");
        icon.className = "stream-icon";
        icon.src = normalizedIconUrl;
        icon.alt = streamerName ? "" : "Stream";
        stream.appendChild(icon);
      }
      if (streamerName) {
        const name = document.createElement("span");
        name.className = "challenge-match-stream__name";
        name.textContent = streamerName;
        stream.title = streamerName;
        stream.appendChild(name);
      }
      section.appendChild(stream);
    });
    return section.childNodes.length ? section : null;
  }

  // "Group A · Round 1 · 22 Nov 14:30" (local time), or the round's week when no time is set.
  function getPopupMetaText(bracketDuel) {
    const rawRound = String(bracketDuel?.round || "").trim();
    const idx = rawRound.indexOf(":");
    const roundTitle = (idx === -1 ? rawRound : rawRound.slice(0, idx)).trim();
    const roundDates = idx === -1 ? "" : rawRound.slice(idx + 1).trim();
    const group = String(bracketDuel?.group || "").trim();
    const time = String(bracketDuel?.time || "").trim();
    return [
      group ? `Group ${group}` : "",
      roundTitle,
      time ? formatMatchTime(time) : roundDates,
    ].filter(Boolean).join(" · ");
  }

  function closeChallengeMatchModal() {
    const overlay = document.querySelector(".challenge-match-modal-overlay");
    if (!overlay) return;
    const returnFocus = overlay._returnFocus;
    overlay.remove();
    document.removeEventListener("keydown", handleChallengeMatchModalKeydown, true);
    if (returnFocus instanceof HTMLElement) returnFocus.focus({ preventScroll: true });
  }

  // Captured so that Esc closes only the popup, not the fullscreen bracket under it.
  function handleChallengeMatchModalKeydown(event) {
    if (event.key !== "Escape" && event.key !== "Esc") return;
    event.stopPropagation();
    closeChallengeMatchModal();
  }

  function openChallengeMatchModal(match, metaText, returnFocus) {
    closeChallengeMatchModal();
    const overlay = document.createElement("div");
    overlay.className = "challenge-match-modal-overlay";
    overlay._returnFocus = returnFocus;

    const dialog = document.createElement("div");
    dialog.className = "challenge-match-modal";
    dialog.setAttribute("role", "dialog");
    dialog.setAttribute("aria-modal", "true");
    dialog.setAttribute("aria-label", `${match?.team1 || "Player 1"} versus ${match?.team2 || "Player 2"}`);

    const closeButton = document.createElement("button");
    closeButton.type = "button";
    closeButton.className = "challenge-match-modal__close";
    closeButton.setAttribute("aria-label", "Close match details");
    closeButton.innerHTML = "&times;";
    closeButton.addEventListener("click", closeChallengeMatchModal);
    dialog.appendChild(closeButton);

    if (metaText) {
      const meta = document.createElement("div");
      meta.className = "challenge-match-modal__meta";
      meta.textContent = metaText;
      dialog.appendChild(meta);
    }

    const matchCard = document.createElement("div");
    matchCard.className = "challenge-match-card";
    matchCard.appendChild(createChallengePlayerCard(match?.player1Details || {}, "left"));
    const vs = document.createElement("div");
    vs.className = "challenge-match-card__vs";
    const vsContent = document.createElement("div");
    vsContent.className = "challenge-match-card__vs-content";
    const formatBadge = createMatchFormatBadge(match?.format, "challenge-match-format-badge");
    if (formatBadge) {
      formatBadge.classList.add("challenge-match-card__format");
      vs.appendChild(formatBadge);
    }
    const vsLabel = document.createElement("span");
    vsLabel.textContent = "VS";
    vsContent.appendChild(vsLabel);
    vs.appendChild(vsContent);
    matchCard.appendChild(vs);
    matchCard.appendChild(createChallengePlayerCard(match?.player2Details || {}, "right"));
    const matchResult = createChallengeMatchResult(match);
    if (matchResult) matchCard.appendChild(matchResult);
    const matchStreams = createChallengeMatchStreams(match);
    if (matchStreams) matchCard.appendChild(matchStreams);
    dialog.appendChild(matchCard);
    overlay.appendChild(dialog);

    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) closeChallengeMatchModal();
    });
    document.body.appendChild(overlay);
    document.addEventListener("keydown", handleChallengeMatchModalKeydown, true);
    closeButton.focus({ preventScroll: true });
  }

  function openBracketDuelModal(duelId, returnFocus) {
    const bracketDuel = bracketDuelsById.get(duelId);
    if (!bracketDuel) return;
    loadDuelDetails()
      .catch(() => ({ cclDuelsById: new Map(), playerDetailsById: new Map() }))
      .then(details => {
        openChallengeMatchModal(buildPopupMatch(bracketDuel, details), getPopupMetaText(bracketDuel), returnFocus);
      });
  }

  // Delegated, so the boxes of the fullscreen copy of a bracket open the popup too.
  document.addEventListener("click", (event) => {
    if (!(event.target instanceof Element)) return;
    const box = event.target.closest(".match-box[data-duel-id]");
    if (!box) return;
    openBracketDuelModal(box.dataset.duelId, box);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    if (!(event.target instanceof Element) || !event.target.matches(".match-box[data-duel-id]")) return;
    event.preventDefault();
    openBracketDuelModal(event.target.dataset.duelId, event.target);
  });

  function runWhenReady(callback) {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", callback);
    } else {
      callback();
    }
  }

  runWhenReady(fetchTournamentsAndInit);

  // Opens a fullscreen overlay that shows only the bracket block
  function openBracketFullscreen(sourceWrapper) {
    try {
      const overlay = document.createElement('div');
      overlay.className = 'fullscreen-overlay';

      // Close button (top-left, icon only)
      const closeBtn = document.createElement('button');
      closeBtn.className = 'fullscreen-close-btn';
      closeBtn.title = 'Закрити (Esc)';
      closeBtn.innerHTML = '<i class="fas fa-xmark"></i>';
      overlay.appendChild(closeBtn);

      const content = document.createElement('div');
      content.className = 'fullscreen-content';
      // Clone the scrollable wrapper with the bracket inside
      const cloned = sourceWrapper.cloneNode(true);
      content.appendChild(cloned);
      overlay.appendChild(content);

      document.body.appendChild(overlay);

      const onClose = () => {
        if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        document.removeEventListener('keydown', onKeyDown);
      };
      closeBtn.addEventListener('click', onClose);
      overlay.addEventListener('click', (e) => {
        // allow clicking the dark background to close (but not inner content)
        if (e.target === overlay) onClose();
      });

      // Close on Esc
      const onKeyDown = (e) => {
        if (e.key === 'Escape' || e.key === 'Esc') onClose();
      };
      document.addEventListener('keydown', onKeyDown);
    } catch (e) {
      console.error('Fullscreen open failed', e);
    }
  }
</script>
