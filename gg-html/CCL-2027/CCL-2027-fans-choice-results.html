<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- СТИЛІ -->
<style>
  :root {
    --main-bg-color: #15375c;
    --muted: #666;
    --border: #e0e0e0;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    margin: 0;
    color: #222;
  }

  .fcr-wrap {
    display: grid;
    gap: 10px;
    padding: 4px 2px 12px;
    max-width: 640px;
    margin: 0 auto;
  }

  .fcr-summary {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px 12px;
    font-size: 13px;
    color: var(--muted);
  }

  .fcr-totals strong {
    color: #222;
    font-size: 15px;
  }

  .fcr-list {
    display: grid;
    gap: 6px;
  }

  .fcr-item {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .fcr-head {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    padding: 8px 10px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 12px;
    align-items: center;
    gap: 4px 10px;
    cursor: pointer;
  }

  .fcr-head:hover,
  .fcr-head:focus-visible {
    background: #f7f9fc;
  }

  .fcr-country {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
  }

  .fcr-country span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .fcr-flag {
    width: 22px;
    height: 16px;
    object-fit: cover;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .fcr-counts {
    display: flex;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
  }

  .fcr-confirmed {
    font-size: 16px;
    font-weight: 700;
    color: #15375c;
  }

  .fcr-pending {
    font-size: 12px;
    color: #1a5d96;
  }

  .fcr-chevron {
    color: #6f7785;
    font-size: 11px;
    transition: transform 0.18s ease;
  }

  .fcr-item.open .fcr-chevron {
    transform: rotate(180deg);
  }

  /* Share of the confirmed votes: the weight of the association on the draw wheel. */
  .fcr-bar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .fcr-bar-track {
    flex: 1 1 auto;
    height: 6px;
    border-radius: 3px;
    background: #eef1f5;
    overflow: hidden;
  }

  .fcr-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #ff3d6e 0%, #ff5e57 50%, #ff8a3d 100%);
  }

  .fcr-share {
    min-width: 38px;
    text-align: right;
    font-size: 11px;
    color: var(--muted);
  }

  .fcr-votes {
    border-top: 1px solid #edf1f6;
    padding: 4px 10px 8px;
    display: grid;
  }

  .fcr-vote {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 2px 10px;
    padding: 5px 0;
    border-top: 1px solid #f2f4f7;
    font-size: 13px;
  }

  .fcr-vote:first-child {
    border-top: 0;
  }

  .fcr-vote.is-void .fcr-player {
    color: #98a2b3;
  }

  .fcr-player {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-weight: 600;
  }

  .fcr-player a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    color: inherit;
    text-decoration: none;
  }

  .fcr-player a:hover .fcr-nick {
    text-decoration: underline;
  }

  .fcr-nick {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .fcr-bga {
    width: 14px;
    height: 14px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .fcr-no-bga {
    width: 14px;
    flex-shrink: 0;
  }

  .fcr-verified {
    color: #2e7d32;
    font-size: 11px;
  }

  .fcr-date {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .fcr-chip {
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  .fcr-chip--pending {
    background: #e4f0fb;
    color: #1a5d96;
  }

  .fcr-chip--rejected {
    background: #fdecec;
    color: #a12a2a;
  }

  .fcr-chip--cancelled {
    background: #f3f4f6;
    color: #667085;
  }

  .fcr-reason {
    grid-column: 1 / -1;
    padding-left: 20px;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
  }

  .fcr-empty,
  .fcr-error {
    padding: 12px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
  }

  .fcr-error {
    color: #c62828;
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .fcr-vote {
      grid-template-columns: minmax(0, 1fr);
    }

    .fcr-date,
    .fcr-reason {
      padding-left: 20px;
    }
  }
</style>

<!-- HTML -->
<div class="fcr-wrap" id="cclFansChoiceResults">
  <div class="fcr-empty">Loading results...</div>
</div>

<!-- СКРИПТ -->
<script>
(function () {
  const API_BASE = window.AUTH_BASE_URL || "https://api.carcassonne.gg";
  const TOURNAMENT_ID = "CCL-2027";
  const RESULTS_URL = `${API_BASE}/public/ccl/${encodeURIComponent(TOURNAMENT_ID)}/fans-choice/results`;
  const BGA_LOGO_URL = "https://carcassonne.gg/gallery/bga-logo.png";
  const REFRESH_MS = 60 * 1000;
  const STATUS_LABELS = { pending: "Under review", rejected: "Rejected", cancelled: "Cancelled" };

  const root = document.getElementById("cclFansChoiceResults");
  // Associations the visitor opened; kept across refreshes.
  const openAssociations = new Set();
  let data = null;

  function el(tag, className, textContent) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (textContent !== undefined) node.textContent = textContent;
    return node;
  }

  // SQLite keeps "YYYY-MM-DD HH:MM:SS" in UTC -> "4 Nov 2026, 10:00 UTC"
  function formatVoteDate(value) {
    const raw = String(value || "").trim();
    const date = new Date(/^\d{4}-\d{2}-\d{2} /.test(raw) ? `${raw.replace(" ", "T")}Z` : raw);
    if (Number.isNaN(date.getTime())) return raw;
    const day = date.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
    const time = `${String(date.getUTCHours()).padStart(2, "0")}:${String(date.getUTCMinutes()).padStart(2, "0")}`;
    return `${day}, ${time} UTC`;
  }

  // "2026-11-09T00:00:00Z" -> "November 9 at 00:00 UTC"
  function formatDeadline(iso) {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return "";
    const month = date.toLocaleString("en-GB", { month: "long", timeZone: "UTC" });
    const time = `${String(date.getUTCHours()).padStart(2, "0")}:${String(date.getUTCMinutes()).padStart(2, "0")}`;
    return `${month} ${date.getUTCDate()} at ${time} UTC`;
  }

  function plural(count, word) {
    return `${count} ${word}${count === 1 ? "" : "s"}`;
  }

  function renderSummary() {
    const summary = el("div", "fcr-summary");
    const totals = el("div", "fcr-totals");
    totals.appendChild(el("strong", "", plural(data.totals.confirmed, "confirmed vote")));
    if (data.totals.pending) totals.appendChild(document.createTextNode(` · ${data.totals.pending} under review`));
    summary.appendChild(totals);
    const voting = data.voting || {};
    const note = voting.status === "closed"
      ? "Voting is closed"
      : voting.status === "upcoming"
        ? `Voting opens ${formatDeadline(voting.opens_at)}`
        : `Voting closes ${formatDeadline(voting.closes_at)}`;
    summary.appendChild(el("div", "", note));
    return summary;
  }

  function renderPlayer(vote) {
    const player = el("div", "fcr-player");
    const nick = el("span", "fcr-nick", vote.bga_nickname || "—");
    if (vote.bga_player_id) {
      const link = el("a");
      link.href = `https://boardgamearena.com/player?id=${encodeURIComponent(vote.bga_player_id)}`;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.title = "BGA profile";
      const logo = el("img", "fcr-bga");
      logo.src = BGA_LOGO_URL;
      logo.alt = "BGA";
      link.append(logo, nick);
      player.appendChild(link);
    } else {
      player.append(el("span", "fcr-no-bga"), nick);
    }
    if (vote.verified) {
      const verified = el("i", "fa-solid fa-circle-check fcr-verified");
      verified.title = "Verified player";
      verified.setAttribute("aria-label", "Verified player");
      player.appendChild(verified);
    }
    if (STATUS_LABELS[vote.status]) {
      player.appendChild(el("span", `fcr-chip fcr-chip--${vote.status}`, STATUS_LABELS[vote.status]));
    }
    return player;
  }

  function renderVotes(association) {
    const list = el("div", "fcr-votes");
    association.votes.forEach((vote) => {
      const isVoid = vote.status === "rejected" || vote.status === "cancelled";
      const row = el("div", `fcr-vote${isVoid ? " is-void" : ""}`);
      row.append(renderPlayer(vote), el("div", "fcr-date", formatVoteDate(vote.voted_at)));
      if (isVoid && vote.reason) row.appendChild(el("div", "fcr-reason", vote.reason));
      list.appendChild(row);
    });
    return list;
  }

  function renderAssociation(association) {
    const isOpen = openAssociations.has(association.id);
    const item = el("div", `fcr-item${isOpen ? " open" : ""}`);
    const head = el("button", "fcr-head");
    head.type = "button";
    head.setAttribute("aria-expanded", String(isOpen));

    const country = el("div", "fcr-country");
    if (association.flag) {
      const flag = el("img", "fcr-flag");
      flag.src = association.flag;
      flag.alt = "";
      country.appendChild(flag);
    }
    country.appendChild(el("span", "", association.name));

    const counts = el("div", "fcr-counts");
    counts.appendChild(el("span", "fcr-confirmed", String(association.confirmed)));
    if (association.pending) counts.appendChild(el("span", "fcr-pending", `+${association.pending} under review`));

    const share = data.totals.confirmed ? association.confirmed / data.totals.confirmed : 0;
    const bar = el("div", "fcr-bar");
    bar.title = "Share of the confirmed votes: the weight on the draw wheel";
    const track = el("div", "fcr-bar-track");
    const fill = el("div", "fcr-bar-fill");
    fill.style.width = `${(share * 100).toFixed(1)}%`;
    track.appendChild(fill);
    bar.append(track, el("span", "fcr-share", `${Math.round(share * 100)}%`));

    head.append(country, counts, el("i", "fa-solid fa-chevron-down fcr-chevron"), bar);
    head.addEventListener("click", () => {
      if (openAssociations.has(association.id)) openAssociations.delete(association.id);
      else openAssociations.add(association.id);
      render();
    });
    item.appendChild(head);
    if (isOpen) item.appendChild(renderVotes(association));
    return item;
  }

  function render() {
    root.innerHTML = "";
    root.appendChild(renderSummary());
    if (!data.associations.length) {
      root.appendChild(el("div", "fcr-empty", "No votes yet."));
      return;
    }
    const list = el("div", "fcr-list");
    data.associations.forEach((association) => list.appendChild(renderAssociation(association)));
    root.appendChild(list);
  }

  async function load() {
    try {
      const response = await fetch(RESULTS_URL, { credentials: "include" });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok || !Array.isArray(result.associations)) throw new Error(result.message || "Failed to load results");
      data = result;
      render();
    } catch (error) {
      console.error("❌ Failed to load Fans Choice results", error);
      // Keep the last results on a failed refresh.
      if (!data) {
        root.innerHTML = "";
        root.appendChild(el("div", "fcr-error", "❌ Failed to load results. Please reload the page."));
      }
    }
  }

  load();
  // The results update while voting is open; refreshes pause in a hidden tab.
  setInterval(() => {
    if (document.visibilityState === "visible" && data?.voting?.status !== "closed") load();
  }, REFRESH_MS);

  // Lets the parent page fit the iframe to the content, if it listens.
  if (window.parent !== window && "ResizeObserver" in window) {
    new ResizeObserver(() => {
      window.parent.postMessage({ type: "ccl-fans-choice-results:height", height: document.documentElement.scrollHeight }, "*");
    }).observe(document.body);
  }
})();
</script>
