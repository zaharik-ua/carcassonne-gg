<style>
  :root {
    --main-bg-color: #15375c;
    --hover-bg-color: #0e2c4d;
    --accent-text-color: #fff;
    --muted: #666;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    margin: 0;
    color: #222;
  }

  .fc-wrap {
    display: grid;
    gap: 10px;
    /* Room for the Vote Here button glow, so a fitted iframe does not clip it. */
    padding: 4px 2px 18px;
    max-width: 520px;
    margin: 0 auto;
  }

  .fc-btn {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    border: 1px solid #c8ced8;
    border-radius: 2px;
    padding: 0 14px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    line-height: 1.2;
    background: #eef2f6;
    color: #333;
  }

  .fc-btn-primary {
    background-color: var(--main-bg-color);
    border-color: var(--main-bg-color);
    color: var(--accent-text-color);
  }

  .fc-btn-primary:hover,
  .fc-btn-primary:focus-visible {
    background-color: var(--hover-bg-color);
    border-color: var(--hover-bg-color);
  }

  .fc-btn:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* Coral to orange gradient: stands out from the site's navy. On hover the wide background shifts slightly. */
  .fc-start {
    justify-self: center;
    min-width: 200px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(90deg, #ff3d6e 0%, #ff5e57 40%, #ff8a3d 70%, #ff3d6e 100%);
    background-size: 200% 100%;
    background-position: 0% 0;
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 14px rgba(255, 77, 94, 0.35);
    transition: background-position 0.3s ease, box-shadow 0.3s ease;
  }

  .fc-start:hover,
  .fc-start:focus-visible {
    background-position: 30% 0;
    box-shadow: 0 4px 16px rgba(255, 77, 94, 0.42);
  }

  .fc-card {
    background: #fff;
    padding: 12px;
    display: grid;
    gap: 10px;
    font-size: 14px;
    line-height: 1.4;
  }

  .fc-card form {
    display: grid;
    gap: 10px;
  }

  .fc-title {
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .fc-row {
    display: grid;
    gap: 2px;
    min-width: 0;
  }

  .fc-row label {
    font-size: 12px;
    font-weight: 600;
    color: #333;
  }

  .fc-row input {
    width: 100%;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    height: 32px;
    padding: 4px 8px;
    font: inherit;
    font-size: 14px;
    box-sizing: border-box;
  }

  .fc-row input:focus {
    outline: none;
    border-color: #9ea7b3;
  }

  .fc-hint {
    font-size: 12px;
    color: var(--muted);
  }

  .fc-note {
    padding: 8px 10px;
    border-radius: 4px;
    background: #f5f8fc;
    border: 1px solid #d6e2f0;
    font-size: 13px;
    color: #334155;
  }

  .fc-note-warning {
    background: #fff8e1;
    border-color: #f3dc9a;
  }

  .fc-voter {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #333;
  }

  .fc-voter i {
    color: #2e7d32;
  }

  .fc-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .fc-actions .fc-btn-primary {
    margin-left: auto;
  }

  .fc-error {
    color: #c62828;
    font-size: 13px;
    font-weight: 600;
  }

  .fc-error:empty {
    display: none;
  }

  .fc-card a {
    color: #0277BD;
    text-decoration: none;
  }

  .fc-card a:hover {
    text-decoration: underline;
  }

  .country-flag {
    height: 18px;
    width: 22px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .fc-vote-line {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 600;
  }

  .fc-success {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .fc-success-text {
    display: grid;
    gap: 8px;
    min-width: 0;
  }

  .fc-success > i {
    color: #2e7d32;
    font-size: 20px;
    margin-top: 1px;
  }

  /* Dropdown with search, as on the registration page. The menu stays in the flow so the iframe does not clip it. */
  .cp-dd {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
  }

  .cp-dd-btn {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    height: 32px;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    background: #fff;
    color: #2f3947;
    font-size: 14px;
    padding: 4px 8px;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
  }

  .cp-dd-btn:hover,
  .cp-dd-btn:focus-visible,
  .cp-dd-btn.open {
    border-color: #9ea7b3;
  }

  .cp-dd-btn-content {
    display: inline-flex;
    align-items: center;
    flex: 1 1 auto;
    gap: 6px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cp-dd-placeholder {
    color: #999;
  }

  .cp-dd-flag {
    width: 16px;
    height: auto;
    border-radius: 2px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .cp-dd-chevron {
    color: #6f7785;
    font-size: 10px;
    transition: transform 0.18s ease;
  }

  .cp-dd-btn.open .cp-dd-chevron {
    transform: rotate(180deg);
  }

  .cp-dd-menu {
    margin-top: 4px;
    max-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 0 solid #d5dbe4;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.16s ease, max-height 0.16s ease;
  }

  .cp-dd-menu.open {
    border-width: 1px;
    box-shadow: 0 8px 18px rgba(15, 28, 48, 0.14);
    opacity: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .cp-dd-search {
    position: sticky;
    top: 0;
    flex: 0 0 auto;
    padding: 6px 8px;
    border-bottom: 1px solid #edf1f6;
    background: #fff;
  }

  .cp-dd-search input {
    width: 100%;
    height: 28px;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    padding: 4px 8px;
    font: inherit;
    font-size: 13px;
    box-sizing: border-box;
  }

  .cp-dd-option {
    all: unset;
    box-sizing: border-box;
    flex: 0 0 auto;
    width: 100%;
    padding: 5px 8px;
    border-top: 1px solid #edf1f6;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #2f3947;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    cursor: pointer;
  }

  .cp-dd-search + .cp-dd-option {
    border-top: none;
  }

  .cp-dd-option:hover,
  .cp-dd-option:focus-visible {
    background: #f5f5f5;
  }

  .cp-dd-option.active {
    background: #e4f0fb;
  }

  .cp-dd-option.disabled {
    cursor: not-allowed;
    color: #9aa1ab;
    background: #fafafa;
  }

  .cp-dd-option.disabled .cp-dd-flag {
    opacity: 0.5;
  }

  .cp-dd-reason {
    margin-left: auto;
    padding-left: 8px;
    font-size: 11px;
    font-style: italic;
    color: #9aa1ab;
    white-space: normal;
    text-align: right;
  }

  .cp-dd-empty {
    padding: 8px 10px;
    font-size: 13px;
    color: #6b7280;
  }
</style>

<!-- HTML -->
<div class="fc-wrap" id="cclFansChoice">
  <button type="button" class="fc-btn fc-start" id="fcStart">Vote Here</button>
  <div id="fcPanel" hidden></div>
</div>

<!-- СКРИПТ -->
<script>
(function () {
  const API_BASE = window.AUTH_BASE_URL || "https://api.carcassonne.gg";
  const TOURNAMENT_ID = "CCL-2027";
  const STATE_URL = `${API_BASE}/public/ccl/${encodeURIComponent(TOURNAMENT_ID)}/fans-choice`;
  const VOTES_URL = `${API_BASE}/public/ccl/${encodeURIComponent(TOURNAMENT_ID)}/fans-choice/votes`;
  const VERIFY_URL = "https://carcassonne.gg/player/?id=noprofile";
  // Guests have no account: this browser remembers their vote so they do not vote again.
  const STORAGE_KEY = `ccl-fans-choice:${TOURNAMENT_ID}`;

  const startButton = document.getElementById("fcStart");
  const panel = document.getElementById("fcPanel");

  let data = null;
  let loadError = "";
  let panelOpen = false;
  let selectedAssociation = "";
  let openDropdown = null;

  function el(tag, className, textContent) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (textContent !== undefined) node.textContent = textContent;
    return node;
  }

  function readRememberedVoteId() {
    try {
      const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      return Number(value?.id) || null;
    } catch (_error) {
      return null;
    }
  }

  function rememberVote(vote) {
    try {
      if (vote) localStorage.setItem(STORAGE_KEY, JSON.stringify({ id: vote.id }));
      else localStorage.removeItem(STORAGE_KEY);
    } catch (_error) {
      // Private mode: the server still allows one vote per nickname.
    }
  }

  // "2026-11-09T23:59:59Z" -> "November 9 at 23:59 UTC"
  function formatUtc(iso) {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return "";
    const month = date.toLocaleString("en-GB", { month: "long", timeZone: "UTC" });
    const time = `${String(date.getUTCHours()).padStart(2, "0")}:${String(date.getUTCMinutes()).padStart(2, "0")}`;
    return `${month} ${date.getUTCDate()} at ${time} UTC`;
  }

  function findAssociation(id) {
    const key = String(id || "").toUpperCase();
    return (data?.associations || []).find((row) => String(row.id).toUpperCase() === key) || null;
  }

  function isEligible(id) {
    return Boolean(findAssociation(id)?.eligible);
  }

  function topLink(href, label) {
    const link = el("a", "", label);
    link.href = href;
    link.target = "_top";
    return link;
  }

  function createFlag(association, className) {
    if (!association?.flag) return null;
    const img = el("img", className);
    img.src = association.flag;
    img.alt = "";
    return img;
  }

  // Excluded associations stay in the list but cannot be chosen; the reason is shown next to them.
  function createAssociationDropdown(onChange) {
    const options = (data?.associations || []).map((row) => ({ value: row.id, label: row.name, association: row }));

    const root = el("div", "cp-dd");
    const button = el("button", "cp-dd-btn");
    button.type = "button";
    const buttonContent = el("span", "cp-dd-btn-content");
    button.append(buttonContent, el("span", "cp-dd-chevron", "▾"));

    const menu = el("div", "cp-dd-menu");
    const searchWrap = el("div", "cp-dd-search");
    const searchInput = el("input");
    searchInput.type = "text";
    searchInput.placeholder = "Type to filter...";
    searchWrap.appendChild(searchInput);
    menu.appendChild(searchWrap);

    const appendOptionContent = (target, option) => {
      const flag = createFlag(option.association, "cp-dd-flag");
      if (flag) target.appendChild(flag);
      target.appendChild(el("span", "", option.label));
    };

    const renderButton = () => {
      buttonContent.innerHTML = "";
      const option = options.find((row) => row.value === selectedAssociation);
      if (option) appendOptionContent(buttonContent, option);
      else buttonContent.appendChild(el("span", "cp-dd-placeholder", "Select an association"));
    };

    const visibleOptions = () => {
      const query = searchInput.value.trim().toLowerCase();
      return options.filter((option) => !query || option.label.toLowerCase().includes(query));
    };

    const fitMenu = () => {
      menu.style.maxHeight = `${Math.min(menu.scrollHeight, 300)}px`;
    };

    const select = (option) => {
      if (!option.association.eligible) return;
      selectedAssociation = option.value;
      renderButton();
      api.close();
      onChange(option);
    };

    const renderMenu = () => {
      menu.querySelectorAll(".cp-dd-option,.cp-dd-empty").forEach((node) => node.remove());
      const rows = visibleOptions();
      if (!rows.length) menu.appendChild(el("div", "cp-dd-empty", "Nothing found."));
      rows.forEach((option) => {
        const eligible = option.association.eligible;
        const optionButton = el("button", "cp-dd-option" + (eligible ? "" : " disabled"));
        optionButton.type = "button";
        optionButton.classList.toggle("active", option.value === selectedAssociation);
        if (!eligible) optionButton.setAttribute("aria-disabled", "true");
        appendOptionContent(optionButton, option);
        if (!eligible && option.association.reason) {
          optionButton.appendChild(el("span", "cp-dd-reason", option.association.reason));
        }
        optionButton.addEventListener("click", (event) => {
          event.stopPropagation();
          select(option);
        });
        menu.appendChild(optionButton);
      });
    };

    const api = {
      root,
      close() {
        menu.classList.remove("open");
        menu.style.maxHeight = "0px";
        button.classList.remove("open");
        if (openDropdown === api) openDropdown = null;
      },
      open() {
        searchInput.value = "";
        renderMenu();
        menu.classList.add("open");
        button.classList.add("open");
        fitMenu();
        openDropdown = api;
        if (window.matchMedia("(min-width: 600px)").matches) {
          try {
            searchInput.focus({ preventScroll: true });
          } catch (_error) {
            searchInput.focus();
          }
        }
      },
    };

    button.addEventListener("click", (event) => {
      event.stopPropagation();
      if (menu.classList.contains("open")) api.close();
      else api.open();
    });
    searchInput.addEventListener("click", (event) => event.stopPropagation());
    searchInput.addEventListener("input", () => {
      renderMenu();
      fitMenu();
    });
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        api.close();
        button.focus();
      } else if (event.key === "Enter") {
        event.preventDefault();
        const first = visibleOptions().find((option) => option.association.eligible);
        if (first) select(first);
      }
    });

    root.append(button, menu);
    renderButton();
    return api;
  }

  document.addEventListener("click", () => {
    if (openDropdown) openDropdown.close();
  });

  function showPanel(...children) {
    panel.innerHTML = "";
    const card = el("div", "fc-card");
    card.append(...children.filter(Boolean));
    panel.appendChild(card);
    panel.hidden = false;
    return card;
  }

  // The vote to show instead of the form: a verified player's or signed-in account's vote,
  // else the one this browser remembers. Cancelled votes do not count: the voter votes again.
  function currentVote() {
    const vote = data?.viewer?.vote || data?.remembered_vote || null;
    return vote && vote.status !== "cancelled" ? vote : null;
  }

  function cancelledVote() {
    const vote = data?.viewer?.vote || data?.remembered_vote || null;
    return vote?.status === "cancelled" ? vote : null;
  }

  function render() {
    if (loadError) {
      showPanel(el("div", "fc-error", loadError));
      return;
    }
    if (!data) {
      showPanel(el("div", "fc-hint", "Loading..."));
      return;
    }
    const vote = currentVote();
    if (vote) {
      renderVoted(vote, false);
      return;
    }
    if (data.voting.status === "closed") {
      showPanel(el("div", "fc-title", "Voting is closed"), el("div", "", "Thank you to everyone who voted!"));
      return;
    }
    renderForm();
  }

  function votingNotice() {
    if (data.voting.status !== "upcoming") return null;
    return el("div", "fc-note fc-note-warning", `Voting opens ${formatUtc(data.voting.opens_at)}.`);
  }

  function cancelledNotice() {
    const vote = cancelledVote();
    if (!vote) return null;
    const name = findAssociation(vote.association_id)?.name || vote.association_id;
    return el("div", "fc-note fc-note-warning", `Your vote for ${name} was cancelled. Please vote again.`);
  }

  function associationRow(onChange) {
    const row = el("div", "fc-row");
    row.append(el("label", "", "Association"), createAssociationDropdown(onChange).root);
    return row;
  }

  function createNicknameRow() {
    const row = el("div", "fc-row");
    const label = el("label", "", "BGA nickname");
    label.htmlFor = "fcNickname";
    const input = el("input");
    input.id = "fcNickname";
    input.type = "text";
    input.maxLength = 64;
    input.autocomplete = "off";
    row.append(
      label,
      input,
      el("div", "fc-hint", "Enter your nickname exactly as it is on Board Game Arena. Otherwise admins will not be able to confirm your vote.")
    );
    return { row, input };
  }

  function renderForm(changing = null) {
    const verified = Boolean(data.viewer?.verified);
    const upcoming = data.voting.status === "upcoming";

    if (changing) {
      selectedAssociation = changing.association_id;
    } else if (!isEligible(selectedAssociation)) {
      // Verified players start with their own association when it can be voted for.
      const own = verified ? data.viewer.association_id : "";
      selectedAssociation = isEligible(own) ? findAssociation(own).id : "";
    }

    const form = el("form");
    form.noValidate = true;
    const error = el("div", "fc-error");
    const submit = el("button", "fc-btn fc-btn-primary", "Submit vote");
    submit.type = "submit";
    const syncSubmit = () => {
      submit.disabled = upcoming || !selectedAssociation;
    };

    const intro = [el("div", "fc-title", changing ? "Change your vote" : "Fans Choice vote"), votingNotice(), cancelledNotice()];
    let nickname = null;

    if (verified) {
      const voter = el("div", "fc-voter");
      voter.append(el("i", "fa-solid fa-circle-check"), el("span", "", "Voting as"));
      voter.appendChild(el("strong", "", data.viewer.bga_nickname || data.viewer.player_id));
      intro.push(voter);
      form.appendChild(associationRow(syncSubmit));
      form.appendChild(el("div", "fc-hint", `You can change your vote until voting closes on ${formatUtc(data.voting.closes_at)}.`));
    } else {
      const note = el("div", "fc-note", "Your vote will be checked by the admins. If you sign in and verify your account on carcassonne.gg, your vote is confirmed automatically. ");
      note.appendChild(topLink(VERIFY_URL, "How to sign in and verify"));
      intro.push(note);
      form.appendChild(associationRow(syncSubmit));
      nickname = createNicknameRow();
      form.appendChild(nickname.row);
      form.appendChild(el("div", "fc-hint", "If you vote for an association other than your own, admins may ask you to confirm your vote in a private message on BGA."));
    }

    const actions = el("div", "fc-actions");
    if (changing) {
      const back = el("button", "fc-btn", "Back");
      back.type = "button";
      back.addEventListener("click", () => renderVoted(changing, false));
      actions.appendChild(back);
    }
    actions.appendChild(submit);
    form.append(error, actions);
    syncSubmit();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = { association_id: selectedAssociation };
      if (!body.association_id) {
        error.textContent = "Choose an association.";
        return;
      }
      if (nickname) {
        body.bga_nickname = nickname.input.value.trim();
        if (!body.bga_nickname) {
          error.textContent = "Enter your BGA nickname.";
          nickname.input.focus();
          return;
        }
      }

      error.textContent = "";
      submit.disabled = true;
      submit.textContent = "Submitting...";
      try {
        const response = await fetch(VOTES_URL, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) throw new Error(result.message || "Voting failed. Please try again.");
        if (verified || data.viewer?.authenticated) data.viewer.vote = result.vote;
        if (!verified) {
          data.remembered_vote = result.vote;
          rememberVote(result.vote);
        }
        renderVoted(result.vote, true);
      } catch (requestError) {
        error.textContent = requestError.message || "Voting failed. Please try again.";
        submit.textContent = "Submit vote";
        syncSubmit();
      }
    });

    showPanel(...intro, form);
  }

  function renderVoted(vote, justVoted) {
    const verified = Boolean(data.viewer?.verified);
    const association = findAssociation(vote.association_id);

    const success = el("div", "fc-success");
    success.appendChild(el("i", "fa-solid fa-circle-check"));
    const textWrap = el("div", "fc-success-text");
    textWrap.appendChild(el("div", "fc-title", justVoted ? "Thank you for voting! 🎉" : "You have voted"));

    const voteLine = el("div", "fc-vote-line");
    voteLine.appendChild(el("span", "", "Your vote:"));
    const flag = createFlag(association, "country-flag");
    if (flag) voteLine.appendChild(flag);
    voteLine.appendChild(el("span", "", association?.name || vote.association_id));
    textWrap.appendChild(voteLine);

    if (vote.status === "confirmed") {
      textWrap.appendChild(el("div", "", "Your vote is confirmed."));
    } else if (vote.status === "rejected") {
      const rejected = el("div", "", "Your vote was rejected. If you think this is a mistake, contact us at ");
      const email = el("a", "", "carcassonne.gg@gmail.com");
      email.href = "mailto:carcassonne.gg@gmail.com";
      rejected.append(email, document.createTextNode("."));
      textWrap.appendChild(rejected);
    } else {
      textWrap.appendChild(el("div", "", "Your vote has been received and will be checked by the admins."));
    }

    const canChange = verified && data.voting.status === "open";
    if (canChange) {
      textWrap.appendChild(el("div", "fc-hint", `You can change your vote until voting closes on ${formatUtc(data.voting.closes_at)}.`));
    }
    success.appendChild(textWrap);

    const children = [success];
    if (canChange) {
      const change = el("button", "fc-btn", "Change vote");
      change.type = "button";
      change.addEventListener("click", () => renderForm(vote));
      const actions = el("div", "fc-actions");
      actions.appendChild(change);
      children.push(actions);
    }
    showPanel(...children);
  }

  startButton.addEventListener("click", () => {
    panelOpen = !panelOpen;
    if (panelOpen) render();
    else panel.hidden = true;
  });

  const rememberedVoteId = readRememberedVoteId();
  const stateUrl = rememberedVoteId ? `${STATE_URL}?vote_id=${encodeURIComponent(rememberedVoteId)}` : STATE_URL;
  fetch(stateUrl, { credentials: "include" })
    .then((response) => {
      if (!response.ok) throw new Error("Failed to load Fans Choice data");
      return response.json();
    })
    .then((result) => {
      if (!result?.ok || !Array.isArray(result.associations)) throw new Error("Failed to load Fans Choice data");
      data = result;
      // The remembered vote is gone or voided: this browser may vote again.
      if (rememberedVoteId && (!data.remembered_vote || data.remembered_vote.status === "cancelled")) rememberVote(null);
    })
    .catch((error) => {
      console.error("❌ Failed to load CCL Fans Choice", error);
      loadError = "❌ Failed to load voting data. Please reload the page.";
    })
    .finally(() => {
      // Players who have voted see their vote right away.
      if (currentVote()) panelOpen = true;
      if (panelOpen && !panel.querySelector("form")) render();
    });

  // Lets the parent page fit the iframe to the content, if it listens.
  if (window.parent !== window && "ResizeObserver" in window) {
    new ResizeObserver(() => {
      window.parent.postMessage({ type: "ccl-fans-choice:height", height: document.documentElement.scrollHeight }, "*");
    }).observe(document.body);
  }
})();
</script>
