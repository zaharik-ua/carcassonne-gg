.results-pagesize-btn:hover,

.results-pagesize-label {

.results-pagesize-menu {

  border-radius: 4px;

  transform: translateY(4px);
  transition: opacity 0.16s ease, transform 0.16s ease, max-height 0.16s ease;
  z-index: 20;
}

.results-pagesize-menu.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.results-pagesize-option:hover {
  background: #f5f5f5;

.results-pagesize-option.active {
  background: #e4f0fb;

.results-pagination {

}

  border-radius: 3px;
  padding: 2px;

  border-radius: 2px;

  color: #555;

<script>
const API_BASE = window.AUTH_BASE_URL || "https://api.carcassonne.gg";
const MATCHES_URL = `${API_BASE}/public/team-official-matches`;
const BGA_ICON_URL = "https://carcassonne.gg/gallery/bga-logo.png";
const CARCASSONNE_LAB_ICON_URL = "https://carcassonne.gg/gallery/carcassonne-lab-icon.png";
const streamsOff = new URLSearchParams(window.location.search).get("streams") === "false";
const RESULTS_PAGE_SIZE_OPTIONS = [15, 30, 50];
const resultsPaginationState = {
  pageSize: 15,
  currentPage: 1,
  totalItems: 0,
  totalPages: 1
};
const autoUpdate = new URLSearchParams(window.location.search).get("autoupdate") === "true";
const openLineupsSet = new Set();
const openMatchId = new URLSearchParams(window.location.search).get("open");

if (openMatchId) {
  openMatchId.split(",").map(id => String(id || "").trim()).filter(Boolean).forEach(id => openLineupsSet.add(id));
}

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function parseUtc(value) {
  const ts = Date.parse(String(value || "").trim());
  return Number.isFinite(ts) ? ts : 0;
}

function readTeamOfficialMatchesFiltersFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return {
    association: String(params.get("association") || "").trim().toUpperCase(),
    year: String(params.get("year") || "").trim(),
    player: String(params.get("player") || "").trim(),
    tournament: String(params.get("tournament") || "").trim()
  };
}

function getTodayBoundsLocal() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).getTime();
  return { start, end };
}

function buildMatchesUrl() {
  const filters = readTeamOfficialMatchesFiltersFromUrl();
  const url = new URL(MATCHES_URL);
  url.searchParams.set("results_page_size", String(resultsPaginationState.pageSize));
  url.searchParams.set("results_page", String(resultsPaginationState.currentPage));
  url.searchParams.set("results_before", new Date(getTodayBoundsLocal().start).toISOString());
  if (filters.association) url.searchParams.set("association", filters.association);
  if (filters.year) url.searchParams.set("year", filters.year);
  if (filters.player) url.searchParams.set("player", filters.player);
  if (filters.tournament) url.searchParams.set("tournament", filters.tournament);
  return url.toString();
}

function getMatchSectionKey(match) {
  const ts = parseUtc(match?.time_utc);
  const { start, end } = getTodayBoundsLocal();
  if (!ts) return "upcoming";
  if (ts < start) return "results";
  if (ts < end) return "today";
  return "upcoming";
}

function formatMatchTime(isoValue, { isToday = false, showYear = true, showTime = true } = {}) {
  const ts = parseUtc(isoValue);
  if (!ts) return "--:--";
  const date = new Date(ts);
  const MONTHS_3 = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const dd = String(date.getDate()).padStart(2, "0");
  const mon = MONTHS_3[date.getMonth()];
  const yyyy = String(date.getFullYear());
  const time = date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
  if (isToday) return time;

  const parts = [`${dd} ${mon}`];
  if (showYear) parts.push(yyyy);
  if (showTime) parts.push(time);
  return parts.join("\n");
}

function createRatingElement(rating) {
  const rNum = rating === null || rating === undefined || rating === "" ? null : parseInt(rating, 10);
  if (!Number.isInteger(rNum)) return null;

  const wrap = document.createElement("div");
  wrap.className = "match-rating" + (rNum === 6 ? " match-rating--gold" : "");

  const filledCount = rNum >= 1 && rNum <= 5 ? rNum : rNum === 6 ? 5 : 0;
  const emptyCount = 5 - filledCount;

  for (let i = 0; i < filledCount; i += 1) {
    const star = document.createElement("span");
    star.className = "material-icons-round";
    star.textContent = "star";
    if (rNum !== 6) {
      star.style.color = "#333";
    }
    wrap.appendChild(star);
  }

  for (let i = 0; i < emptyCount; i += 1) {
    const star = document.createElement("span");
    star.className = "material-icons-round";
    star.textContent = "star";
    star.style.color = "#bbb";
    wrap.appendChild(star);
  }

  return wrap;
}

function createTournamentHeader(tournament) {
  const header = document.createElement("div");
  header.className = "tournament-header";

  const linkValue = String(tournament?.link || "").trim();
  const titleEl = document.createElement(linkValue ? "a" : "div");
  titleEl.className = "tournament-header__title";
  if (linkValue) {
    titleEl.href = linkValue;
    titleEl.target = "_self";
    titleEl.rel = "noopener noreferrer";
  }

  const icon = document.createElement("img");
  icon.className = "tournament-icon";
  icon.src = String(tournament?.logo || "https://carcassonne.gg/gallery/friendly-matches.png").trim();
  icon.alt = String(tournament?.name || "Official Matches").trim();

  const span = document.createElement("span");
  span.textContent = String(tournament?.name || tournament?.short_title || "Official Matches").trim();

  titleEl.appendChild(icon);
  titleEl.appendChild(span);
  header.appendChild(titleEl);

  const right = document.createElement("div");
  right.className = "tournament-header__right";
  header.appendChild(right);
  header._right = right;

  return header;
}

function hasValue(value) {
  return value !== null && value !== undefined && String(value).trim() !== "";
}

function hasScores(match) {
  return hasValue(match?.dw1) || hasValue(match?.dw2) || hasValue(match?.gw1) || hasValue(match?.gw2);
}

function isLiveStatus(status) {
  const raw = String(status || "").trim().toLowerCase().replace(/_/g, " ");
  return raw === "in progress" || raw === "live";
}

function sortLineups(lineups) {
  return (Array.isArray(lineups) ? lineups.slice() : []).sort((a, b) => {
    const aNo = Number(a?.duel_number);
    const bNo = Number(b?.duel_number);
    if (Number.isFinite(aNo) && Number.isFinite(bNo) && aNo !== bNo) {
      return aNo - bNo;
    }
    return String(a?.id || "").localeCompare(String(b?.id || ""));
  });
}

function buildLineupMap(duels) {
  const map = new Map();
  (Array.isArray(duels) ? duels : []).forEach((duel) => {
    const matchId = String(duel?.match_id || "").trim();
    if (!matchId) return;
    if (!map.has(matchId)) {
      map.set(matchId, []);
    }
    map.get(matchId).push(duel);
  });
  map.forEach((list, key) => {
    map.set(key, sortLineups(list));
  });
  return map;
}

function lineupValueExists(value) {
  return value !== null && value !== undefined && String(value).trim() !== "";
}

function getLineupPlayerDetails(duel, side) {
  const savedDetails = duel?.[`player${side}Details`] || {};
  const id = String(savedDetails?.id || duel?.[`player_${side}_id`] || "").trim();
  return {
    id,
    nickname: String(savedDetails?.nickname || duel?.[`player_${side}_name`] || id || "Unknown player").trim(),
    name: String(savedDetails?.name || duel?.[`player_${side}_real_name`] || "").trim(),
    avatar: String(
      savedDetails?.avatar
      || buildBgaAvatarUrl(id, duel?.[`player_${side}_avatar`])
      || ""
    ).trim(),
    flag: String(savedDetails?.flag || duel?.[`player_${side}_association_flag`] || "").trim(),
    country: String(
      savedDetails?.country
      || duel?.[`player_${side}_association_name`]
      || duel?.[`player_${side}_country`]
      || ""
    ).trim(),
    elo: savedDetails?.elo ?? duel?.[`player_${side}_gg_elo`] ?? null,
    rank: savedDetails?.rank ?? duel?.[`player_${side}_gg_rank`] ?? null,
    bgaElo: savedDetails?.bgaElo
      ?? duel?.[`player_${side}_bga_elo`]
      ?? duel?.[`player_${side}_elo`]
      ?? null,
  };
}

function buildBgaAvatarUrl(playerId, avatarValue) {
  const playerIdText = String(playerId || "").trim();
  const avatarText = String(avatarValue || "").trim();
  if (!avatarText) return "";
  if (/^https?:\/\//i.test(avatarText)) return avatarText;
  if (avatarText === "x00000") return "https://x.boardgamearena.net/data/avatar/default_184.jpg";

  const defaultMatch = avatarText.match(/^_def_(\d+)$/);
  if (defaultMatch) {
    return `https://x.boardgamearena.net/data/avatar/defaults/default-${defaultMatch[1].padStart(4, "0")}.jpg`;
  }

  if (!/^\d+$/.test(playerIdText)) return "";
  const playerIdNumber = Number(playerIdText);
  if (!Number.isFinite(playerIdNumber)) return "";
  const firstFolder = String(Math.floor(playerIdNumber / 100000000));
  const secondFolder = String(Math.floor(playerIdNumber / 1000000));
  const thirdFolder = String(Math.floor(playerIdNumber / 1000));
  return `https://x.boardgamearena.net/data/avatar/${firstFolder}/${secondFolder}/${thirdFolder}/${playerIdText}_184.jpg?h=${encodeURIComponent(avatarText)}`;
}

function getPlayerInitials(player) {
  const source = String(player?.nickname || player?.name || "?").trim();
  const parts = source.split(/\s+/).filter(Boolean);
  return (parts.length > 1 ? `${parts[0][0]}${parts[1][0]}` : source.slice(0, 2)).toUpperCase();
}

function createMatchLineupPlayer(duel, side) {
  const player = getLineupPlayerDetails(duel, side);
  const playerElement = document.createElement("span");
  playerElement.className = `lineup__duel-player lineup__duel-player--${side === 1 ? "left" : "right"}`;

  const imageUrl = player.avatar;
  const avatar = imageUrl ? document.createElement("img") : document.createElement("span");
  avatar.className = "lineup__duel-avatar";
  if (imageUrl) {
    avatar.src = imageUrl;
    avatar.alt = "";
    avatar.loading = "lazy";
  } else {
    avatar.classList.add("lineup__duel-avatar-fallback");
    avatar.textContent = getPlayerInitials(player);
    avatar.setAttribute("aria-hidden", "true");
  }

  const nickname = document.createElement("span");
  nickname.className = "lineup__duel-name";
  nickname.textContent = player.nickname;

  if (side === 1) {
    playerElement.appendChild(avatar);
    playerElement.appendChild(nickname);
  } else {
    playerElement.appendChild(nickname);
    playerElement.appendChild(avatar);
  }

  return playerElement;
}

function createMatchLineupDuelRow(duel) {
  const player1 = getLineupPlayerDetails(duel, 1);
  const player2 = getLineupPlayerDetails(duel, 2);
  const score1 = duel?.score1 ?? duel?.dw1;
  const score2 = duel?.score2 ?? duel?.dw2;
  const hasDuelScore = lineupValueExists(score1) && lineupValueExists(score2);
  const resultLabel = hasDuelScore ? `${score1} - ${score2}` : "vs";

  const row = document.createElement("button");
  row.type = "button";
  row.className = "lineup__duel";
  row.setAttribute("aria-label", `${player1.nickname} ${resultLabel} ${player2.nickname}`);

  const result = document.createElement("span");
  result.className = "lineup__duel-result";
  result.textContent = resultLabel;

  const matchup = document.createElement("span");
  matchup.className = "lineup__duel-matchup";
  matchup.appendChild(createMatchLineupPlayer(duel, 1));
  matchup.appendChild(result);
  matchup.appendChild(createMatchLineupPlayer(duel, 2));
  row.appendChild(matchup);

  row.addEventListener("click", () => {
    openChallengeMatchModal({
      id: duel?.id,
      team1: player1.nickname,
      team2: player2.nickname,
      format: duel?.duel_format,
      status: duel?.status,
      gw1: score1,
      gw2: score2,
      games: Array.isArray(duel?.games) ? duel.games.filter(Boolean) : [],
      player1Details: player1,
      player2Details: player2
    }, row);
  });

  return row;
}

function isTruthyOne(value) {
  return value === 1 || value === true || String(value || "").trim() === "1";
}

function getCarcassonneLabUrl(value) {
  const raw = String(value || "").trim();
  if (!raw) return "";
  try {
    const url = new URL(raw);
    if (url.protocol !== "https:" || url.hostname !== "www.carcassonnelab.com") return "";
    if (!url.hash.startsWith("#/")) return "";
    return url.href;
  } catch (_error) {
    return "";
  }
}

function createChallengeMatchResult(match) {
  const normalizedStatus = String(match?.status || "").trim().toLowerCase().replace(/_/g, " ");
  const isInProgress = normalizedStatus === "in progress";
  const isCompleted = normalizedStatus === "done" || normalizedStatus === "completed";
  if (!isInProgress && !isCompleted) return null;

  const games = (Array.isArray(match?.games) ? match.games : [])
    .map(game => {
      const player1Score = game?.player_1_score;
      const player2Score = game?.player_2_score;
      const tableId = String(game?.bga_table_id || "").trim();
      const player1Clock = isTruthyOne(game?.player_1_clock);
      const player2Clock = isTruthyOne(game?.player_2_clock);
      const carcassonneLabUrl = getCarcassonneLabUrl(game?.carcassonne_lab_url);
      const hasPlayer1Score = lineupValueExists(player1Score);
      const hasPlayer2Score = lineupValueExists(player2Score);
      return hasPlayer1Score && hasPlayer2Score
        ? { player1Score, player2Score, player1Clock, player2Clock, tableId, carcassonneLabUrl }
        : null;
    })
    .filter(Boolean);

  const hasMatchScore = lineupValueExists(match?.gw1) && lineupValueExists(match?.gw2);
  if (!hasMatchScore && !games.length) return null;

  let score1 = hasMatchScore ? match.gw1 : 0;
  let score2 = hasMatchScore ? match.gw2 : 0;
  if (!hasMatchScore) {
    games.forEach(game => {
      if (game.player1Clock !== game.player2Clock) {
        if (game.player1Clock) score2 += 1;
        if (game.player2Clock) score1 += 1;
        return;
      }
      const gameScore1 = Number(game.player1Score);
      const gameScore2 = Number(game.player2Score);
      if (!Number.isFinite(gameScore1) || !Number.isFinite(gameScore2)) return;
      if (gameScore1 > gameScore2) score1 += 1;
      if (gameScore2 > gameScore1) score2 += 1;
    });
  }

  const result = document.createElement("section");
  result.className = "challenge-match-result";
  const status = document.createElement("div");
  status.className = `challenge-match-result__status${isCompleted ? " challenge-match-result__status--completed" : ""}`;
  status.textContent = isCompleted ? "COMPLETED" : "IN PROGRESS";
  result.appendChild(status);

  const score = document.createElement("div");
  score.className = "challenge-match-result__score";
  score.textContent = `${score1} - ${score2}`;
  result.appendChild(score);

  if (games.length) {
    const gameScores = document.createElement("div");
    gameScores.className = "challenge-match-result__games";
    const bgaRow = document.createElement("div");
    const bgaLinks = document.createElement("div");
    const bgaIcon = document.createElement("img");
    bgaRow.className = "challenge-match-result__games-row";
    bgaLinks.className = "challenge-match-result__games-links";
    bgaIcon.className = "challenge-match-result__games-source-icon";
    bgaIcon.src = BGA_ICON_URL;
    bgaIcon.alt = "BGA";
    bgaIcon.loading = "lazy";
    bgaRow.appendChild(bgaIcon);
    bgaRow.appendChild(bgaLinks);

    const labRow = document.createElement("div");
    const labLinks = document.createElement("div");
    const labIcon = document.createElement("img");
    labRow.className = "challenge-match-result__games-row";
    labLinks.className = "challenge-match-result__games-links";
    labIcon.className = "challenge-match-result__games-source-icon";
    labIcon.src = CARCASSONNE_LAB_ICON_URL;
    labIcon.alt = "CarcassonneLab";
    labIcon.loading = "lazy";
    labRow.appendChild(labIcon);
    labRow.appendChild(labLinks);

    games.forEach(game => {
      const badge = document.createElement(game.tableId ? "a" : "span");
      badge.className = "challenge-match-result__game";
      const hasClockLoss = game.player1Clock !== game.player2Clock;
      if (hasClockLoss) {
        badge.classList.add("challenge-match-result__game--clock");
        const clock = document.createElement("i");
        clock.className = "fa-regular fa-clock challenge-match-result__game-clock";
        const clockScore = document.createElement("span");
        clockScore.textContent = game.player1Clock ? "0:1" : "1:0";
        badge.appendChild(clock);
        badge.appendChild(clockScore);
      } else {
        const player1Score = Number(game.player1Score);
        const player2Score = Number(game.player2Score);
        if (Number.isFinite(player1Score) && Number.isFinite(player2Score)) {
          if (player1Score > player2Score) {
            badge.classList.add("challenge-match-result__game--player-1");
          } else if (player2Score > player1Score) {
            badge.classList.add("challenge-match-result__game--player-2");
          }
        }
        badge.textContent = `${game.player1Score}:${game.player2Score}`;
      }
      if (game.tableId) {
        badge.href = `https://boardgamearena.com/table?table=${encodeURIComponent(game.tableId)}`;
        badge.target = "_blank";
        badge.rel = "noopener noreferrer";
        badge.title = "Open game on Board Game Arena";
      }
      bgaLinks.appendChild(badge);

      if (game.carcassonneLabUrl) {
        const labBadge = document.createElement("a");
        labBadge.className = badge.className;
        Array.from(badge.childNodes).forEach(node => {
          labBadge.appendChild(node.cloneNode(true));
        });
        labBadge.href = game.carcassonneLabUrl;
        labBadge.target = "_blank";
        labBadge.rel = "noopener noreferrer";
        labBadge.title = "Review game in CarcassonneLab";
        labBadge.setAttribute("aria-label", `Review game ${badge.textContent.trim()} in CarcassonneLab`);
        labLinks.appendChild(labBadge);
      }
    });
    gameScores.appendChild(bgaRow);
    if (labLinks.childNodes.length) gameScores.appendChild(labRow);
    result.appendChild(gameScores);
  }

  return result;
}

function closeChallengeMatchModal() {
  const overlay = document.querySelector(".challenge-match-modal-overlay");
  if (!overlay) return;
  const returnFocus = overlay._returnFocus;
  overlay.remove();
  document.removeEventListener("keydown", handleChallengeMatchModalKeydown);
  if (returnFocus instanceof HTMLElement) returnFocus.focus({ preventScroll: true });
}

function handleChallengeMatchModalKeydown(event) {
  if (event.key === "Escape") closeChallengeMatchModal();
}

function openChallengeMatchModal(match, returnFocus) {
  closeChallengeMatchModal();
  const overlay = document.createElement("div");
  overlay.className = "challenge-match-modal-overlay";
  overlay._returnFocus = returnFocus;

  const dialog = document.createElement("div");
  dialog.className = "challenge-match-modal";
  dialog.setAttribute("role", "dialog");
  dialog.setAttribute("aria-modal", "true");
  dialog.setAttribute("aria-label", `${match?.team1 || "Player 1"} versus ${match?.team2 || "Player 2"}`);

  const closeButton = document.createElement("button");
  closeButton.type = "button";
  closeButton.className = "challenge-match-modal__close";
  closeButton.setAttribute("aria-label", "Close match details");
  closeButton.innerHTML = "&times;";
  closeButton.addEventListener("click", closeChallengeMatchModal);
  dialog.appendChild(closeButton);

  const matchCard = document.createElement("div");
  matchCard.className = "challenge-match-card";
  matchCard.appendChild(createChallengePlayerCard(match?.player1Details || {}, "left"));
  const vs = document.createElement("div");
  vs.className = "challenge-match-card__vs";
  const vsContent = document.createElement("div");
  vsContent.className = "challenge-match-card__vs-content";
  const formatBadge = createMatchFormatBadge(match?.format, "challenge-match-format-badge");
  if (formatBadge) {
    formatBadge.classList.add("challenge-match-card__format");
    vs.appendChild(formatBadge);
  }
  const vsLabel = document.createElement("span");
  vsLabel.textContent = "VS";
  vsContent.appendChild(vsLabel);
  vs.appendChild(vsContent);
  matchCard.appendChild(vs);
  matchCard.appendChild(createChallengePlayerCard(match?.player2Details || {}, "right"));
  const matchResult = createChallengeMatchResult(match);
  if (matchResult) matchCard.appendChild(matchResult);
  dialog.appendChild(matchCard);
  overlay.appendChild(dialog);

  overlay.addEventListener("click", event => {
    if (event.target === overlay) closeChallengeMatchModal();
  });
  document.body.appendChild(overlay);
  document.addEventListener("keydown", handleChallengeMatchModalKeydown);
  closeButton.focus({ preventScroll: true });
}

function createLineupPanel(matchId, lineups, chevronIcon) {
  const lineupPanel = document.createElement("div");
  lineupPanel.className = "lineup";
  lineupPanel.id = `lineup-${encodeURIComponent(matchId)}`;
  lineupPanel.inert = !openLineupsSet.has(matchId);

  const lineupBody = document.createElement("div");
  lineupBody.className = "lineup__overview";

  sortLineups(lineups).forEach(duel => {
    lineupBody.appendChild(createMatchLineupDuelRow(duel));
  });

  lineupPanel.appendChild(lineupBody);

  const isOpen = openLineupsSet.has(matchId);
  if (isOpen) {
    lineupPanel.classList.add("open");
    lineupPanel.style.height = "auto";
    chevronIcon.style.transform = "rotate(180deg)";
  }

  return lineupPanel;
}

function bindLineupToggle(matchId, lineupPanel, chevronIcon, toggleBtn) {
  let animationFrame = null;
  toggleBtn.setAttribute("aria-controls", lineupPanel.id);
  toggleBtn.setAttribute("aria-expanded", String(lineupPanel.classList.contains("open")));
  lineupPanel.addEventListener("transitionend", event => {
    if (event.target !== lineupPanel || event.propertyName !== "height") return;
    if (lineupPanel.classList.contains("open")) lineupPanel.style.height = "auto";
  });

  toggleBtn.addEventListener("click", () => {
    if (animationFrame !== null) cancelAnimationFrame(animationFrame);
    const willOpen = !lineupPanel.classList.contains("open");
    lineupPanel.style.height = `${lineupPanel.getBoundingClientRect().height}px`;
    void lineupPanel.offsetHeight;
    lineupPanel.classList.toggle("open", willOpen);
    lineupPanel.inert = !willOpen;
    toggleBtn.setAttribute("aria-expanded", String(willOpen));
    chevronIcon.style.transform = willOpen ? "rotate(180deg)" : "rotate(0deg)";
    if (willOpen) openLineupsSet.add(matchId);
    else openLineupsSet.delete(matchId);

    if (window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches) {
      lineupPanel.style.height = willOpen ? "auto" : "0px";
      return;
    }
    animationFrame = requestAnimationFrame(() => {
      lineupPanel.style.height = willOpen ? `${lineupPanel.scrollHeight}px` : "0px";
      animationFrame = null;
    });
  });
}

function createMatchElement(match, lineups, options = {}) {
  const { isToday = false, showRating = false, showYear = true, showTime = true, showExpandedTime = false } = options;
  const wrapper = document.createElement("div");
  wrapper.className = "match-wrapper";

  const row = document.createElement("div");
  row.className = "match-row";
  row.dataset.id = String(match?.id || "").trim();

  const timeDiv = document.createElement("div");
  timeDiv.className = "match-time";
  if (showRating) {
    const ratingEl = createRatingElement(match?.rating);
    if (ratingEl) timeDiv.appendChild(ratingEl);
  }
  const timeText = document.createElement("div");
  timeText.className = "match-time-text";
  const renderTimeText = (expanded = false) => {
    timeText.innerHTML = esc(formatMatchTime(match?.time_utc, {
      isToday,
      showYear,
      showTime: expanded ? true : showTime
    })).replaceAll("\n", "<br>");
  };
  renderTimeText(false);
  timeDiv.appendChild(timeText);
  row.appendChild(timeDiv);

  const divider = document.createElement("div");
  divider.className = "divider-vertical";
  row.appendChild(divider);

  const tournamentLogo = String(match?.tournament_logo || "").trim();
  const tournamentLogoDiv = document.createElement("div");
  tournamentLogoDiv.className = "match-tournament-logo";
  if (tournamentLogo) {
    const logo = document.createElement("img");
    logo.src = tournamentLogo;
    logo.alt = String(match?.tournament_name || match?.tournament_short_title || "").trim();
    tournamentLogoDiv.appendChild(logo);
  }
  row.appendChild(tournamentLogoDiv);

  const tournamentDivider = document.createElement("div");
  tournamentDivider.className = "divider-vertical";
  row.appendChild(tournamentDivider);

  const teamsDiv = document.createElement("div");
  teamsDiv.className = "teams";

  [
    { flag: match?.team_1_flag, name: match?.team_1_name || match?.team_1 },
    { flag: match?.team_2_flag, name: match?.team_2_name || match?.team_2 }
  ].forEach((team) => {
    const teamRow = document.createElement("div");
    teamRow.className = "team-row";

    if (String(team.flag || "").trim()) {
      const flag = document.createElement("img");
      flag.className = "team-flag";
      flag.src = team.flag;
      flag.alt = String(team.name || "").trim();
      teamRow.appendChild(flag);
    }

    const name = document.createElement("span");
    name.textContent = String(team.name || "-").trim() || "-";
    teamRow.appendChild(name);
    teamsDiv.appendChild(teamRow);
  });

  row.appendChild(teamsDiv);

  const rightDiv = document.createElement("div");
  rightDiv.className = "match-right";

  if (isLiveStatus(match?.status)) {
    const liveIcon = document.createElement("img");
    liveIcon.className = "live-icon";
    liveIcon.src = "https://carcassonne.gg/gallery_gen/f4d6792e3ac5f7356502e64aefa51f32_60x28_fit.png";
    liveIcon.alt = "LIVE";
    rightDiv.appendChild(liveIcon);
  }

  if (!streamsOff && Array.isArray(match.streamers) && match.streamers.length) {
    const streams = Array.isArray(match.streams) ? match.streams : [];
    match.streamers.forEach((iconUrl, i) => {
      if (!iconUrl) return;
      const streamerIcon = document.createElement("img");
      streamerIcon.className = "stream-icon";
      streamerIcon.src = iconUrl;
      streamerIcon.alt = "Stream";
      const streamUrl = streams[i];
      if (typeof streamUrl === "string" && streamUrl.trim() !== "") {
        const streamLink = document.createElement("a");
        streamLink.href = streamUrl;
        streamLink.target = "_blank";
        streamLink.rel = "noopener noreferrer";
        streamLink.appendChild(streamerIcon);
        rightDiv.appendChild(streamLink);
      } else {
        rightDiv.appendChild(streamerIcon);
      }
    });
  }

  if (hasScores(match)) {
    const scoreBox = document.createElement("div");
    scoreBox.className = "score-box match-score";
    scoreBox.innerHTML = `<div>${esc(hasValue(match?.dw1) ? match.dw1 : "-")}</div><div>${esc(hasValue(match?.dw2) ? match.dw2 : "-")}</div>`;
    rightDiv.appendChild(scoreBox);

    const gamesBox = document.createElement("div");
    gamesBox.className = "score-box-alt";
    gamesBox.innerHTML = `<div>(${esc(hasValue(match?.gw1) ? match.gw1 : "-")})</div><div>(${esc(hasValue(match?.gw2) ? match.gw2 : "-")})</div>`;
    rightDiv.appendChild(gamesBox);
  }

  const matchId = String(match?.id || "").trim();
  const matchLineups = Array.isArray(lineups) ? lineups.filter(Boolean) : [];
  let lineupPanel = null;

  if (matchId && matchLineups.length > 0) {
    const toggleBtn = document.createElement("button");
    toggleBtn.type = "button";
    toggleBtn.className = "chevron";
    toggleBtn.setAttribute("aria-label", "Toggle match lineups");

    const chevronIcon = document.createElement("i");
    chevronIcon.className = "fas fa-chevron-down";
    chevronIcon.style.transition = "transform 0.3s ease";
    chevronIcon.style.transform = "rotate(0deg)";
    chevronIcon.style.fontSize = "12px";
    chevronIcon.style.padding = "0 4px";
    toggleBtn.appendChild(chevronIcon);

    lineupPanel = createLineupPanel(matchId, matchLineups, chevronIcon);
    bindLineupToggle(matchId, lineupPanel, chevronIcon, toggleBtn);
    if (showExpandedTime) {
      const syncExpandedTime = () => renderTimeText(lineupPanel.classList.contains("open"));
      syncExpandedTime();
      toggleBtn.addEventListener("click", () => {
        requestAnimationFrame(syncExpandedTime);
      });
    }
    rightDiv.appendChild(toggleBtn);
  }

  row.appendChild(rightDiv);
  wrapper.appendChild(row);
  if (lineupPanel) {
    wrapper.appendChild(lineupPanel);
  }

  return wrapper;
}

  const nextBtn = document.createElement("button");
  nextBtn.type = "button";
  nextBtn.className = "results-pagebtn";
  nextBtn.textContent = "Next";

  pagination.appendChild(prevBtn);
  pagination.appendChild(pageInfo);
  pagination.appendChild(nextBtn);
  controls.appendChild(pagination);

  function renderPage() {
    card.querySelectorAll(".match-wrapper").forEach((el) => el.remove());

    matches.forEach((match, index) => {
      const matchId = String(match?.id || "").trim();
      const matchEl = createMatchElement(match, lineupMap.get(matchId) || [], options);
      if (index === 0) matchEl.classList.add("match-wrapper--first");
      card.appendChild(matchEl);
    });

    pageInfo.textContent = `Page ${resultsPaginationState.currentPage} of ${resultsPaginationState.totalPages}`;
    prevBtn.disabled = resultsPaginationState.currentPage <= 1;
    nextBtn.disabled = resultsPaginationState.currentPage >= resultsPaginationState.totalPages;
  }

  function closePageSizeMenu() {
    pageSizeMenu.classList.remove("open");
    pageSizeMenu.style.maxHeight = "0px";
    pageSizeBtn.classList.remove("open");
  }

  function setPageSize(nextSize) {
    resultsPaginationState.pageSize = RESULTS_PAGE_SIZE_OPTIONS.includes(nextSize) ? nextSize : 15;
    resultsPaginationState.currentPage = 1;
    pageSizeBtnLabel.textContent = String(resultsPaginationState.pageSize);
    pageSizeMenu.querySelectorAll(".results-pagesize-option").forEach((el) => {
      el.classList.toggle("active", el.dataset.value === String(resultsPaginationState.pageSize));
    });
    fetchAndRenderMatches();
  }

  pageSizeBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = pageSizeMenu.classList.contains("open");
    closePageSizeMenu();
    if (!isOpen) {
      pageSizeMenu.classList.add("open");
      pageSizeMenu.style.maxHeight = `${pageSizeMenu.scrollHeight}px`;
      pageSizeBtn.classList.add("open");
    }
  });

  pageSizeMenu.querySelectorAll(".results-pagesize-option").forEach((optBtn) => {
    optBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const nextSize = Number(optBtn.dataset.value) || 15;
      setPageSize(nextSize);
      closePageSizeMenu();
    });
  });

  if (window.__teamOfficialMatchesResultsPageSizeHandler) {
    document.removeEventListener("click", window.__teamOfficialMatchesResultsPageSizeHandler);
  }
  window.__teamOfficialMatchesResultsPageSizeHandler = (e) => {
    if (!pageSizeWrap.contains(e.target)) closePageSizeMenu();
  };
  document.addEventListener("click", window.__teamOfficialMatchesResultsPageSizeHandler);

  prevBtn.addEventListener("click", () => {
    if (resultsPaginationState.currentPage <= 1) return;
    resultsPaginationState.currentPage -= 1;
    fetchAndRenderMatches();
  });

  nextBtn.addEventListener("click", () => {
    if (resultsPaginationState.currentPage >= resultsPaginationState.totalPages) return;
    resultsPaginationState.currentPage += 1;
    fetchAndRenderMatches();
  });

  renderPage();
}

function renderAllSectionsFromData(data) {
  const container = document.getElementById("matches-container");
  if (!container) return;
  container.innerHTML = "";

  const matches = (Array.isArray(data?.matches) ? data.matches : [])
    .filter((match) => parseUtc(match?.time_utc));

  const lineupMap = buildLineupMap(
    (Array.isArray(data?.duels) ? data.duels : [])
      .filter((duel) => String(duel?.match_id || "").trim())
  );
  const resultsPagination = data?.pagination?.results || null;
  resultsPaginationState.totalItems = Number(resultsPagination?.total) || 0;
  resultsPaginationState.totalPages = Math.max(1, Number(resultsPagination?.total_pages) || 1);
  resultsPaginationState.currentPage = Math.min(
    Math.max(1, Number(resultsPagination?.page) || resultsPaginationState.currentPage || 1),
    resultsPaginationState.totalPages
  );

  const sections = {
    today: [],
    upcoming: [],
    results: []
  };

  matches.forEach((match) => {
    sections[getMatchSectionKey(match)].push(match);
  });

  sections.today.sort((a, b) => parseUtc(a?.time_utc) - parseUtc(b?.time_utc));
  sections.upcoming.sort((a, b) => parseUtc(a?.time_utc) - parseUtc(b?.time_utc));
  sections.results.sort((a, b) => parseUtc(b?.time_utc) - parseUtc(a?.time_utc));

  renderSection(container, "Today", sections.today, lineupMap, { isToday: true, showRating: true, showYear: false, showTime: true });
  renderSection(container, "Upcoming", sections.upcoming, lineupMap, { isToday: false, showRating: true, showYear: false, showTime: true });
  renderResultsSection(container, "Results", sections.results, lineupMap, { isToday: false, showRating: false, showYear: true, showTime: false, showExpandedTime: true });

  if (!sections.today.length && !sections.upcoming.length && !sections.results.length) {
    container.appendChild(createEmptyCard("No official team matches found."));
  }
}

function setLoading(visible) {
  const el = document.getElementById("matches-loading");
  if (!el) return;
  el.classList.toggle("is-visible", Boolean(visible));
}

async function fetchAndRenderMatches() {
  setLoading(true);
  try {
    const response = await fetch(buildMatchesUrl(), { method: "GET" });
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    const data = await response.json();
    renderAllSectionsFromData(data || {});
  } catch (error) {
    console.error("Failed to load official team matches:", error);
    const container = document.getElementById("matches-container");
    if (container) {
      container.innerHTML = "";
      container.appendChild(createEmptyCard("Failed to load official team matches."));
    }
  } finally {
    setLoading(false);
  }
}

fetchAndRenderMatches();

if (autoUpdate) {
  setInterval(fetchAndRenderMatches, 60000);
}

function resetPaginationAndReloadTeamOfficialMatches() {
  resultsPaginationState.currentPage = 1;
  fetchAndRenderMatches();
}

window.addEventListener("popstate", resetPaginationAndReloadTeamOfficialMatches);
window.addEventListener("team-official-matches-filter-change", resetPaginationAndReloadTeamOfficialMatches);
</script>
