<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  :root {
    --ip-bg: #f5f7fb;
    --ip-card: #fff;
    --ip-text: #1f2937;
    --ip-muted: #667085;
    --ip-line: #d8dee8;
    --ip-primary: #1a73b7;
    --ip-primary-soft: #e7f1f9;
    --ip-danger: #b42318;
    --ip-success: #19733d;
    --ip-warning-bg: #fff8e8;
  }

   body {
    font-family: "Montserrat", sans-serif;
  }

  .ip-wrap {
    display: grid;
    gap: 12px;
    margin: 0 8px 16px;
  }

  .ip-card {
    padding: 12px;
    border: 1px solid var(--ip-line);
    border-radius: 7px;
    background: var(--ip-card);
    box-shadow: 0 1px 2px rgba(15, 17, 19, 0.05);
  }

  .ip-head,
  .ip-toolbar,
  .ip-row,
  .ip-actions,
  .ip-check-control {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ip-head,
  .ip-toolbar,
  .ip-row {
    justify-content: space-between;
  }

  .ip-title {
    margin: 0;
    font-size: 21px;
    line-height: 1.25;
  }

  .ip-subtitle,
  .ip-meta,
  .ip-empty,
  .ip-hint {
    color: var(--ip-muted);
    font-size: 12px;
    line-height: 1.45;
  }

  .ip-status {
    min-height: 18px;
    font-size: 13px;
  }

  .ip-status.error {
    color: var(--ip-danger);
  }

  .ip-status.success {
    color: var(--ip-success);
  }

  .ip-hidden {
    display: none !important;
  }

  .ip-select,
  .ip-input {
    width: 100%;
    min-height: 38px;
    box-sizing: border-box;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    padding: 7px 9px;
    background: #fff;
    color: var(--ip-text);
    font: inherit;
    font-size: 14px;
  }

  .ip-tournament-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .ip-tournament-name {
    min-width: 0;
    margin: 0;
    font-size: 20px;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .ip-tournament-meta {
    margin-top: 5px;
  }

  .ip-tournament-switcher {
    flex: 0 0 auto;
  }

  .ip-tournament-switch-btn {
    min-height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }

  .ip-tournament-switcher .ip-city-picker-menu {
    right: 0;
    left: auto;
    width: min(360px, calc(100vw - 32px));
  }

  .ip-tournament-switcher .ip-city-option {
    white-space: normal;
  }

  .ip-city-picker {
    position: relative;
  }

  .ip-city-picker-btn {
    width: 100%;
    min-height: 38px;
    box-sizing: border-box;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    padding: 7px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #fff;
    color: var(--ip-text);
    font: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
  }

  .ip-city-picker-btn.open {
    border-color: var(--ip-primary);
  }

  .ip-city-picker-value,
  .ip-city-option-label {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ip-city-picker-value span,
  .ip-city-option-label span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ip-city-picker-menu {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    left: 0;
    z-index: 30;
    display: none;
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    background: #fff;
    box-shadow: 0 8px 18px rgba(15, 28, 48, 0.14);
  }

  .ip-city-picker-menu.open {
    display: block;
  }

  .ip-city-search {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: 7px;
    border-bottom: 1px solid #e4e8ef;
    background: #fff;
  }

  .ip-city-option {
    width: 100%;
    min-height: 38px;
    box-sizing: border-box;
    border: 0;
    border-top: 1px solid #edf1f6;
    padding: 7px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #fff;
    color: var(--ip-text);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }

  .ip-city-option:hover,
  .ip-city-option.active {
    background: var(--ip-primary-soft);
  }

  .ip-city-option.add-new {
    color: #155986;
    font-weight: 700;
  }

  .ip-city-icon {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    border-radius: 4px;
    object-fit: contain;
  }

  .ip-inline-city {
    grid-column: 1 / -1;
    width: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px 12px;
    padding: 12px;
    border: 1px solid #a9cce4;
    border-radius: 6px;
    background: #f4f9fd;
  }

  .ip-inline-city-title,
  .ip-inline-city-actions {
    grid-column: 1 / -1;
  }

  .ip-inline-city-title {
    font-size: 13px;
    font-weight: 700;
  }

  .ip-inline-city-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ip-readonly {
    background: #eef2f6;
    color: var(--ip-muted);
  }

  .ip-city-inline-mount {
    grid-column: 1 / -1;
  }

  .ip-btn {
    min-height: 23px;
    border: 1px solid #c8ced8;
    border-radius: 3px;
    padding: 3px 8px;
    background: #eef2f6;
    color: #2f3947;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .ip-btn.primary {
    border-color: var(--ip-primary);
    background: var(--ip-primary);
    color: #fff;
  }

  .ip-btn.danger {
    color: var(--ip-danger);
  }

  .ip-btn.danger-filled {
    border-color: var(--ip-danger);
    background: var(--ip-danger);
    color: #fff;
  }

  .ip-btn:disabled {
    cursor: default;
    opacity: 0.55;
  }

  .ip-badge {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    border-radius: 999px;
    padding: 2px 9px;
    background: var(--ip-primary-soft);
    color: #155986;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .ip-tabs {
    display: flex;
    gap: 6px;
    padding: 4px;
    border: 1px solid var(--ip-line);
    border-radius: 6px;
    background: #fff;
  }

  .ip-tab {
    flex: 1 1 0;
    min-height: 38px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: #445063;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .ip-tab.active {
    background: var(--ip-primary-soft);
    color: #155986;
  }

  .ip-counters {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }

  .ip-player-counters {
    margin-top: 10px;
  }

  .ip-counter {
    padding: 10px;
    border: 1px solid var(--ip-line);
    border-radius: 5px;
    background: #fff;
  }

  .ip-counter-value {
    font-size: 20px;
    font-weight: 700;
  }

  .ip-counter-label {
    margin-top: 2px;
    color: var(--ip-muted);
    font-size: 11px;
  }

  .ip-list {
    margin-top: 10px;
    overflow: hidden;
    border: 1px solid var(--ip-line);
    border-radius: 6px;
    background: #fff;
  }

  .ip-row {
    min-height: 54px;
    padding: 7px 9px;
    border-top: 1px solid #e4e8ef;
  }

  .ip-row:first-child {
    border-top: 0;
  }

  .ip-person {
    min-width: 0;
    flex: 1 1 auto;
  }

  .ip-person-name {
    overflow: hidden;
    font-size: 14px;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ip-person-meta {
    margin-top: 3px;
    overflow-wrap: anywhere;
    color: var(--ip-muted);
    font-size: 11px;
  }

  .ip-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px 12px;
    margin-top: 10px;
    padding: 12px;
    border: 1px solid var(--ip-line);
    border-radius: 6px;
    background: #fff;
  }

  .ip-field {
    display: grid;
    gap: 4px;
  }

  .ip-field label {
    color: #344054;
    font-size: 12px;
    font-weight: 600;
  }

  .ip-form-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ip-readiness {
    margin-bottom: 10px;
    padding: 10px;
    border: 1px solid #f0c36c;
    border-radius: 5px;
    background: var(--ip-warning-bg);
    font-size: 12px;
    line-height: 1.45;
  }

  .ip-readiness.ready {
    border-color: #9bc9aa;
    background: #effaf2;
    color: var(--ip-success);
  }

  .ip-late-mode {
    grid-column: 1 / -1;
    margin: 0;
  }

  .ip-readiness ul {
    margin: 6px 0 0;
    padding-left: 18px;
  }

  .ip-recovery {
    margin-top: 10px;
    padding: 10px;
    border: 1px solid #efb4ae;
    border-radius: 6px;
    background: #fff6f5;
    color: #7a271a;
    font-size: 12px;
    line-height: 1.45;
  }

  .ip-recovery strong {
    display: block;
    margin-bottom: 4px;
  }

  .ip-check-control {
    flex: 0 0 auto;
  }

  .ip-draw-number-display {
    min-width: 32px;
    color: #344054;
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
    text-align: right;
  }

  .ip-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(24, 31, 41, 0.42);
  }

  .ip-modal-dialog {
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
    display: grid;
    gap: 12px;
    padding: 16px;
    border: 1px solid var(--ip-line);
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 16px 36px rgba(15, 28, 48, 0.22);
  }

  .ip-modal-title {
    color: #222;
    font-size: 16px;
    font-weight: 700;
  }

  .ip-modal-player {
    color: #4b5563;
    font-size: 14px;
    line-height: 1.4;
  }

  .ip-modal-fields {
    display: grid;
    gap: 12px;
  }

  .ip-checkin-checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #344054;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .ip-checkin-checkbox input {
    width: 20px;
    height: 20px;
    margin: 0;
  }

  .ip-modal-warning {
    min-height: 17px;
    color: var(--ip-danger);
    font-size: 12px;
    line-height: 1.4;
  }

  .ip-modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .ip-cancellation-dialog {
    max-width: 520px;
  }

  .ip-cancellation-message {
    font-size: 13px;
    line-height: 1.5;
  }

  .ip-cancellation-results {
    max-height: 240px;
    overflow-y: auto;
    padding: 10px;
    border: 1px solid #efb4ae;
    border-radius: 6px;
    background: #fff6f5;
    color: #7a271a;
    font-size: 12px;
    line-height: 1.45;
  }

  .ip-cancellation-results ul {
    margin: 7px 0 0;
    padding-left: 20px;
  }

  .ip-draw-number {
    width: 82px;
  }

  .ip-modal-dialog .ip-draw-number {
    width: 80px;
    height: 80px;
    min-height: 80px;
    padding: 8px;
    appearance: textfield;
    -moz-appearance: textfield;
    font-size: 32px;
    font-weight: 700;
    text-align: center;
  }

  .ip-modal-dialog .ip-draw-number::-webkit-inner-spin-button,
  .ip-modal-dialog .ip-draw-number::-webkit-outer-spin-button {
    margin: 0;
    -webkit-appearance: none;
  }

  .ip-swiss-summary,
  .ip-swiss-preview,
  .ip-swiss-matches {
    display: grid;
    gap: 10px;
    margin-top: 10px;
  }

  .ip-swiss-summary {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .ip-swiss-table-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
  }

  .ip-swiss-stat,
  .ip-match-card {
    padding: 10px;
    border: 1px solid var(--ip-line);
    border-radius: 6px;
    background: #fff;
  }

  .ip-swiss-table-card {
    width: 100%;
    min-width: 0;
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    color: var(--ip-text);
    font: inherit;
    text-align: left;
  }

  button.ip-swiss-table-card {
    cursor: pointer;
  }

  button.ip-swiss-table-card:hover,
  button.ip-swiss-table-card:focus-visible {
    border-color: var(--ip-primary);
    box-shadow: 0 0 0 2px var(--ip-primary-soft);
    outline: 0;
  }

  .ip-swiss-table-card.completed {
    border-color: #9bc9aa;
    background: #effaf2;
  }

  .ip-swiss-table-number {
    color: var(--ip-muted);
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
  }

  .ip-swiss-table-players {
    min-height: 0;
    flex: 1 1 auto;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 5px;
    padding: 8px 0 2px;
  }

  .ip-swiss-table-player {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }

  .ip-swiss-table-player.with-record {
    flex-direction: column;
    gap: 2px;
  }

  .ip-swiss-player-record {
    color: var(--ip-muted);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.2;
  }

  .ip-swiss-table-player.winner {
    font-weight: 700;
  }

  .ip-swiss-table-player-name {
    min-width: 0;
    max-width: 100%;
    display: block;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.25;
    overflow-wrap: anywhere;
    text-align: center;
    white-space: normal;
  }

  .ip-swiss-table-player.winner .ip-swiss-table-player-name {
    font-weight: 700;
  }

  .ip-time-lost-icon {
    position: relative;
    width: 14px;
    height: 14px;
    flex: 0 0 14px;
    box-sizing: border-box;
    border: 2px solid var(--ip-danger);
    border-radius: 50%;
  }

  .ip-time-lost-icon::before,
  .ip-time-lost-icon::after {
    position: absolute;
    content: "";
    background: var(--ip-danger);
    transform-origin: bottom center;
  }

  .ip-time-lost-icon::before {
    top: 2px;
    left: 4px;
    width: 2px;
    height: 4px;
  }

  .ip-time-lost-icon::after {
    top: 5px;
    left: 5px;
    width: 4px;
    height: 2px;
    transform: rotate(25deg);
    transform-origin: left center;
  }

  .ip-starting-player-icon {
    width: 12px;
    height: 12px;
    display: inline-block;
    margin-right: 6px;
    object-fit: contain;
    vertical-align: -1px;
  }

  .ip-swiss-table-versus {
    color: var(--ip-muted);
    font-size: 11px;
    font-weight: 600;
    text-align: center;
  }

  .ip-swiss-table-versus.result {
    color: var(--ip-success);
    font-size: 16px;
    font-weight: 700;
  }

  .ip-match-result-dialog {
    max-width: 520px;
  }

  .ip-swiss-result-form {
    display: grid;
    gap: 14px;
  }

  .ip-swiss-score-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 18px;
    align-items: end;
  }

  .ip-swiss-score-player {
    min-width: 0;
    display: grid;
    gap: 3px;
    align-self: stretch;
    align-content: end;
    text-align: center;
  }

  .ip-swiss-score-player-name {
    overflow-wrap: anywhere;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.25;
  }

  .ip-swiss-score-player.winner .ip-swiss-score-player-name {
    font-weight: 700;
  }

  .ip-swiss-score-won {
    min-height: 20px;
    justify-self: center;
    visibility: hidden;
    color: var(--ip-success);
    font-size: 15px;
    font-weight: 700;
    line-height: 20px;
  }

  .ip-swiss-score-won.visible {
    visibility: visible;
  }

  .ip-swiss-score-input {
    width: 112px;
    height: 112px;
    min-height: 112px;
    justify-self: center;
    padding: 8px;
    appearance: textfield;
    -moz-appearance: textfield;
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
    text-align: center;
  }

  .ip-swiss-score-input::-webkit-inner-spin-button,
  .ip-swiss-score-input::-webkit-outer-spin-button {
    margin: 0;
    -webkit-appearance: none;
  }

  .ip-swiss-result-controls {
    display: grid;
    gap: 10px;
  }

  .ip-swiss-result-control {
    display: grid;
    grid-template-columns: 118px minmax(0, 1fr);
    align-items: center;
    gap: 10px;
  }

  .ip-swiss-result-control label {
    color: #344054;
    font-size: 12px;
    font-weight: 700;
  }

  .ip-admin-note-toggle {
    width: max-content;
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--ip-primary);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .ip-swiss-admin-note {
    display: grid;
    gap: 4px;
  }

  .ip-swiss-admin-note label {
    color: #344054;
    font-size: 12px;
    font-weight: 600;
  }

  @media (max-width: 420px) {
    .ip-swiss-score-input {
      width: 96px;
      height: 96px;
      min-height: 96px;
    }

    .ip-swiss-result-control {
      grid-template-columns: 1fr;
      gap: 4px;
    }
  }

  .ip-swiss-stat strong {
    display: block;
    margin-bottom: 3px;
    font-size: 15px;
  }

  .ip-preview-head,
  .ip-match-head,
  .ip-match-players,
  .ip-swiss-action-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .ip-preview-head,
  .ip-match-head {
    margin-bottom: 7px;
  }

  .ip-match-players {
    justify-content: flex-start;
    font-size: 14px;
    font-weight: 600;
  }

  .ip-match-versus {
    color: var(--ip-muted);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
  }

  .ip-warning-list {
    display: flex;
    gap: 5px;
    margin-top: 7px;
    flex-wrap: wrap;
  }

  .ip-warning {
    border-radius: 999px;
    padding: 3px 8px;
    background: #fff1cc;
    color: #7a4b00;
    font-size: 10px;
    font-weight: 700;
  }

  .ip-result-form {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #e4e8ef;
  }

  .ip-result-form .ip-form-actions,
  .ip-result-form .ip-result-wide {
    grid-column: 1 / -1;
  }

  .ip-result-form .ip-input,
  .ip-result-form .ip-select {
    min-height: 34px;
    padding: 5px 7px;
    font-size: 12px;
  }

  .ip-standings-scroll {
    margin-top: 10px;
    overflow-x: auto;
    border: 1px solid var(--ip-line);
    border-radius: 6px;
  }

  .ip-standings-table {
    width: 100%;
    min-width: 650px;
    border-collapse: collapse;
    background: #fff;
    font-size: 12px;
  }

  .ip-standings-table th,
  .ip-standings-table td {
    padding: 9px 10px;
    border-top: 1px solid #e4e8ef;
    text-align: right;
    white-space: nowrap;
  }

<script>
(function () {
  const AUTH_BASE = window.AUTH_BASE_URL || "https://api.carcassonne.gg";
  const ACCESSIBLE_URL = `${AUTH_BASE}/in-person-tournaments/accessible`;
  const ASSOCIATIONS_URL = `${AUTH_BASE}/associations`;
  const STARTING_PLAYER_ICON_URL = "https://carcassonne.gg/gallery/blue-mipple-no-bg-small.png";

  const state = {
    tournaments: [],
    associations: [],
    cities: [],
    selectedTournamentId: "",
    overview: null,
    swiss: null,
    playoff: null,
    pairingPreview: null,
    playoffSetupSlots: [],
    activeTab: "players",
    playerFormController: null,
  };

  const tournamentName = document.getElementById("ipTournamentName");
  const tournamentSwitcher = document.getElementById("ipTournamentSwitcher");
  const tournamentSwitchBtn = document.getElementById("ipTournamentSwitchBtn");
  const tournamentMenu = document.getElementById("ipTournamentMenu");
  const tournamentMeta = document.getElementById("ipTournamentMeta");
  const workspace = document.getElementById("ipWorkspace");
  const statusEl = document.getElementById("ipStatus");
  const countersEl = document.getElementById("ipCounters");
  const playersPanel = document.getElementById("ipPlayersPanel");
  const checkInPanel = document.getElementById("ipCheckInPanel");
  const swissPanel = document.getElementById("ipSwissPanel");
  const standingsPanel = document.getElementById("ipStandingsPanel");
  const playoffPanel = document.getElementById("ipPlayoffPanel");
  const playersList = document.getElementById("ipPlayersList");
  const checkInList = document.getElementById("ipCheckInList");
  const playerFormMount = document.getElementById("ipPlayerFormMount");
  const readinessEl = document.getElementById("ipReadiness");
  const addPlayerBtn = document.getElementById("ipAddPlayerBtn");
  const addLatePlayerBtn = document.getElementById("ipAddLatePlayerBtn");
  const startCheckInBtn = document.getElementById("ipStartCheckInBtn");
  const refreshBtn = document.getElementById("ipRefreshBtn");
  const swissActions = document.getElementById("ipSwissActions");
  const swissSummary = document.getElementById("ipSwissSummary");
  const swissPreview = document.getElementById("ipSwissPreview");
  const swissRecovery = document.getElementById("ipSwissRecovery");
  const swissMatches = document.getElementById("ipSwissMatches");
  const standingsEl = document.getElementById("ipStandings");
  const playoffActions = document.getElementById("ipPlayoffActions");
  const playoffBracket = document.getElementById("ipPlayoffBracket");
  const playoffCompletion = document.getElementById("ipPlayoffCompletion");

  class ApiError extends Error {
    constructor(response, payload) {
      super(payload?.message || `Request failed (${response.status})`);
      this.status = response.status;
      this.code = payload?.code || "";
      this.details = payload?.details || null;
    }
  }

  async function apiJson(url, options = {}) {
    const response = await fetch(url, {
      credentials: "include",
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {}),
      },
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok || payload?.ok === false) throw new ApiError(response, payload);
    return payload;
  }

  function setStatus(message, type = "") {
    statusEl.textContent = message || "";
    statusEl.className = `ip-status${type ? ` ${type}` : ""}`;
  }

  function selectedTournament() {
    return state.tournaments.find((item) => item.id === state.selectedTournamentId) || null;
  }

  function tournamentUrl(path = "") {
    return `${AUTH_BASE}/in-person-tournaments/${encodeURIComponent(state.selectedTournamentId)}${path}`;
  }

  function formatDates(tournament) {
    if (!tournament?.start_date) return "";
    return tournament.start_date === tournament.end_date
      ? tournament.start_date
      : `${tournament.start_date} – ${tournament.end_date}`;
  }

  function createButton(label, className, onClick) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = className || "ip-btn";
    button.textContent = label;
    button.addEventListener("click", onClick);
    return button;
  }

  function createField(labelText, type = "text") {
    const field = document.createElement("div");
    field.className = "ip-field";
    const label = document.createElement("label");
    label.textContent = labelText;
    const input = document.createElement("input");
    input.type = type;
    input.className = "ip-input";
    field.appendChild(label);
    field.appendChild(input);
    return { field, input };
  }

  function createSelectField(labelText, options, value) {
    const field = document.createElement("div");
    field.className = "ip-field";
    const label = document.createElement("label");
    label.textContent = labelText;
    const select = document.createElement("select");
    select.className = "ip-select";
    (options || []).forEach((entry) => {
      const option = document.createElement("option");
      option.value = String(entry.value ?? "");
      option.textContent = String(entry.label ?? entry.value ?? "");
      if (option.value === String(value ?? "")) option.selected = true;
      select.appendChild(option);
    });
    field.appendChild(label);
    field.appendChild(select);
    return { field, select };
  }

  function createMenuSelectField(labelText, options, initialValue, { signal } = {}) {
    const field = document.createElement("div");
    field.className = "ip-field";
    const label = document.createElement("label");
    label.textContent = labelText;
    const root = document.createElement("div");
    root.className = "ip-city-picker ip-menu-picker";
    const button = document.createElement("button");
    button.type = "button";
    button.className = "ip-city-picker-btn";
    button.setAttribute("aria-haspopup", "listbox");
    button.setAttribute("aria-expanded", "false");
    const selectedContent = document.createElement("span");
    selectedContent.className = "ip-city-picker-value";
    const selectedText = document.createElement("span");
    const chevron = document.createElement("span");
    chevron.textContent = "▾";
    selectedContent.appendChild(selectedText);
    button.appendChild(selectedContent);
    button.appendChild(chevron);

    const menu = document.createElement("div");
    menu.className = "ip-city-picker-menu";
    menu.setAttribute("role", "listbox");
    const normalizedOptions = (options || []).map((entry) => ({
      value: String(entry.value ?? ""),
      label: String(entry.label ?? entry.value ?? ""),
    }));
    let value = String(initialValue ?? "");
    let disabled = false;
    const changeListeners = [];

    const close = () => {
      menu.classList.remove("open");
      button.classList.remove("open");
      button.setAttribute("aria-expanded", "false");
    };
    const renderButton = () => {
      const selected = normalizedOptions.find((entry) => entry.value === value)
        || normalizedOptions[0]
        || { value: "", label: "—" };
      value = selected.value;
      selectedText.textContent = selected.label || "—";
      selectedContent.style.color = selected.value ? "" : "#999";
    };
    const setValue = (nextValue, { notify = false } = {}) => {
      const next = String(nextValue ?? "");
      value = normalizedOptions.some((entry) => entry.value === next) ? next : "";
      renderButton();
      renderOptions();
      if (notify) changeListeners.forEach((listener) => listener());
    };
    const renderOptions = () => {
      menu.innerHTML = "";
      normalizedOptions.forEach((entry) => {
        const option = document.createElement("button");
        option.type = "button";
        option.className = `ip-city-option${entry.value === value ? " active" : ""}`;
        option.textContent = entry.label || "—";
        option.setAttribute("role", "option");
        option.setAttribute("aria-selected", entry.value === value ? "true" : "false");
        option.addEventListener("click", () => {
          setValue(entry.value, { notify: true });
          close();
        });
        menu.appendChild(option);
      });
    };
    const open = () => {
      if (disabled) return;
      renderOptions();
      menu.classList.add("open");
      button.classList.add("open");
      button.setAttribute("aria-expanded", "true");
    };
    const setDisabled = (nextDisabled) => {
      disabled = !!nextDisabled;
      button.disabled = disabled;
      if (disabled) close();
    };

    button.addEventListener("click", () => {
      if (menu.classList.contains("open")) close();
      else open();
    });
    document.addEventListener("click", (event) => {
      if (!root.contains(event.target)) close();
    }, signal ? { signal } : undefined);

    renderButton();
    renderOptions();
    root.appendChild(button);
    root.appendChild(menu);
    field.appendChild(label);
    field.appendChild(root);
    return {
      field,
      button,
      getValue: () => value,
      setValue,
      setDisabled,
      onChange: (listener) => changeListeners.push(listener),
    };
  }

  function cityLabel(city) {
    return [city?.name_en, city?.name_local].filter(Boolean).join(" • ") || String(city?.id || "");
  }

  function appendCityLabel(container, city, fallbackText) {
    container.innerHTML = "";
    if (city?.icon_url) {
      const icon = document.createElement("img");
      icon.className = "ip-city-icon";
      icon.src = city.icon_url;
      icon.alt = "";
      icon.addEventListener("error", () => icon.remove(), { once: true });
      container.appendChild(icon);
    }
    const text = document.createElement("span");
    text.textContent = city ? cityLabel(city) : fallbackText;
    container.appendChild(text);
  }

  function createCityPickerField(initialValue, { onAddNew, signal } = {}) {
    const field = document.createElement("div");
    field.className = "ip-field";
    const label = document.createElement("label");
    label.textContent = "City *";
    const root = document.createElement("div");
    root.className = "ip-city-picker";
    const button = document.createElement("button");
    button.type = "button";
    button.className = "ip-city-picker-btn";
    const selectedContent = document.createElement("span");
    selectedContent.className = "ip-city-picker-value";
    const chevron = document.createElement("span");
    chevron.textContent = "▾";
    button.appendChild(selectedContent);
    button.appendChild(chevron);

    const menu = document.createElement("div");
    menu.className = "ip-city-picker-menu";
    const searchWrap = document.createElement("div");
    searchWrap.className = "ip-city-search";
    const searchInput = document.createElement("input");
    searchInput.type = "text";
    searchInput.className = "ip-input";
    searchInput.placeholder = "Type to filter cities...";
    searchWrap.appendChild(searchInput);
    menu.appendChild(searchWrap);

    let value = String(initialValue || "").trim();
    let filterQuery = "";
    const findCity = (cityId) => state.cities.find((city) => (
      String(city?.id || "") === String(cityId || "")
    )) || null;
    const renderButton = () => {
      const city = findCity(value);
      if (!city) value = "";
      appendCityLabel(selectedContent, city, "Select city...");
      selectedContent.style.color = city ? "" : "#999";
    };
    const close = () => {
      menu.classList.remove("open");
      button.classList.remove("open");
    };
    const setValue = (nextValue) => {
      value = findCity(nextValue) ? String(nextValue) : "";
      renderButton();
      renderOptions();
    };
    const createOption = (city) => {
      const option = document.createElement("button");
      option.type = "button";
      option.className = `ip-city-option${String(city.id) === value ? " active" : ""}`;
      const optionLabel = document.createElement("span");
      optionLabel.className = "ip-city-option-label";
      appendCityLabel(optionLabel, city, city.id);
      option.appendChild(optionLabel);
      option.addEventListener("click", (event) => {
        event.stopPropagation();
        setValue(city.id);
        close();
      });
      return option;
    };
    const renderOptions = () => {
      menu.querySelectorAll(".ip-city-option").forEach((node) => node.remove());
      const query = filterQuery.trim().toLocaleLowerCase("en");
      state.cities
        .slice()
        .sort((left, right) => cityLabel(left).localeCompare(cityLabel(right)))
        .filter((city) => !query || `${cityLabel(city)} ${city.id}`.toLocaleLowerCase("en").includes(query))
        .forEach((city) => menu.appendChild(createOption(city)));
      const addNew = document.createElement("button");
      addNew.type = "button";
      addNew.className = "ip-city-option add-new";
      addNew.textContent = "+ Add new city";
      addNew.addEventListener("click", (event) => {
        event.stopPropagation();
        close();
        if (typeof onAddNew === "function") onAddNew();
      });
      menu.appendChild(addNew);
    };
    const open = () => {
      filterQuery = "";
      searchInput.value = "";
      renderOptions();
      menu.classList.add("open");
      button.classList.add("open");
      try {
        searchInput.focus({ preventScroll: true });
      } catch (_error) {
        searchInput.focus();
      }
    };

    searchInput.addEventListener("click", (event) => event.stopPropagation());
    searchInput.addEventListener("keydown", (event) => event.stopPropagation());
    searchInput.addEventListener("input", () => {
      filterQuery = searchInput.value;
      renderOptions();
    });
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      if (menu.classList.contains("open")) close();
      else open();
    });
    document.addEventListener("click", (event) => {
      if (!root.contains(event.target)) close();
    }, signal ? { signal } : undefined);

    renderButton();
    renderOptions();
    root.appendChild(button);
    root.appendChild(menu);
    field.appendChild(label);
    field.appendChild(root);
    return {
      field,
      getValue: () => value,
      setValue,
      refresh: () => {
        renderButton();
        renderOptions();
      },
    };
  }

  function mountInlineCityCreator(tournament, picker, mount) {
    mount.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "ip-inline-city";
    const title = document.createElement("div");
    title.className = "ip-inline-city-title";
    title.textContent = "Add new city";
    const country = createField("Country / association");
    country.input.value = [
      tournament.association_name,
      tournament.association_id,
    ].filter(Boolean).join(" • ");
    country.input.readOnly = true;
    country.input.classList.add("ip-readonly");
    const nameEn = createField("City name (English) *");
    const nameLocal = createField("City name (local)");
    const iconUrl = createField("City icon URL", "url");
    iconUrl.input.placeholder = "https://...";
    const actions = document.createElement("div");
    actions.className = "ip-inline-city-actions";
    const create = createButton("Create and select", "ip-btn primary", async () => {
      const englishName = String(nameEn.input.value || "").trim();
      if (!englishName) {
        setStatus("English city name is required.", "error");
        nameEn.input.focus();
        return;
      }
      create.disabled = true;
      try {
        const data = await apiJson(tournamentUrl("/participant-cities"), {
          method: "POST",
          body: JSON.stringify({
            name_en: englishName,
            name_local: String(nameLocal.input.value || "").trim() || null,
            icon_url: String(iconUrl.input.value || "").trim() || null,
          }),
        });
        state.cities.push(data.city);
        picker.refresh();
        picker.setValue(data.city.id);
        mount.innerHTML = "";
        setStatus("City created and selected.", "success");
      } catch (error) {
        setStatus(error.message || "Failed to create city.", "error");
        create.disabled = false;
      }
    });
    const cancel = createButton("Cancel", "ip-btn", () => {
      mount.innerHTML = "";
      setStatus("");
    });
    actions.appendChild(create);
    actions.appendChild(cancel);
    wrap.appendChild(title);
    wrap.appendChild(country.field);
    wrap.appendChild(nameEn.field);
    wrap.appendChild(nameLocal.field);
    wrap.appendChild(iconUrl.field);
    wrap.appendChild(actions);
    mount.appendChild(wrap);
    nameEn.input.focus();
  }

  function closeTournamentMenu() {
    tournamentMenu.classList.remove("open");
    tournamentSwitchBtn.classList.remove("open");
    tournamentSwitchBtn.setAttribute("aria-expanded", "false");
  }

  function renderTournamentSwitcher() {
    tournamentMenu.innerHTML = "";
    if (!state.tournaments.length) {
      tournamentName.textContent = "No In-Person tournaments available";
      tournamentSwitcher.classList.add("ip-hidden");
      tournamentMeta.textContent = "You are not assigned as an administrator of an active In-Person tournament.";
      workspace.classList.add("ip-hidden");
      return;
    }
    const selected = selectedTournament();
    tournamentName.textContent = selected?.name_local || selected?.name_en || "In-Person tournament";
    tournamentSwitcher.classList.toggle("ip-hidden", state.tournaments.length <= 1);
    state.tournaments.forEach((tournament) => {
      const option = document.createElement("button");
      option.type = "button";
      option.className = `ip-city-option${tournament.id === state.selectedTournamentId ? " active" : ""}`;
      option.textContent = [
        tournament.name_local || tournament.name_en,
        formatDates(tournament),
      ].filter(Boolean).join(" • ");
      option.setAttribute("role", "option");
      option.setAttribute(
        "aria-selected",
        tournament.id === state.selectedTournamentId ? "true" : "false"
      );
      option.addEventListener("click", () => {
        closeTournamentMenu();
        if (tournament.id !== state.selectedTournamentId) selectTournament(tournament.id);
      });
      tournamentMenu.appendChild(option);
    });
    closeTournamentMenu();
  }

  function openPlayerForm(participant = null) {
    const tournament = state.overview?.tournament;
    if (!tournament) return;
    state.playerFormController?.abort();
    const formController = new AbortController();
    state.playerFormController = formController;
    playerFormMount.innerHTML = "";
    const form = document.createElement("form");
    form.className = "ip-form";
    const nameEn = createField("Name (English) *");
    nameEn.input.value = participant?.name_en || "";
    const nameLocal = createField("Name (local)");
    nameLocal.input.value = participant?.name_local || "";
    const bgaNickname = createField("BGA nickname");
    bgaNickname.input.value = participant?.bga_nickname || "";
    const cityInlineMount = document.createElement("div");
    cityInlineMount.className = "ip-city-inline-mount";
    let location;
    if (tournament.scope === "international") {
      location = createSelectField(
        "Country / association *",
        [{ value: "", label: "Select country..." }].concat(state.associations.map((association) => ({
          value: association.id,
          label: [association.flag, association.name].filter(Boolean).join(" • "),
        }))),

      );
    } else {
      location = createCityPickerField(participant?.city_id || "", {
        signal: formController.signal,
        onAddNew: () => mountInlineCityCreator(tournament, location, cityInlineMount),
      });
    }
    const getLocationValue = () => (

    );
    form.appendChild(nameEn.field);
    form.appendChild(nameLocal.field);

    save.type = "submit";
    save.className = "ip-btn primary";
    save.textContent = participant ? "Save" : "Create";
    actions.appendChild(save);
    actions.appendChild(createButton("Cancel", "ip-btn", () => {
      formController.abort();
      if (state.playerFormController === formController) state.playerFormController = null;
      playerFormMount.innerHTML = "";

    }));
    if (participant) {
      if (
        ["swiss", "playoff"].includes(tournament.status)
        && ["registered", "checked_in"].includes(participant.status)
      ) {
        actions.appendChild(createButton(
          "Withdraw",
          "ip-btn danger",
          () => deactivateParticipant(participant, "withdrawn")
        ));
        actions.appendChild(createButton(
          "Disqualify",
          "ip-btn danger",
          () => deactivateParticipant(participant, "disqualified")
        ));
      }
      const deleteButton = createButton(
        "Delete",
        "ip-btn danger",
        () => deletePlayer(participant)
      );
      deleteButton.disabled = participant.has_matches || !!tournament.has_started_swiss;
      actions.appendChild(deleteButton);
    }
    form.appendChild(actions);

    async function saveParticipant(confirmDuplicate) {
      const payload = {
        name_en: String(nameEn.input.value || "").trim(),
        name_local: String(nameLocal.input.value || "").trim() || null,
        bga_nickname: String(bgaNickname.input.value || "").trim() || null,
        association_id: tournament.scope === "international" ? getLocationValue() : null,
        city_id: tournament.scope === "local" ? getLocationValue() : null,
        confirm_duplicate: confirmDuplicate,
      };
      save.disabled = true;
      try {
        await apiJson(
          participant
            ? tournamentUrl(`/participants/${encodeURIComponent(participant.id)}`)
            : tournamentUrl("/participants"),
          { method: participant ? "PATCH" : "POST", body: JSON.stringify(payload) }
        );
        formController.abort();
        if (state.playerFormController === formController) state.playerFormController = null;
        playerFormMount.innerHTML = "";
        await loadOverview();
        setStatus(participant ? "Player updated." : "Player added.", "success");
      } catch (error) {
        if (error.code === "DUPLICATE_PARTICIPANT" && !confirmDuplicate) {
          const candidates = (error.details?.candidates || []).map((candidate) => (
            `${candidate.name_en} • ${participantLocation(candidate)}${candidate.bga_nickname ? ` • BGA: ${candidate.bga_nickname}` : ""} • ID: ${candidate.id}`
          )).join("\n");
          if (window.confirm(`Possible duplicate:\n${candidates}\n\nAdd this person as a genuine namesake?`)) {
            save.disabled = false;
            await saveParticipant(true);
            return;
          }
        } else {
          setStatus(error.message || "Failed to save player.", "error");
        }
        save.disabled = false;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!nameEn.input.value.trim() || !getLocationValue()) {
        setStatus("English name and location are required.", "error");
        return;

      await saveParticipant(false);
    });
    playerFormMount.appendChild(form);
    nameEn.input.focus();

  async function deletePlayer(participant) {
    if (!window.confirm(`Delete ${participant.name_en} from this tournament?`)) return;
    try {
      await apiJson(tournamentUrl(`/participants/${encodeURIComponent(participant.id)}`), {
        method: "DELETE",
      });
      await loadOverview();
      setStatus("Player deleted.", "success");
    } catch (error) {
      setStatus(error.message || "Failed to delete player.", "error");
    }
  }

  async function deactivateParticipant(participant, nextStatus) {
    const label = nextStatus === "disqualified" ? "disqualify" : "withdraw";
    const reason = window.prompt(`Reason to ${label} ${participant.name_en}:`, "");
    if (reason === null) return;
    if (!reason.trim()) {
      setStatus("A reason is required.", "error");
      return;
    }
    try {
      const data = await apiJson(
        tournamentUrl(`/participants/${encodeURIComponent(participant.id)}/status`),
        {
          method: "PATCH",
          body: JSON.stringify({ status: nextStatus, reason: reason.trim() }),
        }
      );
      const resolution = data.resolution;
      if (resolution?.type === "technical_result") {
        const finishLabel = nextStatus === "disqualified" ? "disqualification" : "withdrawal";
        const matchLabel = resolution.stage === "playoff"
          ? resolution.round_label
          : `round ${resolution.round_number}`;
        const shouldRecord = window.confirm(
          `${participant.name_en} has an unfinished match in ${matchLabel}. `
          + `Record a technical ${finishLabel} win for the opponent now?`
        );
        if (shouldRecord) {
          const resultStage = resolution.stage === "playoff" ? "playoff" : "swiss";
          await apiJson(
            tournamentUrl(`/${resultStage}/matches/${encodeURIComponent(resolution.match.id)}/result`),
            {
              method: "PUT",
              body: JSON.stringify({
                ...resolution.suggested_result,
                admin_note: reason.trim(),
              }),
            }
          );
        }
      }
      await loadOverview();
      if (resolution?.type === "cancel_draft_round") {
        state.activeTab = "swiss";
        renderWorkspace();
        setStatus(
          `${participant.name_en} marked ${nextStatus}. Cancel draft round ${resolution.round_number} and regenerate it.`,
          "success"
        );
      } else {
        setStatus(`${participant.name_en} marked ${nextStatus}.`, "success");
      }
    } catch (error) {
      setStatus(error.message || `Failed to ${label} player.`, "error");
    }
  }

    }

    const title = document.createElement("strong");

      ? "Ready to form the first Swiss round."
      : "Not ready for the first Swiss round.";

          ? (issue.participants || []).map((participant) => participant.name_en).filter(Boolean)
          : [];

  function openCheckInModal(participant) {
    const tournament = state.overview?.tournament;
    const editable = tournament?.status === "check_in" && !tournament?.has_started_swiss;
    if (!editable) return;

    const overlay = document.createElement("div");
    overlay.className = "ip-modal-overlay";

    const form = document.createElement("form");
    form.className = "ip-modal-dialog";
    form.setAttribute("role", "dialog");
    form.setAttribute("aria-modal", "true");
    form.setAttribute("aria-labelledby", "ipCheckInModalTitle");

    const title = document.createElement("div");
    title.id = "ipCheckInModalTitle";
    title.className = "ip-modal-title";
    title.textContent = participant.status === "checked_in" ? "Edit check-in" : "Player check-in";

    const player = document.createElement("div");
    player.className = "ip-modal-player";
    player.textContent = participant.name_local || participant.name_en;

    const fields = document.createElement("div");
    fields.className = "ip-modal-fields";

    const checkedInLabel = document.createElement("label");
    checkedInLabel.className = "ip-checkin-checkbox";
    const checkedIn = document.createElement("input");
    checkedIn.type = "checkbox";
    checkedIn.checked = true;
    const checkedInText = document.createElement("span");
    checkedInText.textContent = "Player checked in";
    checkedInLabel.appendChild(checkedIn);
    checkedInLabel.appendChild(checkedInText);

    const drawNumber = createField("Draw number", "number");
    drawNumber.input.min = "1";
    drawNumber.input.step = "1";
    drawNumber.input.inputMode = "numeric";
    drawNumber.input.classList.add("ip-draw-number");
    drawNumber.input.value = participant.draw_number == null ? "" : String(participant.draw_number);

    const warning = document.createElement("div");
    warning.className = "ip-modal-warning";
    warning.setAttribute("role", "alert");
    warning.setAttribute("aria-live", "polite");

    const actions = document.createElement("div");
    actions.className = "ip-modal-actions";
    const cancel = createButton("Cancel", "ip-btn", () => closeModal());
    const save = document.createElement("button");
    save.type = "submit";
    save.className = "ip-btn primary";
    save.textContent = "Save";
    actions.appendChild(cancel);
    actions.appendChild(save);

    fields.appendChild(checkedInLabel);
    fields.appendChild(drawNumber.field);
    form.appendChild(title);
    form.appendChild(player);
    form.appendChild(fields);
    form.appendChild(warning);
    form.appendChild(actions);
    overlay.appendChild(form);

    let saving = false;

    function closeModal() {
      if (saving) return;
      document.removeEventListener("keydown", handleEscape);
      overlay.remove();
    }

    function handleEscape(event) {
      if (event.key === "Escape") closeModal();
    }

    function validateDrawNumber() {
      warning.textContent = "";
      if (!checkedIn.checked || drawNumber.input.value.trim() === "") return true;
      const value = Number(drawNumber.input.value);
      if (!Number.isInteger(value) || value <= 0) {
        warning.textContent = "Draw number must be a positive integer.";
        return false;
      }
      const owner = (state.overview?.participants || []).find((candidate) => (
        String(candidate.id) !== String(participant.id)
        && candidate.draw_number != null
        && Number(candidate.draw_number) === value
      ));
      if (owner) {
        warning.textContent = `Draw number ${value} is already used by ${owner.name_local || owner.name_en}.`;
        return false;
      }
      return true;
    }

    function syncForm() {
      drawNumber.input.disabled = saving || !checkedIn.checked;
      checkedIn.disabled = saving;
      cancel.disabled = saving;
      const valid = validateDrawNumber();
      save.disabled = saving || !valid;
      return valid;
    }

    checkedIn.addEventListener("change", syncForm);
    drawNumber.input.addEventListener("input", syncForm);
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) closeModal();
    });
    document.addEventListener("keydown", handleEscape);
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!validateDrawNumber()) {
        syncForm();
        return;
      }
      saving = true;
      save.textContent = "Saving...";
      syncForm();
      try {
        await apiJson(tournamentUrl(`/participants/${encodeURIComponent(participant.id)}/check-in`), {
          method: "PATCH",
          body: JSON.stringify({
            checked_in: checkedIn.checked,
            draw_number: checkedIn.checked && drawNumber.input.value !== ""
              ? Number(drawNumber.input.value)
              : null,
          }),
        });
        await loadOverview();
        saving = false;
        closeModal();
        setStatus(`Check-in saved for ${participant.name_en}.`, "success");
      } catch (error) {
        saving = false;
        save.textContent = "Save";
        if (error.code === "DRAW_NUMBER_TAKEN") {
          const owner = error.details?.participant;
          const ownerName = owner?.name_local || owner?.name_en;
          warning.textContent = ownerName
            ? `This draw number is already used by ${ownerName}.`
            : "This draw number is already used by another player.";
        } else {
          warning.textContent = error.message || "Failed to save check-in.";
        }
        drawNumber.input.disabled = !checkedIn.checked;
        checkedIn.disabled = false;
        cancel.disabled = false;
        save.disabled = false;
      }
    });

    document.body.appendChild(overlay);
    syncForm();
    checkedIn.focus();
  }

  function renderCheckIn() {
    checkInList.innerHTML = "";
    const tournament = state.overview?.tournament;
    const participants = (state.overview?.participants || []).filter((participant) => (
      participant.status === "registered" || participant.status === "checked_in"
    ));
    startCheckInBtn.classList.toggle("ip-hidden", tournament?.status !== "registration");
    startCheckInBtn.disabled = (state.overview?.counters?.registered || 0) < 2;
    renderReadiness();
    if (!participants.length) {
      const empty = document.createElement("div");
      empty.className = "ip-empty";
      empty.textContent = "Register players before check-in.";
      checkInList.appendChild(empty);
      return;
    }
    const editable = tournament?.status === "check_in" && !tournament?.has_started_swiss;
    participants.forEach((participant) => {
      const row = document.createElement("div");
      row.className = "ip-row";
      const main = document.createElement("div");
      main.className = "ip-person";
      const name = document.createElement("div");
      name.className = "ip-person-name";
      name.textContent = participant.name_local || participant.name_en;
      const meta = document.createElement("div");
      meta.className = "ip-person-meta";
      meta.textContent = playerMeta(participant);
      main.appendChild(name);
      main.appendChild(meta);

      const controls = document.createElement("div");
      controls.className = "ip-check-control";
      if (participant.status === "checked_in") {
        const number = document.createElement("div");
        number.className = "ip-draw-number-display";
        number.textContent = participant.draw_number == null ? "—" : String(participant.draw_number);
        number.setAttribute(
          "aria-label",
          participant.draw_number == null ? "Draw number not set" : `Draw number ${participant.draw_number}`
        );
        controls.appendChild(number);
      }
      const action = createButton(
        participant.status === "checked_in" ? "Edit" : "Check-in",
        participant.status === "checked_in" ? "ip-btn" : "ip-btn primary",
        () => openCheckInModal(participant)
      );
      action.disabled = !editable;
      controls.appendChild(action);
      row.appendChild(main);
      row.appendChild(controls);
      checkInList.appendChild(row);
    });
  }

  function swissParticipantName(match, side) {
    const id = match?.[`participant_${side}_id`];
    const participant = (state.overview?.participants || []).find((entry) => entry.id === id);
    return participant?.name_local
      || match?.[`participant_${side}_name_local`]
      || participant?.name_en
      || match?.[`participant_${side}_name_en`]
      || id
      || "—";
  }

  function createSwissStat(value, label) {
    const card = document.createElement("div");
    card.className = "ip-swiss-stat";
    const strong = document.createElement("strong");
    strong.textContent = String(value);
    const hint = document.createElement("div");
    hint.className = "ip-hint";
    hint.textContent = label;
    card.appendChild(strong);
    card.appendChild(hint);
    return card;
  }

  function warningLabel(code) {
    const labels = {
      rematch: "Rematch unavoidable",
      starter_3_in_a_row: "Third identical start role",
      starter_imbalance: "Starter imbalance",
    };
    return labels[String(code || "")] || String(code || "Pairing warning").replace(/_/g, " ");
  }

  function swissTableResult(match) {
    if (match.is_bye) return "Bye";
    if (match.status !== "completed") return "vs";
    if (match.points_a != null && match.points_b != null) {
      return `${match.points_a} : ${match.points_b}`;
    }
    if (match.winner_participant_id === match.participant_a_id) return "1 : 0";
    if (match.winner_participant_id === match.participant_b_id) return "0 : 1";
    return "Result";
  }

  function swissParticipantRecord(participantId) {
    const record = { wins: 0, losses: 0 };
    (state.swiss?.rounds || []).forEach((round) => {
      if (round.status !== "completed") return;
      (round.matches || []).forEach((match) => {
        if (
          match.status !== "completed"
          || ![match.participant_a_id, match.participant_b_id].includes(participantId)
        ) return;
        if (match.winner_participant_id === participantId) record.wins += 1;
        else if (match.winner_participant_id) record.losses += 1;
      });
    });
    return record;
  }

  function createSwissTablePlayer(match, side, { showRecord = false } = {}) {
    const participantId = match[`participant_${side}_id`];
    const player = document.createElement("div");
    player.className = `ip-swiss-table-player${
      match.status === "completed" && match.winner_participant_id === participantId ? " winner" : ""
    }${showRecord ? " with-record" : ""}`;
    if (showRecord) {
      const record = swissParticipantRecord(participantId);
      const recordEl = document.createElement("span");
      recordEl.className = "ip-swiss-player-record";
      recordEl.textContent = `${record.wins} – ${record.losses}`;
      recordEl.title = "Wins – losses";
      player.appendChild(recordEl);
    }
    const name = document.createElement("span");
    name.className = "ip-swiss-table-player-name";
    if (match.starting_participant_id === participantId) {
      const starter = document.createElement("img");
      starter.className = "ip-starting-player-icon";
      starter.src = STARTING_PLAYER_ICON_URL;
      starter.alt = "Starts";
      starter.title = "Starting player";
      name.appendChild(starter);
    }
    name.appendChild(document.createTextNode(swissParticipantName(match, side)));
    player.appendChild(name);
    const lostOnTime = match.result_type === "time_forfeit"
      && (match.loser_participant_id === participantId
        || (!match.loser_participant_id
          && match.winner_participant_id
          && match.winner_participant_id !== participantId));
    if (lostOnTime) {
      const clock = document.createElement("span");
      clock.className = "ip-time-lost-icon";
      clock.title = "Lost on time";
      clock.setAttribute("aria-label", "Lost on time");
      player.appendChild(clock);
    }
    return player;
  }

  function createSwissTableCard(match, { onClick = null, showRecord = false } = {}) {
    const interactive = typeof onClick === "function";
    const card = document.createElement(interactive ? "button" : "article");
    if (interactive) card.type = "button";
    card.className = `ip-match-card ip-swiss-table-card${
      match.status === "completed" ? " completed" : ""
    }`;

    const table = document.createElement("div");
    table.className = "ip-swiss-table-number";
    table.textContent = match.is_bye ? "Bye" : String(match.table_number);
    card.appendChild(table);

    const players = document.createElement("div");
    players.className = "ip-swiss-table-players";
    players.appendChild(createSwissTablePlayer(match, "a", { showRecord }));
    const versus = document.createElement("div");
    versus.className = `ip-swiss-table-versus${match.status === "completed" ? " result" : ""}`;
    versus.textContent = swissTableResult(match);
    players.appendChild(versus);
    if (!match.is_bye) players.appendChild(createSwissTablePlayer(match, "b", { showRecord }));
    card.appendChild(players);

    if (interactive) {
      card.setAttribute(
        "aria-label",
        `Edit table ${match.table_number}: ${swissParticipantName(match, "a")} versus ${swissParticipantName(match, "b")}`
      );
      card.addEventListener("click", onClick);
    }
    return card;
  }

  function createPairingCard(match, { preview = false } = {}) {
    const card = document.createElement("div");
    card.className = "ip-match-card";
    const head = document.createElement("div");
    head.className = "ip-match-head";
    const table = document.createElement("strong");
    table.textContent = match.is_bye ? "Bye" : `Table ${match.table_number}`;
    const status = document.createElement("span");
    status.className = "ip-badge";
    status.textContent = match.is_bye
      ? "Completed"
      : preview
        ? "Preview"
        : String(match.status || "scheduled");
    head.appendChild(table);
    head.appendChild(status);

    const players = document.createElement("div");
    players.className = "ip-match-players";
    const playerA = document.createElement("span");
    playerA.textContent = swissParticipantName(match, "a");
    players.appendChild(playerA);
    if (!match.is_bye) {
      const versus = document.createElement("span");
      versus.className = "ip-match-versus";
      versus.textContent = "vs";
      const playerB = document.createElement("span");
      playerB.textContent = swissParticipantName(match, "b");
      players.appendChild(versus);
      players.appendChild(playerB);
    }
    card.appendChild(head);
    card.appendChild(players);

    const starter = document.createElement("div");
    starter.className = "ip-person-meta";
    starter.textContent = match.is_bye
      ? `${swissParticipantName(match, "a")} receives one win.`
      : !match.starting_participant_id
        ? "Starting player not set."
        : `Starts: ${match.starting_participant_id === match.participant_a_id
        ? swissParticipantName(match, "a")
        : swissParticipantName(match, "b")}`;
    card.appendChild(starter);

    if (match.status === "completed" && !match.is_bye) {
      const result = document.createElement("div");
      result.className = "ip-person-meta";
      const winnerName = match.winner_participant_id === match.participant_a_id
        ? swissParticipantName(match, "a")
        : swissParticipantName(match, "b");
      result.textContent = match.points_a != null && match.points_b != null
        ? `Result: ${match.points_a}:${match.points_b} • Winner: ${winnerName}`
        : `Result: ${String(match.result_type || "win").replace(/_/g, " ")} • Winner: ${winnerName}`;
      card.appendChild(result);
    }

    if (match.warnings?.length) {
      const warnings = document.createElement("div");
      warnings.className = "ip-warning-list";
      match.warnings.forEach((code) => {
        const warning = document.createElement("span");
        warning.className = "ip-warning";
        warning.textContent = warningLabel(code);
        warnings.appendChild(warning);
      });
      card.appendChild(warnings);
    }
    return card;
  }

  function adoptSwissResponse(data) {
    state.swiss = data;
    state.pairingPreview = null;
    if (state.overview && data?.tournament) state.overview.tournament = data.tournament;
    const index = state.tournaments.findIndex((item) => item.id === data?.tournament?.id);
    if (index >= 0) state.tournaments[index] = { ...state.tournaments[index], ...data.tournament };
  }

  function adoptPlayoffResponse(data) {
    state.playoff = data;
    if (state.overview && data?.tournament) state.overview.tournament = data.tournament;
    const index = state.tournaments.findIndex((item) => item.id === data?.tournament?.id);
    if (index >= 0) state.tournaments[index] = { ...state.tournaments[index], ...data.tournament };
  }

  async function previewNextSwissRound() {
    const roundNumber = state.swiss?.next_round_number || 1;
    setStatus(`Building round ${roundNumber} preview...`);
    try {
      const data = await apiJson(tournamentUrl("/swiss/rounds/preview"), {
        method: "POST",
        body: JSON.stringify({ round_number: roundNumber }),
      });
      state.pairingPreview = data.preview;
      renderSwiss();
      setStatus(`Round ${roundNumber} preview is ready.`, "success");
    } catch (error) {
      setStatus(error.message || "Failed to preview Swiss pairings.", "error");
    }
  }

  async function confirmSwissPreview(button) {
    const preview = state.pairingPreview;
    if (!preview) return;
    button.disabled = true;
    try {
      const data = await apiJson(tournamentUrl("/swiss/rounds/confirm"), {
        method: "POST",
        body: JSON.stringify({ round_number: preview.round_number, publish: true }),
      });
      adoptSwissResponse(data);
      renderWorkspace();
      setStatus(`Round ${preview.round_number} pairings confirmed and published.`, "success");
    } catch (error) {
      setStatus(error.message || "Failed to confirm Swiss pairings.", "error");
      button.disabled = false;
    }
  }

  async function publishSwissRound(round, button) {
    if (!window.confirm(`Publish Swiss round ${round.round_number}? Pairings will become active.`)) return;
    button.disabled = true;
    try {
      const data = await apiJson(
        tournamentUrl(`/swiss/rounds/${encodeURIComponent(round.id)}/publish`),
        { method: "POST", body: "{}" }
      );
      adoptSwissResponse(data);
      renderWorkspace();
      setStatus(`Swiss round ${round.round_number} published.`, "success");
    } catch (error) {
      setStatus(error.message || "Failed to publish Swiss round.", "error");
      button.disabled = false;
    }
  }

  async function completeSwissRound(round, button) {
    button.disabled = true;
    try {
      const data = await apiJson(
        tournamentUrl(`/swiss/rounds/${encodeURIComponent(round.id)}/complete`),
        { method: "POST", body: "{}" }
      );
      adoptSwissResponse(data);
      renderWorkspace();
      setStatus(`Swiss round ${round.round_number} completed. Standings updated.`, "success");
    } catch (error) {
      const missing = error.details?.missing_table_numbers || [];
      setStatus(
        missing.length
          ? `${error.message} Missing tables: ${missing.join(", ")}.`
          : error.message || "Failed to complete Swiss round.",
        "error"
      );
      button.disabled = false;
    }
  }

  async function reopenCompletedSwissRound(round, button) {
    button.disabled = true;
    try {
      const data = await apiJson(
        tournamentUrl(`/swiss/rounds/${encodeURIComponent(round.id)}/reopen`),
        { method: "POST", body: "{}" }
      );
      adoptSwissResponse(data);
      renderWorkspace();
      setStatus(
        `Swiss round ${round.round_number} reopened. Edit its results, then complete it again.`,
        "success"
      );
    } catch (error) {
      setStatus(error.message || "Failed to reopen the completed Swiss round.", "error");
      button.disabled = false;
    }
  }

  function cancellationResultLabel(match) {
    if (match.is_bye) return `${swissParticipantName(match, "a")}: bye win`;
    const winner = match.winner_participant_id === match.participant_a_id
      ? swissParticipantName(match, "a")
      : swissParticipantName(match, "b");
    const score = match.points_a != null && match.points_b != null
      ? `${match.points_a}:${match.points_b}`
      : String(match.finish_reason || match.result_type || "result").replace(/_/g, " ");
    return `Table ${match.table_number}: ${score}, winner ${winner}`;
  }

  function openSwissRoundCancellationModal(round, preview) {
    return new Promise((resolve) => {
      const overlay = document.createElement("div");
      overlay.className = "ip-modal-overlay";
      const dialog = document.createElement("div");
      dialog.className = "ip-modal-dialog ip-cancellation-dialog";
      dialog.setAttribute("role", "dialog");
      dialog.setAttribute("aria-modal", "true");
      dialog.setAttribute("aria-labelledby", "ipSwissCancellationModalTitle");

      const title = document.createElement("div");
      title.id = "ipSwissCancellationModalTitle";
      title.className = "ip-modal-title";
      title.textContent = `Cancel exactly Swiss round ${round.round_number}?`;

      const message = document.createElement("div");
      message.className = "ip-cancellation-message";
      message.textContent = "This action removes the round from the active Swiss history.";

      const resultLines = (preview.completed_results || []).map(cancellationResultLabel);
      const consequences = document.createElement("div");
      consequences.className = "ip-cancellation-results";
      if (resultLines.length) {
        const summary = document.createElement("strong");
        summary.textContent = `These ${resultLines.length} results will stop counting:`;
        const list = document.createElement("ul");
        resultLines.forEach((resultLine) => {
          const item = document.createElement("li");
          item.textContent = resultLine;
          list.appendChild(item);
        });
        consequences.appendChild(summary);
        consequences.appendChild(list);
      } else {
        consequences.textContent = "The round has no completed results.";
      }

      const standings = document.createElement("div");
      standings.className = "ip-hint";
      standings.textContent = preview.previous_standings_revision
        ? `Standings will return to revision ${preview.previous_standings_revision}.`
        : "There will be no active standings revision.";

      const actions = document.createElement("div");
      actions.className = "ip-modal-actions";
      const keep = createButton("Keep round", "ip-btn", () => closeModal(false));
      const confirm = createButton(
        `Cancel round ${round.round_number}`,
        "ip-btn danger-filled",
        () => closeModal(true)
      );
      actions.appendChild(keep);
      actions.appendChild(confirm);

      function closeModal(confirmed) {
        document.removeEventListener("keydown", handleEscape);
        overlay.remove();
        resolve(confirmed);
      }

      function handleEscape(event) {
        if (event.key === "Escape") closeModal(false);
      }

      dialog.appendChild(title);
      dialog.appendChild(message);
      dialog.appendChild(consequences);
      dialog.appendChild(standings);
      dialog.appendChild(actions);
      overlay.appendChild(dialog);
      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeModal(false);
      });
      document.addEventListener("keydown", handleEscape);
      document.body.appendChild(overlay);
      keep.focus();
    });
  }

  async function cancelLastSwissRound(round, button) {
    button.disabled = true;
    try {
      const data = await apiJson(
        tournamentUrl(`/swiss/rounds/${encodeURIComponent(round.id)}/cancellation-preview`)
      );
      const preview = data.preview;
      if (!await openSwissRoundCancellationModal(round, preview)) return;
      const cancelled = await apiJson(
        tournamentUrl(`/swiss/rounds/${encodeURIComponent(round.id)}/cancel`),
        {
          method: "POST",
          body: JSON.stringify({ reason: "Cancelled by tournament organizer" }),
        }
      );
      adoptSwissResponse(cancelled);
      await loadOverview();
      setStatus(
        `Swiss round ${round.round_number} cancelled. You can correct the previous state and regenerate it.`,
        "success"
      );
    } catch (error) {
      setStatus(error.message || "Failed to cancel Swiss round.", "error");
    } finally {
      button.disabled = false;
    }
  }

  async function recordNoShow(match, absentParticipantId, button, stage = "swiss") {
    const absentIsA = absentParticipantId === match.participant_a_id;
    const absentName = absentIsA ? swissParticipantName(match, "a") : swissParticipantName(match, "b");
    const winnerId = absentIsA ? match.participant_b_id : match.participant_a_id;
    if (!window.confirm(`Record ${absentName} as a no-show and give the opponent a technical win?`)) return;
    button.disabled = true;
    try {
      const data = await apiJson(
        tournamentUrl(`/${stage}/matches/${encodeURIComponent(match.id)}/result`),
        {
          method: "PUT",
          body: JSON.stringify({
            starting_participant_id: match.starting_participant_id,
            result_type: "technical",
            winner_participant_id: winnerId,
            finish_reason: "no_show",
            admin_note: `${absentName} did not appear`,
          }),
        }
      );
      if (stage === "playoff") adoptPlayoffResponse(data);
      else adoptSwissResponse(data);
      renderWorkspace();
      setStatus(`No-show recorded for ${absentName}.`, "success");
    } catch (error) {
      setStatus(error.message || "Failed to record no-show.", "error");
      button.disabled = false;
    }
  }

  function openMatchResultModal(
    match,
    { stage = "swiss", titleText = "", round = null } = {}
  ) {
    const overlay = document.createElement("div");
    overlay.className = "ip-modal-overlay";
    const pickerController = new AbortController();

    const dialog = document.createElement("div");
    dialog.className = "ip-modal-dialog ip-match-result-dialog";
    dialog.setAttribute("role", "dialog");
    dialog.setAttribute("aria-modal", "true");
    dialog.setAttribute("aria-labelledby", "ipMatchResultModalTitle");

    const title = document.createElement("div");
    title.id = "ipMatchResultModalTitle";
    title.className = "ip-modal-title";
    title.textContent = titleText || `Table ${match.table_number}`;
    const error = document.createElement("div");
    error.className = "ip-modal-warning";
    error.setAttribute("role", "alert");
    error.setAttribute("aria-live", "polite");

    function closeModal() {
      pickerController.abort();
      document.removeEventListener("keydown", handleEscape);
      overlay.remove();
    }

    function handleEscape(event) {
      if (event.key === "Escape") closeModal();
    }

    const form = createSwissResultForm(match, {
      stage,
      errorTarget: error,
      onCancel: closeModal,
      onSaved: closeModal,
      signal: pickerController.signal,
    });
    dialog.appendChild(title);
    if (
      stage === "playoff"
      && round
      && !["final", "bronze_medal_match"].includes(round.round_key)
    ) {
      dialog.appendChild(createPlayoffTableEditor(round, match, closeModal));
    }
    dialog.appendChild(form);
    overlay.appendChild(dialog);
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) closeModal();
    });
    document.addEventListener("keydown", handleEscape);
    document.body.appendChild(overlay);
    form.querySelector(".ip-swiss-score-input:not(:disabled), select")?.focus();
  }

  function openSwissResultModal(match) {
    openMatchResultModal(match);
  }

  function openPlayoffResultModal(round, match) {
    openMatchResultModal(match, {
      stage: "playoff",
      titleText: `${round.round_label} • Table ${match.table_number}`,
      round,
    });
  }

  function createPlayoffTableEditor(round, match, closeModal) {
    const editor = document.createElement("div");
    editor.className = "ip-playoff-modal-table";
    const tableNumber = createField("Table", "number");
    tableNumber.input.min = "1";
    tableNumber.input.step = "1";
    tableNumber.input.value = match.table_number == null ? "" : String(match.table_number);
    const actions = document.createElement("div");
    actions.className = "ip-actions";
    const editable = state.playoff?.tournament?.status === "playoff"
      && ["draft", "published"].includes(round.status)
      && match.status !== "completed";
    const save = createButton("Save table", "ip-btn", async () => {
      const nextTableNumber = Number(tableNumber.input.value);
      if (!Number.isInteger(nextTableNumber) || nextTableNumber <= 0) {
        setStatus("Table number must be a positive integer.", "error");
        return;
      }
      save.disabled = true;
      try {
        const data = await apiJson(
          tournamentUrl(`/playoff/matches/${encodeURIComponent(match.id)}/table`),
          { method: "PATCH", body: JSON.stringify({ table_number: nextTableNumber }) }
        );
        adoptPlayoffResponse(data);
        renderWorkspace();
        closeModal();
        setStatus(`Table updated for ${round.round_label}.`, "success");
      } catch (error) {
        setStatus(error.message || "Failed to update the playoff table.", "error");
        save.disabled = false;
      }
    });
    save.disabled = !editable;
    actions.appendChild(save);
    if (match.table_number === 1) {
      const marker = document.createElement("span");
      marker.className = "ip-streaming";
      marker.textContent = "Streaming table";
      actions.appendChild(marker);
    } else {
      const streaming = createButton("Make streaming table", "ip-btn", async () => {
        streaming.disabled = true;
        try {
          const data = await apiJson(
            tournamentUrl(`/playoff/matches/${encodeURIComponent(match.id)}/streaming-table`),
            { method: "POST", body: "{}" }
          );
          adoptPlayoffResponse(data);
          renderWorkspace();
          closeModal();
          setStatus(`${round.round_label} streaming table updated.`, "success");
        } catch (error) {
          setStatus(error.message || "Failed to update the streaming table.", "error");
          streaming.disabled = false;
        }
      });
      streaming.disabled = !editable;
      actions.appendChild(streaming);
    }
    tableNumber.input.disabled = !editable;
    editor.appendChild(tableNumber.field);
    editor.appendChild(actions);
    return editor;
  }

  function createSwissResultForm(
    match,
    { stage = "swiss", errorTarget = null, onCancel = null, onSaved = null, signal = null } = {}
  ) {
    const form = document.createElement("form");
    form.className = "ip-swiss-result-form";
    form.noValidate = true;

    const playerOptions = [
      { value: match.participant_a_id, label: swissParticipantName(match, "a") },
      { value: match.participant_b_id, label: swissParticipantName(match, "b") },
    ];
    const initialScore = (side) => {
      const participantId = match[`participant_${side}_id`];
      const points = match[`points_${side}`];
      if (points != null) return String(points);
      if (match.status === "completed" && match.winner_participant_id) {
        return match.winner_participant_id === participantId ? "1" : "0";
      }
      return "";
    };
    const createScorePlayer = (side) => {
      const participantId = match[`participant_${side}_id`];
      const summary = document.createElement("div");
      summary.className = "ip-swiss-score-player";
      summary.dataset.participantId = participantId;
      const name = document.createElement("label");
      name.className = "ip-swiss-score-player-name";
      name.htmlFor = `ipSwissScore${side.toUpperCase()}`;
      name.textContent = swissParticipantName(match, side);
      const won = document.createElement("div");
      won.className = "ip-swiss-score-won";
      won.textContent = "Won";
      const input = document.createElement("input");
      input.id = `ipSwissScore${side.toUpperCase()}`;
      input.type = "number";
      input.min = "0";
      input.step = "1";
      input.inputMode = "numeric";
      input.autocomplete = "off";
      input.className = "ip-input ip-swiss-score-input";
      input.value = initialScore(side);
      summary.appendChild(name);
      return { participantId, summary, input, won };
    };

    const scoreA = createScorePlayer("a");
    const scoreB = createScorePlayer("b");
    const scoreGrid = document.createElement("div");
    scoreGrid.className = "ip-swiss-score-grid";
    scoreGrid.appendChild(scoreA.summary);
    scoreGrid.appendChild(scoreB.summary);
    scoreGrid.appendChild(scoreA.input);
    scoreGrid.appendChild(scoreB.input);
    scoreGrid.appendChild(scoreA.won);
    scoreGrid.appendChild(scoreB.won);

    const controls = document.createElement("div");
    controls.className = "ip-swiss-result-controls";
    const starter = createMenuSelectField(
      "Starting player:",
      playerOptions,
      match.starting_participant_id || match.participant_a_id,
      { signal }
    );
    starter.field.className = "ip-swiss-result-control";
    const initialTimeLostParticipantId = match.result_type === "time_forfeit"
      ? match.loser_participant_id
        || (match.winner_participant_id === match.participant_a_id
          ? match.participant_b_id
          : match.participant_a_id)
      : "";
    const timeLost = createMenuSelectField(
      "Time lost:",
      [{ value: "", label: "—" }].concat(playerOptions),
      initialTimeLostParticipantId,
      { signal }
    );
    timeLost.field.className = "ip-swiss-result-control";
    controls.appendChild(starter.field);
    controls.appendChild(timeLost.field);

    const note = createField("Admin note");
    note.field.className = "ip-swiss-admin-note";
    note.input.value = match.admin_note || "";
    const noteToggle = createButton("Add admin note", "ip-admin-note-toggle", () => {
      noteToggle.classList.add("ip-hidden");
      note.field.classList.remove("ip-hidden");
      note.input.focus();
    });
    if (match.admin_note) noteToggle.classList.add("ip-hidden");
    else note.field.classList.add("ip-hidden");

    const actions = document.createElement("div");
    actions.className = "ip-modal-actions";
    const cancel = createButton("Cancel", "ip-btn", () => {
      if (typeof onCancel === "function") onCancel();
    });
    const save = document.createElement("button");
    save.type = "submit";
    save.className = "ip-btn primary";
    save.textContent = "Save";
    actions.appendChild(cancel);
    actions.appendChild(save);

    form.appendChild(scoreGrid);
    form.appendChild(controls);
    form.appendChild(noteToggle);
    form.appendChild(note.field);
    if (errorTarget) form.appendChild(errorTarget);
    form.appendChild(actions);

    let saving = false;
    const validScore = (input) => {
