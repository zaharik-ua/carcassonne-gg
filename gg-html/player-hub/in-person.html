<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ip-bg: #f5f7fb;
    --ip-card: #fff;
    --ip-text: #1f2937;
    --ip-muted: #667085;
    --ip-line: #d8dee8;
    --ip-primary: #1a73b7;
    --ip-primary-soft: #e7f1f9;
    --ip-danger: #b42318;
    --ip-success: #19733d;
    --ip-warning-bg: #fff8e8;
  }

  body {
    margin: 0;
    background: var(--ip-bg);
    color: var(--ip-text);
    font-family: "Montserrat", sans-serif;
  }

  .ip-wrap {
    display: grid;
    gap: 12px;
    margin: 0 8px 16px;
  }

  .ip-card {
    padding: 12px;
    border: 1px solid var(--ip-line);
    border-radius: 7px;
    background: var(--ip-card);
    box-shadow: 0 1px 2px rgba(18, 31, 53, 0.05);
  }

  .ip-head,
  .ip-toolbar,
  .ip-row,
  .ip-actions,
  .ip-check-control {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ip-head,
  .ip-toolbar,
  .ip-row {
    justify-content: space-between;
  }

  .ip-title {
    margin: 0;
    font-size: 21px;
    line-height: 1.25;
  }

  .ip-subtitle,
  .ip-meta,
  .ip-empty,
  .ip-hint {
    color: var(--ip-muted);
    font-size: 12px;
    line-height: 1.45;
  }

  .ip-status {
    min-height: 18px;
    font-size: 13px;
  }

  .ip-status.error {
    color: var(--ip-danger);
  }

  .ip-status.success {
    color: var(--ip-success);
  }

  .ip-hidden {
    display: none !important;
  }

  .ip-select,
  .ip-input {
    width: 100%;
    min-height: 38px;
    box-sizing: border-box;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    padding: 7px 9px;
    background: #fff;
    color: var(--ip-text);
    font: inherit;
    font-size: 14px;
  }

  .ip-tournament-select {
    flex: 1 1 320px;
  }

  .ip-city-picker {
    position: relative;
  }

  .ip-city-picker-btn {
    width: 100%;
    min-height: 38px;
    box-sizing: border-box;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    padding: 7px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #fff;
    color: var(--ip-text);
    font: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
  }

  .ip-city-picker-btn.open {
    border-color: var(--ip-primary);
  }

  .ip-city-picker-value,
  .ip-city-option-label {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ip-city-picker-value span,
  .ip-city-option-label span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ip-city-picker-menu {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    left: 0;
    z-index: 30;
    display: none;
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    background: #fff;
    box-shadow: 0 8px 18px rgba(15, 28, 48, 0.14);
  }

  .ip-city-picker-menu.open {
    display: block;
  }

  .ip-city-search {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: 7px;
    border-bottom: 1px solid #e4e8ef;
    background: #fff;
  }

  .ip-city-option {
    width: 100%;
    min-height: 38px;
    box-sizing: border-box;
    border: 0;
    border-top: 1px solid #edf1f6;
    padding: 7px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #fff;
    color: var(--ip-text);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }

  .ip-city-option:hover,
  .ip-city-option.active {
    background: var(--ip-primary-soft);
  }

  .ip-city-option.add-new {
    color: #155986;
    font-weight: 700;
  }

  .ip-city-icon {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    border-radius: 4px;
    object-fit: contain;
  }

  .ip-inline-city {
    grid-column: 1 / -1;
    width: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px 12px;
    padding: 12px;
    border: 1px solid #a9cce4;
    border-radius: 6px;
    background: #f4f9fd;
  }

  .ip-inline-city-title,
  .ip-inline-city-actions {
    grid-column: 1 / -1;
  }

  .ip-inline-city-title {
    font-size: 13px;
    font-weight: 700;
  }

  .ip-inline-city-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ip-readonly {
    background: #eef2f6;
    color: var(--ip-muted);
  }

  .ip-city-inline-mount {
    grid-column: 1 / -1;
  }

  .ip-btn {
    min-height: 38px;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    padding: 7px 12px;
    background: #eef2f6;
    color: #2f3947;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .ip-btn.primary {
    border-color: var(--ip-primary);
    background: var(--ip-primary);
    color: #fff;
  }

  .ip-btn.danger {
    color: var(--ip-danger);
  }

  .ip-btn:disabled {
    cursor: default;
    opacity: 0.55;
  }

  .ip-badge {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    border-radius: 999px;
    padding: 2px 9px;
    background: var(--ip-primary-soft);
    color: #155986;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .ip-tabs {
    display: flex;
    gap: 6px;
    padding: 4px;
    border: 1px solid var(--ip-line);
    border-radius: 6px;
    background: #fff;
  }

  .ip-tab {
    flex: 1 1 0;
    min-height: 38px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: #445063;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .ip-tab.active {
    background: var(--ip-primary-soft);
    color: #155986;
  }

  .ip-counters {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }

  .ip-counter {
    padding: 10px;
    border: 1px solid var(--ip-line);
    border-radius: 5px;
    background: #fff;
  }

  .ip-counter-value {
    font-size: 20px;
    font-weight: 700;
  }

  .ip-counter-label {
    margin-top: 2px;
    color: var(--ip-muted);
    font-size: 11px;
  }

  .ip-list {
    margin-top: 10px;
    overflow: hidden;
    border: 1px solid var(--ip-line);
    border-radius: 6px;
    background: #fff;
  }

  .ip-row {
    min-height: 54px;
    padding: 7px 9px;
    border-top: 1px solid #e4e8ef;
  }

  .ip-row:first-child {
    border-top: 0;
  }

  .ip-person {
    min-width: 0;
    flex: 1 1 auto;
  }

  .ip-person-name {
    overflow: hidden;
    font-size: 14px;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ip-person-meta {
    margin-top: 3px;
    overflow-wrap: anywhere;
    color: var(--ip-muted);
    font-size: 11px;
  }

  .ip-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px 12px;
    margin-top: 10px;
    padding: 12px;
    border: 1px solid var(--ip-line);
    border-radius: 6px;
    background: #fff;
  }

  .ip-field {
    display: grid;
    gap: 4px;
  }

  .ip-field label {
    color: #344054;
    font-size: 12px;
    font-weight: 600;
  }

  .ip-form-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ip-readiness {
    margin-bottom: 10px;
    padding: 10px;
    border: 1px solid #f0c36c;
    border-radius: 5px;
    background: var(--ip-warning-bg);
    font-size: 12px;
    line-height: 1.45;
  }

  .ip-readiness.ready {
    border-color: #9bc9aa;
    background: #effaf2;
    color: var(--ip-success);
  }

  .ip-readiness ul {
    margin: 6px 0 0;
    padding-left: 18px;
  }

  .ip-check-control {
    flex: 0 0 auto;
  }

  .ip-check-control input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin: 0;
  }

  .ip-draw-number {
    width: 82px;
  }

  .ip-swiss-summary,
  .ip-swiss-preview,
  .ip-swiss-matches {
    display: grid;
    gap: 10px;
    margin-top: 10px;
  }

  .ip-swiss-summary {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .ip-swiss-stat,
  .ip-match-card {
    padding: 10px;
    border: 1px solid var(--ip-line);
    border-radius: 6px;
    background: #fff;
  }

  .ip-swiss-stat strong {
    display: block;
    margin-bottom: 3px;
    font-size: 15px;
  }

  .ip-preview-head,
  .ip-match-head,
  .ip-match-players,
  .ip-swiss-action-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .ip-preview-head,
  .ip-match-head {
    margin-bottom: 7px;
  }

  .ip-match-players {
    justify-content: flex-start;
    font-size: 14px;
    font-weight: 600;
  }

  .ip-match-versus {
    color: var(--ip-muted);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
  }

  .ip-warning-list {
    display: flex;
    gap: 5px;
    margin-top: 7px;
    flex-wrap: wrap;
  }

  .ip-warning {
    border-radius: 999px;
    padding: 3px 8px;
    background: #fff1cc;
    color: #7a4b00;
    font-size: 10px;
    font-weight: 700;
  }

  .ip-result-form {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #e4e8ef;
  }

  .ip-result-form .ip-form-actions,
  .ip-result-form .ip-result-wide {
    grid-column: 1 / -1;
  }

  .ip-result-form .ip-input,
  .ip-result-form .ip-select {
    min-height: 34px;
    padding: 5px 7px;
    font-size: 12px;
  }

  .ip-standings-scroll {
    margin-top: 10px;
    overflow-x: auto;
    border: 1px solid var(--ip-line);
    border-radius: 6px;
  }

  .ip-standings-table {
    width: 100%;
    min-width: 650px;
    border-collapse: collapse;
    background: #fff;
    font-size: 12px;
  }

  .ip-standings-table th,
  .ip-standings-table td {
    padding: 9px 10px;
    border-top: 1px solid #e4e8ef;
    text-align: right;
    white-space: nowrap;
  }

  .ip-standings-table thead th {
    border-top: 0;
    background: #f8fafc;
    color: #475467;
    font-size: 10px;
    text-transform: uppercase;
  }

  .ip-standings-table th:nth-child(2),
  .ip-standings-table td:nth-child(2) {
    width: 100%;
    text-align: left;
  }

  @media (max-width: 720px) {
    .ip-head,
    .ip-toolbar,
    .ip-row {
      align-items: stretch;
      flex-direction: column;
    }

    .ip-actions,
    .ip-check-control {
      width: 100%;
    }

    .ip-actions .ip-btn,
    .ip-check-control .ip-btn {
      flex: 1 1 auto;
      min-height: 44px;
    }

    .ip-counters {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .ip-form {
      grid-template-columns: 1fr;
    }

    .ip-inline-city {
      grid-template-columns: 1fr;
    }

    .ip-draw-number {
      flex: 1 1 auto;
      width: auto;
      min-height: 44px;
    }

    .ip-swiss-summary,
    .ip-result-form {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="ip-wrap">
  <div class="ip-head">
    <div>
      <h1 class="ip-title">In-Person Tournaments</h1>
      <div class="ip-subtitle">Register players, run Swiss rounds and review standings.</div>
    </div>
    <button id="ipRefreshBtn" class="ip-btn" type="button">Refresh</button>
  </div>

  <div id="ipStatus" class="ip-status"></div>

  <div id="ipTournamentCard" class="ip-card">
    <div class="ip-toolbar">
      <select id="ipTournamentSelect" class="ip-select ip-tournament-select" aria-label="In-Person tournament"></select>
    </div>
    <div id="ipTournamentMeta" class="ip-meta"></div>
  </div>

  <div id="ipWorkspace" class="ip-hidden">
    <div class="ip-counters" id="ipCounters"></div>

    <div class="ip-tabs" role="tablist">
      <button class="ip-tab active" type="button" data-ip-tab="players">Players</button>
      <button class="ip-tab" type="button" data-ip-tab="check-in">Check-in</button>
      <button class="ip-tab" type="button" data-ip-tab="swiss">Swiss</button>
      <button class="ip-tab" type="button" data-ip-tab="standings">Standings</button>
    </div>

    <section id="ipPlayersPanel" class="ip-card">
      <div class="ip-toolbar">
        <strong>Players</strong>
        <button id="ipAddPlayerBtn" class="ip-btn primary" type="button">Add player</button>
      </div>
      <div id="ipPlayerFormMount"></div>
      <div id="ipPlayersList" class="ip-list"></div>
    </section>

    <section id="ipCheckInPanel" class="ip-card ip-hidden">
      <div class="ip-toolbar">
        <div>
          <strong>Check-in and draw numbers</strong>
          <div class="ip-hint">Draw numbers must be unique positive integers. Gaps and a missing #1 are allowed.</div>
        </div>
        <button id="ipStartCheckInBtn" class="ip-btn primary ip-hidden" type="button">Start check-in</button>
      </div>
      <div id="ipReadiness"></div>
      <div id="ipCheckInList" class="ip-list"></div>
    </section>

    <section id="ipSwissPanel" class="ip-card ip-hidden">
      <div class="ip-toolbar">
        <div>
          <strong>Swiss rounds</strong>
          <div class="ip-hint">Preview pairings, publish a round, then enter every table result.</div>
        </div>
        <div id="ipSwissActions" class="ip-actions"></div>
      </div>
      <div id="ipSwissSummary" class="ip-swiss-summary"></div>
      <div id="ipSwissPreview" class="ip-swiss-preview"></div>
      <div id="ipSwissMatches" class="ip-swiss-matches"></div>
    </section>

    <section id="ipStandingsPanel" class="ip-card ip-hidden">
      <div class="ip-toolbar">
        <div>
          <strong>Swiss standings</strong>
          <div id="ipStandingsMeta" class="ip-hint"></div>
        </div>
      </div>
      <div id="ipStandings"></div>
    </section>
  </div>
</div>

<script>
(function () {
  const AUTH_BASE = window.AUTH_BASE_URL || "https://api.carcassonne.gg";
  const ACCESSIBLE_URL = `${AUTH_BASE}/in-person-tournaments/accessible`;
  const ASSOCIATIONS_URL = `${AUTH_BASE}/associations`;

  const state = {
    tournaments: [],
    associations: [],
    cities: [],
    selectedTournamentId: "",
    overview: null,
    swiss: null,
    pairingPreview: null,
    activeTab: "players",
    playerFormController: null,
  };

  const tournamentSelect = document.getElementById("ipTournamentSelect");
  const tournamentMeta = document.getElementById("ipTournamentMeta");
  const workspace = document.getElementById("ipWorkspace");
  const statusEl = document.getElementById("ipStatus");
  const countersEl = document.getElementById("ipCounters");
  const playersPanel = document.getElementById("ipPlayersPanel");
  const checkInPanel = document.getElementById("ipCheckInPanel");
  const swissPanel = document.getElementById("ipSwissPanel");
  const standingsPanel = document.getElementById("ipStandingsPanel");
  const playersList = document.getElementById("ipPlayersList");
  const checkInList = document.getElementById("ipCheckInList");
  const playerFormMount = document.getElementById("ipPlayerFormMount");
  const readinessEl = document.getElementById("ipReadiness");
  const addPlayerBtn = document.getElementById("ipAddPlayerBtn");
  const startCheckInBtn = document.getElementById("ipStartCheckInBtn");
  const refreshBtn = document.getElementById("ipRefreshBtn");
  const swissActions = document.getElementById("ipSwissActions");
  const swissSummary = document.getElementById("ipSwissSummary");
  const swissPreview = document.getElementById("ipSwissPreview");
  const swissMatches = document.getElementById("ipSwissMatches");
  const standingsEl = document.getElementById("ipStandings");
  const standingsMeta = document.getElementById("ipStandingsMeta");

  class ApiError extends Error {
    constructor(response, payload) {
      super(payload?.message || `Request failed (${response.status})`);
      this.status = response.status;
      this.code = payload?.code || "";
      this.details = payload?.details || null;
    }
  }

  async function apiJson(url, options = {}) {
    const response = await fetch(url, {
      credentials: "include",
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {}),
      },
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok || payload?.ok === false) throw new ApiError(response, payload);
    return payload;
  }

  function setStatus(message, type = "") {
    statusEl.textContent = message || "";
    statusEl.className = `ip-status${type ? ` ${type}` : ""}`;
  }

  function selectedTournament() {
    return state.tournaments.find((item) => item.id === state.selectedTournamentId) || null;
  }

  function tournamentUrl(path = "") {
    return `${AUTH_BASE}/in-person-tournaments/${encodeURIComponent(state.selectedTournamentId)}${path}`;
  }

  function formatDates(tournament) {
    if (!tournament?.start_date) return "";
    return tournament.start_date === tournament.end_date
      ? tournament.start_date
      : `${tournament.start_date} – ${tournament.end_date}`;
  }

  function createButton(label, className, onClick) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = className || "ip-btn";
    button.textContent = label;
    button.addEventListener("click", onClick);
    return button;
  }

  function createField(labelText, type = "text") {
    const field = document.createElement("div");
    field.className = "ip-field";
    const label = document.createElement("label");
    label.textContent = labelText;
    const input = document.createElement("input");
    input.type = type;
    input.className = "ip-input";
    field.appendChild(label);
    field.appendChild(input);
    return { field, input };
  }

  function createSelectField(labelText, options, value) {
    const field = document.createElement("div");
    field.className = "ip-field";
    const label = document.createElement("label");
    label.textContent = labelText;
    const select = document.createElement("select");
    select.className = "ip-select";
    (options || []).forEach((entry) => {
      const option = document.createElement("option");
      option.value = String(entry.value ?? "");
      option.textContent = String(entry.label ?? entry.value ?? "");
      if (option.value === String(value ?? "")) option.selected = true;
      select.appendChild(option);
    });
    field.appendChild(label);
    field.appendChild(select);
    return { field, select };
  }

  function cityLabel(city) {
    return [city?.name_en, city?.name_local].filter(Boolean).join(" • ") || String(city?.id || "");
  }

  function appendCityLabel(container, city, fallbackText) {
    container.innerHTML = "";
    if (city?.icon_url) {
      const icon = document.createElement("img");
      icon.className = "ip-city-icon";
      icon.src = city.icon_url;
      icon.alt = "";
      icon.addEventListener("error", () => icon.remove(), { once: true });
      container.appendChild(icon);
    }
    const text = document.createElement("span");
    text.textContent = city ? cityLabel(city) : fallbackText;
    container.appendChild(text);
  }

  function createCityPickerField(initialValue, { onAddNew, signal } = {}) {
    const field = document.createElement("div");
    field.className = "ip-field";
    const label = document.createElement("label");
    label.textContent = "City *";
    const root = document.createElement("div");
    root.className = "ip-city-picker";
    const button = document.createElement("button");
    button.type = "button";
    button.className = "ip-city-picker-btn";
    const selectedContent = document.createElement("span");
    selectedContent.className = "ip-city-picker-value";
    const chevron = document.createElement("span");
    chevron.textContent = "▾";
    button.appendChild(selectedContent);
    button.appendChild(chevron);

    const menu = document.createElement("div");
    menu.className = "ip-city-picker-menu";
    const searchWrap = document.createElement("div");
    searchWrap.className = "ip-city-search";
    const searchInput = document.createElement("input");
    searchInput.type = "text";
    searchInput.className = "ip-input";
    searchInput.placeholder = "Type to filter cities...";
    searchWrap.appendChild(searchInput);
    menu.appendChild(searchWrap);

    let value = String(initialValue || "").trim();
    let filterQuery = "";
    const findCity = (cityId) => state.cities.find((city) => (
      String(city?.id || "") === String(cityId || "")
    )) || null;
    const renderButton = () => {
      const city = findCity(value);
      if (!city) value = "";
      appendCityLabel(selectedContent, city, "Select city...");
      selectedContent.style.color = city ? "" : "#999";
    };
    const close = () => {
      menu.classList.remove("open");
      button.classList.remove("open");
    };
    const setValue = (nextValue) => {
      value = findCity(nextValue) ? String(nextValue) : "";
      renderButton();
      renderOptions();
    };
    const createOption = (city) => {
      const option = document.createElement("button");
      option.type = "button";
      option.className = `ip-city-option${String(city.id) === value ? " active" : ""}`;
      const optionLabel = document.createElement("span");
      optionLabel.className = "ip-city-option-label";
      appendCityLabel(optionLabel, city, city.id);
      option.appendChild(optionLabel);
      option.addEventListener("click", (event) => {
        event.stopPropagation();
        setValue(city.id);
        close();
      });
      return option;
    };
    const renderOptions = () => {
      menu.querySelectorAll(".ip-city-option").forEach((node) => node.remove());
      const query = filterQuery.trim().toLocaleLowerCase("en");
      state.cities
        .slice()
        .sort((left, right) => cityLabel(left).localeCompare(cityLabel(right)))
        .filter((city) => !query || `${cityLabel(city)} ${city.id}`.toLocaleLowerCase("en").includes(query))
        .forEach((city) => menu.appendChild(createOption(city)));
      const addNew = document.createElement("button");
      addNew.type = "button";
      addNew.className = "ip-city-option add-new";
      addNew.textContent = "+ Add new city";
      addNew.addEventListener("click", (event) => {
        event.stopPropagation();
        close();
        if (typeof onAddNew === "function") onAddNew();
      });
      menu.appendChild(addNew);
    };
    const open = () => {
      filterQuery = "";
      searchInput.value = "";
      renderOptions();
      menu.classList.add("open");
      button.classList.add("open");
      try {
        searchInput.focus({ preventScroll: true });
      } catch (_error) {
        searchInput.focus();
      }
    };

    searchInput.addEventListener("click", (event) => event.stopPropagation());
    searchInput.addEventListener("keydown", (event) => event.stopPropagation());
    searchInput.addEventListener("input", () => {
      filterQuery = searchInput.value;
      renderOptions();
    });
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      if (menu.classList.contains("open")) close();
      else open();
    });
    document.addEventListener("click", (event) => {
      if (!root.contains(event.target)) close();
    }, signal ? { signal } : undefined);

    renderButton();
    renderOptions();
    root.appendChild(button);
    root.appendChild(menu);
    field.appendChild(label);
    field.appendChild(root);
    return {
      field,
      getValue: () => value,
      setValue,
      refresh: () => {
        renderButton();
        renderOptions();
      },
    };
  }

  function mountInlineCityCreator(tournament, picker, mount) {
    mount.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "ip-inline-city";
    const title = document.createElement("div");
    title.className = "ip-inline-city-title";
    title.textContent = "Add new city";
    const country = createField("Country / association");
    country.input.value = [
      tournament.association_name,
      tournament.association_id,
    ].filter(Boolean).join(" • ");
    country.input.readOnly = true;
    country.input.classList.add("ip-readonly");
    const nameEn = createField("City name (English) *");
    const nameLocal = createField("City name (local)");
    const iconUrl = createField("City icon URL", "url");
    iconUrl.input.placeholder = "https://...";
    const actions = document.createElement("div");
    actions.className = "ip-inline-city-actions";
    const create = createButton("Create and select", "ip-btn primary", async () => {
      const englishName = String(nameEn.input.value || "").trim();
      if (!englishName) {
        setStatus("English city name is required.", "error");
        nameEn.input.focus();
        return;
      }
      create.disabled = true;
      try {
        const data = await apiJson(tournamentUrl("/participant-cities"), {
          method: "POST",
          body: JSON.stringify({
            name_en: englishName,
            name_local: String(nameLocal.input.value || "").trim() || null,
            icon_url: String(iconUrl.input.value || "").trim() || null,
          }),
        });
        state.cities.push(data.city);
        picker.refresh();
        picker.setValue(data.city.id);
        mount.innerHTML = "";
        setStatus("City created and selected.", "success");
      } catch (error) {
        setStatus(error.message || "Failed to create city.", "error");
        create.disabled = false;
      }
    });
    const cancel = createButton("Cancel", "ip-btn", () => {
      mount.innerHTML = "";
      setStatus("");
    });
    actions.appendChild(create);
    actions.appendChild(cancel);
    wrap.appendChild(title);
    wrap.appendChild(country.field);
    wrap.appendChild(nameEn.field);
    wrap.appendChild(nameLocal.field);
    wrap.appendChild(iconUrl.field);
    wrap.appendChild(actions);
    mount.appendChild(wrap);
    nameEn.input.focus();
  }

  function renderTournamentSelector() {
    tournamentSelect.innerHTML = "";
    if (!state.tournaments.length) {
      const option = document.createElement("option");
      option.value = "";
      option.textContent = "No In-Person tournaments available";
      tournamentSelect.appendChild(option);
      tournamentSelect.disabled = true;
      tournamentMeta.textContent = "You are not assigned as an administrator of an active In-Person tournament.";
      workspace.classList.add("ip-hidden");
      return;
    }
    tournamentSelect.disabled = false;
    state.tournaments.forEach((tournament) => {
      const option = document.createElement("option");
      option.value = tournament.id;
      option.textContent = `${tournament.name_en} • ${formatDates(tournament)}`;
      if (tournament.id === state.selectedTournamentId) option.selected = true;
      tournamentSelect.appendChild(option);
    });
  }

  function renderTournamentMeta() {
    const tournament = state.overview?.tournament || selectedTournament();
    if (!tournament) {
      tournamentMeta.textContent = "";
      return;
    }
    const location = tournament.scope === "international"
      ? "International"
      : [
        tournament.local_subtype === "qualifier" ? "Local qualifier" : "Local final",
        tournament.association_name || tournament.association_id,
        tournament.qualifier_city_name_en,
      ].filter(Boolean).join(" • ");
    tournamentMeta.textContent = [
      String(tournament.status || "").toUpperCase(),
      location,
      formatDates(tournament),
      `${tournament.swiss_rounds_count} Swiss rounds`,

  function renderCounters() {
    const counters = state.overview?.counters || {};
    const items = [
      [counters.registered || 0, "Roster"],
      [counters.checked_in || 0, "Checked-in"],
      [counters.without_draw_number || 0, "Without number"],
      [counters.withdrawn_disqualified || 0, "Withdrawn / DQ"],
    ];
    countersEl.innerHTML = "";
    items.forEach(([value, label]) => {

      const number = document.createElement("div");

      number.textContent = String(value);
      const text = document.createElement("div");

  function participantLocation(participant) {
    return participant.city_name_en
      || participant.city_name_local
      || participant.association_name
      || participant.association_id
      || "—";
  }

  function participantMeta(participant) {
    return [
      participant.name_local,
      participantLocation(participant),
      participant.bga_nickname ? `BGA: ${participant.bga_nickname}` : "",
      participant.status,
      participant.draw_number == null ? "" : `#${participant.draw_number}`,
    ].filter(Boolean).join(" • ");
  }

  function renderPlayers() {
    state.playerFormController?.abort();
    state.playerFormController = null;
    playerFormMount.innerHTML = "";
    playersList.innerHTML = "";
    const participants = state.overview?.participants || [];
    const tournament = state.overview?.tournament;
    addPlayerBtn.disabled = !!tournament?.has_started_swiss
      || ["cancelled", "completed"].includes(String(tournament?.status || ""));
    if (!participants.length) {
      const empty = document.createElement("div");
      empty.className = "ip-empty";
      empty.textContent = "No players registered yet.";
      playersList.appendChild(empty);
      return;
    }
    participants.forEach((participant) => {
      const row = document.createElement("div");
      row.className = "ip-row";
      const main = document.createElement("div");
      main.className = "ip-person";
      const name = document.createElement("div");
      name.className = "ip-person-name";
      name.textContent = participant.name_en;
      const meta = document.createElement("div");
      meta.className = "ip-person-meta";
      meta.textContent = participantMeta(participant);
      main.appendChild(name);
      main.appendChild(meta);
      const actions = document.createElement("div");
      actions.className = "ip-actions";
      actions.appendChild(createButton("Edit", "ip-btn", () => openPlayerForm(participant)));
      const deleteButton = createButton("Delete", "ip-btn danger", () => deletePlayer(participant));

      row.appendChild(main);
      row.appendChild(actions);

  function openPlayerForm(participant = null) {
    const tournament = state.overview?.tournament;
    if (!tournament) return;
    state.playerFormController?.abort();
    const formController = new AbortController();
    state.playerFormController = formController;
    playerFormMount.innerHTML = "";
    const form = document.createElement("form");
    form.className = "ip-form";
    const nameEn = createField("Name (English) *");
    nameEn.input.value = participant?.name_en || "";
    const nameLocal = createField("Name (local)");
    nameLocal.input.value = participant?.name_local || "";
    const bgaNickname = createField("BGA nickname");
    bgaNickname.input.value = participant?.bga_nickname || "";
    const cityInlineMount = document.createElement("div");
    cityInlineMount.className = "ip-city-inline-mount";
    let location;
    if (tournament.scope === "international") {
      location = createSelectField(
        "Country / association *",
        [{ value: "", label: "Select country..." }].concat(state.associations.map((association) => ({
          value: association.id,
          label: [association.flag, association.name].filter(Boolean).join(" • "),
        }))),
        participant?.association_id || ""
      );
    } else {
      location = createCityPickerField(participant?.city_id || "", {
        signal: formController.signal,
        onAddNew: () => mountInlineCityCreator(tournament, location, cityInlineMount),
      });
    }
    const getLocationValue = () => (
      tournament.scope === "international" ? location.select.value : location.getValue()
    );
    form.appendChild(nameEn.field);
    form.appendChild(nameLocal.field);
    form.appendChild(bgaNickname.field);
    form.appendChild(location.field);
    if (tournament.scope === "local") form.appendChild(cityInlineMount);
    const actions = document.createElement("div");
    actions.className = "ip-form-actions";
    const save = document.createElement("button");
    save.type = "submit";
    save.className = "ip-btn primary";
    save.textContent = participant ? "Save" : "Add player";
    actions.appendChild(save);
    actions.appendChild(createButton("Cancel", "ip-btn", () => {
      formController.abort();
      if (state.playerFormController === formController) state.playerFormController = null;
      playerFormMount.innerHTML = "";
      setStatus("");
    }));
    form.appendChild(actions);

    async function saveParticipant(confirmDuplicate) {
      const payload = {
        name_en: String(nameEn.input.value || "").trim(),
        name_local: String(nameLocal.input.value || "").trim() || null,
        bga_nickname: String(bgaNickname.input.value || "").trim() || null,
        association_id: tournament.scope === "international" ? getLocationValue() : null,
        city_id: tournament.scope === "local" ? getLocationValue() : null,
        confirm_duplicate: confirmDuplicate,
      };
      save.disabled = true;
      try {
        await apiJson(
          participant
            ? tournamentUrl(`/participants/${encodeURIComponent(participant.id)}`)
            : tournamentUrl("/participants"),
          { method: participant ? "PATCH" : "POST", body: JSON.stringify(payload) }
        );
        formController.abort();
        if (state.playerFormController === formController) state.playerFormController = null;
        playerFormMount.innerHTML = "";
        await loadOverview();
        setStatus(participant ? "Player updated." : "Player added.", "success");
      } catch (error) {
        if (error.code === "DUPLICATE_PARTICIPANT" && !confirmDuplicate) {
          const candidates = (error.details?.candidates || []).map((candidate) => (
            `${candidate.name_en} • ${participantLocation(candidate)}${candidate.bga_nickname ? ` • BGA: ${candidate.bga_nickname}` : ""} • ID: ${candidate.id}`
          )).join("\n");
          if (window.confirm(`Possible duplicate:\n${candidates}\n\nAdd this person as a genuine namesake?`)) {
            save.disabled = false;
            await saveParticipant(true);
            return;
          }
        } else {
          setStatus(error.message || "Failed to save player.", "error");
        }
        save.disabled = false;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!nameEn.input.value.trim() || !getLocationValue()) {
        setStatus("English name and location are required.", "error");
        return;
      }
      await saveParticipant(false);
    });
    playerFormMount.appendChild(form);
    nameEn.input.focus();
  }

  async function deletePlayer(participant) {
    if (!window.confirm(`Delete ${participant.name_en} from this tournament?`)) return;
    try {
      await apiJson(tournamentUrl(`/participants/${encodeURIComponent(participant.id)}`), {
        method: "DELETE",
      });
      await loadOverview();
      setStatus("Player deleted.", "success");
    } catch (error) {
      setStatus(error.message || "Failed to delete player.", "error");
    }
  }

  function renderReadiness() {
    readinessEl.innerHTML = "";
    const readiness = state.overview?.readiness;
    if (!readiness) return;
    const box = document.createElement("div");
    if (state.overview?.tournament?.has_started_swiss) {
      box.className = "ip-readiness ready";
      const locked = document.createElement("strong");
      locked.textContent = "Check-in and draw numbers are locked after Swiss starts.";
      box.appendChild(locked);
      readinessEl.appendChild(box);
      return;
    }
    box.className = `ip-readiness${readiness.ready ? " ready" : ""}`;
    const title = document.createElement("strong");
    title.textContent = readiness.ready
      ? "Ready to form the first Swiss round."
      : "Not ready for the first Swiss round.";
    box.appendChild(title);
    if (readiness.issues?.length) {
      const list = document.createElement("ul");
      readiness.issues.forEach((issue) => {
        const item = document.createElement("li");
        const missingPlayers = issue.code === "MISSING_DRAW_NUMBERS"
          ? (issue.participants || []).map((participant) => participant.name_en).filter(Boolean)
          : [];
        item.textContent = missingPlayers.length
          ? `${issue.message} ${missingPlayers.join(", ")}.`
          : issue.message;
        list.appendChild(item);
      });
      box.appendChild(list);
    }
    readinessEl.appendChild(box);
  }

  function renderCheckIn() {
    checkInList.innerHTML = "";
    const tournament = state.overview?.tournament;
    const participants = (state.overview?.participants || []).filter((participant) => (
      participant.status === "registered" || participant.status === "checked_in"
    ));
    startCheckInBtn.classList.toggle("ip-hidden", tournament?.status !== "registration");
    startCheckInBtn.disabled = (state.overview?.counters?.registered || 0) < 2;
    renderReadiness();
    if (!participants.length) {
      const empty = document.createElement("div");
      empty.className = "ip-empty";
      empty.textContent = "Register players before check-in.";
      checkInList.appendChild(empty);
      return;
    }
    const editable = tournament?.status === "check_in" && !tournament?.has_started_swiss;
    participants.forEach((participant) => {
      const row = document.createElement("div");
      row.className = "ip-row";
      const main = document.createElement("div");
      main.className = "ip-person";
      const name = document.createElement("div");
      name.className = "ip-person-name";
      name.textContent = participant.name_en;
      const meta = document.createElement("div");
      meta.className = "ip-person-meta";
      meta.textContent = participantMeta(participant);
      main.appendChild(name);
      main.appendChild(meta);

      const controls = document.createElement("div");
      controls.className = "ip-check-control";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = participant.status === "checked_in";
      checkbox.disabled = !editable;
      checkbox.setAttribute("aria-label", `Check in ${participant.name_en}`);
      const number = document.createElement("input");
      number.type = "number";
      number.min = "1";
      number.step = "1";
      number.inputMode = "numeric";
      number.placeholder = "Draw #";
      number.className = "ip-input ip-draw-number";
      number.value = participant.draw_number == null ? "" : String(participant.draw_number);
      number.disabled = !editable || !checkbox.checked;
      checkbox.addEventListener("change", () => {
        number.disabled = !checkbox.checked;
        if (!checkbox.checked) number.value = "";
      });
      const save = createButton("Save", "ip-btn", async () => {
        save.disabled = true;
        try {
          await apiJson(tournamentUrl(`/participants/${encodeURIComponent(participant.id)}/check-in`), {
            method: "PATCH",
            body: JSON.stringify({
              checked_in: checkbox.checked,
              draw_number: checkbox.checked && number.value !== "" ? Number(number.value) : null,
            }),
          });
          await loadOverview();
          setStatus(`Check-in saved for ${participant.name_en}.`, "success");
        } catch (error) {
          setStatus(error.message || "Failed to save check-in.", "error");
          save.disabled = false;
        }
      });
      save.disabled = !editable;
      controls.appendChild(checkbox);
      controls.appendChild(number);
      controls.appendChild(save);
      row.appendChild(main);
      row.appendChild(controls);
      checkInList.appendChild(row);
    });
  }

  function swissParticipantName(match, side) {
    const id = match?.[`participant_${side}_id`];
    return match?.[`participant_${side}_name_en`]
      || (state.overview?.participants || []).find((participant) => participant.id === id)?.name_en
      || id
      || "—";
  }

  function createSwissStat(value, label) {
    const card = document.createElement("div");
    card.className = "ip-swiss-stat";
    const strong = document.createElement("strong");
    strong.textContent = String(value);
    const hint = document.createElement("div");
    hint.className = "ip-hint";
    hint.textContent = label;
    card.appendChild(strong);
    card.appendChild(hint);
    return card;
  }

  function warningLabel(code) {
    const labels = {
      rematch: "Rematch unavoidable",
      starter_3_in_a_row: "Third identical start role",
      starter_imbalance: "Starter imbalance",
    };
    return labels[String(code || "")] || String(code || "Pairing warning").replace(/_/g, " ");
  }

  function createPairingCard(match, { preview = false } = {}) {
    const card = document.createElement("div");
    card.className = "ip-match-card";
    const head = document.createElement("div");
    head.className = "ip-match-head";
    const table = document.createElement("strong");
    table.textContent = match.is_bye ? "Bye" : `Table ${match.table_number}`;
    const status = document.createElement("span");
    status.className = "ip-badge";
    status.textContent = match.is_bye
      ? "Completed"
      : preview
        ? "Preview"
        : String(match.status || "scheduled");
    head.appendChild(table);
    head.appendChild(status);

    const players = document.createElement("div");
    players.className = "ip-match-players";
    const playerA = document.createElement("span");
    playerA.textContent = swissParticipantName(match, "a");
    players.appendChild(playerA);
    if (!match.is_bye) {
      const versus = document.createElement("span");
      versus.className = "ip-match-versus";
      versus.textContent = "vs";
      const playerB = document.createElement("span");
      playerB.textContent = swissParticipantName(match, "b");
      players.appendChild(versus);
      players.appendChild(playerB);
    }
    card.appendChild(head);
    card.appendChild(players);

    const starter = document.createElement("div");
    starter.className = "ip-person-meta";
    starter.textContent = match.is_bye
      ? `${swissParticipantName(match, "a")} receives one win.`
      : `Starts: ${match.starting_participant_id === match.participant_a_id
        ? swissParticipantName(match, "a")
        : swissParticipantName(match, "b")}`;
    card.appendChild(starter);

    if (match.status === "completed" && !match.is_bye) {
      const result = document.createElement("div");
      result.className = "ip-person-meta";
      const winnerName = match.winner_participant_id === match.participant_a_id
        ? swissParticipantName(match, "a")
        : swissParticipantName(match, "b");
      result.textContent = match.result_type === "points"
        ? `Result: ${match.points_a}:${match.points_b} • Winner: ${winnerName}`
        : `Result: ${String(match.result_type || "win").replace(/_/g, " ")} • Winner: ${winnerName}`;
      card.appendChild(result);
    }

    if (match.warnings?.length) {
      const warnings = document.createElement("div");
      warnings.className = "ip-warning-list";
      match.warnings.forEach((code) => {
        const warning = document.createElement("span");
        warning.className = "ip-warning";
        warning.textContent = warningLabel(code);
        warnings.appendChild(warning);
      });
      card.appendChild(warnings);
    }
    return card;
  }

  function adoptSwissResponse(data) {
    state.swiss = data;
    state.pairingPreview = null;
    if (state.overview && data?.tournament) state.overview.tournament = data.tournament;
    const index = state.tournaments.findIndex((item) => item.id === data?.tournament?.id);
    if (index >= 0) state.tournaments[index] = { ...state.tournaments[index], ...data.tournament };
  }

  async function previewNextSwissRound() {
    const roundNumber = state.swiss?.next_round_number || 1;
    setStatus(`Building round ${roundNumber} preview...`);
    try {
      const data = await apiJson(tournamentUrl("/swiss/rounds/preview"), {
        method: "POST",
        body: JSON.stringify({ round_number: roundNumber }),
      });
      state.pairingPreview = data.preview;
      renderSwiss();
      setStatus(`Round ${roundNumber} preview is ready.`, "success");
    } catch (error) {
      setStatus(error.message || "Failed to preview Swiss pairings.", "error");
    }
  }

  async function confirmSwissPreview(button) {
    const preview = state.pairingPreview;
    if (!preview) return;
    button.disabled = true;
    try {
      const data = await apiJson(tournamentUrl("/swiss/rounds/confirm"), {
        method: "POST",
        body: JSON.stringify({ round_number: preview.round_number }),
      });
      adoptSwissResponse(data);
      renderWorkspace();
      setStatus(`Round ${preview.round_number} pairings confirmed as a draft.`, "success");
    } catch (error) {
      setStatus(error.message || "Failed to confirm Swiss pairings.", "error");
      button.disabled = false;
    }
  }

  async function publishSwissRound(round, button) {
    if (!window.confirm(`Publish Swiss round ${round.round_number}? Pairings will become active.`)) return;
    button.disabled = true;
    try {
      const data = await apiJson(
        tournamentUrl(`/swiss/rounds/${encodeURIComponent(round.id)}/publish`),
        { method: "POST", body: "{}" }
      );
      adoptSwissResponse(data);
      renderWorkspace();
      setStatus(`Swiss round ${round.round_number} published.`, "success");
    } catch (error) {
      setStatus(error.message || "Failed to publish Swiss round.", "error");
      button.disabled = false;
    }
  }

  async function completeSwissRound(round, button) {
    if (!window.confirm(`Complete Swiss round ${round.round_number} and calculate standings?`)) return;
    button.disabled = true;
    try {
      const data = await apiJson(
        tournamentUrl(`/swiss/rounds/${encodeURIComponent(round.id)}/complete`),
        { method: "POST", body: "{}" }
      );
      adoptSwissResponse(data);
      renderWorkspace();
      setStatus(`Swiss round ${round.round_number} completed. Standings updated.`, "success");
    } catch (error) {
      const missing = error.details?.missing_table_numbers || [];
      setStatus(
        missing.length
          ? `${error.message} Missing tables: ${missing.join(", ")}.`
          : error.message || "Failed to complete Swiss round.",
        "error"
      );
      button.disabled = false;
    }
  }

  function createResultForm(match) {
    const form = document.createElement("form");
    form.className = "ip-result-form";
    const playerOptions = [
      { value: match.participant_a_id, label: swissParticipantName(match, "a") },
      { value: match.participant_b_id, label: swissParticipantName(match, "b") },
    ];
    const starter = createSelectField(
      "Starting player",
      playerOptions,
      match.starting_participant_id
    );
    const resultType = createSelectField(
      "Result type",
      [
        { value: "points", label: "Points" },
        { value: "simple", label: "Win / loss" },
        { value: "time_forfeit", label: "Time forfeit" },
        { value: "technical", label: "Technical" },
      ],
      match.result_type || "points"
    );
    const pointsA = createField(`${swissParticipantName(match, "a")} points`, "number");
    pointsA.input.min = "0";
    pointsA.input.step = "1";
    pointsA.input.value = match.points_a == null ? "" : String(match.points_a);
    const pointsB = createField(`${swissParticipantName(match, "b")} points`, "number");
    pointsB.input.min = "0";
    pointsB.input.step = "1";
    pointsB.input.value = match.points_b == null ? "" : String(match.points_b);
    const winner = createSelectField(
      "Winner",
      [{ value: "", label: "Select winner..." }].concat(playerOptions),
      match.winner_participant_id || ""
    );
    const finishReason = createSelectField(
      "Technical reason",
      [
        { value: "", label: "Select reason..." },
        { value: "withdrawal", label: "Withdrawal" },
        { value: "disqualification", label: "Disqualification" },
        { value: "no_show", label: "No-show" },
        { value: "admin_decision", label: "Admin decision" },
      ],
      match.finish_reason || ""
    );
    const note = createField("Admin note");
    note.field.classList.add("ip-result-wide");
    note.input.value = match.admin_note || "";

    form.appendChild(starter.field);
    form.appendChild(resultType.field);
    form.appendChild(pointsA.field);
    form.appendChild(pointsB.field);
    form.appendChild(winner.field);
    form.appendChild(finishReason.field);
    form.appendChild(note.field);
    const actions = document.createElement("div");
    actions.className = "ip-form-actions";
    const save = document.createElement("button");
    save.type = "submit";
    save.className = "ip-btn primary";
    save.textContent = match.status === "completed" ? "Update result" : "Save result";
    actions.appendChild(save);
    form.appendChild(actions);

    const updateFields = () => {
      const type = resultType.select.value;
      const usesPoints = type === "points";
      const usesWinner = type !== "points";
      pointsA.field.classList.toggle("ip-hidden", !usesPoints);
      pointsB.field.classList.toggle("ip-hidden", !usesPoints);
      winner.field.classList.toggle("ip-hidden", !usesWinner);
      finishReason.field.classList.toggle("ip-hidden", type !== "technical");
    };
    resultType.select.addEventListener("change", updateFields);
    updateFields();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const type = resultType.select.value;
      if (type === "points" && (pointsA.input.value === "" || pointsB.input.value === "")) {
        setStatus("Enter points for both players.", "error");
        return;
      }
      if (type !== "points" && !winner.select.value) {
        setStatus("Select the winner.", "error");
        return;
      }
      if (type === "technical" && !finishReason.select.value) {
        setStatus("Select the technical finish reason.", "error");
        return;
      }
      const payload = {
        starting_participant_id: starter.select.value,
        result_type: type,
        points_a: type === "points" ? Number(pointsA.input.value) : null,
        points_b: type === "points" ? Number(pointsB.input.value) : null,
        winner_participant_id: type === "points" ? null : winner.select.value,
        finish_reason: type === "technical" ? finishReason.select.value : null,
        admin_note: String(note.input.value || "").trim() || null,
      };
      save.disabled = true;
      try {
        const data = await apiJson(
          tournamentUrl(`/swiss/matches/${encodeURIComponent(match.id)}/result`),
          { method: "PUT", body: JSON.stringify(payload) }
        );
        adoptSwissResponse(data);
        renderWorkspace();
        setStatus(`Result saved for table ${match.table_number}.`, "success");
      } catch (error) {
        setStatus(error.message || `Failed to save table ${match.table_number}.`, "error");
        save.disabled = false;
      }
    });
    return form;
  }

  function renderSwissSummary() {
    swissSummary.innerHTML = "";
    const swiss = state.swiss;
    if (!swiss) return;
    const current = swiss.current_round;
    swissSummary.appendChild(createSwissStat(
      current ? `Round ${current.round_number}` : "Not started",
      "Current round"
    ));
    swissSummary.appendChild(createSwissStat(
      `${swiss.completed_rounds || 0} / ${swiss.swiss_rounds_count || 0}`,
      "Rounds completed"
    ));
    swissSummary.appendChild(createSwissStat(
      current ? `${current.progress.completed} / ${current.progress.total}` : "0 / 0",
      "Tables completed"
    ));
  }

  function renderSwissPreview() {
    swissPreview.innerHTML = "";
    const preview = state.pairingPreview;
    if (!preview) return;
    const header = document.createElement("div");
    header.className = "ip-preview-head";
    const title = document.createElement("strong");
    title.textContent = `Round ${preview.round_number} pairing preview`;
    const warningCount = document.createElement("span");
    warningCount.className = "ip-badge";
    warningCount.textContent = `${preview.warnings?.length || 0} warnings`;
    header.appendChild(title);
    header.appendChild(warningCount);
    swissPreview.appendChild(header);
    (preview.matches || []).forEach((match) => {
      swissPreview.appendChild(createPairingCard(match, { preview: true }));
    });
    const actions = document.createElement("div");
    actions.className = "ip-swiss-action-row";
    const confirm = createButton("Confirm pairings", "ip-btn primary", () => confirmSwissPreview(confirm));
    const cancel = createButton("Discard preview", "ip-btn", () => {
      state.pairingPreview = null;
      renderSwiss();
      setStatus("");
    });
    actions.appendChild(confirm);
    actions.appendChild(cancel);
    swissPreview.appendChild(actions);
  }

  function renderSwissMatches() {
    swissMatches.innerHTML = "";
    const round = state.swiss?.current_round;
    if (!round) {
      const empty = document.createElement("div");
      empty.className = "ip-empty";
      empty.textContent = state.overview?.tournament?.status === "check_in"
        ? "Complete check-in, then preview the first Swiss round."
        : "Swiss rounds have not started.";
      swissMatches.appendChild(empty);
      return;
    }
    const heading = document.createElement("div");
    heading.className = "ip-preview-head";
    const title = document.createElement("strong");
    title.textContent = `Round ${round.round_number} tables`;
    const progress = document.createElement("span");
    progress.className = "ip-badge";
    progress.textContent = `${round.progress.completed}/${round.progress.total} completed`;
    heading.appendChild(title);
    heading.appendChild(progress);
    swissMatches.appendChild(heading);
    (round.matches || []).forEach((match) => {
      const card = createPairingCard(match);
      if (!match.is_bye && round.status === "published") {
        card.appendChild(createResultForm(match));
      }
      swissMatches.appendChild(card);
    });
  }

  function renderSwiss() {
    swissActions.innerHTML = "";
    renderSwissSummary();
    renderSwissPreview();
    renderSwissMatches();
    const swiss = state.swiss;
    if (!swiss || state.pairingPreview) return;
    const round = swiss.current_round;
    if (!round && swiss.can_generate_first_round && state.overview?.readiness?.ready) {
      swissActions.appendChild(createButton(
        "Preview first round",
        "ip-btn primary",
        previewNextSwissRound
      ));
    } else if (round?.status === "draft") {
      const publish = createButton("Publish round", "ip-btn primary", () => publishSwissRound(round, publish));
      swissActions.appendChild(publish);
    } else if (
      round?.status === "published"
      && round.progress.completed === round.progress.total
    ) {
      const complete = createButton("Complete round", "ip-btn primary", () => completeSwissRound(round, complete));
      swissActions.appendChild(complete);
    } else if (round?.status === "completed" && swiss.can_generate_next_round) {
      swissActions.appendChild(createButton(
        `Preview round ${swiss.next_round_number}`,
        "ip-btn primary",
        previewNextSwissRound
      ));
    } else if (swiss.swiss_complete) {
      const badge = document.createElement("span");
      badge.className = "ip-badge";
      badge.textContent = "Swiss complete";
      swissActions.appendChild(badge);
    }
  }

  function renderStandings() {
    standingsEl.innerHTML = "";
    const standings = state.swiss?.standings;
    const rows = standings?.rows || [];
    standingsMeta.textContent = standings?.revision
      ? `Revision ${standings.revision} • updated after the latest completed round`
      : "Standings appear after the first completed Swiss round.";
    if (!rows.length) {
      const empty = document.createElement("div");
      empty.className = "ip-empty";
      empty.textContent = "No Swiss standings yet.";
      standingsEl.appendChild(empty);
      return;
    }
    const scroll = document.createElement("div");
    scroll.className = "ip-standings-scroll";
    const table = document.createElement("table");
    table.className = "ip-standings-table";
    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    ["#", "Player", "Wins", "Solkoff1", "Solkoff2", "VP difference"].forEach((label) => {
      const th = document.createElement("th");
      th.scope = "col";
      th.textContent = label;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    const tbody = document.createElement("tbody");
    rows.forEach((standing) => {
      const row = document.createElement("tr");
      const values = [
        standing.position,
        standing.participant_name_en || standing.bga_nickname || standing.participant_id,
        standing.wins,
        standing.solkoff1,
        standing.solkoff2,
        Number(standing.vp_difference) > 0
          ? `+${standing.vp_difference}`
          : standing.vp_difference,
      ];
      values.forEach((value) => {
        const cell = document.createElement("td");
        cell.textContent = String(value ?? "");
        row.appendChild(cell);
      });
      tbody.appendChild(row);
    });
    table.appendChild(thead);
    table.appendChild(tbody);
    scroll.appendChild(table);
    standingsEl.appendChild(scroll);
  }

  function renderWorkspace() {
    if (!state.overview) {
      workspace.classList.add("ip-hidden");
      return;
    }
    workspace.classList.remove("ip-hidden");
    renderTournamentMeta();
    renderCounters();
    renderPlayers();
    renderCheckIn();
    renderSwiss();
    renderStandings();
    document.querySelectorAll("[data-ip-tab]").forEach((button) => {
      button.classList.toggle("active", button.dataset.ipTab === state.activeTab);
    });
    playersPanel.classList.toggle("ip-hidden", state.activeTab !== "players");
    checkInPanel.classList.toggle("ip-hidden", state.activeTab !== "check-in");
    swissPanel.classList.toggle("ip-hidden", state.activeTab !== "swiss");
    standingsPanel.classList.toggle("ip-hidden", state.activeTab !== "standings");
  }

  async function loadOverview() {
    if (!state.selectedTournamentId) {
      state.overview = null;
      state.swiss = null;
      state.pairingPreview = null;
      renderWorkspace();
      return;
    }
    const selected = selectedTournament();
    const requests = [
      apiJson(tournamentUrl("/participants")),
      apiJson(tournamentUrl("/swiss")),
    ];
    if (selected?.scope === "local") requests.push(apiJson(tournamentUrl("/participant-cities")));
    const [overview, swissData, citiesData] = await Promise.all(requests);
    state.overview = overview;
    state.swiss = swissData;
    state.pairingPreview = null;
    state.cities = Array.isArray(citiesData?.cities) ? citiesData.cities : [];
    renderWorkspace();
  }

  async function selectTournament(tournamentId) {
    state.selectedTournamentId = String(tournamentId || "");
    const url = new URL(window.location.href);
    if (state.selectedTournamentId) url.searchParams.set("tournament", state.selectedTournamentId);
    else url.searchParams.delete("tournament");
    window.history.replaceState({}, "", url.toString());
    renderTournamentSelector();
    setStatus("");
    try {
      await loadOverview();
    } catch (error) {
      state.overview = null;
      state.swiss = null;
      state.pairingPreview = null;
      renderWorkspace();
      setStatus(error.message || "Failed to load tournament.", "error");
    }
  }

  async function loadAll() {
    refreshBtn.disabled = true;
    setStatus("Loading...");
    try {
      const [accessibleData, associationsData] = await Promise.all([
        apiJson(ACCESSIBLE_URL),
        apiJson(ASSOCIATIONS_URL),
      ]);
      state.tournaments = Array.isArray(accessibleData?.tournaments) ? accessibleData.tournaments : [];
      state.associations = Array.isArray(associationsData?.associations) ? associationsData.associations : [];
      const requestedId = new URL(window.location.href).searchParams.get("tournament") || "";
      const preservedId = state.tournaments.some((item) => item.id === state.selectedTournamentId)
        ? state.selectedTournamentId
        : "";
      state.selectedTournamentId = state.tournaments.some((item) => item.id === requestedId)
        ? requestedId
        : preservedId || state.tournaments[0]?.id || "";
      renderTournamentSelector();
      renderTournamentMeta();
      if (state.selectedTournamentId) await selectTournament(state.selectedTournamentId);
      else {
        state.overview = null;
        state.swiss = null;
        renderWorkspace();
        setStatus("");
      }
    } catch (error) {
      state.tournaments = [];
      state.overview = null;
      state.swiss = null;
      renderTournamentSelector();
      setStatus(
        error.status === 401 ? "Sign in to open In-Person tournaments." : error.message,
        "error"
      );
    } finally {
      refreshBtn.disabled = false;
    }
  }

  tournamentSelect.addEventListener("change", () => selectTournament(tournamentSelect.value));
  refreshBtn.addEventListener("click", loadAll);
  addPlayerBtn.addEventListener("click", () => openPlayerForm());
  startCheckInBtn.addEventListener("click", async () => {
    startCheckInBtn.disabled = true;
    try {
      await apiJson(tournamentUrl("/start-check-in"), { method: "POST", body: "{}" });
      await loadOverview();
      setStatus("Check-in started.", "success");
    } catch (error) {
      setStatus(error.message || "Failed to start check-in.", "error");
      startCheckInBtn.disabled = false;
    }
  });
  document.querySelectorAll("[data-ip-tab]").forEach((button) => {
    button.addEventListener("click", () => {
      state.activeTab = button.dataset.ipTab;
      renderWorkspace();
    });
  });
  window.addEventListener("gg-auth-state-change", loadAll);

  loadAll();
})();
</script>
