      if (input.value === "") return false;
      const value = Number(input.value);
      return Number.isInteger(value) && value >= 0;
    };
    const currentWinnerId = () => {
      if (timeLost.getValue() === match.participant_a_id) return match.participant_b_id;
      if (timeLost.getValue() === match.participant_b_id) return match.participant_a_id;
      if (!validScore(scoreA.input) || !validScore(scoreB.input)) return "";
      const pointsA = Number(scoreA.input.value);
      const pointsB = Number(scoreB.input.value);
      if (pointsA > pointsB) return match.participant_a_id;
      if (pointsB > pointsA) return match.participant_b_id;
      if (starter.getValue() === match.participant_a_id) return match.participant_b_id;
      if (starter.getValue() === match.participant_b_id) return match.participant_a_id;
      return "";
    };
    const syncForm = () => {
      const winnerId = currentWinnerId();
      [scoreA, scoreB].forEach((score) => {
        const isWinner = score.participantId === winnerId;
        score.summary.classList.toggle("winner", isWinner);
        score.won.classList.toggle("visible", isWinner);
      });
      scoreA.input.disabled = saving;
      scoreB.input.disabled = saving;
      starter.setDisabled(saving);
      timeLost.setDisabled(saving);
      note.input.disabled = saving;
      noteToggle.disabled = saving;
      cancel.disabled = saving;
      save.disabled = saving
        || !starter.getValue()
        || !validScore(scoreA.input)
        || !validScore(scoreB.input);
    };

    scoreA.input.addEventListener("input", () => syncForm());
    scoreB.input.addEventListener("input", () => syncForm());
    starter.onChange(() => syncForm());
    timeLost.onChange(() => syncForm());
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (errorTarget) errorTarget.textContent = "";
      if (!starter.getValue()) {
        if (errorTarget) errorTarget.textContent = "Select the starting player.";
        return;
      }
      const timeLostParticipantId = timeLost.getValue();
      if (!validScore(scoreA.input) || !validScore(scoreB.input)) {
        if (errorTarget) errorTarget.textContent = "Enter a non-negative whole-number score for both players.";
        return;
      }
      const payload = timeLostParticipantId
        ? {
          starting_participant_id: starter.getValue(),
          result_type: "time_forfeit",
          points_a: Number(scoreA.input.value),
          points_b: Number(scoreB.input.value),
          winner_participant_id: timeLostParticipantId === match.participant_a_id
            ? match.participant_b_id
            : match.participant_a_id,
          finish_reason: "time_forfeit",
          admin_note: String(note.input.value || "").trim() || null,
        }
        : {
          starting_participant_id: starter.getValue(),
          result_type: "points",
          points_a: Number(scoreA.input.value),
          points_b: Number(scoreB.input.value),
          admin_note: String(note.input.value || "").trim() || null,
        };
      saving = true;
      save.textContent = "Saving...";
      syncForm();
      try {
        const data = await apiJson(
          tournamentUrl(`/${stage}/matches/${encodeURIComponent(match.id)}/result`),
          { method: "PUT", body: JSON.stringify(payload) }
        );
        if (stage === "playoff") adoptPlayoffResponse(data);
        else adoptSwissResponse(data);
        renderWorkspace();
        setStatus(`Result saved for table ${match.table_number}.`, "success");
        if (typeof onSaved === "function") onSaved();
      } catch (error) {
        saving = false;
        save.textContent = "Save";
        if (errorTarget) errorTarget.textContent = error.message || `Failed to save table ${match.table_number}.`;
        syncForm();
      }
    });

    syncForm();
    return form;
  }

  function createResultForm(
    match,
    { stage = "swiss", modal = false, errorTarget = null, onCancel = null, onSaved = null } = {}
  ) {
    const form = document.createElement("form");
    form.className = "ip-result-form";
    const reportError = (message) => {
      if (errorTarget) errorTarget.textContent = message;
      else setStatus(message, "error");
    };
    const clearError = () => {
      if (errorTarget) errorTarget.textContent = "";
    };
    const playerOptions = [
      { value: match.participant_a_id, label: swissParticipantName(match, "a") },
      { value: match.participant_b_id, label: swissParticipantName(match, "b") },
    ];
    const starter = createSelectField(
      "Starting player",
      playerOptions,
      match.starting_participant_id
    );
    const resultType = createSelectField(
      "Result type",
      [
        { value: "points", label: "Points" },
        { value: "simple", label: "Win / loss" },
        { value: "time_forfeit", label: "Time forfeit" },
        { value: "technical", label: "Technical" },
      ],
      match.result_type || "points"
    );
    const pointsA = createField(`${swissParticipantName(match, "a")} points`, "number");
    pointsA.input.min = "0";
    pointsA.input.step = "1";
    pointsA.input.value = match.points_a == null ? "" : String(match.points_a);
    const pointsB = createField(`${swissParticipantName(match, "b")} points`, "number");
    pointsB.input.min = "0";
    pointsB.input.step = "1";
    pointsB.input.value = match.points_b == null ? "" : String(match.points_b);
    const winner = createSelectField(
      "Winner",
      [{ value: "", label: "Select winner..." }].concat(playerOptions),
      match.winner_participant_id || ""
    );
    const finishReason = createSelectField(
      "Technical reason",
      [
        { value: "", label: "Select reason..." },
        { value: "withdrawal", label: "Withdrawal" },
        { value: "disqualification", label: "Disqualification" },
        { value: "no_show", label: "No-show" },
        { value: "admin_decision", label: "Admin decision" },
      ],
      match.finish_reason || ""
    );
    const note = createField("Admin note");
    note.field.classList.add("ip-result-wide");
    note.input.value = match.admin_note || "";

    form.appendChild(starter.field);
    form.appendChild(resultType.field);
    form.appendChild(pointsA.field);
    form.appendChild(pointsB.field);
    form.appendChild(winner.field);
    form.appendChild(finishReason.field);
    form.appendChild(note.field);
    const actions = document.createElement("div");
    actions.className = "ip-form-actions";
    const save = document.createElement("button");
    save.type = "submit";
    save.className = "ip-btn primary";
    save.textContent = modal ? "Save" : match.status === "completed" ? "Update result" : "Save result";
    if (modal && typeof onCancel === "function") {
      actions.appendChild(createButton("Cancel", "ip-btn", onCancel));
    }
    actions.appendChild(save);
    if (!modal) {
      const noShowA = createButton(`${swissParticipantName(match, "a")} no-show`, "ip-btn danger", () => (
        recordNoShow(match, match.participant_a_id, noShowA, stage)
      ));
      const noShowB = createButton(`${swissParticipantName(match, "b")} no-show`, "ip-btn danger", () => (
        recordNoShow(match, match.participant_b_id, noShowB, stage)
      ));
      actions.appendChild(noShowA);
      actions.appendChild(noShowB);
    }
    form.appendChild(actions);

    const updateFields = () => {
      const type = resultType.select.value;
      const usesPoints = type === "points";
      const usesWinner = type !== "points";
      pointsA.field.classList.toggle("ip-hidden", !usesPoints);
      pointsB.field.classList.toggle("ip-hidden", !usesPoints);
      winner.field.classList.toggle("ip-hidden", !usesWinner);
      finishReason.field.classList.toggle("ip-hidden", type !== "technical");
    };
    resultType.select.addEventListener("change", updateFields);
    updateFields();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError();
      const type = resultType.select.value;
      if (type === "points" && (pointsA.input.value === "" || pointsB.input.value === "")) {
        reportError("Enter points for both players.");
        return;
      }
      if (type !== "points" && !winner.select.value) {
        reportError("Select the winner.");
        return;
      }
      if (type === "technical" && !finishReason.select.value) {
        reportError("Select the technical finish reason.");
        return;
      }
      const payload = {
        starting_participant_id: starter.select.value,
        result_type: type,
        points_a: type === "points" ? Number(pointsA.input.value) : null,
        points_b: type === "points" ? Number(pointsB.input.value) : null,
        winner_participant_id: type === "points" ? null : winner.select.value,
        finish_reason: type === "technical" ? finishReason.select.value : null,
        admin_note: String(note.input.value || "").trim() || null,
      };
      save.disabled = true;
      try {
        const data = await apiJson(
          tournamentUrl(`/${stage}/matches/${encodeURIComponent(match.id)}/result`),
          { method: "PUT", body: JSON.stringify(payload) }
        );
        if (stage === "playoff") adoptPlayoffResponse(data);
        else adoptSwissResponse(data);
        renderWorkspace();
        setStatus(`Result saved for table ${match.table_number}.`, "success");
        if (typeof onSaved === "function") onSaved();
      } catch (error) {
        reportError(error.message || `Failed to save table ${match.table_number}.`);
        save.disabled = false;
      }
    });
    return form;
  }

  function renderSwissSummary() {
    swissSummary.innerHTML = "";
    const swiss = state.swiss;
    if (!swiss) return;
    const current = swiss.current_round;
    swissSummary.appendChild(createSwissStat(
      current ? `Round ${current.round_number}` : "Not started",
      "Current round"
    ));
    swissSummary.appendChild(createSwissStat(
      `${swiss.completed_rounds || 0} / ${swiss.swiss_rounds_count || 0}`,
      "Rounds completed"
    ));
    const tableProgress = swissTableProgress(current);
    swissSummary.appendChild(createSwissStat(
      `${tableProgress.completed} / ${tableProgress.total}`,
      "Tables completed"
    ));
  }

  function swissTableProgress(round) {
    const tables = (round?.matches || []).filter((match) => !match.is_bye);
    return {
      completed: tables.filter((match) => match.status === "completed").length,
      total: tables.length,
    };
  }

  function renderSwissPreview() {
    swissPreview.innerHTML = "";
    const preview = state.pairingPreview;
    if (!preview) return;
    const header = document.createElement("div");
    header.className = "ip-preview-head";
    const title = document.createElement("strong");
    title.textContent = `Round ${preview.round_number} pairing preview`;
    header.appendChild(title);
    const warningCount = preview.warnings?.length || 0;
    if (warningCount > 0) {
      const warningBadge = document.createElement("span");
      warningBadge.className = "ip-badge";
      warningBadge.textContent = `${warningCount} warnings`;
      header.appendChild(warningBadge);
    }
    swissPreview.appendChild(header);
    const actions = document.createElement("div");
    actions.className = "ip-swiss-action-row";
    const confirm = createButton("Confirm and publish", "ip-btn primary", () => confirmSwissPreview(confirm));
    const cancel = createButton("Discard preview", "ip-btn", () => {
      state.pairingPreview = null;
      renderSwiss();
      setStatus("");
    });
    actions.appendChild(confirm);
    actions.appendChild(cancel);
    swissPreview.appendChild(actions);
    const grid = document.createElement("div");
    grid.className = "ip-swiss-table-grid";
    (preview.matches || []).forEach((match) => {
      grid.appendChild(createSwissTableCard(match, { showRecord: true }));
    });
    swissPreview.appendChild(grid);
  }

  function renderSwissMatches() {
    swissMatches.innerHTML = "";
    const rounds = state.swiss?.rounds || [];
    if (!rounds.length) {
      const empty = document.createElement("div");
      empty.className = "ip-empty";
      empty.textContent = state.overview?.tournament?.status === "check_in"
        ? "Complete check-in, then preview the first Swiss round."
        : "Swiss rounds have not started.";
      swissMatches.appendChild(empty);
      return;
    }
    rounds
      .slice()
      .sort((left, right) => Number(right.round_number) - Number(left.round_number))
      .forEach((round) => {
        const section = document.createElement("section");
        section.className = "ip-swiss-round";
        const heading = document.createElement("div");
        heading.className = "ip-preview-head";
        const title = document.createElement("strong");
        title.textContent = `Round ${round.round_number} tables`;
        heading.appendChild(title);
        section.appendChild(heading);
        const grid = document.createElement("div");
        grid.className = "ip-swiss-table-grid";
        (round.matches || [])
          .slice()
          .sort((left, right) => (
            Number(left.table_number ?? Number.MAX_SAFE_INTEGER)
            - Number(right.table_number ?? Number.MAX_SAFE_INTEGER)
          ))
          .forEach((match) => {
            const onClick = !match.is_bye && round.status === "published"
              ? () => openSwissResultModal(match)
              : null;
            grid.appendChild(createSwissTableCard(match, { onClick }));
          });
        section.appendChild(grid);
        swissMatches.appendChild(section);
      });
  }

  function renderSwiss() {
    swissActions.innerHTML = "";
    swissRecovery.innerHTML = "";
    renderSwissSummary();
    renderSwissPreview();
    renderSwissMatches();
    const swiss = state.swiss;
    if (!swiss || state.pairingPreview) return;
    const round = swiss.current_round;
    if (!round && swiss.can_generate_first_round && state.overview?.readiness?.ready) {
      swissActions.appendChild(createButton(
        "Preview first round",
        "ip-btn primary",
        previewNextSwissRound
      ));
    } else if (round?.status === "draft") {
      const publish = createButton("Publish round", "ip-btn primary", () => publishSwissRound(round, publish));
      swissActions.appendChild(publish);
    } else if (
      round?.status === "published"
      && round.progress.completed === round.progress.total
    ) {
      const complete = createButton("Complete round", "ip-btn primary", () => completeSwissRound(round, complete));
      swissActions.appendChild(complete);
    } else if (round?.status === "completed") {
      if (swiss.can_reopen_current_round) {
        const reopen = createButton(
          "Undo complete round",
          "ip-btn",
          () => reopenCompletedSwissRound(round, reopen)
        );
        swissActions.appendChild(reopen);
      }
      if (swiss.can_generate_next_round) {
        swissActions.appendChild(createButton(
          `Preview round ${swiss.next_round_number}`,
          "ip-btn primary",
          previewNextSwissRound
        ));
      } else if (swiss.swiss_complete) {
        const badge = document.createElement("span");
        badge.className = "ip-badge";
        badge.textContent = "Swiss complete";
        swissActions.appendChild(badge);
      }
    }
    if (round && swiss.can_cancel_current_round) {
      const cancel = createButton(
        `Cancel round ${round.round_number}`,
        "ip-btn danger",
        () => cancelLastSwissRound(round, cancel)
      );
      swissActions.appendChild(cancel);
      if (round.status === "draft") {
        const note = document.createElement("div");
        note.className = "ip-recovery";
        const title = document.createElement("strong");
        title.textContent = "Draft-round no-show";
        const text = document.createElement("span");
        text.textContent = round.round_number === 1
          ? "Cancel this draft, remove the player's check-in, then regenerate the round."
          : "Mark the player withdrawn, cancel this draft, then regenerate the round.";
        note.appendChild(title);
        note.appendChild(text);
        swissRecovery.appendChild(note);
      }
    }
  }

  function renderStandings() {
    standingsEl.innerHTML = "";
    const standings = state.swiss?.standings;
    const rows = standings?.rows || [];
    if (!rows.length) {
      const empty = document.createElement("div");
      empty.className = "ip-empty";
      empty.textContent = "No Swiss standings yet.";
      standingsEl.appendChild(empty);
      return;
    }
    const scroll = document.createElement("div");
    scroll.className = "ip-standings-scroll";
    const table = document.createElement("table");
    table.className = "ip-standings-table";
    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    ["#", "Player", "Wins", "Solkoff1", "Solkoff2", "VP difference"].forEach((label) => {
      const th = document.createElement("th");
      th.scope = "col";
      th.textContent = label;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    const tbody = document.createElement("tbody");
    rows.forEach((standing) => {
      const row = document.createElement("tr");
      const values = [
        standing.position,
        standing.participant_name_en || standing.bga_nickname || standing.participant_id,
        standing.wins,
        standing.solkoff1,
        standing.solkoff2,
        Number(standing.vp_difference) > 0
          ? `+${standing.vp_difference}`
          : standing.vp_difference,
      ];
      values.forEach((value) => {
        const cell = document.createElement("td");
        cell.textContent = String(value ?? "");
        row.appendChild(cell);
      });
      tbody.appendChild(row);
    });
    table.appendChild(thead);
    table.appendChild(tbody);
    scroll.appendChild(table);
    standingsEl.appendChild(scroll);
  }

  const PLAYOFF_MAIN_ROUNDS = [
    "round_of_32",
    "round_of_16",
    "quarter_final",
    "semi_final",
    "final",
  ];
  const PLAYOFF_ROUND_LABELS = {
    round_of_32: "Round of 32",
    round_of_16: "Round of 16",
    quarter_final: "Quarter-final",
    semi_final: "Semi-final",
    bronze_medal_match: "Bronze medal match",
    final: "Final",
  };
  const PLAYOFF_MATCH_WIDTH = 250;
  const PLAYOFF_MATCH_HEIGHT = 64;
  const PLAYOFF_MARGIN = 14;
  const PLAYOFF_LABEL_SPACE = 48;
  const PLAYOFF_HORIZONTAL_GAP = 42;
  const PLAYOFF_VERTICAL_GAP = 24;

  function playoffParticipantName(participantId) {
    const participant = (state.overview?.participants || []).find((entry) => (
      entry.id === participantId
    ));
    return participant?.name_local || participant?.name_en || participantId || "—";
  }

  function playoffSetupParticipantName(participantId) {
    const standing = (state.playoff?.standings?.rows || []).find((entry) => (
      entry.participant_id === participantId
    ));
    const position = Number(standing?.position);
    const name = playoffParticipantName(participantId);
    return Number.isInteger(position) && position > 0
      ? `#${position} • ${name}`
      : name;
  }

  function playoffRoundLabel(roundKey) {
    return PLAYOFF_ROUND_LABELS[roundKey]
      || String(roundKey || "").replace(/_/g, " ");
  }

  function playoffTableNumber(roundKey, tableNumber) {
    if (roundKey === "final") return 1;
    if (roundKey === "bronze_medal_match") return 2;
    return tableNumber;
  }

  function ensurePlayoffSetupSlots() {
    const participantCount = Number(state.playoff?.participant_count || 0);
    if (state.playoffSetupSlots.length !== participantCount) {
      state.playoffSetupSlots = Array(participantCount).fill("");
    } else {
      const eligibleIds = new Set(
        (state.playoff?.eligible_participants || []).map((participant) => participant.id)
      );
      state.playoffSetupSlots = state.playoffSetupSlots.map((participantId) => (
        eligibleIds.has(participantId) ? participantId : ""
      ));
    }
    return state.playoffSetupSlots;
  }

  function buildEmptyPlayoffRounds() {
    const firstRound = String(state.playoff?.first_round || "");
    const firstRoundIndex = PLAYOFF_MAIN_ROUNDS.indexOf(firstRound);
    if (firstRoundIndex < 0) return [];
    const mainRoundKeys = PLAYOFF_MAIN_ROUNDS.slice(firstRoundIndex);
    const orderedRoundKeys = [
      ...mainRoundKeys.slice(0, -1),
      "bronze_medal_match",
      "final",
    ];
    const medalRoundOrder = mainRoundKeys.length;
    const slots = ensurePlayoffSetupSlots();
    const rounds = orderedRoundKeys.map((roundKey, roundIndex) => {
      const mainIndex = mainRoundKeys.indexOf(roundKey);
      const matchCount = mainIndex < 0 ? 1 : slots.length / (2 ** (mainIndex + 1));
      return {
        id: `setup-round-${roundKey}`,
        round_key: roundKey,
        round_label: playoffRoundLabel(roundKey),
        round_order: ["bronze_medal_match", "final"].includes(roundKey)
          ? medalRoundOrder
          : roundIndex + 1,
        status: "setup",
        matches: Array.from({ length: matchCount }, (_, matchIndex) => ({
          id: `setup-match-${roundKey}-${matchIndex + 1}`,
          bracket_position: matchIndex + 1,
          table_number: roundKey === "bronze_medal_match" ? 2 : matchIndex + 1,
          participant_a_id: null,
          participant_b_id: null,
          next_match_for_winner_id: null,
          next_match_for_loser_id: null,
          status: "scheduled",
          setup: true,
        })),
      };
    });
    const roundsByKey = new Map(rounds.map((round) => [round.round_key, round]));
    const firstRoundMatches = roundsByKey.get(firstRound)?.matches || [];
    firstRoundMatches.forEach((match, index) => {
      match.setup_slot_a_index = index * 2;
      match.setup_slot_b_index = (index * 2) + 1;
      match.participant_a_id = slots[match.setup_slot_a_index] || null;
      match.participant_b_id = slots[match.setup_slot_b_index] || null;
    });
    mainRoundKeys.slice(0, -1).forEach((roundKey, roundIndex) => {
      const nextRound = roundsByKey.get(mainRoundKeys[roundIndex + 1]);
      (roundsByKey.get(roundKey)?.matches || []).forEach((match, matchIndex) => {
        match.next_match_for_winner_id = nextRound.matches[Math.floor(matchIndex / 2)]?.id || null;
        if (roundKey === "semi_final") {
          match.next_match_for_loser_id = roundsByKey.get("bronze_medal_match")?.matches[0]?.id || null;
        }
      });
    });
    return rounds;
  }

  function playoffParticipantOptions(excludedSlotIndexes = []) {
    const excluded = new Set(excludedSlotIndexes);
    const usedElsewhere = new Set(
      ensurePlayoffSetupSlots().filter((participantId, index) => (
        participantId && !excluded.has(index)
      ))
    );
    const standingsByParticipant = new Map(
      (state.playoff?.standings?.rows || []).map((standing) => (
        [standing.participant_id, standing.position]
      ))
    );
    const swissPosition = (participantId) => {
      const position = Number(standingsByParticipant.get(participantId));
      return Number.isInteger(position) && position > 0
        ? position
        : Number.MAX_SAFE_INTEGER;
    };
    return [{ value: "", label: "Select participant..." }].concat(
      (state.playoff?.eligible_participants || [])
        .filter((participant) => !usedElsewhere.has(participant.id))
        .slice()
        .sort((left, right) => (
          swissPosition(left.id) - swissPosition(right.id)
          || String(left.name_local || left.name_en || "").localeCompare(
            String(right.name_local || right.name_en || ""),
            undefined,
            { sensitivity: "base" }
          )
        ))
        .map((participant) => ({
          value: participant.id,
          label: [
            standingsByParticipant.has(participant.id)
              ? `#${standingsByParticipant.get(participant.id)}`
              : "Unranked",
            participant.name_local || participant.name_en,
            participant.bga_nickname ? `BGA: ${participant.bga_nickname}` : "",
          ].filter(Boolean).join(" • "),
        }))
    );
  }

  function playoffSeedOrder(participantCount) {
    let order = [1];
    for (let bracketSize = 2; bracketSize <= participantCount; bracketSize *= 2) {
      order = order.flatMap((seed) => [seed, bracketSize + 1 - seed]);
    }
    return order;
  }

  function seedPlayoffFromSwiss() {
    const participantCount = Number(state.playoff?.participant_count || 0);
    const eligibleIds = new Set(
      (state.playoff?.eligible_participants || []).map((participant) => participant.id)
    );
    const rankedParticipantIds = (state.playoff?.standings?.rows || [])
      .filter((standing) => eligibleIds.has(standing.participant_id))
      .slice()
      .sort((left, right) => Number(left.position) - Number(right.position))
      .map((standing) => standing.participant_id)
      .slice(0, participantCount);
    if (rankedParticipantIds.length < participantCount) {
      setStatus(
        `Swiss standings do not contain ${participantCount} eligible playoff players.`,
        "error"
      );
      return;
    }
    state.playoffSetupSlots = playoffSeedOrder(participantCount).map((seed) => (
      rankedParticipantIds[seed - 1]
    ));
    renderPlayoff();
    setStatus("Playoff matches seeded from Swiss standings.", "success");
  }

  function openPlayoffParticipantModal(round, match) {
    const slotAIndex = match.setup_slot_a_index;
    const slotBIndex = match.setup_slot_b_index;
    if (!Number.isInteger(slotAIndex) || !Number.isInteger(slotBIndex)) return;
    const overlay = document.createElement("div");
    overlay.className = "ip-modal-overlay";
    const pickerController = new AbortController();
    const form = document.createElement("form");
    form.className = "ip-modal-dialog ip-playoff-selection-dialog";
    form.setAttribute("role", "dialog");
    form.setAttribute("aria-modal", "true");
    form.setAttribute("aria-labelledby", "ipPlayoffSelectionModalTitle");
    const title = document.createElement("div");
    title.id = "ipPlayoffSelectionModalTitle";
    title.className = "ip-modal-title";
    title.textContent = `${round.round_label} • Match ${match.bracket_position}`;
    const hint = document.createElement("div");
    hint.className = "ip-modal-player";
    hint.textContent = "Select both players for this first-round match.";
    const options = playoffParticipantOptions([slotAIndex, slotBIndex]);
    const playerA = createMenuSelectField(
      "Player 1",
      options,
      state.playoffSetupSlots[slotAIndex],
      { signal: pickerController.signal }
    );
    const playerB = createMenuSelectField(
      "Player 2",
      options,
      state.playoffSetupSlots[slotBIndex],
      { signal: pickerController.signal }
    );
    const error = document.createElement("div");
    error.className = "ip-modal-warning";
    error.setAttribute("role", "alert");
    const actions = document.createElement("div");
    actions.className = "ip-modal-actions";
    let saving = false;

    function closeModal() {
      if (saving) return;
      pickerController.abort();
      document.removeEventListener("keydown", handleEscape);
      overlay.remove();
    }

    function handleEscape(event) {
      if (event.key === "Escape") closeModal();
    }

    const clear = createButton("Clear match", "ip-btn danger", () => {
      state.playoffSetupSlots[slotAIndex] = "";
      state.playoffSetupSlots[slotBIndex] = "";
      closeModal();
      renderPlayoff();
      setStatus("");
    });
    clear.disabled = !state.playoffSetupSlots[slotAIndex]
      && !state.playoffSetupSlots[slotBIndex];
    const cancel = createButton("Cancel", "ip-btn", closeModal);
    const save = document.createElement("button");
    save.type = "submit";
    save.className = "ip-btn primary";
    save.textContent = "Save players";
    actions.appendChild(clear);
    actions.appendChild(cancel);
    actions.appendChild(save);
    form.appendChild(title);
    form.appendChild(hint);
    form.appendChild(playerA.field);
    form.appendChild(playerB.field);
    form.appendChild(error);
    form.appendChild(actions);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const participantAId = playerA.getValue();
      const participantBId = playerB.getValue();
      if (participantAId && participantAId === participantBId) {
        error.textContent = "Select two different players.";
        return;
      }
      saving = false;
      state.playoffSetupSlots[slotAIndex] = participantAId;
      state.playoffSetupSlots[slotBIndex] = participantBId;
      closeModal();
      renderPlayoff();
      setStatus("Playoff match players saved.", "success");
    });
    overlay.appendChild(form);
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) closeModal();
    });
    document.addEventListener("keydown", handleEscape);
    document.body.appendChild(overlay);
    playerA.button.focus();
  }

  async function startPlayoffFromBracket(button) {
    const participantIds = ensurePlayoffSetupSlots().slice();
    if (participantIds.some((participantId) => !participantId)) {
      setStatus("Select players for every first-round match.", "error");
      return;
    }
    button.disabled = true;
    try {
      const previewData = await apiJson(tournamentUrl("/playoff/preview"), {
        method: "POST",
        body: JSON.stringify({ participant_ids: participantIds }),
      });
      const preview = previewData.preview;
      const data = await apiJson(tournamentUrl("/playoff/confirm"), {
        method: "POST",
        body: JSON.stringify({
          participant_ids: preview.participant_ids,
          expected_tournament_revision: preview.tournament_revision,
          expected_standings_revision: preview.standings_revision,
        }),
      });
      adoptPlayoffResponse(data);
      state.playoffSetupSlots = [];
      renderWorkspace();
      setStatus("Playoff started and the first round was published.", "success");
    } catch (error) {
      setStatus(error.message || "Failed to start the playoff.", "error");
      button.disabled = false;
    }
  }

  async function publishPlayoffRound(round, button) {
    button.disabled = true;
    try {
      const data = await apiJson(
        tournamentUrl(`/playoff/rounds/${encodeURIComponent(round.id)}/publish`),
        { method: "POST", body: "{}" }
      );
      adoptPlayoffResponse(data);
      renderWorkspace();
      setStatus(
        ["final", "bronze_medal_match"].includes(round.round_key)
          ? "Final and Bronze medal match published."
          : `${round.round_label} published.`,
        "success"
      );
    } catch (error) {
      setStatus(
        error.message || (["final", "bronze_medal_match"].includes(round.round_key)
          ? "Failed to publish the medal matches."
          : `Failed to publish ${round.round_label}.`),
        "error"
      );
      button.disabled = false;
    }
  }

  async function returnPlayoffSetupToSwiss(button) {
    const round = state.swiss?.current_round;
    if (!round || !state.swiss?.can_reopen_current_round) return;
    if (!window.confirm(
      `Reopen Swiss round ${round.round_number} and discard the current playoff setup?`
    )) return;
    button.disabled = true;
    try {
      await apiJson(
        tournamentUrl(`/swiss/rounds/${encodeURIComponent(round.id)}/reopen`),
        { method: "POST", body: "{}" }
      );
      state.playoffSetupSlots = [];
      state.activeTab = "swiss";
      await loadOverview();
      setStatus(`Swiss round ${round.round_number} reopened.`, "success");
    } catch (error) {
      setStatus(error.message || "Failed to return to Swiss.", "error");
      button.disabled = false;
    }
  }

  async function resetPlayoffBracket(button) {
    if (!window.confirm(
      "Reset the confirmed playoff bracket and return to match setup?"
    )) return;
    button.disabled = true;
    try {
      const data = await apiJson(tournamentUrl("/playoff/reset"), {
        method: "POST",
        body: JSON.stringify({ reason: "Reset by tournament organizer" }),
      });
      state.playoffSetupSlots = Array.isArray(data.participant_ids)
        ? data.participant_ids
        : [];
      state.activeTab = "playoff";
      await loadOverview();
      setStatus("Playoff bracket reset. Configure the matches again.", "success");
    } catch (error) {
      setStatus(error.message || "Failed to reset the playoff bracket.", "error");
      button.disabled = false;
    }
  }

  function playoffMatchScore(match, participantId, side) {
    if (match.status !== "completed") return "";
    const points = match[`points_${side}`];
    if (points != null) return String(points);
    return match.winner_participant_id === participantId ? "1" : "0";
  }

  function playoffMatchPlaceholder(round, match) {
    if (round.status === "setup" && Number.isInteger(match.setup_slot_a_index)) {
      return "Select player";
    }
    if (round.round_key === "bronze_medal_match") return "Loser of semi-final";
    return "Winner of previous match";
  }

  function createPlayoffBracketMatch(round, match) {
    const isSetupMatch = round.status === "setup"
      && Number.isInteger(match.setup_slot_a_index);
    const canEditResult = state.playoff?.tournament?.status === "playoff"
      && ["published", "completed"].includes(round.status)
      && match.participant_a_id
      && match.participant_b_id;
    const interactive = isSetupMatch || canEditResult;
    const card = document.createElement(interactive ? "button" : "div");
    if (interactive) card.type = "button";
    card.className = `ip-playoff-match${match.status === "completed" ? " completed" : ""}`;
    card.style.left = `${match.layout_left}px`;
    card.style.top = `${match.layout_top}px`;
    card.style.width = `${PLAYOFF_MATCH_WIDTH}px`;
    card.style.height = `${PLAYOFF_MATCH_HEIGHT}px`;
    ["a", "b"].forEach((side) => {
      const participantId = match[`participant_${side}_id`];
      const row = document.createElement("div");
      row.className = `ip-playoff-match-player${
        match.status === "completed" && match.winner_participant_id === participantId
          ? " winner"
          : ""
      }`;
      const name = document.createElement("span");
      name.className = `ip-playoff-match-name${participantId ? "" : " ip-playoff-match-placeholder"}`;
      if (participantId && match.starting_participant_id === participantId) {
        const starter = document.createElement("img");
        starter.className = "ip-starting-player-icon";
        starter.src = STARTING_PLAYER_ICON_URL;
        starter.alt = "Starts";
        starter.title = "Starting player";
        name.appendChild(starter);
      }
      name.appendChild(document.createTextNode(
        participantId
          ? isSetupMatch
            ? playoffSetupParticipantName(participantId)
            : playoffParticipantName(participantId)
          : playoffMatchPlaceholder(round, match)
      ));
      const score = document.createElement("span");
      score.className = "ip-playoff-match-score";
      score.textContent = participantId ? playoffMatchScore(match, participantId, side) : "";
      row.appendChild(name);
      row.appendChild(score);
      card.appendChild(row);
    });
    if (isSetupMatch) {
      card.setAttribute("aria-label", `Select players for ${round.round_label} match ${match.bracket_position}`);
      card.addEventListener("click", () => openPlayoffParticipantModal(round, match));
    } else if (canEditResult) {
      card.setAttribute("aria-label", `Edit result for ${round.round_label}, table ${match.table_number}`);
      card.addEventListener("click", () => openPlayoffResultModal(round, match));
    }
    return card;
  }

  function layoutPlayoffRounds(sourceRounds) {
    const rounds = sourceRounds.map((round) => ({
      ...round,
      matches: (round.matches || []).map((match) => ({
        ...match,
        table_number: playoffTableNumber(round.round_key, match.table_number),
      })),
    }));
    const mainRounds = PLAYOFF_MAIN_ROUNDS
      .map((roundKey) => rounds.find((round) => round.round_key === roundKey))
      .filter(Boolean);
    if (!mainRounds.length) return null;
    const baseTop = PLAYOFF_MARGIN + PLAYOFF_LABEL_SPACE;
    const step = PLAYOFF_MATCH_HEIGHT + PLAYOFF_VERTICAL_GAP;
    mainRounds.forEach((round, roundIndex) => {
      (round.matches || []).forEach((match, matchIndex) => {
        match.layout_left = PLAYOFF_MARGIN
          + roundIndex * (PLAYOFF_MATCH_WIDTH + PLAYOFF_HORIZONTAL_GAP);
        match.layout_top = baseTop
          + (((matchIndex + 0.5) * (2 ** roundIndex)) - 0.5) * step;
      });
    });
    const firstRoundMatches = mainRounds[0].matches || [];
    const firstRoundBottom = firstRoundMatches.length
      ? Math.max(...firstRoundMatches.map((match) => match.layout_top + PLAYOFF_MATCH_HEIGHT))
      : baseTop + PLAYOFF_MATCH_HEIGHT;
    const bronzeRound = rounds.find((round) => round.round_key === "bronze_medal_match") || null;
    let bronzeLabelTop = 0;
    if (bronzeRound?.matches?.length) {
      bronzeLabelTop = firstRoundBottom + PLAYOFF_VERTICAL_GAP + 14;
      bronzeRound.matches.forEach((match, matchIndex) => {
        match.layout_left = PLAYOFF_MARGIN
          + (mainRounds.length - 1) * (PLAYOFF_MATCH_WIDTH + PLAYOFF_HORIZONTAL_GAP);
        match.layout_top = bronzeLabelTop + 28
          + matchIndex * (PLAYOFF_MATCH_HEIGHT + PLAYOFF_VERTICAL_GAP);
      });
    }
    const matches = rounds.flatMap((round) => round.matches || []);
    const width = PLAYOFF_MARGIN * 2
      + mainRounds.length * PLAYOFF_MATCH_WIDTH
      + Math.max(0, mainRounds.length - 1) * PLAYOFF_HORIZONTAL_GAP;
    const height = Math.max(
      firstRoundBottom,
      ...(bronzeRound?.matches || []).map((match) => match.layout_top + PLAYOFF_MATCH_HEIGHT)
    ) + PLAYOFF_MARGIN;
    return { rounds, mainRounds, bronzeRound, bronzeLabelTop, matches, width, height };
  }

  function appendPlayoffConnector(bracket, from, to) {
    if (!from || !to) return;
    const xFrom = from.layout_left + PLAYOFF_MATCH_WIDTH;
    const yFrom = from.layout_top + PLAYOFF_MATCH_HEIGHT / 2;
    const xTo = to.layout_left;
    const yTo = to.layout_top + PLAYOFF_MATCH_HEIGHT / 2;
    const middleX = xFrom + Math.max(8, (xTo - xFrom) / 2);
    const addSegment = (left, top, width, height) => {
      const segment = document.createElement("div");
      segment.className = "ip-playoff-connector";
      segment.style.left = `${left}px`;
      segment.style.top = `${top}px`;
      segment.style.width = `${Math.max(2, width)}px`;
      segment.style.height = `${Math.max(2, height)}px`;
      bracket.appendChild(segment);
    };
    if (yFrom === yTo) {
      addSegment(xFrom, yFrom - 1, xTo - xFrom, 2);
      return;
    }
    addSegment(xFrom, yFrom - 1, middleX - xFrom, 2);
    addSegment(middleX - 1, Math.min(yFrom, yTo), 2, Math.abs(yTo - yFrom));
    addSegment(middleX, yTo - 1, xTo - middleX, 2);
  }

  function renderPlayoffActions() {
    playoffActions.innerHTML = "";
    const playoff = state.playoff;
    if (!playoff) return;
    const rounds = playoff.rounds || [];
    if (!rounds.length) {
      if (playoff.can_start) {
        const slots = ensurePlayoffSetupSlots();
        if (state.swiss?.can_reopen_current_round) {
          const backToSwiss = createButton(
            "Back to Swiss",
            "ip-btn",
            () => returnPlayoffSetupToSwiss(backToSwiss)
          );
          playoffActions.appendChild(backToSwiss);
        }
        const autoSeed = createButton("Auto-seed", "ip-btn", seedPlayoffFromSwiss);
        const start = createButton(
          "Start playoff",
          "ip-btn primary",
          () => startPlayoffFromBracket(start)
        );
        start.disabled = slots.some((participantId) => !participantId);
        playoffActions.appendChild(autoSeed);
        playoffActions.appendChild(start);
      }
      return;
    }
    if (playoff.can_reset) {
      const reset = createButton(
        "Reset playoff bracket",
        "ip-btn danger",
        () => resetPlayoffBracket(reset)
      );
      playoffActions.appendChild(reset);
    }
    const medalRoundKeys = new Set(["final", "bronze_medal_match"]);
    rounds
      .filter((round) => (
        !medalRoundKeys.has(round.round_key)
        && round.status === "draft"
        && round.can_publish
      ))
      .forEach((round) => {
        const publish = createButton(
          `Publish ${round.round_label}`,
          "ip-btn primary",
          () => publishPlayoffRound(round, publish)
        );
        playoffActions.appendChild(publish);
      });
    const medalRounds = rounds.filter((round) => medalRoundKeys.has(round.round_key));
    const medalDrafts = medalRounds.filter((round) => round.status === "draft");
    if (medalDrafts.length && medalDrafts.every((round) => round.can_publish)) {
      const medalRound = medalRounds.find((round) => round.round_key === "final")
        || medalDrafts[0];
      const publish = createButton(
        "Publish medal round",
        "ip-btn primary",
        () => publishPlayoffRound(medalRound, publish)
      );
      playoffActions.appendChild(publish);
    }
    if (playoff.tournament?.status !== "completed") {
      const complete = createButton("Complete tournament", "ip-btn primary", async () => {
        complete.disabled = true;
        try {
          const data = await apiJson(tournamentUrl("/playoff/complete"), {
            method: "POST",
            body: "{}",
          });
          adoptPlayoffResponse(data);
          renderWorkspace();
          setStatus("Tournament completed. Final placements are locked.", "success");
        } catch (error) {
          setStatus(error.message || "Failed to complete the tournament.", "error");
          complete.disabled = false;
        }
      });
      complete.disabled = !playoff.can_complete;
      playoffActions.appendChild(complete);
    }
  }

  function renderPlayoffBracket() {
    playoffBracket.innerHTML = "";
    const playoff = state.playoff;
    if (!playoff) return;
    const activeRounds = playoff.rounds || [];
    if (!activeRounds.length && !playoff.swiss_complete) {
      const box = document.createElement("div");
      box.className = "ip-readiness";
      box.textContent = "Complete every configured Swiss round to open the playoff bracket.";
      playoffBracket.appendChild(box);
      return;
    }
    const setupMode = activeRounds.length === 0;
    const rounds = setupMode ? buildEmptyPlayoffRounds() : activeRounds;
    const layout = layoutPlayoffRounds(rounds);
    if (!layout) return;
    if (!setupMode) {
      const hint = document.createElement("div");
      hint.className = "ip-hint";
      hint.textContent = "Click a published match to enter or correct its result.";
      playoffBracket.appendChild(hint);
    }
    const scroll = document.createElement("div");
    scroll.className = "ip-playoff-bracket-scroll";
    const bracket = document.createElement("div");
    bracket.className = "ip-playoff-bracket";
    bracket.style.width = `${layout.width}px`;
    bracket.style.height = `${layout.height}px`;
    layout.mainRounds.forEach((round, roundIndex) => {
      const label = document.createElement("div");
      label.className = "ip-playoff-round-label";
      label.textContent = round.round_label || playoffRoundLabel(round.round_key);
      label.style.left = `${PLAYOFF_MARGIN + roundIndex * (PLAYOFF_MATCH_WIDTH + PLAYOFF_HORIZONTAL_GAP)}px`;
      label.style.top = `${PLAYOFF_MARGIN}px`;
      label.style.width = `${PLAYOFF_MATCH_WIDTH}px`;
      bracket.appendChild(label);
    });
    if (layout.bronzeRound) {
      const bronzeLabel = document.createElement("div");
      bronzeLabel.className = "ip-playoff-bronze-label";
      bronzeLabel.textContent = layout.bronzeRound.round_label || "Bronze medal match";
      bronzeLabel.style.left = `${PLAYOFF_MARGIN + (layout.mainRounds.length - 1) * (PLAYOFF_MATCH_WIDTH + PLAYOFF_HORIZONTAL_GAP)}px`;
      bronzeLabel.style.top = `${layout.bronzeLabelTop}px`;
      bronzeLabel.style.width = `${PLAYOFF_MATCH_WIDTH}px`;
      bracket.appendChild(bronzeLabel);
    }
    const matchesById = new Map(layout.matches.map((match) => [match.id, match]));
    layout.matches.forEach((match) => {
      appendPlayoffConnector(bracket, match, matchesById.get(match.next_match_for_winner_id));
      appendPlayoffConnector(bracket, match, matchesById.get(match.next_match_for_loser_id));
    });
    layout.rounds.forEach((round) => {
      (round.matches || []).forEach((match) => {
        const meta = document.createElement("div");
        meta.className = "ip-playoff-match-meta";
        meta.textContent = match.table_number === 1
          ? "Table 1 • Streaming"
          : `Table ${match.table_number}`;
        meta.style.left = `${match.layout_left + 2}px`;
        meta.style.top = `${Math.max(0, match.layout_top - 14)}px`;
        bracket.appendChild(meta);
        bracket.appendChild(createPlayoffBracketMatch(round, match));
      });
    });
    scroll.appendChild(bracket);
    playoffBracket.appendChild(scroll);
  }

  function renderPlayoffCompletion() {
    playoffCompletion.innerHTML = "";
    const playoff = state.playoff;
    if (!playoff?.rounds?.length) return;
    if (playoff.tournament?.status === "completed" && playoff.placements) {
      const box = document.createElement("div");
      box.className = "ip-readiness ready";
      const title = document.createElement("strong");
      title.textContent = "Tournament completed";
      const places = document.createElement("div");
      places.textContent = [
        `1st ${playoffParticipantName(playoff.placements.first)}`,
        `2nd ${playoffParticipantName(playoff.placements.second)}`,
        `3rd ${playoffParticipantName(playoff.placements.third)}`,
        `4th ${playoffParticipantName(playoff.placements.fourth)}`,
      ].join(" • ");
      box.appendChild(title);
      box.appendChild(places);
      playoffCompletion.appendChild(box);
    }
  }

  function renderPlayoff() {
    renderPlayoffActions();
    renderPlayoffBracket();
    renderPlayoffCompletion();
  }

  function renderWorkspace() {
    if (!state.overview) {
      workspace.classList.add("ip-hidden");
      return;
    }
    workspace.classList.remove("ip-hidden");
    renderTournamentMeta();
    renderCounters();
    renderPlayers();
    renderCheckIn();
    renderSwiss();
    renderStandings();
    renderPlayoff();
    document.querySelectorAll("[data-ip-tab]").forEach((button) => {
      button.classList.toggle("active", button.dataset.ipTab === state.activeTab);
    });
    playersPanel.classList.toggle("ip-hidden", state.activeTab !== "players");
    checkInPanel.classList.toggle("ip-hidden", state.activeTab !== "check-in");
    swissPanel.classList.toggle("ip-hidden", state.activeTab !== "swiss");
    standingsPanel.classList.toggle("ip-hidden", state.activeTab !== "standings");
    playoffPanel.classList.toggle("ip-hidden", state.activeTab !== "playoff");
  }

  async function loadOverview() {
    if (!state.selectedTournamentId) {
      state.overview = null;
      state.swiss = null;
      state.playoff = null;
      state.pairingPreview = null;
      state.playoffSetupSlots = [];
      renderWorkspace();
      return;
    }
    const selected = selectedTournament();
    const requests = [
      apiJson(tournamentUrl("/participants")),
      apiJson(tournamentUrl("/swiss")),
      apiJson(tournamentUrl("/playoff")),
    ];
    if (selected?.scope === "local") requests.push(apiJson(tournamentUrl("/participant-cities")));
    const [overview, swissData, playoffData, citiesData] = await Promise.all(requests);
    state.overview = overview;
    state.swiss = swissData;
    state.playoff = playoffData;
    state.pairingPreview = null;
    state.cities = Array.isArray(citiesData?.cities) ? citiesData.cities : [];
    renderWorkspace();
  }

  async function selectTournament(tournamentId) {
    if (String(tournamentId || "") !== state.selectedTournamentId) {
      state.playoffSetupSlots = [];
    }
    state.selectedTournamentId = String(tournamentId || "");
    const url = new URL(window.location.href);
    if (state.selectedTournamentId) url.searchParams.set("tournament", state.selectedTournamentId);
    else url.searchParams.delete("tournament");
    window.history.replaceState({}, "", url.toString());
    renderTournamentSwitcher();
    renderTournamentMeta();
    setStatus("");
    try {
      await loadOverview();
    } catch (error) {
      state.overview = null;
      state.swiss = null;
      state.playoff = null;
      state.pairingPreview = null;
      state.playoffSetupSlots = [];
      renderWorkspace();
      setStatus(error.message || "Failed to load tournament.", "error");
    }
  }

  async function loadAll() {
    refreshBtn.disabled = true;
    setStatus("Loading...");
    try {
      const [accessibleData, associationsData] = await Promise.all([
        apiJson(ACCESSIBLE_URL),
        apiJson(ASSOCIATIONS_URL),
      ]);
      state.tournaments = Array.isArray(accessibleData?.tournaments) ? accessibleData.tournaments : [];
      state.associations = Array.isArray(associationsData?.associations) ? associationsData.associations : [];
      const requestedId = new URL(window.location.href).searchParams.get("tournament") || "";
      const preservedId = state.tournaments.some((item) => item.id === state.selectedTournamentId)
        ? state.selectedTournamentId
        : "";
      state.selectedTournamentId = state.tournaments.some((item) => item.id === requestedId)
        ? requestedId
        : preservedId || state.tournaments[0]?.id || "";
      renderTournamentSwitcher();
      renderTournamentMeta();
      if (state.selectedTournamentId) await selectTournament(state.selectedTournamentId);
      else {
        state.overview = null;
        state.swiss = null;
        state.playoff = null;
        renderWorkspace();
        setStatus("");
      }
    } catch (error) {
      state.tournaments = [];
      state.overview = null;
      state.swiss = null;
      state.playoff = null;
      renderTournamentSwitcher();
      setStatus(
        error.status === 401 ? "Sign in to open In-Person tournaments." : error.message,
        "error"
      );
    } finally {
      refreshBtn.disabled = false;
    }
  }

  tournamentSwitchBtn.addEventListener("click", (event) => {
    event.stopPropagation();
    const isOpen = tournamentMenu.classList.contains("open");
    closeTournamentMenu();
    if (!isOpen) {
      tournamentMenu.classList.add("open");
      tournamentSwitchBtn.classList.add("open");
      tournamentSwitchBtn.setAttribute("aria-expanded", "true");
    }
  });
  document.addEventListener("click", (event) => {
    if (!tournamentSwitcher.contains(event.target)) closeTournamentMenu();
  });
  refreshBtn.addEventListener("click", loadAll);
  addPlayerBtn.addEventListener("click", () => openPlayerForm());
  addLatePlayerBtn.addEventListener("click", openLatePlayerForm);
  startCheckInBtn.addEventListener("click", async () => {
    startCheckInBtn.disabled = true;
    try {
      await apiJson(tournamentUrl("/start-check-in"), { method: "POST", body: "{}" });
      await loadOverview();
      setStatus("Check-in started.", "success");
    } catch (error) {
      setStatus(error.message || "Failed to start check-in.", "error");
      startCheckInBtn.disabled = false;
    }
  });
  document.querySelectorAll("[data-ip-tab]").forEach((button) => {
    button.addEventListener("click", () => {
      state.activeTab = button.dataset.ipTab;
      renderWorkspace();
    });
  });
  window.addEventListener("gg-auth-state-change", loadAll);

  loadAll();
})();
</script>
