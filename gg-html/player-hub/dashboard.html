<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* Design: "Flat Design" from the ui-ux-pro-max skill, in the Player Hub palette:
     solid fills, no shadows or gradients, small radii, color/opacity hover only. */
  :root {
    --dash-text: #1f2937;
    --dash-muted: #5b6576;
    --dash-faint: #8a94a3;
    --dash-border: #e3e8ef;
    --dash-border-strong: #c9d1dc;
    --dash-card: #fff;
    --dash-soft: #f4f6f9;
    --dash-primary: #1a73b7;
    --dash-primary-hover: #155d94;
    --dash-primary-soft: #e8f1fa;
    --dash-attention: #b4232f;
    --dash-attention-hover: #961c27;
    --dash-attention-bg: #fdecee;
    --dash-warn: #8a5a00;
    --dash-ok: #2d6a3e;
    --dash-neutral-bg: #eef1f5;
    --dash-radius: 6px;
    --dash-ease: 160ms ease;
  }

  body {
    margin: 0;
    font-family: "Montserrat", sans-serif;
    color: var(--dash-text);
  }

  .dash-wrap {
    display: grid;
    gap: 16px;
    margin: 0 8px 16px;
  }

  .dash-icon {
    display: inline-flex;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .dash-icon svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- Header and filters ---------- */

  .dash-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 16px;
  }

  .dash-title {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.2;
  }

  .dash-subtitle {
    font-size: 14px;
    color: var(--dash-muted);
    margin-top: 4px;
  }

  .dash-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .dash-filters[hidden] {
    display: none;
  }

  .dash-filter {
    display: grid;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--dash-muted);
  }

  .dash-filter.tournament {
    width: 240px;
  }

  .dash-filter.days {
    width: 130px;
  }

  .dash-filter.status {
    width: 260px;
  }

  .dash-filter.proposed {
    width: 170px;
  }

  .cp-dd {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    width: 100%;
  }

  .cp-dd-btn {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    height: 36px;
    border: 0;
    border-radius: 4px;
    background: var(--dash-neutral-bg);
    color: var(--dash-text);
    font-size: 14px;
    font-weight: 500;
    padding: 4px 10px;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    transition: background-color var(--dash-ease);
  }

  .cp-dd-btn:hover,
  .cp-dd-btn.open {
    background: #e2e7ee;
  }

  .cp-dd-btn:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  .cp-dd-btn-content {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cp-dd-btn-content span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cp-dd-chevron {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    color: var(--dash-muted);
    transition: transform var(--dash-ease);
  }

  .cp-dd-btn.open .cp-dd-chevron {
    transform: rotate(180deg);
  }

  .cp-dd-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 4px);
    min-width: 100%;
    width: max-content;
    max-width: min(320px, calc(100vw - 32px));
    max-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    background: #fff;
    border: 1px solid var(--dash-border-strong);
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, max-height 0.16s ease;
    z-index: 20;
  }

  .cp-dd-menu.open {
    opacity: 1;
    pointer-events: auto;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .cp-dd-option {
    all: unset;
    box-sizing: border-box;
    padding: 8px 10px;
    display: block;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--dash-text);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }

  .cp-dd-option:hover,
  .cp-dd-option:focus-visible {
    background: var(--dash-soft);
  }

  .cp-dd-option.active {
    background: var(--dash-primary);
    color: #fff;
    font-weight: 600;
  }

  /* ---------- Messages and loading ---------- */

  .dash-alert {
    background: var(--dash-soft);
    border-radius: var(--dash-radius);
    padding: 16px;
    font-size: 14px;
    color: var(--dash-muted);
  }

  .dash-skeleton {
    display: grid;
    gap: 16px;
  }

  .dash-skeleton-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }

  .dash-skeleton-block {
    height: 84px;
    border-radius: var(--dash-radius);
    background: var(--dash-neutral-bg);
    animation: dash-pulse 1.2s ease-in-out infinite alternate;
  }

  .dash-skeleton-block.tall {
    height: 180px;
  }

  @keyframes dash-pulse {
    from { opacity: 1; }
    to { opacity: 0.5; }
  }

  /* ---------- Counter tiles ---------- */

  .dash-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }

  .dash-tile {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 4px 8px;
    padding: 14px;
    border: 0;
    border-radius: var(--dash-radius);
    background: var(--dash-neutral-bg);
    color: var(--dash-muted);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color var(--dash-ease);
  }

  .dash-tile:hover {
    background: #e2e7ee;
  }

  .dash-tile:focus-visible {
    outline: 2px solid var(--dash-text);
    outline-offset: 2px;
  }

  .dash-tile-icon {
    grid-column: 2;
    grid-row: 1;
    display: inline-flex;
    opacity: 0.8;
  }

  .dash-tile-body {
    grid-column: 1;
    grid-row: 1;
    display: grid;
    gap: 4px;
    min-width: 0;
  }

  .dash-tile-count {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--dash-text);
  }

  .dash-tile-label {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
  }

  .dash-tile.is-clear .dash-tile-count {
    color: var(--dash-faint);
  }

  .dash-tile.tone-attention {
    background: var(--dash-attention);
    color: #fff;
  }

  .dash-tile.tone-attention:hover {
    background: var(--dash-attention-hover);
  }

  .dash-tile.tone-info {
    background: var(--dash-primary);
    color: #fff;
  }

  .dash-tile.tone-info:hover {
    background: var(--dash-primary-hover);
  }

  .dash-tile.tone-attention .dash-tile-count,
  .dash-tile.tone-info .dash-tile-count {
    color: #fff;
  }

  /* ---------- Sections ---------- */

  .dash-section {
    background: var(--dash-card);
    border: 1px solid var(--dash-border);
    border-radius: var(--dash-radius);
    scroll-margin-top: 16px;
    transition: opacity var(--dash-ease);
  }

  .dash-section.is-loading {
    opacity: 0.55;
    pointer-events: none;
  }

  .dash-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    background: var(--dash-soft);
    border-radius: calc(var(--dash-radius) - 1px) calc(var(--dash-radius) - 1px) 0 0;
  }

  .dash-section-head:last-child {
    border-radius: calc(var(--dash-radius) - 1px);
  }

  .dash-section-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .dash-section-icon {
    display: inline-flex;
    color: var(--dash-primary);
  }

  .dash-section.is-empty .dash-section-icon {
    color: var(--dash-faint);
  }

  .dash-section-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.25;
  }

  .dash-section.is-empty .dash-section-title {
    color: var(--dash-muted);
  }

  .dash-section-meta {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--dash-muted);
    white-space: nowrap;
  }

  .dash-section-meta .dash-icon {
    width: 14px;
    height: 14px;
  }

  .dash-section.is-empty .dash-section-meta {
    color: var(--dash-ok);
  }

  .dash-section-note {
    padding: 10px 16px 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--dash-muted);
  }

  .dash-section.is-empty .dash-section-note {
    padding-bottom: 12px;
  }

  .dash-rows {
    display: grid;
    padding: 4px 0;
  }

  .dash-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px 16px;
    padding: 12px 16px;
    border-top: 1px solid var(--dash-border);
  }

  .dash-row:first-child {
    border-top: 0;
  }

  .dash-row-main {
    display: grid;
    gap: 4px;
    min-width: 0;
  }

  .dash-row-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .dash-row-line {
    font-size: 13px;
    line-height: 1.45;
    color: var(--dash-muted);
    overflow-wrap: anywhere;
  }

  /* Texts of repeated submissions of one case, one per line with -- between them. */
  .dash-row-line.dash-case-details {
    white-space: pre-line;
    color: var(--dash-text);
  }

  .dash-row-error {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    margin-top: 2px;
    padding: 6px 10px;
    border-radius: 4px;
    background: var(--dash-attention-bg);
    font-size: 13px;
    line-height: 1.4;
    color: var(--dash-attention);
    overflow-wrap: anywhere;
  }

  .dash-row-error .dash-icon {
    width: 15px;
    height: 15px;
    margin-top: 1px;
  }

  .dash-row-side {
    display: grid;
    justify-items: end;
    align-content: start;
    gap: 8px;
  }

  .dash-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
    background: var(--dash-neutral-bg);
    color: #3d4757;
  }

  .dash-badge.attention { background: var(--dash-attention); color: #fff; }
  .dash-badge.warn { background: var(--dash-warn); color: #fff; }
  .dash-badge.ok { background: var(--dash-ok); color: #fff; }

  /* Same as the View button of the tournaments page (cp-edit-btn cp-edit-btn-view). */
  .dash-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    background: #f3f4f6;
    color: #2f3947;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: border-color var(--dash-ease);
  }

  .dash-link:hover {
    border-color: #9ea7b3;
  }

  .dash-link:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  /* ---------- Unplanned matches: the match list of the tournaments page (CCL) ---------- */

  .dash-section-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 16px 0;
  }

  .dash-section-filters .cp-dd-menu {
    left: 0;
    right: auto;
  }

  .dash-matches {
    padding: 12px 16px 0;
  }

  /* Paging of team-official-matches.html (results-controls). */
  .dash-pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f7f8fa;
  }

  .dash-pagesize {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #555;
  }

  .dash-pagesize-picker {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    min-width: 58px;
  }

  .dash-pagesize-btn {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    min-height: 24px;
    padding: 4px 7px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    background: #fff;
    color: #2f3947;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
  }

  .dash-pagesize-btn:hover,
  .dash-pagesize-btn.open {
    border-color: #9ea7b3;
  }

  .dash-pagesize-btn:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  .dash-pagesize-btn .dash-icon {
    width: 12px;
    height: 12px;
    color: #6f7785;
    transition: transform var(--dash-ease);
  }

  .dash-pagesize-btn.open .dash-icon {
    transform: rotate(180deg);
  }

  .dash-pagesize-menu {
    position: absolute;
    left: 0;
    top: calc(100% + 4px);
    min-width: 100%;
    max-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    border: 1px solid #d5dbe4;
    border-radius: 4px;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, max-height 0.16s ease;
    z-index: 20;
  }

  .dash-pagesize-menu.open {
    opacity: 1;
    pointer-events: auto;
  }

  .dash-pagesize-option {
    all: unset;
    box-sizing: border-box;
    padding: 5px 8px;
    border-top: 1px solid #edf1f6;
    font-size: 12px;
    line-height: 1.2;
    color: #2f3947;
    white-space: nowrap;
    cursor: pointer;
  }

  .dash-pagesize-option:first-child {
    border-top: none;
  }

  .dash-pagesize-option:hover,
  .dash-pagesize-option:focus-visible {
    background: #f5f5f5;
  }

  .dash-pagesize-option.active {
    background: #e4f0fb;
  }

  .dash-pagination {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .dash-pagebtn {
    font: inherit;
    font-size: 12px;
    color: #333;
    background: #fff;
    border: 1px solid #cfcfcf;
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
  }

  .dash-pagebtn:disabled {
    opacity: 0.45;
    cursor: default;
  }

  .dash-pagebtn:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  .dash-pageinfo {
    min-width: 72px;
    font-size: 12px;
    color: #555;
    text-align: center;
  }

  .dash-match-heading {
    padding: 0 2px;
    font-size: 14px;
    font-weight: 600;
    color: #222;
  }

  .dash-match-list {
    border: 1px solid #ccc;
    border-radius: 6px;
    margin: 4px 0 12px;
    background: #fff;
  }

  .dash-match + .dash-match {
    border-top: 1px solid #ccc;
  }

  .dash-match-row {
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 4px 8px;
    box-sizing: border-box;
  }

  .dash-match-time {
    width: 58px;
    min-width: 58px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .dash-match-time-text {
    font-size: 12px;
    line-height: 14px;
    font-weight: 600;
    color: #333;
    white-space: pre-line;
  }

  .dash-match-divider {
    width: 1px;
    margin: 0 6px;
    align-self: stretch;
    border-radius: 1px;
    background: #dfdfdf;
  }

  .dash-match-players {
    flex-grow: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-size: 13px;
    line-height: 1.2;
  }

  .dash-match-player {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 16px;
  }

  .dash-match-player-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: inherit;
    text-decoration: none;
  }

  /* Player links of matches.html (.duel-player-row a). */
  a.dash-match-player-name:hover {
    color: #0277BD;
  }

  a.dash-match-player-name:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  /* Marks the player who sent the time proposal. */
  .dash-match-proposer {
    display: inline-flex;
    flex: 0 0 auto;
    color: var(--dash-primary);
  }

  .dash-match-proposer .dash-icon {
    width: 15px;
    height: 15px;
  }

  .dash-match-flag {
    width: 20px;
    height: 20px;
    object-fit: contain;
    flex: 0 0 auto;
  }

  .dash-match-meta {
    margin-top: 2px;
    font-size: 11px;
    color: #667286;
    overflow-wrap: anywhere;
  }

  .dash-match-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    margin-left: 8px;
  }

  /* Status badge of the tournaments page (cp-status-badge). */
  .dash-status-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 20px;
    padding: 0 8px;
    border: 1px solid #d5dbe4;
    border-radius: 999px;
    background: #f3f4f6;
    color: #475467;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }

  .dash-status-badge.is-attention {
    border-color: #f5c2c0;
    background: #fde8e8;
    color: #b42318;
  }

  .dash-status-badge.is-warn {
    border-color: #f3dc9a;
    background: #fff8e1;
    color: #5c4300;
  }

  .dash-match-meta.is-overdue {
    font-weight: 600;
    color: #b42318;
  }

  .dash-more {
    padding: 10px 16px;
    font-size: 13px;
    color: var(--dash-muted);
    border-top: 1px solid var(--dash-border);
  }

  @media (pointer: coarse) {
    .dash-link {
      min-height: 32px;
      padding: 4px 12px;
    }

    .cp-dd-btn {
      height: 44px;
    }
  }

  @media (max-width: 560px) {
    .dash-title {
      font-size: 22px;
    }

    .dash-row {
      grid-template-columns: minmax(0, 1fr);
    }

    .dash-row-side {
      justify-items: start;
      grid-auto-flow: column;
      justify-content: space-between;
      align-items: center;
    }

    .dash-filters,
    .dash-filter.tournament,
    .dash-filter.days,
    .dash-filter.status,
    .dash-filter.proposed {
      width: 100%;
    }

    .dash-match-row {
      flex-wrap: wrap;
    }

    .dash-match-actions {
      width: 100%;
      margin: 6px 0 0;
    }

    .dash-tiles,
    .dash-skeleton-tiles {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .dash-tile {
      padding: 12px;
    }

    .cp-dd-menu {
      left: 0;
      right: auto;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .dash-section,
    .dash-tile,
    .dash-link,
    .dash-pagesize-btn .dash-icon,
    .dash-pagesize-menu,
    .cp-dd-btn,
    .cp-dd-chevron,
    .cp-dd-menu {
      transition: none;
    }

    .dash-skeleton-block {
      animation: none;
    }
  }
</style>

<div class="dash-wrap">
  <div class="dash-head">
    <div>
      <div class="dash-title">Dashboard</div>
      <div class="dash-subtitle">What needs your attention right now.</div>
    </div>
    <div class="dash-filters" id="dashFilters" hidden>
      <div class="dash-filter tournament">
        Tournament
        <div id="dashTournament"></div>
      </div>
    </div>
  </div>
  <div id="dashContent" aria-live="polite" aria-busy="true"></div>
</div>

<script>
(function () {
  const AUTH_BASE = window.AUTH_BASE_URL || "https://api.carcassonne.gg";
  const DASHBOARD_URL = `${AUTH_BASE}/dashboard`;
  const SITE_BASE = window.location.origin;

  const contentEl = document.getElementById("dashContent");
  const filtersEl = document.getElementById("dashFilters");
  const tournamentSlot = document.getElementById("dashTournament");
  const DEFAULT_DAYS = "3";
  const DAY_OPTIONS = [1, 2, 3, 4, 5].map((days) => ({ value: String(days), label: `${days} day${days === 1 ? "" : "s"}` }));
  // Unplanned matches with an active time proposal, by when the proposed time is (PROPOSED_TIME_WINDOWS on the server).
  const PROPOSED_TIME_OPTIONS = [
    { value: "", label: "Any time" },
    { value: "4h", label: "Within 4 hours" },
    { value: "12h", label: "Within 12 hours" },
    { value: "1d", label: "Within 1 day" },
    { value: "passed", label: "Already passed" },
  ];
  const PAGE_SIZE_OPTIONS = [10, 20, 50];
  const DEFAULT_PAGE_SIZE = PAGE_SIZE_OPTIONS[0];
  // `page` and `pageSize`: paging of Unplanned matches (UNPLANNED_PAGE_SIZES on the server).
  const filterState = { tournamentId: "", days: DEFAULT_DAYS, status: "", proposed: "", page: 1, pageSize: DEFAULT_PAGE_SIZE };
  const dropdowns = [];
  let loadSeq = 0;

  // Lucide-style line icons (static markup, no user data).
  const ICONS = {
    calendarClock: '<path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><circle cx="16" cy="16" r="6"/><path d="M16 14v2l1 1"/>',
    alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    newspaper: '<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/>',
    userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/>',
    swords: '<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><path d="M5 14l4 4"/><path d="M7 17l-3 3"/><path d="M3 19l2 2"/>',
    fileText: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    chevronDown: '<path d="m6 9 6 6 6-6"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  };

  function icon(name) {
    const node = el("span", "dash-icon");
    node.setAttribute("aria-hidden", "true");
    node.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[name] || ""}</svg>`;
    return node;
  }

  function showMessage(text) {
    contentEl.setAttribute("aria-busy", "false");
    contentEl.className = "dash-alert";
    contentEl.textContent = text;
  }

  function showLoading() {
    contentEl.setAttribute("aria-busy", "true");
    contentEl.className = "dash-skeleton";
    contentEl.innerHTML = "";
    const tiles = el("div", "dash-skeleton-tiles");
    for (let i = 0; i < 4; i += 1) tiles.appendChild(el("div", "dash-skeleton-block"));
    contentEl.appendChild(tiles);
    contentEl.appendChild(el("div", "dash-skeleton-block tall"));
  }

  // Same dropdown as the other Player Hub pages (cp-dd).
  function createDropdown(initialValue, options, onChange) {
    let value = String(initialValue ?? "");
    const root = el("div", "cp-dd");
    const btn = el("button", "cp-dd-btn");
    btn.type = "button";
    const btnContent = el("span", "cp-dd-btn-content");
    const chevron = el("span", "cp-dd-chevron");
    chevron.appendChild(icon("chevronDown"));
    btn.appendChild(btnContent);
    btn.appendChild(chevron);
    const menu = el("div", "cp-dd-menu");

    const renderButton = () => {
      const selected = options.find((option) => option.value === value) || options[0];
      btnContent.innerHTML = "";
      btnContent.appendChild(el("span", "", selected ? selected.label : ""));
      btn.title = selected ? selected.label : "";
    };
    const close = () => {
      menu.classList.remove("open");
      menu.style.maxHeight = "0px";
      btn.classList.remove("open");
    };
    const open = () => {
      menu.classList.add("open");
      menu.style.maxHeight = `${Math.min(menu.scrollHeight, 280)}px`;
      btn.classList.add("open");
    };

    options.forEach((option) => {
      const optionBtn = el("button", `cp-dd-option${option.value === value ? " active" : ""}`, option.label);
      optionBtn.type = "button";
      optionBtn.title = option.label;
      optionBtn.dataset.value = option.value;
      optionBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        close();
        if (option.value === value) return;
        value = option.value;
        menu.querySelectorAll(".cp-dd-option").forEach((node) => node.classList.toggle("active", node.dataset.value === value));
        renderButton();
        onChange(value);
      });
      menu.appendChild(optionBtn);
    });
    btn.addEventListener("click", (event) => {
      event.stopPropagation();
      const isOpen = menu.classList.contains("open");
      dropdowns.forEach((dropdown) => dropdown.close());
      if (!isOpen) open();
    });

    renderButton();
    root.appendChild(btn);
    root.appendChild(menu);
    const api = { root, close };
    dropdowns.push(api);
    return api;
  }

  document.addEventListener("click", () => dropdowns.forEach((dropdown) => dropdown.close()));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") dropdowns.forEach((dropdown) => dropdown.close());
  });

  // In the order of the Status filter (PLANNING_STATUSES on the server).
  const PLANNING_STATUS = {
    deadline_passed: { label: "Deadline passed", tone: "attention" },
    no_proposal: { label: "No time proposed", tone: "attention" },
    time_proposed: { label: "Time proposed", tone: "warn" },
    change_pending: { label: "Time being renegotiated", tone: "warn" },
  };
  const PLAYER_PROFILE_URL = "https://carcassonne.gg/player/?id=";
  const CCL_STAGE_LABELS = { Q1: "Q1", Q2: "Q2", Q3: "Q3", Main: "League Stage", Playoffs: "Playoffs" };

  const PLAYER_ACTION = {
    accept_time: { label: "Accept or counter the proposed time", tone: "attention" },
    propose_time: { label: "Propose a time", tone: "attention" },
    deadline_passed: { label: "Deadline passed", tone: "attention" },
    result_error: { label: "Result check failed", tone: "attention" },
    waiting_opponent: { label: "Waiting for opponent", tone: "warn" },
    time_not_set: { label: "Captains are agreeing the time", tone: "" },
    planned: { label: "Planned", tone: "ok" },
  };

  // Block order on the page and in the counter tiles.
  const BLOCKS = [
    { key: "unplanned_duels", title: "Unplanned matches", tile: "Unplanned matches", icon: "calendarClock", render: renderUnplannedDuel },
    { key: "error_duels", title: "Matches in Error", tile: "Errors", icon: "alert", render: renderErrorDuel },
    { key: "cases", title: "Open cases", tile: "Open cases", icon: "inbox", render: renderCase },
    { key: "news_drafts", title: "News proposals in Draft", tile: "News proposals", icon: "newspaper", render: renderNewsDraft },
    { key: "new_users", title: "New users with a BGA profile", tile: "New users", icon: "userPlus", render: renderNewUser, info: true },
    { key: "my_duels", title: "My matches", tile: "My matches: action needed", icon: "swords", render: renderMyDuel, countKey: "action_count" },
    { key: "my_cases", title: "My cases", tile: "My open cases", icon: "fileText", render: renderMyCase, countKey: "active_count" },
  ];

  function readUrlState() {
    const params = new URLSearchParams(window.location.search);
    return {
      tournamentId: String(params.get("tournament_id") || "").trim(),
      days: String(params.get("days") || "").trim(),
      status: String(params.get("status") || "").trim(),
      proposed: String(params.get("proposed_time") || "").trim(),
      page: String(params.get("page") || "").trim(),
      pageSize: String(params.get("per_page") || "").trim(),
    };
  }

  function writeUrlState(state) {
    const url = new URL(window.location.href);
    const setParam = (name, value) => {
      if (value) url.searchParams.set(name, value);
      else url.searchParams.delete(name);
    };
    setParam("tournament_id", state.tournamentId);
    setParam("days", state.days === DEFAULT_DAYS ? "" : state.days);
    setParam("status", state.status);
    setParam("proposed_time", state.proposed);
    setParam("page", Number(state.page) > 1 ? String(state.page) : "");
    setParam("per_page", Number(state.pageSize) !== DEFAULT_PAGE_SIZE ? String(state.pageSize) : "");
    window.history.replaceState(null, "", url.toString());
  }

  function el(tag, className, textValue) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (textValue !== undefined && textValue !== null) node.textContent = String(textValue);
    return node;
  }

  function absoluteLink(link) {
    if (!link) return "";
    return /^https?:\/\//i.test(link) ? link : `${SITE_BASE}${link}`;
  }

  function formatUtc(iso) {
    const ts = Date.parse(iso || "");
    if (!Number.isFinite(ts)) return "";
    return new Intl.DateTimeFormat("en-GB", {
      weekday: "short", day: "numeric", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit", timeZone: "UTC",
    }).format(new Date(ts)) + " UTC";
  }

  // Deadlines are stored as Sunday 23:59 UTC; the tournament page shows them as Monday 00:00.
  function formatDeadline(iso) {
    let ts = Date.parse(iso || "");
    if (!Number.isFinite(ts)) return "";
    if (new Date(ts).getUTCMinutes() === 59) ts = Math.ceil((ts + 1) / 60000) * 60000;
    return formatUtc(new Date(ts).toISOString());
  }

  function formatDate(iso) {
    const ts = Date.parse(iso || "");
    if (!Number.isFinite(ts)) return "";
    return new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" })
      .format(new Date(ts));
  }


  function badge(info) {
    if (!info) return null;
    return el("span", `dash-badge ${info.tone || ""}`.trim(), info.label);
  }

  function linkTo(href, label = "View") {
    if (!href) return null;
    const anchor = el("a", "dash-link", label);
    anchor.href = absoluteLink(href);
    if (/^https?:\/\//i.test(href)) {
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
    }
    return anchor;
  }

  function duelContext(item) {
    return [item.tournament?.name, item.stage, item.round, item.group].filter(Boolean).join(" · ");
  }

  function playerName(player) {
    return player?.name || "TBD";
  }


  function row({ title, lines = [], errorLine = "", side = [] }) {
    const node = el("div", "dash-row");
    const main = el("div", "dash-row-main");
    main.appendChild(el("div", "dash-row-title", title));
    // A line is a string, or { text, className } for a line with its own style.
    lines.filter((line) => (typeof line === "string" ? line : line?.text)).forEach((line) => {
      if (typeof line === "string") main.appendChild(el("div", "dash-row-line", line));
      else main.appendChild(el("div", `dash-row-line ${line.className || ""}`.trim(), line.text));
    });
    if (errorLine) {
      const errorEl = el("div", "dash-row-error");
      errorEl.appendChild(icon("alert"));
      errorEl.appendChild(el("span", "", errorLine));
      main.appendChild(errorEl);
    }
    const sideEl = el("div", "dash-row-side");
    side.filter(Boolean).forEach((child) => sideEl.appendChild(child));
    node.appendChild(main);
    node.appendChild(sideEl);
    return node;
  }

  // Time column of the tournaments page: "25 Nov 18:00" in the viewer's time.
  function formatMatchTime(iso) {
    const date = new Date(iso || "");
    if (!Number.isFinite(date.getTime())) return "Time TBD";
    const month = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][date.getMonth()];
    const pad = (value) => String(value).padStart(2, "0");
    const dayMonth = `${pad(date.getDate())} ${month}`;
    const time = `${pad(date.getHours())}:${pad(date.getMinutes())}`;
    return date.getFullYear() < new Date().getFullYear() ? `${dayMonth}\n${date.getFullYear()}\n${time}` : `${dayMonth} ${time}`;
  }

  function unplannedHeading(item) {
    return [
      item.tournament?.name,
      CCL_STAGE_LABELS[item.stage] || item.stage,
      item.round,
      item.group ? `Group ${item.group}` : "",
    ].filter(Boolean).join(" · ");
  }

  // Flag, name with a link to the player's profile, and a clock icon for the player who proposed the time.
  function matchPlayerLine(player, isProposer) {
    const line = el("div", "dash-match-player");
    if (player?.association_flag) {
      const flag = el("img", "dash-match-flag");
      flag.src = player.association_flag;
      flag.alt = "";
      line.appendChild(flag);
    }
    const name = el(player?.id ? "a" : "span", "dash-match-player-name", playerName(player));
    if (player?.id) {
      name.href = `${PLAYER_PROFILE_URL}${encodeURIComponent(player.id)}`;
    }
    line.appendChild(name);
    if (isProposer) {
      const mark = el("span", "dash-match-proposer");
      mark.title = "Proposed the match time";
      mark.setAttribute("role", "img");
      mark.setAttribute("aria-label", "Proposed the match time");
      mark.appendChild(icon("clock"));
      line.appendChild(mark);
    }
    return line;
  }

  const plural = (count, word) => `${count} ${word}${count === 1 ? "" : "s"}`;

  // "4 days 5 hours", "1 day", "5 hours", "45 minutes": minutes only when less than an hour is left.
  function durationText(ms) {
    const totalMinutes = Math.max(0, Math.floor(ms / 60000));
    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    if (days) return [plural(days, "day"), hours ? plural(hours, "hour") : ""].filter(Boolean).join(" ");
    if (hours) return plural(hours, "hour");
    return plural(totalMinutes, "minute");
  }

  // Time left until the stage deadline (shown as Monday 00:00, see formatDeadline).
  function deadlineText(item) {
    let ts = Date.parse(item.deadline_utc || "");
    if (!Number.isFinite(ts)) return "";
    if (new Date(ts).getUTCMinutes() === 59) ts = Math.ceil((ts + 1) / 60000) * 60000;
    const left = ts - Date.now();
    return left > 0 ? `Time to play: ${durationText(left)}` : `Deadline passed ${durationText(-left)} ago`;
  }

  function hasActiveProposal(item) {
    return (item.proposed_time_status === "pending" || item.proposed_time_status === "change_pending")
      && Number.isFinite(Date.parse(item.proposed_time_utc || ""));
  }

  // "Match in: 6 hours" for the proposed time; a proposed time that has passed is shown in red.
  function proposedTimeLine(item) {
    if (!hasActiveProposal(item)) return null;
    const left = Date.parse(item.proposed_time_utc) - Date.now();
    return left > 0
      ? el("div", "dash-match-meta", `Match in: ${durationText(left)}`)
      : el("div", "dash-match-meta is-overdue", `Proposed time passed ${durationText(-left)} ago without a reply`);
  }

  function renderUnplannedDuel(item) {
    const wrap = el("div", "dash-match");
    const matchRow = el("div", "dash-match-row");
    // The time column shows the proposed time, or nothing while no time is proposed.
    const time = el("div", "dash-match-time");
    if (hasActiveProposal(item)) time.appendChild(el("div", "dash-match-time-text", formatMatchTime(item.proposed_time_utc)));
    const proposerId = hasActiveProposal(item) ? item.proposed_by_player_id : null;
    const players = el("div", "dash-match-players");
    players.appendChild(matchPlayerLine(item.player_1, !!proposerId && item.player_1?.id === proposerId));
    players.appendChild(matchPlayerLine(item.player_2, !!proposerId && item.player_2?.id === proposerId));
    const deadline = deadlineText(item);
    if (deadline) players.appendChild(el("div", "dash-match-meta", deadline));
    const proposedTime = proposedTimeLine(item);
    if (proposedTime) players.appendChild(proposedTime);
    const actions = el("div", "dash-match-actions");
    const status = PLANNING_STATUS[item.planning_status];
    if (status) actions.appendChild(el("span", `dash-status-badge${status.tone ? ` is-${status.tone}` : ""}`, status.label));
    const view = linkTo(item.link);
    if (view) actions.appendChild(view);
    matchRow.append(time, el("div", "dash-match-divider"), players, actions);
    wrap.appendChild(matchRow);
    return wrap;
  }

  // Matches under "Tournament · Stage · Round · Group" headings, as on the tournaments page.
  function renderUnplannedList(block) {
    const items = block.items || [];
    const body = el("div", "dash-matches");
    body.appendChild(renderUnplannedPager(block));
    let heading = null;
    let list = null;
    items.forEach((item) => {
      const nextHeading = unplannedHeading(item);
      if (!list || nextHeading !== heading) {
        heading = nextHeading;
        if (heading) body.appendChild(el("div", "dash-match-heading", heading));
        list = el("div", "dash-match-list");
        body.appendChild(list);
      }
      list.appendChild(renderUnplannedDuel(item));
    });
    return body;
  }

  // Per page picker and Prev / Page N of M / Next, as on team-official-matches.html.
  function renderUnplannedPager(block) {
    const totalPages = Math.max(1, Number(block?.total_pages) || 1);
    const page = Math.min(Math.max(1, Number(block?.page) || 1), totalPages);
    const bar = el("div", "dash-pager");

    const sizeWrap = el("div", "dash-pagesize", "Per page:");
    const picker = el("div", "dash-pagesize-picker");
    const sizeBtn = el("button", "dash-pagesize-btn");
    sizeBtn.type = "button";
    sizeBtn.setAttribute("aria-label", `Matches per page: ${filterState.pageSize}`);
    sizeBtn.appendChild(el("span", "", filterState.pageSize));
    sizeBtn.appendChild(icon("chevronDown"));
    const menu = el("div", "dash-pagesize-menu");
    const close = () => {
      menu.classList.remove("open");
      menu.style.maxHeight = "0px";
      sizeBtn.classList.remove("open");
    };
    PAGE_SIZE_OPTIONS.forEach((size) => {
      const option = el("button", `dash-pagesize-option${size === filterState.pageSize ? " active" : ""}`, size);
      option.type = "button";
      option.addEventListener("click", (event) => {
        event.stopPropagation();
        close();
        if (size === filterState.pageSize) return;
        filterState.pageSize = size;
        filterState.page = 1;
        onFilterChange("unplanned_duels", { keepPage: true });
      });
      menu.appendChild(option);
    });
    sizeBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      const isOpen = menu.classList.contains("open");
      dropdowns.forEach((dropdown) => dropdown.close());
      if (isOpen) return;
      menu.classList.add("open");
      menu.style.maxHeight = `${menu.scrollHeight}px`;
      sizeBtn.classList.add("open");
    });
    dropdowns.push({ close });
    picker.append(sizeBtn, menu);
    sizeWrap.appendChild(picker);

    const pagination = el("div", "dash-pagination");
    const goTo = (nextPage) => {
      filterState.page = nextPage;
      onFilterChange("unplanned_duels", { keepPage: true });
    };
    const prev = el("button", "dash-pagebtn", "Prev");
    prev.type = "button";
    prev.disabled = page <= 1;
    prev.addEventListener("click", () => goTo(page - 1));
    const next = el("button", "dash-pagebtn", "Next");
    next.type = "button";
    next.disabled = page >= totalPages;
    next.addEventListener("click", () => goTo(page + 1));
    pagination.append(prev, el("span", "dash-pageinfo", `Page ${page} of ${totalPages}`), next);

    bar.append(sizeWrap, pagination);
    return bar;
  }

  function filterField(label, className, dropdown) {
    const field = el("div", `dash-filter ${className}`, label);
    field.appendChild(dropdown.root);
    return field;
  }

  function renderUnplannedFilters(block) {
    const bar = el("div", "dash-section-filters");
    const counts = block?.status_counts || {};
    const statusKeys = Object.keys(PLANNING_STATUS);
    const total = statusKeys.reduce((sum, key) => sum + Number(counts[key] || 0), 0);
    const statusOptions = [{ value: "", label: `All statuses (${total})` }]
      .concat(statusKeys.map((key) => ({ value: key, label: `${PLANNING_STATUS[key].label} (${Number(counts[key] || 0)})` })));
    const dayOptions = DAY_OPTIONS.some((option) => option.value === filterState.days)
      ? DAY_OPTIONS
      : DAY_OPTIONS.concat({ value: filterState.days, label: `${filterState.days} days` });
    bar.appendChild(filterField("Deadline within", "days", createDropdown(filterState.days, dayOptions, (value) => {
      filterState.days = value;
      onFilterChange("unplanned_duels");
    })));
    bar.appendChild(filterField("Status", "status", createDropdown(filterState.status, statusOptions, (value) => {
      filterState.status = value;
      onFilterChange("unplanned_duels");
    })));
    bar.appendChild(filterField("Proposed time", "proposed", createDropdown(filterState.proposed, PROPOSED_TIME_OPTIONS, (value) => {
      filterState.proposed = value;
      onFilterChange("unplanned_duels");
    })));
    return bar;
  }

  function renderErrorDuel(item) {
    return row({
      title: `${playerName(item.player_1)} vs ${playerName(item.player_2)}`,
      lines: [
        duelContext(item),
        item.time_utc ? `Played ${formatUtc(item.time_utc)}` : "",
        item.checked_at ? `Last check ${formatUtc(item.checked_at)}` : "",
      ],
      errorLine: item.error || "No error message saved",
      side: [badge({ label: "Error", tone: "attention" }), linkTo(item.link)],
    });
  }

  const CASE_PRIORITY_TONE = { urgent: "attention", high: "attention", normal: "warn", low: "" };
  // Case types and categories as players see them (auth-server/src/tournament-cases.js).
  const CASE_LABELS = {
    problem: "Match problem", complaint: "Complaint", request: "Request", feedback: "Feedback", other: "Other",
    scheduling: "Scheduling the match time", not_played: "Match was not played", incomplete: "Match not finished",
    result_dispute: "Wrong match result", conduct: "Rule violation or opponent's behaviour",
    general: "Other question for admins", no_show: "No-show",
    open: "Open", in_progress: "In progress", resolved: "Resolved", closed: "Closed",
    urgent: "Urgent", high: "High", normal: "Normal", low: "Low",
  };
  const caseLabel = (value) => CASE_LABELS[value] || String(value || "").replace(/_/g, " ");
  const CASE_DETAILS_PREVIEW = 160;

  function caseTitle(item) {
    return [caseLabel(item.type), item.category ? caseLabel(item.category) : ""].filter(Boolean).join(": ") || `Case #${item.id}`;
  }

  // Each submission of the case (CASE_DETAILS_SEPARATOR on the server) on its own line, -- between them.
  function caseDetailsPreview(item) {
    const parts = String(item.details || "")
      .split(/\n--\n/)
      .map((part) => part.replace(/\s+/g, " ").trim())
      .filter(Boolean)
      .map((part) => (part.length > CASE_DETAILS_PREVIEW ? `${part.slice(0, CASE_DETAILS_PREVIEW - 1)}…` : part));
    return { text: parts.join("\n--\n"), className: "dash-case-details" };
  }

  function renderCase(item) {
    return row({
      title: caseTitle(item),
      lines: [
        [item.tournament?.name, item.submitted_by?.name ? `From ${item.submitted_by.name}` : ""].filter(Boolean).join(" · "),
        caseDetailsPreview(item),
        [
          item.created_at ? `Opened ${formatDate(item.created_at)} (${item.days_open ?? 0} d)` : "",
          `${caseLabel(item.status)}${item.responsible ? `, ${item.responsible}` : ", unassigned"}`,
        ].filter(Boolean).join(" · "),
      ],
      side: [
        badge({ label: caseLabel(item.priority), tone: CASE_PRIORITY_TONE[item.priority] ?? "" }),
        linkTo(item.link),
      ],
    });
  }

  const MY_CASE_STATUS_TONE = { open: "warn", in_progress: "warn", resolved: "ok", closed: "" };

  function renderMyCase(item) {
    const active = item.status === "open" || item.status === "in_progress";
    const lines = [
      item.tournament?.name || "",
      caseDetailsPreview(item),
      active
        ? [
          item.created_at ? `Submitted ${formatDate(item.created_at)} (${item.days_open ?? 0} d)` : "",
          item.responsible ? `Handled by ${item.responsible}` : "Waiting for an admin",
        ].filter(Boolean).join(" · ")
        : [
          item.created_at ? `Submitted ${formatDate(item.created_at)}` : "",
          item.resolved_at ? `${caseLabel(item.status)} ${formatDate(item.resolved_at)}` : "",
        ].filter(Boolean).join(" · "),
      !active && item.resolution ? `Resolution: ${item.resolution}` : "",
    ];
    return row({
      title: caseTitle(item),
      lines,
      side: [badge({ label: caseLabel(item.status), tone: MY_CASE_STATUS_TONE[item.status] ?? "" }), linkTo(item.link)],
    });
  }

  function renderNewsDraft(item) {
    return row({
      title: item.title || `News #${item.id}`,
      lines: [
        [item.author?.name ? `By ${item.author.name}` : "", item.tournament?.name].filter(Boolean).join(" · "),
        item.created_at ? `Submitted ${formatDate(item.created_at)}` : "",
      ],
      side: [
        badge({ label: `${item.days_waiting ?? 0} d waiting`, tone: (item.days_waiting ?? 0) >= 3 ? "attention" : "warn" }),
        linkTo(item.link),
      ],
    });
  }

  function renderNewUser(item) {
    const name = [item.bga_nickname, item.name && item.name !== item.bga_nickname ? `(${item.name})` : ""]
      .filter(Boolean).join(" ");
    return row({
      title: name || `User #${item.user_id}`,
      lines: [
        [item.association, item.bga_elo !== null && item.bga_elo !== undefined ? `BGA Elo ${item.bga_elo}` : ""]
          .filter(Boolean).join(" · "),
        item.created_at ? `Registered ${formatDate(item.created_at)}` : "",
      ],
      side: [linkTo(item.link, "Profile")],
    });
  }

  function renderMyDuel(item) {
    const lines = [duelContext(item)];
    if (item.time_utc) lines.push(`Time: ${formatUtc(item.time_utc)}`);
    if (item.proposed_time_utc && (item.action === "accept_time" || item.action === "waiting_opponent")) {
      lines.push(`Proposed time: ${formatUtc(item.proposed_time_utc)}`);
    }
    if (item.deadline_utc) lines.push(`Play before ${formatDeadline(item.deadline_utc)}`);
    return row({
      title: `vs ${playerName(item.opponent)}`,
      lines,
      side: [badge(PLAYER_ACTION[item.action]), linkTo(item.link)],
    });
  }

  function blockCount(block, config) {
    return Number(block?.[config.countKey || "count"] || 0);
  }

  function blockMeta(block, config) {
    if (config.key === "new_users") return `${block.count} in the last ${block.days || 7} days`;
    if (config.key === "my_duels") return `${block.action_count} need action · ${block.count} active`;
    if (config.key === "my_cases") return `${block.active_count} open · ${block.count} total`;
    return `${block.count}`;
  }

  function renderSection(config, block, data) {
    const section = el("section", "dash-section");
    section.id = `dash-${config.key}`;
    const count = Number(block?.count || 0);
    if (!count) section.classList.add("is-empty");

    const head = el("div", "dash-section-head");
    const heading = el("div", "dash-section-heading");
    const headingIcon = el("span", "dash-section-icon");
    headingIcon.appendChild(icon(config.icon));
    heading.appendChild(headingIcon);
    heading.appendChild(el("h2", "dash-section-title", config.title));
    head.appendChild(heading);
    const meta = el("div", "dash-section-meta");
    if (!count) meta.appendChild(icon("check"));
    meta.appendChild(el("span", "", count ? blockMeta(block, config) : "Nothing here"));
    head.appendChild(meta);
    section.appendChild(head);

    if (config.key === "cases") {
      section.appendChild(el(
        "div",
        "dash-section-note",
        data.filters?.tournament_id
          ? "Cases of the selected tournament."
          : data.roles?.global_admin
            ? "Cases of all tournaments, most urgent and oldest first."
            : "Cases of the tournaments you manage, most urgent and oldest first."
      ));
    }
    if (config.key === "my_cases") {
      section.appendChild(el("div", "dash-section-note", "Cases you submitted in all tournaments, open ones first."));
    }
    if (config.key === "unplanned_duels") {
      section.appendChild(renderUnplannedFilters(block));
      if (!count) {
        const filtered = filterState.status || filterState.proposed;
        section.appendChild(el("div", "dash-section-note", filtered ? "No matches match these filters." : "No unplanned matches."));
        return section;
      }
      section.appendChild(renderUnplannedList(block));
      return section;
    }
    if (!count) return section;

    const rows = el("div", "dash-rows");
    (block.items || []).forEach((item) => rows.appendChild(config.render(item)));
    section.appendChild(rows);
    if (count > (block.items || []).length) {
      section.appendChild(el("div", "dash-more", `Showing ${(block.items || []).length} of ${count}.`));
    }
    return section;
  }

  function renderTiles(data, visibleBlocks) {
    const tiles = el("div", "dash-tiles");
    visibleBlocks.forEach((config) => {
      const block = data.blocks[config.key];
      const count = blockCount(block, config);
      const tone = !count ? "is-clear" : config.info ? "tone-info" : "tone-attention";
      const tile = el("button", `dash-tile ${tone}`);
      tile.type = "button";
      tile.setAttribute("aria-label", `${config.tile}: ${count}. Go to section`);
      const tileIcon = el("span", "dash-tile-icon");
      tileIcon.appendChild(icon(count ? config.icon : "check"));
      const body = el("span", "dash-tile-body");
      body.appendChild(el("span", "dash-tile-count", count));
      body.appendChild(el("span", "dash-tile-label", config.tile));
      tile.appendChild(tileIcon);
      tile.appendChild(body);
      tile.addEventListener("click", () => {
        document.getElementById(`dash-${config.key}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      tiles.appendChild(tile);
    });
    return tiles;
  }

  function renderFilters(data) {
    if (!data.roles?.tournament_admin) {
      filtersEl.hidden = true;
      return;
    }
    filtersEl.hidden = false;
    filterState.tournamentId = data.filters?.tournament_id || "";
    filterState.days = String(data.filters?.days_before_deadline ?? DEFAULT_DAYS);
    filterState.status = data.filters?.planning_status || "";
    filterState.proposed = data.filters?.proposed_time || "";
    const unplanned = data.blocks?.unplanned_duels;
    filterState.page = Number(unplanned?.page) || 1;
    filterState.pageSize = PAGE_SIZE_OPTIONS.includes(Number(unplanned?.page_size)) ? Number(unplanned.page_size) : DEFAULT_PAGE_SIZE;
    const tournamentOptions = [{ value: "", label: "All my tournaments" }]
      .concat((data.tournaments || []).map((tournament) => ({ value: tournament.id, label: tournament.name })));

    tournamentSlot.innerHTML = "";
    tournamentSlot.appendChild(createDropdown(filterState.tournamentId, tournamentOptions, (value) => {
      filterState.tournamentId = value;
      onFilterChange();
    }).root);
  }

  function renderDashboard(data) {
    // The header and section dropdowns are created again on every render.
    dropdowns.length = 0;
    renderFilters(data);
    const visibleBlocks = BLOCKS.filter((config) => data.blocks?.[config.key]);
    if (!visibleBlocks.length) {
      showMessage("Nothing to show yet. Link your BGA profile to see your matches here.");
      return;
    }
    contentEl.setAttribute("aria-busy", "false");
    contentEl.className = "";
    contentEl.innerHTML = "";
    const wrap = el("div", "dash-wrap");
    wrap.style.margin = "0";
    wrap.appendChild(renderTiles(data, visibleBlocks));
    visibleBlocks.forEach((config) => wrap.appendChild(renderSection(config, data.blocks[config.key], data)));
    contentEl.appendChild(wrap);
  }

  async function load() {
    // Only the latest request renders: filters may change before an earlier response arrives.
    const seq = ++loadSeq;
    const state = readUrlState();
    const url = new URL(DASHBOARD_URL);
    if (state.tournamentId) url.searchParams.set("tournament_id", state.tournamentId);
    if (state.days) url.searchParams.set("days_before_deadline", state.days);
    if (state.status) url.searchParams.set("planning_status", state.status);
    if (state.proposed) url.searchParams.set("proposed_time", state.proposed);
    if (state.page) url.searchParams.set("unplanned_page", state.page);
    if (state.pageSize) url.searchParams.set("unplanned_page_size", state.pageSize);
    try {
      const response = await fetch(url.toString(), { method: "GET", credentials: "include" });
      if (seq !== loadSeq) return;
      if (response.status === 401) {
        showMessage("Please sign in to view your dashboard.");
        return;
      }
      const data = await response.json().catch(() => ({}));
      if (seq !== loadSeq) return;
      if (!response.ok || !data?.ok) throw new Error(data?.message || "Failed to load dashboard");
      renderDashboard(data);
    } catch (_error) {
      if (seq === loadSeq) showMessage("Failed to load the dashboard. Please refresh the page.");
    }
  }

  // `sectionKey`: a filter of that section changed; the page stays and only the section dims while loading.
  // A filter change starts Unplanned matches from its first page; paging itself passes `keepPage`.
  function onFilterChange(sectionKey = "", { keepPage = false } = {}) {
    if (!keepPage) filterState.page = 1;
    writeUrlState(filterState);
    const section = sectionKey ? document.getElementById(`dash-${sectionKey}`) : null;
    if (section) section.classList.add("is-loading");
    else showLoading();
    load();
  }

  window.addEventListener("gg-auth-state-change", load);

  showLoading();
  load();
})();
</script>
