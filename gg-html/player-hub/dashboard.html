<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* Design: "Flat Design" from the ui-ux-pro-max skill, in the Player Hub palette:
     solid fills, no shadows or gradients, small radii, color/opacity hover only. */
  :root {
    --dash-text: #1f2937;
    --dash-muted: #5b6576;
    --dash-faint: #8a94a3;
    --dash-border: #e3e8ef;
    --dash-border-strong: #c9d1dc;
    --dash-card: #fff;
    --dash-soft: #f4f6f9;
    --dash-primary: #1a73b7;
    --dash-primary-hover: #155d94;
    --dash-primary-soft: #e8f1fa;
    --dash-attention: #b4232f;
    --dash-attention-hover: #961c27;
    --dash-attention-bg: #fdecee;
    --dash-warn: #8a5a00;
    --dash-ok: #2d6a3e;
    --dash-neutral-bg: #eef1f5;
    --dash-radius: 6px;
    --dash-ease: 160ms ease;
  }

  body {
    margin: 0;
    font-family: "Montserrat", sans-serif;
    color: var(--dash-text);
  }

  .dash-wrap {
    display: grid;
    gap: 16px;
    margin: 0 8px 16px;
  }

  .dash-icon {
    display: inline-flex;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .dash-icon svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- Header and filters ---------- */

  .dash-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 16px;
  }

  .dash-title {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.2;
  }

  .dash-subtitle {
    font-size: 14px;
    color: var(--dash-muted);
    margin-top: 4px;
  }

  .dash-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .dash-filters[hidden] {
    display: none;
  }

  .dash-filter {
    display: grid;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--dash-muted);
  }

  .dash-filter.tournament {
    width: 240px;
  }

  .dash-filter.days {
    width: 140px;
  }

  .cp-dd {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    width: 100%;
  }

  .cp-dd-btn {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    height: 36px;
    border: 0;
    border-radius: 4px;
    background: var(--dash-neutral-bg);
    color: var(--dash-text);
    font-size: 14px;
    font-weight: 500;
    padding: 4px 10px;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    transition: background-color var(--dash-ease);
  }

  .cp-dd-btn:hover,
  .cp-dd-btn.open {
    background: #e2e7ee;
  }

  .cp-dd-btn:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  .cp-dd-btn-content {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cp-dd-btn-content span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cp-dd-chevron {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    color: var(--dash-muted);
    transition: transform var(--dash-ease);
  }

  .cp-dd-btn.open .cp-dd-chevron {
    transform: rotate(180deg);
  }

  .cp-dd-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 4px);
    min-width: 100%;
    width: max-content;
    max-width: min(320px, calc(100vw - 32px));
    max-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    background: #fff;
    border: 1px solid var(--dash-border-strong);
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, max-height 0.16s ease;
    z-index: 20;
  }

  .cp-dd-menu.open {
    opacity: 1;
    pointer-events: auto;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .cp-dd-option {
    all: unset;
    box-sizing: border-box;
    padding: 8px 10px;
    display: block;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--dash-text);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }

  .cp-dd-option:hover,
  .cp-dd-option:focus-visible {
    background: var(--dash-soft);
  }

  .cp-dd-option.active {
    background: var(--dash-primary);
    color: #fff;
    font-weight: 600;
  }

  /* ---------- Messages and loading ---------- */

  .dash-alert {
    background: var(--dash-soft);
    border-radius: var(--dash-radius);
    padding: 16px;
    font-size: 14px;
    color: var(--dash-muted);
  }

  .dash-skeleton {
    display: grid;
    gap: 16px;
  }

  .dash-skeleton-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }

  .dash-skeleton-block {
    height: 84px;
    border-radius: var(--dash-radius);
    background: var(--dash-neutral-bg);
    animation: dash-pulse 1.2s ease-in-out infinite alternate;
  }

  .dash-skeleton-block.tall {
    height: 180px;
  }

  @keyframes dash-pulse {
    from { opacity: 1; }
    to { opacity: 0.5; }
  }

  /* ---------- Counter tiles ---------- */

  .dash-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }

  .dash-tile {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 4px 8px;
    padding: 14px;
    border: 0;
    border-radius: var(--dash-radius);
    background: var(--dash-neutral-bg);
    color: var(--dash-muted);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color var(--dash-ease);
  }

  .dash-tile:hover {
    background: #e2e7ee;
  }

  .dash-tile:focus-visible {
    outline: 2px solid var(--dash-text);
    outline-offset: 2px;
  }

  .dash-tile-icon {
    grid-column: 2;
    grid-row: 1;
    display: inline-flex;
    opacity: 0.8;
  }

  .dash-tile-body {
    grid-column: 1;
    grid-row: 1;
    display: grid;
    gap: 4px;
    min-width: 0;
  }

  .dash-tile-count {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--dash-text);
  }

  .dash-tile-label {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
  }

  .dash-tile.is-clear .dash-tile-count {
    color: var(--dash-faint);
  }

  .dash-tile.tone-attention {
    background: var(--dash-attention);
    color: #fff;
  }

  .dash-tile.tone-attention:hover {
    background: var(--dash-attention-hover);
  }

  .dash-tile.tone-info {
    background: var(--dash-primary);
    color: #fff;
  }

  .dash-tile.tone-info:hover {
    background: var(--dash-primary-hover);
  }

  .dash-tile.tone-attention .dash-tile-count,
  .dash-tile.tone-info .dash-tile-count {
    color: #fff;
  }

  /* ---------- Sections ---------- */

  .dash-section {
    background: var(--dash-card);
    border: 1px solid var(--dash-border);
    border-radius: var(--dash-radius);
    overflow: hidden;
    scroll-margin-top: 16px;
  }

  .dash-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    background: var(--dash-soft);
  }

  .dash-section-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .dash-section-icon {
    display: inline-flex;
    color: var(--dash-primary);
  }

  .dash-section.is-empty .dash-section-icon {
    color: var(--dash-faint);
  }

  .dash-section-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.25;
  }

  .dash-section.is-empty .dash-section-title {
    color: var(--dash-muted);
  }

  .dash-section-meta {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--dash-muted);
    white-space: nowrap;
  }

  .dash-section-meta .dash-icon {
    width: 14px;
    height: 14px;
  }

  .dash-section.is-empty .dash-section-meta {
    color: var(--dash-ok);
  }

  .dash-section-note {
    padding: 10px 16px 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--dash-muted);
  }

  .dash-section.is-empty .dash-section-note {
    padding-bottom: 12px;
  }

  .dash-rows {
    display: grid;
    padding: 4px 0;
  }

  .dash-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px 16px;
    padding: 12px 16px;
    border-top: 1px solid var(--dash-border);
  }

  .dash-row:first-child {
    border-top: 0;
  }

  .dash-row-main {
    display: grid;
    gap: 4px;
    min-width: 0;
  }

  .dash-row-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .dash-row-line {
    font-size: 13px;
    line-height: 1.45;
    color: var(--dash-muted);
    overflow-wrap: anywhere;
  }

  /* Texts of repeated submissions of one case, one per line with -- between them. */
  .dash-row-line.dash-case-details {
    white-space: pre-line;
    color: var(--dash-text);
  }

  .dash-row-error {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    margin-top: 2px;
    padding: 6px 10px;
    border-radius: 4px;
    background: var(--dash-attention-bg);
    font-size: 13px;
    line-height: 1.4;
    color: var(--dash-attention);
    overflow-wrap: anywhere;
  }

  .dash-row-error .dash-icon {
    width: 15px;
    height: 15px;
    margin-top: 1px;
  }

  .dash-row-side {
    display: grid;
    justify-items: end;
    align-content: start;
    gap: 8px;
  }

  .dash-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
    background: var(--dash-neutral-bg);
    color: #3d4757;
  }

  .dash-badge.attention { background: var(--dash-attention); color: #fff; }
  .dash-badge.warn { background: var(--dash-warn); color: #fff; }
  .dash-badge.ok { background: var(--dash-ok); color: #fff; }

  .dash-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 32px;
    padding: 0 12px;
    box-sizing: border-box;
    border-radius: 4px;
    background: var(--dash-primary-soft);
    font-size: 13px;
    font-weight: 600;
    color: var(--dash-primary);
    text-decoration: none;
    white-space: nowrap;
    transition: background-color var(--dash-ease), color var(--dash-ease);
  }

  .dash-link .dash-icon {
    width: 14px;
    height: 14px;
  }

  .dash-link:hover {
    background: var(--dash-primary);
    color: #fff;
  }

  .dash-link:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  .dash-more {
    padding: 10px 16px;
    font-size: 13px;
    color: var(--dash-muted);
    border-top: 1px solid var(--dash-border);
  }

  @media (pointer: coarse) {
    .dash-link {
      min-height: 44px;
    }

    .cp-dd-btn {
      height: 44px;
    }
  }

  @media (max-width: 560px) {
    .dash-title {
      font-size: 22px;
    }

    .dash-row {
      grid-template-columns: minmax(0, 1fr);
    }

    .dash-row-side {
      justify-items: start;
      grid-auto-flow: column;
      justify-content: space-between;
      align-items: center;
    }

    .dash-filters,
    .dash-filter.tournament,
    .dash-filter.days {
      width: 100%;
    }

    .dash-tiles,
    .dash-skeleton-tiles {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .dash-tile {
      padding: 12px;
    }

    .cp-dd-menu {
      left: 0;
      right: auto;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .dash-tile,
    .dash-link,
    .cp-dd-btn,
    .cp-dd-chevron,
    .cp-dd-menu {
      transition: none;
    }

    .dash-skeleton-block {
      animation: none;
    }
  }
</style>

<div class="dash-wrap">
  <div class="dash-head">
    <div>
      <div class="dash-title">Dashboard</div>
      <div class="dash-subtitle">What needs your attention right now.</div>
    </div>
    <div class="dash-filters" id="dashFilters" hidden>
      <div class="dash-filter tournament">
        Tournament
        <div id="dashTournament"></div>
      </div>
      <div class="dash-filter days">
        Deadline within
        <div id="dashDays"></div>
      </div>
    </div>
  </div>
  <div id="dashContent" aria-live="polite" aria-busy="true"></div>
</div>

<script>
(function () {
  const AUTH_BASE = window.AUTH_BASE_URL || "https://api.carcassonne.gg";
  const DASHBOARD_URL = `${AUTH_BASE}/dashboard`;
  const SITE_BASE = window.location.origin;

  const contentEl = document.getElementById("dashContent");
  const filtersEl = document.getElementById("dashFilters");
  const tournamentSlot = document.getElementById("dashTournament");
  const daysSlot = document.getElementById("dashDays");
  const DAY_OPTIONS = [1, 3, 7, 14, 30].map((days) => ({ value: String(days), label: `${days} day${days === 1 ? "" : "s"}` }));
  const filterState = { tournamentId: "", days: "3" };
  const dropdowns = [];

  // Lucide-style line icons (static markup, no user data).
  const ICONS = {
    calendarClock: '<path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><circle cx="16" cy="16" r="6"/><path d="M16 14v2l1 1"/>',
    alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    newspaper: '<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/>',
    userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/>',
    swords: '<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><path d="M5 14l4 4"/><path d="M7 17l-3 3"/><path d="M3 19l2 2"/>',
    fileText: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    chevronDown: '<path d="m6 9 6 6 6-6"/>',
  };

  function icon(name) {
    const node = el("span", "dash-icon");
    node.setAttribute("aria-hidden", "true");
    node.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[name] || ""}</svg>`;
    return node;
  }

  function showMessage(text) {
    contentEl.setAttribute("aria-busy", "false");
    contentEl.className = "dash-alert";
    contentEl.textContent = text;
  }

  function showLoading() {
    contentEl.setAttribute("aria-busy", "true");
    contentEl.className = "dash-skeleton";
    contentEl.innerHTML = "";
    const tiles = el("div", "dash-skeleton-tiles");
    for (let i = 0; i < 4; i += 1) tiles.appendChild(el("div", "dash-skeleton-block"));
    contentEl.appendChild(tiles);
    contentEl.appendChild(el("div", "dash-skeleton-block tall"));
  }

  // Same dropdown as the other Player Hub pages (cp-dd).
  function createDropdown(initialValue, options, onChange) {
    let value = String(initialValue ?? "");
    const root = el("div", "cp-dd");
    const btn = el("button", "cp-dd-btn");
    btn.type = "button";
    const btnContent = el("span", "cp-dd-btn-content");
    const chevron = el("span", "cp-dd-chevron");
    chevron.appendChild(icon("chevronDown"));
    btn.appendChild(btnContent);
    btn.appendChild(chevron);
    const menu = el("div", "cp-dd-menu");

    const renderButton = () => {
      const selected = options.find((option) => option.value === value) || options[0];
      btnContent.innerHTML = "";
      btnContent.appendChild(el("span", "", selected ? selected.label : ""));
      btn.title = selected ? selected.label : "";
    };
    const close = () => {
      menu.classList.remove("open");
      menu.style.maxHeight = "0px";
      btn.classList.remove("open");
    };
    const open = () => {
      menu.classList.add("open");
      menu.style.maxHeight = `${Math.min(menu.scrollHeight, 280)}px`;
      btn.classList.add("open");
    };

    options.forEach((option) => {
      const optionBtn = el("button", `cp-dd-option${option.value === value ? " active" : ""}`, option.label);
      optionBtn.type = "button";
      optionBtn.title = option.label;
      optionBtn.dataset.value = option.value;
      optionBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        close();
        if (option.value === value) return;
        value = option.value;
        menu.querySelectorAll(".cp-dd-option").forEach((node) => node.classList.toggle("active", node.dataset.value === value));
        renderButton();
        onChange(value);
      });
      menu.appendChild(optionBtn);
    });
    btn.addEventListener("click", (event) => {
      event.stopPropagation();
      const isOpen = menu.classList.contains("open");
      dropdowns.forEach((dropdown) => dropdown.close());
      if (!isOpen) open();
    });

    renderButton();
    root.appendChild(btn);
    root.appendChild(menu);
    const api = { root, close };
    dropdowns.push(api);
    return api;
  }

  document.addEventListener("click", () => dropdowns.forEach((dropdown) => dropdown.close()));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") dropdowns.forEach((dropdown) => dropdown.close());
  });

  const PLANNING_STATUS = {
    deadline_passed: { label: "Deadline passed", tone: "attention" },
    no_proposal: { label: "No time proposed", tone: "attention" },
    time_proposed: { label: "Time proposed, awaiting reply", tone: "warn" },
    change_pending: { label: "Time being renegotiated", tone: "warn" },
  };

  const PLAYER_ACTION = {
    accept_time: { label: "Accept or counter the proposed time", tone: "attention" },
    propose_time: { label: "Propose a time", tone: "attention" },
    deadline_passed: { label: "Deadline passed", tone: "attention" },
    result_error: { label: "Result check failed", tone: "attention" },
    waiting_opponent: { label: "Waiting for opponent", tone: "warn" },
    time_not_set: { label: "Captains are agreeing the time", tone: "" },
    planned: { label: "Planned", tone: "ok" },
  };

  // Block order on the page and in the counter tiles.
  const BLOCKS = [
    { key: "unplanned_duels", title: "Unplanned matches", tile: "Unplanned matches", icon: "calendarClock", render: renderUnplannedDuel },
    { key: "error_duels", title: "Matches in Error", tile: "Errors", icon: "alert", render: renderErrorDuel },
    { key: "cases", title: "Open cases", tile: "Open cases", icon: "inbox", render: renderCase },
    { key: "news_drafts", title: "News proposals in Draft", tile: "News proposals", icon: "newspaper", render: renderNewsDraft },
    { key: "new_users", title: "New users with a BGA profile", tile: "New users", icon: "userPlus", render: renderNewUser, info: true },
    { key: "my_duels", title: "My matches", tile: "My matches: action needed", icon: "swords", render: renderMyDuel, countKey: "action_count" },
    { key: "my_cases", title: "My cases", tile: "My open cases", icon: "fileText", render: renderMyCase, countKey: "active_count" },
  ];

  function readUrlState() {
    const params = new URLSearchParams(window.location.search);
    return {
      tournamentId: String(params.get("tournament_id") || "").trim(),
      days: String(params.get("days") || "").trim(),
    };
  }

  function writeUrlState(state) {
    const url = new URL(window.location.href);
    if (state.tournamentId) url.searchParams.set("tournament_id", state.tournamentId);
    else url.searchParams.delete("tournament_id");
    if (state.days) url.searchParams.set("days", state.days);
    else url.searchParams.delete("days");
    window.history.replaceState(null, "", url.toString());
  }

  function el(tag, className, textValue) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (textValue !== undefined && textValue !== null) node.textContent = String(textValue);
    return node;
  }

  function absoluteLink(link) {
    if (!link) return "";
    return /^https?:\/\//i.test(link) ? link : `${SITE_BASE}${link}`;
  }

  function formatUtc(iso) {
    const ts = Date.parse(iso || "");
    if (!Number.isFinite(ts)) return "";
    return new Intl.DateTimeFormat("en-GB", {
      weekday: "short", day: "numeric", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit", timeZone: "UTC",
    }).format(new Date(ts)) + " UTC";
  }

  // Deadlines are stored as Sunday 23:59 UTC; the tournament page shows them as Monday 00:00.
  function formatDeadline(iso) {
    let ts = Date.parse(iso || "");
    if (!Number.isFinite(ts)) return "";
    if (new Date(ts).getUTCMinutes() === 59) ts = Math.ceil((ts + 1) / 60000) * 60000;
    return formatUtc(new Date(ts).toISOString());
  }

  function formatDate(iso) {
    const ts = Date.parse(iso || "");
    if (!Number.isFinite(ts)) return "";
    return new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" })
      .format(new Date(ts));
  }

  function daysText(days) {
    if (days === null || days === undefined) return "";
    if (days < 0) return `${Math.abs(days)} day${Math.abs(days) === 1 ? "" : "s"} ago`;
    if (days === 0) return "today";
    return `in ${days} day${days === 1 ? "" : "s"}`;
  }

  function badge(info) {
    if (!info) return null;
    return el("span", `dash-badge ${info.tone || ""}`.trim(), info.label);
  }

  function linkTo(href, label = "Open") {
    if (!href) return null;
    const anchor = el("a", "dash-link", label);
    anchor.appendChild(icon("arrowRight"));
    anchor.href = absoluteLink(href);
    if (/^https?:\/\//i.test(href)) {
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
    }
    return anchor;
  }

  function duelContext(item) {
    return [item.tournament?.name, item.stage, item.round, item.group].filter(Boolean).join(" · ");
  }

  function playerName(player) {
    return player?.name || "TBD";
  }

  function contactsText(player, contacts) {
    const entries = Object.entries(contacts || {});
    if (!entries.length) return "";
    const labels = { telegram: "Telegram", whatsapp: "WhatsApp", discord: "Discord", contact_email: "Email" };
    return `${playerName(player)}: ${entries.map(([key, value]) => `${labels[key] || key} ${value}`).join(", ")}`;
  }

  function row({ title, lines = [], errorLine = "", side = [] }) {
    const node = el("div", "dash-row");
    const main = el("div", "dash-row-main");
    main.appendChild(el("div", "dash-row-title", title));
    // A line is a string, or { text, className } for a line with its own style.
    lines.filter((line) => (typeof line === "string" ? line : line?.text)).forEach((line) => {
      if (typeof line === "string") main.appendChild(el("div", "dash-row-line", line));
      else main.appendChild(el("div", `dash-row-line ${line.className || ""}`.trim(), line.text));
    });
    if (errorLine) {
      const errorEl = el("div", "dash-row-error");
      errorEl.appendChild(icon("alert"));
      errorEl.appendChild(el("span", "", errorLine));
      main.appendChild(errorEl);
    }
    const sideEl = el("div", "dash-row-side");
    side.filter(Boolean).forEach((child) => sideEl.appendChild(child));
    node.appendChild(main);
    node.appendChild(sideEl);
    return node;
  }

  function renderUnplannedDuel(item) {
    const lines = [duelContext(item)];
    if (item.deadline_utc) lines.push(`Play before ${formatDeadline(item.deadline_utc)} (${daysText(item.days_to_deadline)})`);
    if (item.proposed_time_utc && (item.planning_status === "time_proposed" || item.planning_status === "change_pending")) {
      const proposer = [item.player_1, item.player_2].find((player) => player?.id === item.proposed_by_player_id);
      lines.push(`Proposed${proposer ? ` by ${proposer.name}` : ""}: ${formatUtc(item.proposed_time_utc)}`);
    }
    if (item.planning_status === "change_pending" && item.time_utc) lines.push(`Current time: ${formatUtc(item.time_utc)}`);
    lines.push(contactsText(item.player_1, item.player_1_contacts));
    lines.push(contactsText(item.player_2, item.player_2_contacts));
    return row({
      title: `${playerName(item.player_1)} vs ${playerName(item.player_2)}`,
      lines,
      side: [badge(PLANNING_STATUS[item.planning_status]), linkTo(item.link)],
    });
  }

  function renderErrorDuel(item) {
    return row({
      title: `${playerName(item.player_1)} vs ${playerName(item.player_2)}`,
      lines: [
        duelContext(item),
        item.time_utc ? `Played ${formatUtc(item.time_utc)}` : "",
        item.checked_at ? `Last check ${formatUtc(item.checked_at)}` : "",
      ],
      errorLine: item.error || "No error message saved",
      side: [badge({ label: "Error", tone: "attention" }), linkTo(item.link)],
    });
  }

  const CASE_PRIORITY_TONE = { urgent: "attention", high: "attention", normal: "warn", low: "" };
  // Case types and categories as players see them (auth-server/src/tournament-cases.js).
  const CASE_LABELS = {
    problem: "Match problem", complaint: "Complaint", request: "Request", feedback: "Feedback", other: "Other",
    scheduling: "Scheduling the match time", not_played: "Match was not played", incomplete: "Match not finished",
    result_dispute: "Wrong match result", conduct: "Rule violation or opponent's behaviour",
    general: "Other question for admins", no_show: "No-show",
    open: "Open", in_progress: "In progress", resolved: "Resolved", closed: "Closed",
    urgent: "Urgent", high: "High", normal: "Normal", low: "Low",
  };
  const caseLabel = (value) => CASE_LABELS[value] || String(value || "").replace(/_/g, " ");
  const CASE_DETAILS_PREVIEW = 160;

  function caseTitle(item) {
    return [caseLabel(item.type), item.category ? caseLabel(item.category) : ""].filter(Boolean).join(": ") || `Case #${item.id}`;
  }

  // Each submission of the case (CASE_DETAILS_SEPARATOR on the server) on its own line, -- between them.
  function caseDetailsPreview(item) {
    const parts = String(item.details || "")
      .split(/\n--\n/)
      .map((part) => part.replace(/\s+/g, " ").trim())
      .filter(Boolean)
      .map((part) => (part.length > CASE_DETAILS_PREVIEW ? `${part.slice(0, CASE_DETAILS_PREVIEW - 1)}…` : part));
    return { text: parts.join("\n--\n"), className: "dash-case-details" };
  }

  function renderCase(item) {
    return row({
      title: caseTitle(item),
      lines: [
        [item.tournament?.name, item.submitted_by?.name ? `From ${item.submitted_by.name}` : ""].filter(Boolean).join(" · "),
        caseDetailsPreview(item),
        [
          item.created_at ? `Opened ${formatDate(item.created_at)} (${item.days_open ?? 0} d)` : "",
          `${caseLabel(item.status)}${item.responsible ? `, ${item.responsible}` : ", unassigned"}`,
        ].filter(Boolean).join(" · "),
      ],
      side: [
        badge({ label: caseLabel(item.priority), tone: CASE_PRIORITY_TONE[item.priority] ?? "" }),
        linkTo(item.link),
      ],
    });
  }

  const MY_CASE_STATUS_TONE = { open: "warn", in_progress: "warn", resolved: "ok", closed: "" };

  function renderMyCase(item) {
    const active = item.status === "open" || item.status === "in_progress";
    const lines = [
      item.tournament?.name || "",
      caseDetailsPreview(item),
      active
        ? [
          item.created_at ? `Submitted ${formatDate(item.created_at)} (${item.days_open ?? 0} d)` : "",
          item.responsible ? `Handled by ${item.responsible}` : "Waiting for an admin",
        ].filter(Boolean).join(" · ")
        : [
          item.created_at ? `Submitted ${formatDate(item.created_at)}` : "",
          item.resolved_at ? `${caseLabel(item.status)} ${formatDate(item.resolved_at)}` : "",
        ].filter(Boolean).join(" · "),
      !active && item.resolution ? `Resolution: ${item.resolution}` : "",
    ];
    return row({
      title: caseTitle(item),
      lines,
      side: [badge({ label: caseLabel(item.status), tone: MY_CASE_STATUS_TONE[item.status] ?? "" }), linkTo(item.link)],
    });
  }

  function renderNewsDraft(item) {
    return row({
      title: item.title || `News #${item.id}`,
      lines: [
        [item.author?.name ? `By ${item.author.name}` : "", item.tournament?.name].filter(Boolean).join(" · "),
        item.created_at ? `Submitted ${formatDate(item.created_at)}` : "",
      ],
      side: [
        badge({ label: `${item.days_waiting ?? 0} d waiting`, tone: (item.days_waiting ?? 0) >= 3 ? "attention" : "warn" }),
        linkTo(item.link),
      ],
    });
  }

  function renderNewUser(item) {
    const name = [item.bga_nickname, item.name && item.name !== item.bga_nickname ? `(${item.name})` : ""]
      .filter(Boolean).join(" ");
    return row({
      title: name || `User #${item.user_id}`,
      lines: [
        [item.association, item.bga_elo !== null && item.bga_elo !== undefined ? `BGA Elo ${item.bga_elo}` : ""]
          .filter(Boolean).join(" · "),
        item.created_at ? `Registered ${formatDate(item.created_at)}` : "",
      ],
      side: [linkTo(item.link, "Profile")],
    });
  }

  function renderMyDuel(item) {
    const lines = [duelContext(item)];
    if (item.time_utc) lines.push(`Time: ${formatUtc(item.time_utc)}`);
    if (item.proposed_time_utc && (item.action === "accept_time" || item.action === "waiting_opponent")) {
      lines.push(`Proposed time: ${formatUtc(item.proposed_time_utc)}`);
    }
    if (item.deadline_utc) lines.push(`Play before ${formatDeadline(item.deadline_utc)}`);
    return row({
      title: `vs ${playerName(item.opponent)}`,
      lines,
      side: [badge(PLAYER_ACTION[item.action]), linkTo(item.link)],
    });
  }

  function blockCount(block, config) {
    return Number(block?.[config.countKey || "count"] || 0);
  }

  function blockMeta(block, config) {
    if (config.key === "new_users") return `${block.count} in the last ${block.days || 7} days`;
    if (config.key === "my_duels") return `${block.action_count} need action · ${block.count} active`;
    if (config.key === "my_cases") return `${block.active_count} open · ${block.count} total`;
    return `${block.count}`;
  }

  function renderSection(config, block, data) {
    const section = el("section", "dash-section");
    section.id = `dash-${config.key}`;
    const count = Number(block?.count || 0);
    if (!count) section.classList.add("is-empty");

    const head = el("div", "dash-section-head");
    const heading = el("div", "dash-section-heading");
    const headingIcon = el("span", "dash-section-icon");
    headingIcon.appendChild(icon(config.icon));
    heading.appendChild(headingIcon);
    heading.appendChild(el("h2", "dash-section-title", config.title));
    head.appendChild(heading);
    const meta = el("div", "dash-section-meta");
    if (!count) meta.appendChild(icon("check"));
    meta.appendChild(el("span", "", count ? blockMeta(block, config) : "Nothing here"));
    head.appendChild(meta);
    section.appendChild(head);

    if (config.key === "cases") {
      section.appendChild(el(
        "div",
        "dash-section-note",
        data.filters?.tournament_id
          ? "Cases of the selected tournament."
          : data.roles?.global_admin
            ? "Cases of all tournaments, most urgent and oldest first."
            : "Cases of the tournaments you manage, most urgent and oldest first."
      ));
    }
    if (config.key === "my_cases") {
      section.appendChild(el("div", "dash-section-note", "Cases you submitted in all tournaments, open ones first."));
    }
    if (config.key === "unplanned_duels") {
      section.appendChild(el(
        "div",
        "dash-section-note",
        `Matches with a stage deadline (CCL) due within ${data.filters?.days_before_deadline ?? 3} days or already overdue. Team tournament matches are not included yet.`
      ));
    }
    if (!count) return section;

    const rows = el("div", "dash-rows");
    (block.items || []).forEach((item) => rows.appendChild(config.render(item)));
    section.appendChild(rows);
    if (count > (block.items || []).length) {
      section.appendChild(el("div", "dash-more", `Showing ${(block.items || []).length} of ${count}.`));
    }
    return section;
  }

  function renderTiles(data, visibleBlocks) {
    const tiles = el("div", "dash-tiles");
    visibleBlocks.forEach((config) => {
      const block = data.blocks[config.key];
      const count = blockCount(block, config);
      const tone = !count ? "is-clear" : config.info ? "tone-info" : "tone-attention";
      const tile = el("button", `dash-tile ${tone}`);
      tile.type = "button";
      tile.setAttribute("aria-label", `${config.tile}: ${count}. Go to section`);
      const tileIcon = el("span", "dash-tile-icon");
      tileIcon.appendChild(icon(count ? config.icon : "check"));
      const body = el("span", "dash-tile-body");
      body.appendChild(el("span", "dash-tile-count", count));
      body.appendChild(el("span", "dash-tile-label", config.tile));
      tile.appendChild(tileIcon);
      tile.appendChild(body);
      tile.addEventListener("click", () => {
        document.getElementById(`dash-${config.key}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      tiles.appendChild(tile);
    });
    return tiles;
  }

  function renderFilters(data) {
    if (!data.roles?.tournament_admin) {
      filtersEl.hidden = true;
      return;
    }
    filtersEl.hidden = false;
    filterState.tournamentId = data.filters?.tournament_id || "";
    filterState.days = String(data.filters?.days_before_deadline ?? 3);
    const tournamentOptions = [{ value: "", label: "All my tournaments" }]
      .concat((data.tournaments || []).map((tournament) => ({ value: tournament.id, label: tournament.name })));
    const dayOptions = DAY_OPTIONS.some((option) => option.value === filterState.days)
      ? DAY_OPTIONS
      : DAY_OPTIONS.concat({ value: filterState.days, label: `${filterState.days} days` });

    dropdowns.length = 0;
    tournamentSlot.innerHTML = "";
    daysSlot.innerHTML = "";
    tournamentSlot.appendChild(createDropdown(filterState.tournamentId, tournamentOptions, (value) => {
      filterState.tournamentId = value;
      onFilterChange();
    }).root);
    daysSlot.appendChild(createDropdown(filterState.days, dayOptions, (value) => {
      filterState.days = value;
      onFilterChange();
    }).root);
  }

  function renderDashboard(data) {
    renderFilters(data);
    const visibleBlocks = BLOCKS.filter((config) => data.blocks?.[config.key]);
    if (!visibleBlocks.length) {
      showMessage("Nothing to show yet. Link your BGA profile to see your matches here.");
      return;
    }
    contentEl.setAttribute("aria-busy", "false");
    contentEl.className = "";
    contentEl.innerHTML = "";
    const wrap = el("div", "dash-wrap");
    wrap.style.margin = "0";
    wrap.appendChild(renderTiles(data, visibleBlocks));
    visibleBlocks.forEach((config) => wrap.appendChild(renderSection(config, data.blocks[config.key], data)));
    contentEl.appendChild(wrap);
  }

  async function load() {
    const state = readUrlState();
    const url = new URL(DASHBOARD_URL);
    if (state.tournamentId) url.searchParams.set("tournament_id", state.tournamentId);
    if (state.days) url.searchParams.set("days_before_deadline", state.days);
    try {
      const response = await fetch(url.toString(), { method: "GET", credentials: "include" });
      if (response.status === 401) {
        showMessage("Please sign in to view your dashboard.");
        return;
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data?.ok) throw new Error(data?.message || "Failed to load dashboard");
      renderDashboard(data);
    } catch (_error) {
      showMessage("Failed to load the dashboard. Please refresh the page.");
    }
  }

  function onFilterChange() {
    writeUrlState({ tournamentId: filterState.tournamentId, days: filterState.days === "3" ? "" : filterState.days });
    showLoading();
    load();
  }

  window.addEventListener("gg-auth-state-change", load);

  showLoading();
  load();
})();
</script>
