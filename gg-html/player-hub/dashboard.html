<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* Design: "Flat Design" from the ui-ux-pro-max skill, in the Player Hub palette:
     solid fills, no shadows or gradients, small radii, color/opacity hover only. */
  :root {
    --dash-text: #1f2937;
    --dash-muted: #5b6576;
    --dash-faint: #8a94a3;
    --dash-border: #e3e8ef;
    --dash-border-strong: #c9d1dc;
    --dash-card: #fff;
    --dash-soft: #f4f6f9;
    --dash-primary: #1a73b7;
    --dash-primary-hover: #155d94;
    --dash-primary-soft: #e8f1fa;
    --dash-attention: #b4232f;
    --dash-attention-hover: #961c27;
    --dash-attention-bg: #fdecee;
    --dash-warn: #8a5a00;
    --dash-ok: #2d6a3e;
    --dash-neutral-bg: #eef1f5;
    --dash-radius: 6px;
    --dash-ease: 160ms ease;
    /* A tile click scrolls its section below the site menu (45px) with a 16px gap. */
    --dash-scroll-offset: 61px;
  }

  body {
    margin: 0;
    font-family: "Montserrat", sans-serif;
    color: var(--dash-text);
  }

  .dash-wrap {
    display: grid;
    gap: 16px;
    margin: 0 8px 16px;
  }

  .dash-icon {
    display: inline-flex;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .dash-icon svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- Header and filters ---------- */

  .dash-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 16px;
  }

  .dash-title {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.2;
  }

  .dash-subtitle {
    font-size: 14px;
    color: var(--dash-muted);
    margin-top: 4px;
  }

  .dash-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .dash-filters[hidden] {
    display: none;
  }

  .dash-filter {
    display: grid;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--dash-muted);
  }

  .dash-filter.tournament {
    width: 240px;
  }


  .cp-dd {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    width: 100%;
  }

  .cp-dd-btn {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    height: 36px;
    border: 0;
    border-radius: 4px;
    background: var(--dash-neutral-bg);
    color: var(--dash-text);
    font-size: 14px;
    font-weight: 500;
    padding: 4px 10px;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    transition: background-color var(--dash-ease);
  }

  .cp-dd-btn:hover,
  .cp-dd-btn.open {
    background: #e2e7ee;
  }

  .cp-dd-btn:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  .cp-dd-btn-content {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cp-dd-btn-content span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cp-dd-chevron {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    color: var(--dash-muted);
    transition: transform var(--dash-ease);
  }

  .cp-dd-btn.open .cp-dd-chevron {
    transform: rotate(180deg);
  }

  .cp-dd-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 4px);
    min-width: 100%;
    width: max-content;
    max-width: min(320px, calc(100vw - 32px));
    max-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    background: #fff;
    border: 1px solid var(--dash-border-strong);
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, max-height 0.16s ease;
    z-index: 20;
  }

  .cp-dd-menu.open {
    opacity: 1;
    pointer-events: auto;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .cp-dd-option {
    all: unset;
    box-sizing: border-box;
    padding: 8px 10px;
    display: block;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--dash-text);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }

  .cp-dd-option:hover,
  .cp-dd-option:focus-visible {
    background: var(--dash-soft);
  }

  .cp-dd-option.active {
    background: var(--dash-primary);
    color: #fff;
    font-weight: 600;
  }

  /* ---------- Messages and loading ---------- */

  .dash-alert {
    background: var(--dash-soft);
    border-radius: var(--dash-radius);
    padding: 16px;
    font-size: 14px;
    color: var(--dash-muted);
  }

  .dash-skeleton {
    display: grid;
    gap: 16px;
  }

  .dash-skeleton-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }

  .dash-skeleton-block {
    height: 84px;
    border-radius: var(--dash-radius);
    background: var(--dash-neutral-bg);
    animation: dash-pulse 1.2s ease-in-out infinite alternate;
  }

  .dash-skeleton-block.tall {
    height: 180px;
  }

  @keyframes dash-pulse {
    from { opacity: 1; }
    to { opacity: 0.5; }
  }

  /* ---------- Counter tiles ---------- */

  .dash-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }

  .dash-tile {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 4px 8px;
    padding: 14px;
    border: 0;
    border-radius: var(--dash-radius);
    background: var(--dash-neutral-bg);
    color: var(--dash-muted);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color var(--dash-ease);
  }

  .dash-tile:hover {
    background: #e2e7ee;
  }

  .dash-tile:focus-visible {
    outline: 2px solid var(--dash-text);
    outline-offset: 2px;
  }

  /* The tile whose filter the list below shows; a second click removes the filter. */
  .dash-tile.is-active {
    outline: 3px solid var(--dash-text);
    outline-offset: 2px;
  }

  .dash-tile-icon {
    grid-column: 2;
    grid-row: 1;
    display: inline-flex;
    opacity: 0.8;
  }

  .dash-tile-body {
    grid-column: 1;
    grid-row: 1;
    display: grid;
    gap: 4px;
    min-width: 0;
  }

  .dash-tile-count {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--dash-text);
  }

  .dash-tile-label {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
  }

  .dash-tile.is-clear .dash-tile-count {
    color: var(--dash-faint);
  }

  .dash-tile.tone-attention {
    background: var(--dash-attention);
    color: #fff;
  }

  .dash-tile.tone-attention:hover {
    background: var(--dash-attention-hover);
  }

  /* News proposals: a medium emerald green; white text keeps 4.5:1 contrast. */
  .dash-tile.tone-ok {
    background: #0a8259;
    color: #fff;
  }

  .dash-tile.tone-ok:hover {
    background: #097550;
  }

  .dash-tile.tone-ok .dash-tile-count {
    color: #fff;
  }

  /* New users: light blue, saturated enough to stand out on the site's light grey background. */
  .dash-tile.tone-info {
    background: #bfdbf7;
    color: #0f4c81;
  }

  .dash-tile.tone-info:hover {
    background: #a9cdf2;
  }

  .dash-tile.tone-info .dash-tile-count {
    color: #0f4c81;
  }

  /* Time proposed: the colors of the Time proposed badge (dash-status-badge is-warn). */
  .dash-tile.tone-warn-soft {
    background: #fff8e1;
    color: #5c4300;
  }

  .dash-tile.tone-warn-soft:hover {
    background: #fdefc4;
  }

  /* No time proposed: a deeper shade of the Deadline passed badge, to stand out on the site background. */
  .dash-tile.tone-attention-soft {
    background: #fbd0d0;
    color: #a51f15;
  }

  .dash-tile.tone-attention-soft:hover {
    background: #f8bcbc;
  }

  .dash-tile.tone-warn-soft .dash-tile-count {
    color: #5c4300;
  }

  .dash-tile.tone-attention-soft .dash-tile-count {
    color: #a51f15;
  }

  .dash-tile.tone-attention .dash-tile-count {
    color: #fff;
  }

  /* ---------- Sections ---------- */

  .dash-section {
    background: var(--dash-card);
    border: 1px solid var(--dash-border);
    border-radius: var(--dash-radius);
    scroll-margin-top: var(--dash-scroll-offset);
    transition: opacity var(--dash-ease);
  }

  .dash-section.is-loading {
    opacity: 0.55;
    pointer-events: none;
  }

  .dash-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    background: var(--dash-soft);
    border-radius: calc(var(--dash-radius) - 1px) calc(var(--dash-radius) - 1px) 0 0;
  }

  .dash-section-head:last-child {
    border-radius: calc(var(--dash-radius) - 1px);
  }

  .dash-section-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .dash-section-icon {
    display: inline-flex;
    color: var(--dash-primary);
  }

  .dash-section.is-empty .dash-section-icon {
    color: var(--dash-faint);
  }

  .dash-section-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.25;
  }

  .dash-section.is-empty .dash-section-title {
    color: var(--dash-muted);
  }

  .dash-section-meta {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--dash-muted);
    white-space: nowrap;
  }

  .dash-section-meta .dash-icon {
    width: 14px;
    height: 14px;
  }

  .dash-section.is-empty .dash-section-meta {
    color: var(--dash-ok);
  }

  .dash-section-note {
    padding: 10px 16px 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--dash-muted);
  }

  .dash-section.is-empty .dash-section-note {
    padding-bottom: 12px;
  }

  .dash-rows {
    display: grid;
    padding: 4px 0;
  }

  .dash-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px 16px;
    padding: 12px 16px;
    border-top: 1px solid var(--dash-border);
  }

  .dash-row:first-child {
    border-top: 0;
  }

  .dash-row-main {
    display: grid;
    gap: 4px;
    min-width: 0;
  }

  .dash-row-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .dash-row-line {
    font-size: 13px;
    line-height: 1.45;
    color: var(--dash-muted);
    overflow-wrap: anywhere;
  }

  /* Texts of repeated submissions of one case, one per line with -- between them. */
  .dash-row-line.dash-case-details {
    white-space: pre-line;
    color: var(--dash-text);
  }

  .dash-row-side {
    display: grid;
    justify-items: end;
    align-content: start;
    gap: 8px;
  }

  .dash-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
    background: var(--dash-neutral-bg);
    color: #3d4757;
  }

  .dash-badge.attention { background: var(--dash-attention); color: #fff; }
  .dash-badge.warn { background: var(--dash-warn); color: #fff; }
  .dash-badge.ok { background: var(--dash-ok); color: #fff; }

  /* Same as the View button of the tournaments page (cp-edit-btn cp-edit-btn-view). */
  .dash-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    background: #f3f4f6;
    color: #2f3947;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: border-color var(--dash-ease);
  }

  .dash-link:hover {
    border-color: #9ea7b3;
  }

  .dash-link:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .dash-link-danger {
    color: var(--dash-attention);
  }

  .dash-row-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
  }

  .dash-link:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  /* ---------- Unplanned matches: the match list of team-official-matches.html ---------- */

  .dash-om {
    scroll-margin-top: var(--dash-scroll-offset);
    transition: opacity var(--dash-ease);
  }

  .dash-om.is-loading {
    opacity: 0.55;
    pointer-events: none;
  }

  /* .section-title */
  .dash-om-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 0 0 10px;
    padding: 0 8px;
    font-size: 17px;
    font-weight: 700;
    color: #222;
  }

  .dash-om-count {
    font-size: 13px;
    font-weight: 600;
    color: #555;
  }

  /* .tournament-card; no overflow: hidden, so the filter menus are not cut off. */
  .dash-om-card {
    background: #fff;
    border-radius: 4px;
    box-shadow: 1.4142px 1.4142px 2px 0 #b2b2b2;
  }

  /* .results-controls */
  .dash-om-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 6px 8px;
    background: #f7f8fa;
    border-bottom: 1px solid #ccc;
  }

  .dash-om-controls:first-child {
    border-radius: 4px 4px 0 0;
  }

  /* The paging row under the rows. */
  .dash-om-controls.is-bottom {
    border-top: 1px solid #ccc;
    border-bottom: none;
    border-radius: 0 0 4px 4px;
  }

  /* Per page and the list's own filters, left of the paging buttons. */
  .dash-om-controls-left {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
  }

  /* .results-pagesize: a label with a small dropdown, used for Per page and the filters. */
  .dash-picker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #555;
  }

  .dash-picker-holder {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    min-width: 58px;
  }

  .dash-picker-btn {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    min-height: 24px;
    padding: 4px 7px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    background: #fff;
    color: #2f3947;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
  }

  .dash-picker-btn:hover,
  .dash-picker-btn.open {
    border-color: #9ea7b3;
  }

  .dash-picker-btn:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  .dash-picker-btn .dash-icon {
    width: 12px;
    height: 12px;
    color: #6f7785;
    transition: transform var(--dash-ease);
  }

  .dash-picker-btn.open .dash-icon {
    transform: rotate(180deg);
  }

  .dash-picker-menu {
    position: absolute;
    left: 0;
    top: calc(100% + 4px);
    min-width: 100%;
    width: max-content;
    max-width: calc(100vw - 32px);
    max-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    border: 1px solid #d5dbe4;
    border-radius: 4px;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, max-height 0.16s ease;
    z-index: 20;
  }

  .dash-picker-menu.open {
    opacity: 1;
    pointer-events: auto;
  }

  .dash-picker-option {
    all: unset;
    box-sizing: border-box;
    padding: 5px 8px;
    border-top: 1px solid #edf1f6;
    font-size: 12px;
    line-height: 1.2;
    color: #2f3947;
    white-space: nowrap;
    cursor: pointer;
  }

  .dash-picker-option:first-child {
    border-top: none;
  }

  .dash-picker-option:hover,
  .dash-picker-option:focus-visible {
    background: #f5f5f5;
  }

  .dash-picker-option.active {
    background: #e4f0fb;
  }

  /* .results-pagination */
  .dash-pagination {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .dash-pagebtn {
    font: inherit;
    font-size: 12px;
    color: #333;
    background: #fff;
    border: 1px solid #cfcfcf;
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
  }

  .dash-pagebtn:disabled {
    opacity: 0.45;
    cursor: default;
  }

  .dash-pagebtn:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  .dash-pageinfo {
    min-width: 72px;
    font-size: 12px;
    color: #555;
    text-align: center;
  }

  /* .match-row */
  .dash-om-row {
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 4px 8px;
    box-sizing: border-box;
    border-top: 1px solid #ccc;
  }

  .dash-om-controls + .dash-om-row,
  .dash-om-card > .dash-om-row:first-child {
    border-top: none;
  }

  .dash-om-row.is-empty {
    justify-content: center;
    color: #666;
    font-size: 13px;
  }

  .dash-om-time {
    width: 46px;
    min-width: 46px;
    font-size: 12px;
    line-height: 14px;
    font-weight: 700;
    color: #333;
    text-align: center;
    white-space: pre-line;
  }

  .dash-om-divider {
    width: 2px;
    margin: 0 6px;
    align-self: stretch;
    border-radius: 1px;
    background: #dfdfdf;
  }

  .dash-om-logo {
    min-width: 34px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dash-om-logo img {
    display: block;
    width: auto;
    height: 25px;
    object-fit: contain;
  }

  .dash-om-players {
    flex-grow: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-size: 13px;
    line-height: 1.2;
  }

  .dash-om-player {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 16px;
  }

  .dash-om-flag {
    width: 20px;
    height: 20px;
    object-fit: contain;
    flex: 0 0 auto;
  }

  .dash-om-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: inherit;
    text-decoration: none;
  }

  /* .duel-player-row a */
  a.dash-om-name:hover {
    color: #0277BD;
  }

  a.dash-om-name:focus-visible {
    outline: 2px solid var(--dash-primary);
    outline-offset: 2px;
  }

  /* Marks the player who sent the time proposal. */
  .dash-om-proposer {
    display: inline-flex;
    flex: 0 0 auto;
    color: var(--dash-primary);
  }

  .dash-om-proposer .dash-icon {
    width: 15px;
    height: 15px;
  }

  /* A player without a site user (Unplanned matches). */
  .dash-om-nouser {
    display: inline-flex;
    flex: 0 0 auto;
    color: #d92d20;
  }

  .dash-om-nouser .dash-icon {
    width: 16px;
    height: 16px;
  }

  .dash-om-meta {
    margin-top: 2px;
    font-size: 11px;
    color: #667286;
    overflow-wrap: anywhere;
  }

  .dash-om-meta.is-overdue {
    font-weight: 600;
    color: #b42318;
  }

  /* .match-right */
  .dash-om-right {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
    margin-left: 8px;
  }

  /* Status badge of the tournaments page (cp-status-badge). */
  .dash-status-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 20px;
    padding: 0 8px;
    border: 1px solid #d5dbe4;
    border-radius: 999px;
    background: #f3f4f6;
    color: #475467;
    font-size: 11px;

  function icon(name) {

  function showMessage(text) {

  }

  function showLoading() {
    contentEl.setAttribute("aria-busy", "true");
    contentEl.className = "dash-skeleton";
    contentEl.innerHTML = "";
    const tiles = el("div", "dash-skeleton-tiles");
    for (let i = 0; i < 4; i += 1) tiles.appendChild(el("div", "dash-skeleton-block"));
    contentEl.appendChild(tiles);
    contentEl.appendChild(el("div", "dash-skeleton-block tall"));

  // Same dropdown as the other Player Hub pages (cp-dd).
  function createDropdown(initialValue, options, onChange) {
    let value = String(initialValue ?? "");
    const root = el("div", "cp-dd");
    const btn = el("button", "cp-dd-btn");
    btn.type = "button";
    const btnContent = el("span", "cp-dd-btn-content");
    const chevron = el("span", "cp-dd-chevron");
    chevron.appendChild(icon("chevronDown"));
    btn.appendChild(btnContent);
    btn.appendChild(chevron);
    const menu = el("div", "cp-dd-menu");

    const renderButton = () => {
      const selected = options.find((option) => option.value === value) || options[0];
      btnContent.innerHTML = "";
      btnContent.appendChild(el("span", "", selected ? selected.label : ""));
      btn.title = selected ? selected.label : "";
    };
    const close = () => {
      menu.classList.remove("open");
      menu.style.maxHeight = "0px";
      btn.classList.remove("open");
    };
    const open = () => {
      menu.classList.add("open");
      menu.style.maxHeight = `${Math.min(menu.scrollHeight, 280)}px`;
      btn.classList.add("open");
    };

    options.forEach((option) => {
      const optionBtn = el("button", `cp-dd-option${option.value === value ? " active" : ""}`, option.label);
      optionBtn.type = "button";
      optionBtn.title = option.label;
      optionBtn.dataset.value = option.value;
      optionBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        close();
        if (option.value === value) return;
        value = option.value;
        menu.querySelectorAll(".cp-dd-option").forEach((node) => node.classList.toggle("active", node.dataset.value === value));
        renderButton();
        onChange(value);
      });
      menu.appendChild(optionBtn);
    });
    btn.addEventListener("click", (event) => {
      event.stopPropagation();
      const isOpen = menu.classList.contains("open");
      dropdowns.forEach((dropdown) => dropdown.close());
      if (!isOpen) open();
    });

    renderButton();
    root.appendChild(btn);
    root.appendChild(menu);
    const api = { root, close };
    dropdowns.push(api);
    return api;
  }

  document.addEventListener("click", () => dropdowns.forEach((dropdown) => dropdown.close()));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") dropdowns.forEach((dropdown) => dropdown.close());
  });

  // In the order of the Status filter (PLANNING_STATUSES on the server).
  const PLANNING_STATUS = {
    deadline_passed: { label: "Deadline passed", tone: "attention" },
    no_proposal: { label: "No time proposed", tone: "attention" },
    time_proposed: { label: "Time proposed", tone: "warn" },
    change_pending: { label: "Time being renegotiated", tone: "warn" },
  };
  const PLAYER_PROFILE_URL = "https://carcassonne.gg/player/?id=";

  const PLAYER_ACTION = {
    accept_time: { label: "Accept or counter the proposed time", tone: "attention" },
    propose_time: { label: "Propose a time", tone: "attention" },
    deadline_passed: { label: "Deadline passed", tone: "attention" },
    result_error: { label: "Result check failed", tone: "attention" },
    waiting_opponent: { label: "Waiting for opponent", tone: "warn" },
    time_not_set: { label: "Captains are agreeing the time", tone: "" },
    planned: { label: "Planned", tone: "ok" },
  };

  // Block order on the page and in the counter tiles.
  const BLOCKS = [
    { key: "unplanned_duels", title: "Unplanned matches", tile: "Unplanned matches", icon: "calendarClock", render: renderUnplannedDuel },
    { key: "error_duels", title: "Matches in Error", tile: "Errors", icon: "alert", render: renderErrorDuel },
    { key: "cases", title: "Open cases", tile: "Open cases", icon: "inbox", render: renderCase },
    { key: "news_drafts", title: "News proposals in Draft", tile: "News proposals", icon: "newspaper", render: renderNewsDraft, tone: "tone-ok" },
    { key: "new_users", title: "New users", tile: "New users", icon: "userPlus", render: renderNewUser, info: true },
    { key: "my_duels", title: "My matches", tile: "My matches: action needed", icon: "swords", render: renderMyDuel, countKey: "action_count" },
    { key: "my_cases", title: "My cases", tile: "My open cases", icon: "fileText", render: renderMyCase, countKey: "active_count" },
  ];

  function readUrlState() {
    const params = new URLSearchParams(window.location.search);
    return {
      tournamentId: String(params.get("tournament_id") || "").trim(),
      status: String(params.get("status") || "").trim(),
      proposed: String(params.get("proposed_time") || "").trim(),
      page: String(params.get("page") || "").trim(),
      pageSize: String(params.get("per_page") || "").trim(),
      usersPage: String(params.get("users_page") || "").trim(),
      usersPageSize: String(params.get("users_per_page") || "").trim(),
      errorsPage: String(params.get("errors_page") || "").trim(),
      errorsPageSize: String(params.get("errors_per_page") || "").trim(),
    };
  }

  function writeUrlState(state) {
    const url = new URL(window.location.href);
    const setParam = (name, value) => {
      if (value) url.searchParams.set(name, value);
      else url.searchParams.delete(name);
    };
    setParam("tournament_id", state.tournamentId);
    url.searchParams.delete("days");
    setParam("status", state.status);
    setParam("proposed_time", state.proposed);
    setParam("page", Number(state.page) > 1 ? String(state.page) : "");
    setParam("per_page", Number(state.pageSize) !== DEFAULT_PAGE_SIZE ? String(state.pageSize) : "");
    setParam("users_page", Number(state.usersPage) > 1 ? String(state.usersPage) : "");
    setParam("users_per_page", Number(state.usersPageSize) !== DEFAULT_PAGE_SIZE ? String(state.usersPageSize) : "");
    setParam("errors_page", Number(state.errorsPage) > 1 ? String(state.errorsPage) : "");
    setParam("errors_per_page", Number(state.errorsPageSize) !== DEFAULT_PAGE_SIZE ? String(state.errorsPageSize) : "");
    window.history.replaceState(null, "", url.toString());
  }

  function el(tag, className, textValue) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (textValue !== undefined && textValue !== null) node.textContent = String(textValue);
    return node;
  }

  function absoluteLink(link) {
    if (!link) return "";
    return /^https?:\/\//i.test(link) ? link : `${SITE_BASE}${link}`;
  }

  function formatUtc(iso) {
    const ts = Date.parse(iso || "");
    if (!Number.isFinite(ts)) return "";
    return new Intl.DateTimeFormat("en-GB", {
      weekday: "short", day: "numeric", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit", timeZone: "UTC",
    }).format(new Date(ts)) + " UTC";
  }

  // Deadlines are stored as Sunday 23:59 UTC; the tournament page shows them as Monday 00:00.
  function formatDeadline(iso) {
    let ts = Date.parse(iso || "");
    if (!Number.isFinite(ts)) return "";
    if (new Date(ts).getUTCMinutes() === 59) ts = Math.ceil((ts + 1) / 60000) * 60000;
    return formatUtc(new Date(ts).toISOString());
  }

  function formatDate(iso) {
    const ts = Date.parse(iso || "");
    if (!Number.isFinite(ts)) return "";
    return new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" })
      .format(new Date(ts));
  }


  function badge(info) {
    if (!info) return null;
    return el("span", `dash-badge ${info.tone || ""}`.trim(), info.label);
  }

  function linkTo(href, label = "View") {
    if (!href) return null;
    const anchor = el("a", "dash-link", label);
    anchor.href = absoluteLink(href);
    if (/^https?:\/\//i.test(href)) {
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
    }
    return anchor;
  }

  function duelContext(item) {
    return [item.tournament?.name, item.stage, item.round, item.group].filter(Boolean).join(" · ");
  }

  function playerName(player) {
    return player?.name || "TBD";
  }


  function row({ title, lines = [], side = [] }) {
    const node = el("div", "dash-row");
    const main = el("div", "dash-row-main");
    main.appendChild(el("div", "dash-row-title", title));
    // A line is a string, or { text, className } for a line with its own style.
    lines.filter((line) => (typeof line === "string" ? line : line?.text)).forEach((line) => {
      if (typeof line === "string") main.appendChild(el("div", "dash-row-line", line));
      else main.appendChild(el("div", `dash-row-line ${line.className || ""}`.trim(), line.text));
    });
    const sideEl = el("div", "dash-row-side");
    side.filter(Boolean).forEach((child) => sideEl.appendChild(child));
    node.appendChild(main);
    node.appendChild(sideEl);
    return node;
  }

  // Time column of team-official-matches.html: "25 Nov" and "18:00" on two lines, in the viewer's time.
  function formatMatchTime(iso) {
    const date = new Date(iso || "");
    if (!Number.isFinite(date.getTime())) return "";
    const month = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][date.getMonth()];
    const pad = (value) => String(value).padStart(2, "0");
    return [
      `${pad(date.getDate())} ${month}`,
      date.getFullYear() !== new Date().getFullYear() ? String(date.getFullYear()) : "",
      `${pad(date.getHours())}:${pad(date.getMinutes())}`,
    ].filter(Boolean).join("\n");
  }

  const plural = (count, word) => `${count} ${word}${count === 1 ? "" : "s"}`;

  // "4 days 5 hours", "1 day", "5 hours", "45 minutes": minutes only when less than an hour is left.
  function durationText(ms) {
    const totalMinutes = Math.max(0, Math.floor(ms / 60000));
    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    if (days) return [plural(days, "day"), hours ? plural(hours, "hour") : ""].filter(Boolean).join(" ");
    if (hours) return plural(hours, "hour");
    return plural(totalMinutes, "minute");
  }

  // Time left until the stage deadline (shown as Monday 00:00, see formatDeadline).
  function deadlineText(item) {
    let ts = Date.parse(item.deadline_utc || "");
    if (!Number.isFinite(ts)) return "";
    if (new Date(ts).getUTCMinutes() === 59) ts = Math.ceil((ts + 1) / 60000) * 60000;
    const left = ts - Date.now();
    return left > 0 ? `Time to play: ${durationText(left)}` : `Deadline passed ${durationText(-left)} ago`;
  }

  function hasActiveProposal(item) {
    return (item.proposed_time_status === "pending" || item.proposed_time_status === "change_pending")
      && Number.isFinite(Date.parse(item.proposed_time_utc || ""));
  }

  // "Match in: 6 hours" for the proposed time; a proposed time that has passed is shown in red.
  function proposedTimeLine(item) {
    if (!hasActiveProposal(item)) return null;
    const left = Date.parse(item.proposed_time_utc) - Date.now();
    return left > 0
      ? el("div", "dash-om-meta", `Match in: ${durationText(left)}`)
      : el("div", "dash-om-meta is-overdue", `Proposed time passed ${durationText(-left)} ago`);
  }

  // Flag, name with a link to the player's profile, a clock icon for the player who proposed the time,
  // and a crossed-out user icon for a player without a site user.
  function matchPlayerLine(player, isProposer) {
    const line = el("div", "dash-om-player");
    if (player?.association_flag) {
      const flag = el("img", "dash-om-flag");
      flag.src = player.association_flag;
      flag.alt = "";
      line.appendChild(flag);
    }
    const name = el(player?.id ? "a" : "span", "dash-om-name", playerName(player));
    if (player?.id) name.href = `${PLAYER_PROFILE_URL}${encodeURIComponent(player.id)}`;
    line.appendChild(name);
    if (isProposer) {
      const mark = el("span", "dash-om-proposer");
      mark.title = "Proposed the match time";
      mark.setAttribute("role", "img");
      mark.setAttribute("aria-label", "Proposed the match time");
      mark.appendChild(icon("clock"));
      line.appendChild(mark);
    }
    // `has_user` comes with Unplanned matches only; false: the player has no user on the site.
    if (player?.has_user === false) {
      const mark = el("span", "dash-om-nouser");
      mark.title = "No user on the site";
      mark.setAttribute("role", "img");
      mark.setAttribute("aria-label", "No user on the site");
      mark.appendChild(icon("userX"));
      line.appendChild(mark);
    }
    return line;
  }

  // A row of team-official-matches.html: time | tournament logo | players | status and View.
  function renderUnplannedDuel(item) {
    const row = el("div", "dash-om-row");
    // The time column shows the proposed time, or nothing while no time is proposed.
    row.appendChild(el("div", "dash-om-time", hasActiveProposal(item) ? formatMatchTime(item.proposed_time_utc) : ""));
    row.appendChild(el("div", "dash-om-divider"));
    const logo = el("div", "dash-om-logo");
    if (item.tournament?.logo) {
      const img = el("img");
      img.src = item.tournament.logo;
      img.alt = item.tournament.name || "";
      img.title = item.tournament.name || "";
      logo.appendChild(img);
    }
    row.appendChild(logo);
    row.appendChild(el("div", "dash-om-divider"));

    const proposerId = hasActiveProposal(item) ? item.proposed_by_player_id : null;
    const players = el("div", "dash-om-players");
    players.appendChild(matchPlayerLine(item.player_1, !!proposerId && item.player_1?.id === proposerId));
    players.appendChild(matchPlayerLine(item.player_2, !!proposerId && item.player_2?.id === proposerId));
    const deadline = deadlineText(item);
    if (deadline) players.appendChild(el("div", "dash-om-meta", deadline));
    const proposedTime = proposedTimeLine(item);
    if (proposedTime) players.appendChild(proposedTime);
    row.appendChild(players);

    const right = el("div", "dash-om-right");
    const status = PLANNING_STATUS[item.planning_status];
    if (status) right.appendChild(el("span", `dash-status-badge${status.tone ? ` is-${status.tone}` : ""}`, status.label));
    const view = linkTo(item.link);
    if (view) right.appendChild(view);
    row.appendChild(right);
    return row;
  }

  // "Label: [value ▾]", the Per page dropdown of team-official-matches.html. Option values are strings.
  function createPicker(label, value, options, onChange) {
    const wrap = el("div", "dash-picker", `${label}:`);
    const holder = el("div", "dash-picker-holder");
    const selected = options.find((option) => option.value === value) || options[0];
    const btn = el("button", "dash-picker-btn");
    btn.type = "button";
    btn.setAttribute("aria-label", `${label}: ${selected.label}`);
    btn.setAttribute("aria-expanded", "false");
    btn.appendChild(el("span", "", selected.label));
    btn.appendChild(icon("chevronDown"));
    const menu = el("div", "dash-picker-menu");
    const close = () => {
      menu.classList.remove("open");
      menu.style.maxHeight = "0px";
      btn.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
    };
    options.forEach((option) => {
      const optionBtn = el("button", `dash-picker-option${option.value === selected.value ? " active" : ""}`, option.label);
      optionBtn.type = "button";
      optionBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        close();
        // Against `value`: a value missing from the options (Already passed) shows the first one.
        if (option.value !== value) onChange(option.value);
      });
      menu.appendChild(optionBtn);
    });
    btn.addEventListener("click", (event) => {
      event.stopPropagation();
      const isOpen = menu.classList.contains("open");
      dropdowns.forEach((dropdown) => dropdown.close());
      if (isOpen) return;
      menu.classList.add("open");
      menu.style.maxHeight = `${Math.min(menu.scrollHeight, 280)}px`;
      btn.classList.add("open");
      btn.setAttribute("aria-expanded", "true");
    });
    dropdowns.push({ close });
    holder.append(btn, menu);
    wrap.appendChild(holder);
    return wrap;
  }

  // Per page, `extra` controls (the list's filters) and Prev / Page N of M / Next (.results-controls),
  // above the rows of a list, or under them with `bottom`.
  function renderPager(block, { pageSize, onPageSize, onPage, extra = [], bottom = false }) {
    const totalPages = Math.max(1, Number(block?.total_pages) || 1);
    const page = Math.min(Math.max(1, Number(block?.page) || 1), totalPages);
    const bar = el("div", `dash-om-controls${bottom ? " is-bottom" : ""}`);
    const sizeOptions = PAGE_SIZE_OPTIONS.map((size) => ({ value: String(size), label: String(size) }));
    const left = el("div", "dash-om-controls-left");
    left.appendChild(createPicker("Per page", String(pageSize), sizeOptions, (value) => onPageSize(Number(value))));
    extra.filter(Boolean).forEach((control) => left.appendChild(control));
    bar.appendChild(left);

    const pagination = el("div", "dash-pagination");
    const prev = el("button", "dash-pagebtn", "Prev");
    prev.type = "button";
    prev.disabled = page <= 1;
    prev.addEventListener("click", () => onPage(page - 1));
    const next = el("button", "dash-pagebtn", "Next");
    next.type = "button";
    next.disabled = page >= totalPages;
    next.addEventListener("click", () => onPage(page + 1));
    pagination.append(prev, el("span", "dash-pageinfo", `Page ${page} of ${totalPages}`), next);
    bar.appendChild(pagination);
    return bar;
  }

  // Title with the count, then a card with the paging row and the rows (team-official-matches.html);
  // the paging row goes above the rows unless it was made with `bottom`.
  function renderListSection(key, titleText, block, { rows = [], emptyText, pager }) {
    const section = el("section", "dash-om");
    section.id = `dash-${key}`;
    const title = el("h2", "dash-om-title");
    title.appendChild(el("span", "", titleText));
    title.appendChild(el("span", "dash-om-count", Number(block?.count || 0)));
    section.appendChild(title);
    const card = el("div", "dash-om-card");
    const pagerOnTop = !pager.classList.contains("is-bottom");
    if (pagerOnTop) card.appendChild(pager);
    if (rows.length) rows.forEach((rowEl) => card.appendChild(rowEl));
    else card.appendChild(el("div", "dash-om-row is-empty", emptyText));
    if (!pagerOnTop) card.appendChild(pager);
    section.appendChild(card);
    return section;
  }

  // Proposed time, in the style of Per page. Status is set by the counter tiles.
  function renderProposedTimePicker() {
    return createPicker("Proposed time", filterState.proposed, PROPOSED_TIME_OPTIONS, (value) => {
      filterState.proposed = value;
      onFilterChange("unplanned_duels");
    });
  }

  function renderUnplannedSection(config, block) {
    const filtered = filterState.status || filterState.proposed;
    return renderListSection(config.key, config.title, block, {
      rows: Number(block?.count || 0) ? (block.items || []).map(renderUnplannedDuel) : [],
      emptyText: filtered ? "No matches match these filters." : "No unplanned matches.",
      pager: renderPager(block, {
        extra: [renderProposedTimePicker()],
        pageSize: filterState.pageSize,
        onPageSize: (size) => {
          filterState.pageSize = size;
          onFilterChange(config.key);
        },
        onPage: (page) => {
          filterState.page = page;
          onFilterChange(config.key, { keepPage: true });
        },
      }),
    });
  }

  // "Registered 4 days 4 hours ago", in the style of Time to play.
  function registeredText(iso) {
    const ts = Date.parse(iso || "");
    if (!Number.isFinite(ts)) return "";
    const ago = Date.now() - ts;
    return ago < 60000 ? "Registered just now" : `Registered ${durationText(ago)} ago`;
  }

  // Flag and nickname with a link to the player's profile, then when the user registered.
  function renderNewUser(item) {
    const rowEl = el("div", "dash-om-row");
    const info = el("div", "dash-om-players");
    const line = el("div", "dash-om-player");
    if (item.association_flag) {
      const flag = el("img", "dash-om-flag");
      flag.src = item.association_flag;
      flag.alt = item.association || "";
      flag.title = item.association || "";
      line.appendChild(flag);
    }
    const name = el(item.link ? "a" : "span", "dash-om-name", item.bga_nickname || item.name || `User #${item.user_id}`);
    if (item.link) name.href = absoluteLink(item.link);
    line.appendChild(name);
    info.appendChild(line);
    const registered = registeredText(item.created_at);
    if (registered) info.appendChild(el("div", "dash-om-meta", registered));
    rowEl.appendChild(info);
    return rowEl;
  }

  function renderNewUsersSection(config, block) {
    return renderListSection(config.key, `New users in the last ${block?.days || 7} days`, block, {
      rows: Number(block?.count || 0) ? (block.items || []).map(renderNewUser) : [],
      emptyText: "No new users.",
      pager: renderPager(block, {
        bottom: true,
        pageSize: filterState.usersPageSize,
        onPageSize: (size) => {
          filterState.usersPageSize = size;
          filterState.usersPage = 1;
          onFilterChange(config.key, { keepPage: true });
        },
        onPage: (page) => {
          filterState.usersPage = page;
          onFilterChange(config.key, { keepPage: true });
        },
      }),
    });
  }

  // "Last check 2 hours ago", in the style of Time to play.
  function lastCheckText(iso) {
    const ts = Date.parse(iso || "");
    if (!Number.isFinite(ts)) return "";
    const ago = Date.now() - ts;
    return ago < 60000 ? "Last check just now" : `Last check ${durationText(ago)} ago`;
  }

  // A row in the style of Unplanned matches: match time | tournament logo | players, last check, error | Error and View.
  function renderErrorDuel(item) {
    const rowEl = el("div", "dash-om-row");
    rowEl.appendChild(el("div", "dash-om-time", formatMatchTime(item.time_utc)));
    rowEl.appendChild(el("div", "dash-om-divider"));
    const logo = el("div", "dash-om-logo");
    if (item.tournament?.logo) {
      const img = el("img");
      img.src = item.tournament.logo;
      img.alt = item.tournament.name || "";
      img.title = item.tournament.name || "";
      logo.appendChild(img);
    }
    rowEl.appendChild(logo);
    rowEl.appendChild(el("div", "dash-om-divider"));

    const players = el("div", "dash-om-players");
    players.appendChild(matchPlayerLine(item.player_1, false));
    players.appendChild(matchPlayerLine(item.player_2, false));
    const lastCheck = lastCheckText(item.checked_at);
    if (lastCheck) players.appendChild(el("div", "dash-om-meta", lastCheck));
    players.appendChild(el("div", "dash-om-meta is-overdue", item.error || "No error message saved"));
    rowEl.appendChild(players);

    const right = el("div", "dash-om-right");
    right.appendChild(el("span", "dash-status-badge is-attention", "Error"));
    const view = linkTo(item.link);
    if (view) right.appendChild(view);
    rowEl.appendChild(right);
    return rowEl;
  }

  function renderErrorSection(config, block) {
    return renderListSection(config.key, config.title, block, {
      rows: Number(block?.count || 0) ? (block.items || []).map(renderErrorDuel) : [],
      emptyText: "No matches in Error.",
      pager: renderPager(block, {
        pageSize: filterState.errorsPageSize,
        onPageSize: (size) => {
          filterState.errorsPageSize = size;
          filterState.errorsPage = 1;
          onFilterChange(config.key, { keepPage: true });
        },
        onPage: (page) => {
          filterState.errorsPage = page;
          onFilterChange(config.key, { keepPage: true });
        },
      }),
    });
  }

  const CASE_PRIORITY_TONE = { urgent: "attention", high: "attention", normal: "warn", low: "" };
  // Case types and categories as players see them (auth-server/src/tournament-cases.js).
  const CASE_LABELS = {
    problem: "Match problem", complaint: "Complaint", request: "Request", feedback: "Feedback", other: "Other",
    scheduling: "Scheduling the match time", not_played: "Match was not played", incomplete: "Match not finished",
    result_dispute: "Wrong match result", conduct: "Rule violation or opponent's behaviour",
    general: "Other question for admins", no_show: "No-show",
    open: "Open", in_progress: "In progress", resolved: "Resolved", closed: "Closed",
    urgent: "Urgent", high: "High", normal: "Normal", low: "Low",
  };
  const caseLabel = (value) => CASE_LABELS[value] || String(value || "").replace(/_/g, " ");
  const CASE_DETAILS_PREVIEW = 160;

  function caseTitle(item) {
    return [caseLabel(item.type), item.category ? caseLabel(item.category) : ""].filter(Boolean).join(": ") || `Case #${item.id}`;
  }

  // Each submission of the case (CASE_DETAILS_SEPARATOR on the server) on its own line, -- between them.
  function caseDetailsPreview(item) {
    const parts = String(item.details || "")
      .split(/\n--\n/)
      .map((part) => part.replace(/\s+/g, " ").trim())
      .filter(Boolean)
      .map((part) => (part.length > CASE_DETAILS_PREVIEW ? `${part.slice(0, CASE_DETAILS_PREVIEW - 1)}…` : part));
    return { text: parts.join("\n--\n"), className: "dash-case-details" };
  }

  function renderCase(item) {
    return row({
      title: caseTitle(item),
      lines: [
        [item.tournament?.name, item.submitted_by?.name ? `From ${item.submitted_by.name}` : ""].filter(Boolean).join(" · "),
        caseDetailsPreview(item),
        [
          item.created_at ? `Opened ${formatDate(item.created_at)} (${item.days_open ?? 0} d)` : "",
          `${caseLabel(item.status)}${item.responsible ? `, ${item.responsible}` : ", unassigned"}`,
        ].filter(Boolean).join(" · "),
      ],
      side: [
        badge({ label: caseLabel(item.priority), tone: CASE_PRIORITY_TONE[item.priority] ?? "" }),
        caseActions(item),
      ],
    });
  }

  // View, Close (status = closed) and Delete (soft delete) of an open case; the list reloads after a change.
  function caseActions(item) {
    const wrap = el("div", "dash-row-actions");
    const view = linkTo(item.link);
    if (view) wrap.appendChild(view);
    const action = (label, className, confirmText, method, path, failText) => {
      const btn = el("button", className, label);
      btn.type = "button";
      btn.addEventListener("click", async () => {
        if (!window.confirm(confirmText)) return;
        wrap.querySelectorAll("button").forEach((node) => { node.disabled = true; });
        try {
          const response = await fetch(`${AUTH_BASE}${path}`, {
            method, credentials: "include", headers: { "Content-Type": "application/json" }, body: "{}",
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data?.ok) throw new Error(data?.message || failText);
          load();
        } catch (error) {
          wrap.querySelectorAll("button").forEach((node) => { node.disabled = false; });
          window.alert(error?.message || failText);
        }
      });
      return btn;
    };
    const name = caseTitle(item);
    wrap.appendChild(action("Close", "dash-link", `Close the case "${name}"?`, "POST",
      `/tournament-cases/${encodeURIComponent(item.id)}/close`, "Failed to close the case"));
    wrap.appendChild(action("Delete", "dash-link dash-link-danger", `Delete the case "${name}"?`, "DELETE",
      `/tournament-cases/${encodeURIComponent(item.id)}`, "Failed to delete the case"));
    return wrap;
  }

  const MY_CASE_STATUS_TONE = { open: "warn", in_progress: "warn", resolved: "ok", closed: "" };

  function renderMyCase(item) {
    const active = item.status === "open" || item.status === "in_progress";
    const lines = [
      item.tournament?.name || "",
      caseDetailsPreview(item),
      active
        ? [
          item.created_at ? `Submitted ${formatDate(item.created_at)} (${item.days_open ?? 0} d)` : "",
          item.responsible ? `Handled by ${item.responsible}` : "Waiting for an admin",
        ].filter(Boolean).join(" · ")
        : [
          item.created_at ? `Submitted ${formatDate(item.created_at)}` : "",
          item.resolved_at ? `${caseLabel(item.status)} ${formatDate(item.resolved_at)}` : "",
        ].filter(Boolean).join(" · "),
      !active && item.resolution ? `Resolution: ${item.resolution}` : "",
    ];
    return row({
      title: caseTitle(item),
      lines,
      side: [badge({ label: caseLabel(item.status), tone: MY_CASE_STATUS_TONE[item.status] ?? "" }), linkTo(item.link)],
    });
  }

  function renderNewsDraft(item) {
    return row({
      title: item.title || `News #${item.id}`,
      lines: [
        [item.author?.name ? `By ${item.author.name}` : "", item.tournament?.name].filter(Boolean).join(" · "),
        item.created_at ? `Submitted ${formatDate(item.created_at)}` : "",
      ],
      side: [
        badge({ label: `${item.days_waiting ?? 0} d waiting`, tone: (item.days_waiting ?? 0) >= 3 ? "attention" : "warn" }),
        linkTo(item.link),
      ],
    });
  }


  function renderMyDuel(item) {
    const lines = [duelContext(item)];
    if (item.time_utc) lines.push(`Time: ${formatUtc(item.time_utc)}`);
    if (item.proposed_time_utc && (item.action === "accept_time" || item.action === "waiting_opponent")) {
      lines.push(`Proposed time: ${formatUtc(item.proposed_time_utc)}`);
    }
    if (item.deadline_utc) lines.push(`Play before ${formatDeadline(item.deadline_utc)}`);
    return row({
      title: `vs ${playerName(item.opponent)}`,
      lines,
      side: [badge(PLAYER_ACTION[item.action]), linkTo(item.link)],
    });
  }

  function blockCount(block, config) {
    return Number(block?.[config.countKey || "count"] || 0);
  }

  function blockMeta(block, config) {
    if (config.key === "my_duels") return `${block.action_count} need action · ${block.count} active`;
    if (config.key === "my_cases") return `${block.active_count} open · ${block.count} total`;
    return `${block.count}`;
  }

  function renderSection(config, block, data) {
    const section = el("section", "dash-section");
    section.id = `dash-${config.key}`;
    const count = Number(block?.count || 0);
    if (!count) section.classList.add("is-empty");

    const head = el("div", "dash-section-head");
    const heading = el("div", "dash-section-heading");
    const headingIcon = el("span", "dash-section-icon");
    headingIcon.appendChild(icon(config.icon));
    heading.appendChild(headingIcon);
    heading.appendChild(el("h2", "dash-section-title", config.title));
    head.appendChild(heading);
    const meta = el("div", "dash-section-meta");
    if (!count) meta.appendChild(icon("check"));
    meta.appendChild(el("span", "", count ? blockMeta(block, config) : "Nothing here"));
    head.appendChild(meta);
    section.appendChild(head);

    if (config.key === "cases") {
      section.appendChild(el(
        "div",
        "dash-section-note",
        data.filters?.tournament_id
          ? "Cases of the selected tournament."
          : data.roles?.global_admin
            ? "Cases of all tournaments, most urgent and oldest first."
            : "Cases of the tournaments you manage, most urgent and oldest first."
      ));
    }
    if (config.key === "my_cases") {
      section.appendChild(el("div", "dash-section-note", "Cases you submitted in all tournaments, open ones first."));
    }
    if (!count) return section;

    const rows = el("div", "dash-rows");
    (block.items || []).forEach((item) => rows.appendChild(config.render(item)));
    section.appendChild(rows);
    if (count > (block.items || []).length) {
      section.appendChild(el("div", "dash-more", `Showing ${(block.items || []).length} of ${count}.`));
    }
    return section;
  }

  // `active`: undefined for a tile without a filter, else whether its filter is on (aria-pressed).
  function createTile({ label, count, iconName, tone, onClick, active }) {
    const tile = el("button", `dash-tile ${count ? tone : "is-clear"}${active ? " is-active" : ""}`);
    tile.type = "button";
    tile.setAttribute("aria-label", active === undefined ? `${label}: ${count}. Go to section` : `${label}: ${count}. Filter the list`);
    if (active !== undefined) tile.setAttribute("aria-pressed", active ? "true" : "false");
    const tileIcon = el("span", "dash-tile-icon");
    tileIcon.appendChild(icon(count ? iconName : "check"));
    const body = el("span", "dash-tile-body");
    body.appendChild(el("span", "dash-tile-count", count));
    body.appendChild(el("span", "dash-tile-label", label));
    tile.appendChild(tileIcon);
    tile.appendChild(body);
    tile.addEventListener("click", onClick);
    return tile;
  }

  const scrollToSection = (key) => {
    document.getElementById(`dash-${key}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // Unplanned matches has four tiles; each one sets the Status and Proposed time filters of the list.
  // Their counts (metrics on the server) do not depend on those filters.
  // Tile counts of an API without `metrics` (not restarted yet), by tournament and days, so they
  // do not change with the Status and Proposed time filters.
  const unplannedMetricsCache = new Map();

  // The tile counts never depend on the Status and Proposed time filters. The server sends them as
  // `metrics`; without them they come from `status_counts`, which ignore the Status filter.
  function unplannedMetrics(block) {
    if (block?.metrics) return block.metrics;
    const key = `${filterState.tournamentId}|${filterState.days}`;
    const cached = unplannedMetricsCache.get(key) || {};
    const counts = block?.status_counts || {};
    const sum = Object.values(counts).reduce((total, value) => total + Number(value || 0), 0);
    if (!filterState.proposed) {
      Object.assign(cached, {
        total: sum, deadline_passed: counts.deadline_passed, no_proposal: counts.no_proposal, time_proposed: counts.time_proposed,
      });
    } else if (filterState.proposed === "passed") {
      cached.proposed_time_passed = sum;
    }
    unplannedMetricsCache.set(key, cached);
    return cached;
  }

  function unplannedTiles(block) {
    const metrics = unplannedMetrics(block);
    // These tiles only filter the list; the page does not scroll (the other tiles scroll to their section).
    const apply = (status, proposed) => {
      if (filterState.status === status && filterState.proposed === proposed) return;
      filterState.status = status;
      filterState.proposed = proposed;
      onFilterChange("unplanned_duels");
    };
    // A status tile keeps a Proposed time dropdown value; the tiles' own filters exclude each other.
    const keptProposed = filterState.proposed === "passed" ? "" : filterState.proposed;
    const statusTile = (status) => ({
      active: filterState.status === status,
      onClick: () => apply(filterState.status === status ? "" : status, keptProposed),
    });
    const passedActive = filterState.proposed === "passed";
    return [
      { label: "Deadline passed", count: metrics.deadline_passed, iconName: "alert", tone: "tone-attention", ...statusTile("deadline_passed") },
      { label: "No time proposed", count: metrics.no_proposal, iconName: "calendarClock", tone: "tone-attention-soft", ...statusTile("no_proposal") },
      { label: "Time proposed", count: metrics.time_proposed, iconName: "clock", tone: "tone-warn-soft", ...statusTile("time_proposed") },
      {
        label: "Proposed time passed", count: metrics.proposed_time_passed, iconName: "clock", tone: "tone-attention",
        active: passedActive, onClick: () => apply("", passedActive ? "" : "passed"),
      },
    ].map((tile) => createTile({ ...tile, count: Number(tile.count || 0) }));
  }

  function renderTiles(data, visibleBlocks) {
    const tiles = el("div", "dash-tiles");
    visibleBlocks.forEach((config) => {
      const block = data.blocks[config.key];
      if (config.key === "unplanned_duels") {
        unplannedTiles(block).forEach((tile) => tiles.appendChild(tile));
        return;
      }
      tiles.appendChild(createTile({
        label: config.tile,
        count: blockCount(block, config),
        iconName: config.icon,
        tone: config.tone || (config.info ? "tone-info" : "tone-attention"),
        onClick: () => scrollToSection(config.key),
      }));
    });
    return tiles;
  }

  function renderFilters(data) {
    if (!data.roles?.tournament_admin) {
      filtersEl.hidden = true;
      return;
    }
    filtersEl.hidden = false;
    filterState.tournamentId = data.filters?.tournament_id || "";
    filterState.days = String(data.filters?.days_before_deadline ?? DEFAULT_DAYS);
    filterState.status = data.filters?.planning_status || "";
    filterState.proposed = data.filters?.proposed_time || "";
    const tournamentOptions = [{ value: "", label: "All my tournaments" }]
      .concat((data.tournaments || []).map((tournament) => ({ value: tournament.id, label: tournament.name })));

    tournamentSlot.innerHTML = "";
    tournamentSlot.appendChild(createDropdown(filterState.tournamentId, tournamentOptions, (value) => {
      filterState.tournamentId = value;
      filterState.errorsPage = 1;
      onFilterChange();
    }).root);
  }

  function renderDashboard(data) {
    // The header and section dropdowns are created again on every render.
    dropdowns.length = 0;
    // Paging as the server applied it (it moves a page past the end back to the last page).
    const pageSizeOf = (block) => (PAGE_SIZE_OPTIONS.includes(Number(block?.page_size)) ? Number(block.page_size) : DEFAULT_PAGE_SIZE);
    filterState.page = Number(data.blocks?.unplanned_duels?.page) || 1;
    filterState.pageSize = pageSizeOf(data.blocks?.unplanned_duels);
    filterState.usersPage = Number(data.blocks?.new_users?.page) || 1;
    filterState.usersPageSize = pageSizeOf(data.blocks?.new_users);
    filterState.errorsPage = Number(data.blocks?.error_duels?.page) || 1;
    filterState.errorsPageSize = pageSizeOf(data.blocks?.error_duels);
    renderFilters(data);
    const visibleBlocks = BLOCKS.filter((config) => data.blocks?.[config.key]);
    if (!visibleBlocks.length) {
      showMessage("Nothing to show yet. Link your BGA profile to see your matches here.");
      return;
    }
    contentEl.setAttribute("aria-busy", "false");
    contentEl.className = "";
    contentEl.innerHTML = "";
    const wrap = el("div", "dash-wrap");
    wrap.style.margin = "0";
    wrap.appendChild(renderTiles(data, visibleBlocks));
    visibleBlocks.forEach((config) => {
      const block = data.blocks[config.key];
      const special = {
        unplanned_duels: renderUnplannedSection, error_duels: renderErrorSection, new_users: renderNewUsersSection,
      }[config.key];
      wrap.appendChild(special ? special(config, block) : renderSection(config, block, data));
    });
    contentEl.appendChild(wrap);
  }

  async function load() {
    // Only the latest request renders: filters may change before an earlier response arrives.
    const seq = ++loadSeq;
    const state = readUrlState();
    const url = new URL(DASHBOARD_URL);
    if (state.tournamentId) url.searchParams.set("tournament_id", state.tournamentId);
    if (state.status) url.searchParams.set("planning_status", state.status);
    if (state.proposed) url.searchParams.set("proposed_time", state.proposed);
    if (state.page) url.searchParams.set("unplanned_page", state.page);
    if (state.pageSize) url.searchParams.set("unplanned_page_size", state.pageSize);
    if (state.usersPage) url.searchParams.set("new_users_page", state.usersPage);
    if (state.usersPageSize) url.searchParams.set("new_users_page_size", state.usersPageSize);
    if (state.errorsPage) url.searchParams.set("error_page", state.errorsPage);
    if (state.errorsPageSize) url.searchParams.set("error_page_size", state.errorsPageSize);
    try {
      const response = await fetch(url.toString(), { method: "GET", credentials: "include" });
      if (seq !== loadSeq) return;
      if (response.status === 401) {
        showMessage("Please sign in to view your dashboard.");
        return;
      }
      const data = await response.json().catch(() => ({}));
      if (seq !== loadSeq) return;
      if (!response.ok || !data?.ok) throw new Error(data?.message || "Failed to load dashboard");
      renderDashboard(data);
    } catch (_error) {
      if (seq === loadSeq) showMessage("Failed to load the dashboard. Please refresh the page.");
    }
  }

  // `sectionKey`: a filter of that section changed; the page stays and only the section dims while loading.
  // A filter change starts Unplanned matches from its first page; paging itself passes `keepPage`.
  function onFilterChange(sectionKey = "", { keepPage = false } = {}) {
    if (!keepPage) filterState.page = 1;
    writeUrlState(filterState);
    const section = sectionKey ? document.getElementById(`dash-${sectionKey}`) : null;
    if (section) section.classList.add("is-loading");
    else showLoading();
    load();
  }

  window.addEventListener("gg-auth-state-change", load);

  showLoading();
  load();
})();
</script>
