<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- СТИЛІ -->
<style>
  :root {
    --main-bg-color: #15375c;
    --hover-bg-color: #0e2c4d;
    --line: #dce3ec;
    --soft: #f5f7fa;
    --muted: #5b6b7c;
    --ok-bg: #ecfdf5;
    --ok-ink: #065f46;
    --warn-bg: #fffbeb;
    --warn-ink: #92400e;
    --bad-bg: #fef2f2;
    --bad-ink: #991b1b;
  }

  .ff-wrap {
    font-family: 'Montserrat', sans-serif;
    color: #16202a;
    max-width: 1100px;
    margin: 0 auto;
    padding: 4px 2px 24px;
    display: grid;
    gap: 14px;
    font-size: 14px;
    line-height: 1.45;
  }

  .ff-wrap * { box-sizing: border-box; }

  .ff-head {
    background: var(--main-bg-color);
    color: #fff;
    border-radius: 6px;
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
  }

  .ff-head h2 { margin: 0; font-size: 18px; }
  .ff-head p { margin: 4px 0 0; color: #cbd5e1; font-size: 13px; }

  .ff-clock {
    background: var(--hover-bg-color);
    border-radius: 6px;
    padding: 8px 12px;
    min-width: 200px;
  }

  .ff-clock-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #9fb3c8; }
  .ff-clock-value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .ff-note {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 14px;
    background: var(--soft);
  }

  .ff-note.ok { background: var(--ok-bg); color: var(--ok-ink); border-color: #a7f3d0; }
  .ff-note.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: #fde68a; }
  .ff-note.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: #fecaca; }
  .ff-note strong { font-weight: 700; }
  .ff-note .ff-btn { margin-top: 8px; }

  .ff-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    align-items: start;
  }

  .ff-panel {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
    background: #fff;
  }

  .ff-panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .ff-panel-head h3 { margin: 0; font-size: 16px; }

  .ff-badge {
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }

  .ff-badge.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .ff-badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .ff-badge.bad { background: var(--bad-bg); color: var(--bad-ink); }
  .ff-badge.info { background: #e0ebf7; color: var(--main-bg-color); }

  .ff-field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }

  .ff-input {
    width: 100%;
    height: 34px;
    padding: 0 10px;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    font: inherit;
    font-size: 14px;
    background: #fff;
  }

  .ff-input:disabled { background: var(--soft); color: #444; }

  .ff-metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin: 12px 0;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--soft);
    font-size: 12px;
    color: var(--muted);
  }

  .ff-metrics strong { display: block; font-size: 15px; color: #16202a; font-variant-numeric: tabular-nums; }
  .ff-metrics .over strong { color: var(--bad-ink); }
  .ff-info { position: relative; display: inline-block; color: #9aa1ab; font-size: 11px; cursor: help; outline: none; }
  .ff-info:hover, .ff-info:focus-visible { color: var(--main-bg-color); }
  .ff-info::after {
    content: attr(data-tip);
    position: absolute;
    right: -6px;
    bottom: calc(100% + 6px);
    width: max-content;
    max-width: 220px;
    padding: 6px 8px;
    border-radius: 4px;
    background: #16202a;
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.35;
    white-space: normal;
    box-shadow: 0 6px 14px rgba(15, 28, 48, 0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
    z-index: 30;
  }
  .ff-info:hover::after, .ff-info:focus::after { opacity: 1; }
  @media (max-width: 480px) { .ff-metrics { grid-template-columns: repeat(2, 1fr); } }

  .ff-slot {
    display: grid;
    grid-template-columns: 22px 1fr auto 30px;
    gap: 8px;
    align-items: center;
    min-height: 38px;
    padding: 4px 6px;
    border: 1px dashed #c8ced8;
    border-radius: 4px;
    margin-bottom: 6px;
  }

  .ff-slot.filled { border-style: solid; background: #fff; }
  .ff-slot-no { color: var(--muted); font-size: 12px; text-align: center; }
  .ff-slot-empty { color: #9aa1ab; font-size: 13px; }
  .ff-slot-price { font-weight: 700; font-variant-numeric: tabular-nums; }

  .ff-player { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .ff-player-name { font-weight: 600; overflow-wrap: anywhere; }
  .ff-flag { width: 20px; height: 14px; object-fit: cover; border: 1px solid #e5e7eb; flex: none; }
  .ff-tag { font-size: 11px; color: var(--muted); }
  .ff-tag.out { color: var(--bad-ink); font-weight: 600; }

  .ff-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 34px;
    padding: 0 14px;
    border: 1px solid var(--main-bg-color);
    border-radius: 4px;
    background: var(--main-bg-color);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }

  .ff-btn:hover:not(:disabled) { background: var(--hover-bg-color); }
  .ff-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .ff-btn.light { background: #fff; color: var(--main-bg-color); }
  .ff-btn.light:hover:not(:disabled) { background: var(--soft); }
  .ff-btn.commit { background: #065f46; border-color: #065f46; }
  .ff-btn.commit:hover:not(:disabled) { background: #054c38; }
  .ff-btn.small { height: 28px; padding: 0 10px; font-size: 13px; }
  .ff-btn.icon { width: 28px; height: 28px; padding: 0; background: #fff; color: var(--muted); border-color: #c8ced8; }
  .ff-btn.icon:hover:not(:disabled) { background: var(--bad-bg); color: var(--bad-ink); }

  .ff-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .ff-btn.ff-delete { margin-left: auto; color: var(--bad-ink); border-color: #fecaca; }
  .ff-btn.ff-delete:hover:not(:disabled) { background: var(--bad-bg); }
  .ff-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .ff-message { font-size: 13px; margin-top: 8px; }
  .ff-deactivated {
    display: grid;
    gap: 4px;
    margin-bottom: 12px;
    padding: 10px 12px;
    border: 1px solid #fecaca;
    border-radius: 6px;
    background: var(--bad-bg);
    color: var(--bad-ink);
    font-size: 13px;
  }
  .ff-message.bad { color: var(--bad-ink); }
  .ff-message.ok { color: var(--ok-ink); }

  .ff-filters {
    display: grid;
    grid-template-columns: 1.4fr repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
  }

  /* Our dropdown (cp-dd on player-hub/tournaments.html) in place of native selects. */
  .ff-dd { position: relative; display: inline-flex; flex-direction: column; width: 100%; }
  .ff-dd-btn {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    height: 34px;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    background: #fff;
    color: #2f3947;
    font-size: 14px;
    padding: 4px 10px;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
  }
  .ff-dd-btn:hover, .ff-dd-btn:focus-visible, .ff-dd-btn.open { border-color: #9ea7b3; }
  .ff-dd-btn-content { display: inline-flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
  .ff-dd-btn-content span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ff-dd-flag { width: 16px; height: 11px; border-radius: 2px; object-fit: cover; flex-shrink: 0; }
  .ff-dd-chevron { color: #6f7785; font-size: 10px; transition: transform 0.18s ease; }
  .ff-dd-btn.open .ff-dd-chevron { transform: rotate(180deg); }
  .ff-dd-menu {
    position: absolute;
    left: 0;
    top: calc(100% + 4px);
    min-width: 100%;
    width: max-content;
    max-width: 320px;
    max-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid #d5dbe4;
    border-radius: 4px;
    box-shadow: 0 8px 18px rgba(15, 28, 48, 0.14);
    opacity: 0;
    pointer-events: none;
    transform: translateY(4px);
    transition: opacity 0.16s ease, transform 0.16s ease, max-height 0.16s ease;
    z-index: 20;
  }
  .ff-dd-menu.open { opacity: 1; pointer-events: auto; transform: translateY(0); overflow-y: auto; overflow-x: hidden; }
  .ff-dd-search { padding: 6px 8px; border-bottom: 1px solid #edf1f6; background: #fff; }
  .ff-dd-search input {
    width: 100%;
    height: 28px;
    border: 1px solid #c8ced8;
    border-radius: 4px;
    padding: 4px 8px;
    font: inherit;
    font-size: 13px;
    box-sizing: border-box;
  }
  .ff-dd-option {
    all: unset;
    box-sizing: border-box;
    padding: 6px 10px;
    border-top: 1px solid #edf1f6;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #2f3947;
    line-height: 1.2;
    white-space: nowrap;
    cursor: pointer;
  }
  .ff-dd-option:first-child { border-top: none; }
  .ff-dd-option:hover { background: #f5f5f5; }
  .ff-dd-option.active { background: #e4f0fb; }

  /* Sortable column headers: Player A→Z ↔ Z→A; Price, Pts and Picked high→low ↔ low→high. Default: Price high→low. */
  .ff-sort {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: inherit;
    font-weight: 600;
  }
  .ff-sort:hover, .ff-sort:focus-visible { color: var(--main-bg-color); }
  .ff-sort .ff-sort-arrow { font-size: 10px; color: #9aa1ab; }
  .ff-sort.active .ff-sort-arrow { color: var(--main-bg-color); }

  /* Add / Remove in the player list: text on wide screens, an icon on mobile. */
  .ff-pick-icon { display: none; }

  /* [Next match]: a small outline button next to the player. */
  .ff-next-btn {
    all: unset;
    box-sizing: border-box;
    height: 20px;
    padding: 0 6px;
    border: 1px solid #c8ced8;
    border-radius: 3px;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    line-height: 18px;
    white-space: nowrap;
    cursor: pointer;
  }
  .ff-next-btn:hover, .ff-next-btn:focus-visible { border-color: var(--main-bg-color); color: var(--main-bg-color); }

  /* Match details popup (same as in matches.html) */
  /* Copied from CCL-2027-qualifications.html; this page's body has no font of its own. */
  .challenge-match-modal-overlay { font-family: 'Montserrat', sans-serif; }
  .challenge-match-modal-overlay {
    position: fixed;
    inset: 44px 0 0;
    z-index: 10002; /* above the fullscreen bracket overlay */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(24, 31, 41, 0.42);
    box-sizing: border-box;
  }

  .challenge-match-modal {
    position: relative;
    width: min(100%, 760px);
    max-height: min(620px, calc(100vh - 44px - 32px));
    overflow: auto;
    border: 1px solid #d8dee8;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 16px 36px rgba(15, 28, 48, 0.22);
    padding: 22px 24px;
    box-sizing: border-box;
  }

  /* BGA profile link under the player's country, as on player-card.html */
  .challenge-match-player__bga-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size: 12px;
    color: #1a73b7;
    text-decoration: none;
    line-height: 1.2;
  }
  .challenge-match-player__bga-link:hover {
    color: #165e93;
    text-decoration: underline;
  }
  .challenge-match-player__bga-link img {
    width: 14px;
    height: 14px;
    object-fit: contain;
  }

  .challenge-match-modal__close {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: #667080;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }

  .challenge-match-modal__close:hover,
  .challenge-match-modal__close:focus-visible {
    background: #f1f3f6;
    color: #172232;
    outline: none;
  }

  .challenge-match-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 24px;
    padding: 22px 6px 0px;
  }

  .challenge-match-player {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .challenge-match-player--right {
    align-items: flex-end;
    text-align: right;
  }

  .challenge-match-player__rating {
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    color: #172232;
    font-size: 14px;
    font-weight: 400;
  }

  .challenge-match-player__rank,
  .challenge-match-player__rating-value {
    font-weight: 700;
  }

  .challenge-match-player__ratings {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .challenge-match-player__rating-line {
    display: inline-flex;
    gap: 4px;
  }

  .challenge-match-player__profile {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .challenge-match-player--right .challenge-match-player__profile {
    flex-direction: row-reverse;
  }

  .challenge-match-player__info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    color: #333;
    font-size: 14px;
    line-height: 1.25;
  }

  .challenge-match-player--right .challenge-match-player__info {
    align-items: flex-end;
  }

  .challenge-match-player__avatar {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    border-radius: 6px;
    background: #f2f2f2;
    object-fit: cover;
  }

  .challenge-match-player__avatar-fallback {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #718096;
    font-size: 18px;
    font-weight: 700;
  }

  .challenge-match-player__nickname {
    min-width: 0;
    overflow: hidden;
    color: #172232;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .challenge-match-player__nickname:hover,
  .challenge-match-player__nickname:focus-visible {
    color: #0277BD;
    outline: none;
  }

  .challenge-match-player__flag {
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    object-fit: contain;
  }

  .challenge-match-player__country-row {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
    font-size: 13px;
  }

  .challenge-match-player__name,
  .challenge-match-player__country {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .challenge-match-result {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    padding: 14px 12px 4px;
    border-top: 1px solid #d8dee8;
  }

  .challenge-match-result__status {
    padding: 3px 8px;
    border-radius: 3px;
    background: #d7eaff;
    color: #073654;
    font-size: 11px;
    line-height: 1.2;
    font-weight: 700;
  }

  .challenge-match-result__status--completed {
    background: #d5ead5;
    color: #2b6f2b;
  }

  .challenge-match-result__score {
    color: #172232;
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
  }

  .challenge-match-result__games {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .challenge-match-result__games-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .challenge-match-result__games-source-icon {
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
    border-radius: 2px;
    object-fit: contain;
  }

  .challenge-match-result__games-links {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .challenge-match-result__game {
    display: inline-flex;
    padding: 3px 7px;
    border-radius: 3px;
    background: #e7e7e7;
    color: #333;
    font-size: 12px;
    line-height: 1.2;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.18s ease, color 0.18s ease;
  }

  .challenge-match-result__game--player-1 {
    background: #f6dada;
    color: #7a2525;
  }

  .challenge-match-result__game--player-2 {
    background: #d7eaff;
    color: #073654;
  }

  .challenge-match-result__game--clock {
    align-items: center;
    gap: 3px;
    background: #f3e4c4;
    color: #8c6418;
  }

  .challenge-match-result__game-clock {
    font-size: 10px;
    line-height: 1;
  }

  a.challenge-match-result__game:hover,
  a.challenge-match-result__game:focus-visible {
    background: #d7eaff;
    color: #073654;
    outline: none;
  }

  a.challenge-match-result__game--player-1:hover,
  a.challenge-match-result__game--player-1:focus-visible {
    background: #efc7c7;
    color: #681b1b;
  }

  a.challenge-match-result__game--player-2:hover,
  a.challenge-match-result__game--player-2:focus-visible {
    background: #c5def8;
    color: #052c45;
  }

  a.challenge-match-result__game--clock:hover,
  a.challenge-match-result__game--clock:focus-visible {
    background: #ead5b2;
    color: #795412;
  }

  .challenge-match-card__vs {
    display: grid;
    grid-template-rows: auto minmax(12px, 1fr) auto minmax(12px, 1fr);
    justify-items: center;
    align-self: stretch;
    color: #8b1e2d;
    font-size: 18px;
    font-weight: 700;
  }

  .challenge-match-card__vs-content {
    grid-row: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .challenge-match-card__format {
    grid-row: 1;
  }

  .challenge-match-format-badge {
    display: inline-flex;
    padding: 3px 7px;
    border-radius: 3px;
    font-size: 12px;
    line-height: 1.2;
    font-weight: 600;
  }

  .challenge-match-format-badge.bo1 {
    background-color: #eee;
    color: #333;
  }

  .challenge-match-format-badge.bo3 {
    background-color: #d7eaff;
    color: #073654;
  }

  .challenge-match-format-badge.bo5 {
    background-color: #fce0e0;
    color: #590f0f;
  }

  .challenge-match-card__vs::before,
  .challenge-match-card__vs::after {
    content: "";
    width: 1px;
    height: auto;
    align-self: stretch;
    margin: 6px 0;
    background: #d8dee8;
  }

  .challenge-match-card__vs::before { grid-row: 2; }
  .challenge-match-card__vs::after { grid-row: 4; }

  @media (max-width: 600px) {
    .challenge-match-modal {
      max-height: calc(100vh - 44px - 24px);
      padding: 18px 16px;
    }

    .challenge-match-card {
      grid-template-columns: 1fr;
      gap: 14px;
      padding: 24px 2px 4px;
    }

    .challenge-match-player--right {
      align-items: flex-start;
      text-align: left;
    }

    .challenge-match-player--right .challenge-match-player__profile {
      flex-direction: row;
    }

    .challenge-match-player--right .challenge-match-player__info {
      align-items: flex-start;
    }

    .challenge-match-card__vs {
      width: 100%;

<div class="ff-wrap" id="cclFantasy">
  <div class="ff-empty">Loading Fantasy…</div>
</div>

<!-- СКРИПТ -->
<script>
(function () {
  const API_BASE = window.AUTH_BASE_URL || "https://api.carcassonne.gg";
  // The Fantasy league this page shows (fantasy_leagues.id).
  const LEAGUE_ID = "CCL-2027-Q";
  const STATE_URL = `${API_BASE}/public/fantasy/${encodeURIComponent(LEAGUE_ID)}`;
  const TEAM_URL = `${API_BASE}/fantasy/${encodeURIComponent(LEAGUE_ID)}/team`;
  const COMMIT_URL = `${TEAM_URL}/commit`;
  const RENAME_URL = `${TEAM_URL}/name`;
  const LEADERBOARD_URL = `${STATE_URL}/leaderboard`;
  const teamDetailsUrl = (teamId) => `${STATE_URL}/teams/${encodeURIComponent(teamId)}`;
  const root = document.getElementById("cclFantasy");

  let data = null;
  // "team" or "leaderboard"; chosen by the league status on the first load.
  let tab = null;
  let leaderboard = null;
  let leaderboardError = null;
  let leaderboardLoading = false;
  // Leaderboard rows opened by the viewer, and the details loaded for them (team id → data or { error }).
  const expanded = new Set();
  const teamDetails = new Map();
  // The team being edited: { team_name, bga_nickname, slot_ids }. Differs from the saved team until Save.
  let draft = null;
  let busy = false;
  let message = null;
  const DEFAULT_SORT = "price-desc";
  const filters = { search: "", stage: "", group: "", association: "", sort: DEFAULT_SORT };
  let clockTimer = 0;
  let reloadedAt = null;

  function el(tag, className, textContent) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (textContent !== undefined && textContent !== null) node.textContent = textContent;
    return node;
  }

  function formatUtc(iso) {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return "";
    const month = date.toLocaleString("en-GB", { month: "long", timeZone: "UTC" });
    const time = `${String(date.getUTCHours()).padStart(2, "0")}:${String(date.getUTCMinutes()).padStart(2, "0")}`;
    return `${month} ${date.getUTCDate()} at ${time} UTC`;
  }

  const credits = (value) => (Math.round(Number(value) * 2) / 2).toFixed(1);
  const halves = (value) => Math.round(Number(value) * 2);
  const season = () => data.league;
  const team = () => data.viewer?.team || null;
  const playerBySlot = (slotId) => data.players.find((player) => player.slot_id.toUpperCase() === String(slotId).toUpperCase()) || null;

  const savedPick = (slotId) => (team()?.players || []).find((player) => player.slot_id.toUpperCase() === String(slotId).toUpperCase()) || null;

  // Price of a pick. Before the main deadline (and in a locked team) players already in the saved team keep
  // the price they were bought at. A late draft is priced at today's prices, as the server does:
  // a price rise can push it over the budget, and then it cannot be saved or committed until players are replaced.
  function pickPrice(slotId) {
    const saved = savedPick(slotId);
    if (saved && (season().status === "open" || team()?.locked)) return Number(saved.price_at_pick);
    const player = playerBySlot(slotId);
    if (player) return Number(player.price);
    return saved ? Number(saved.price_at_pick) : 0;
  }

  // Late draft: players of the draft who cost more now than when the draft was saved.
  const repricedPicks = () => (season().status === "late" && !team()?.locked
    ? draft.slot_ids.filter((slotId) => {
      const saved = savedPick(slotId);
      const player = playerBySlot(slotId);
      return saved && player && halves(player.price) > halves(saved.price_at_pick);
    })
    : []);

  const draftCost = () => draft.slot_ids.reduce((sum, slotId) => sum + halves(pickPrice(slotId)), 0) / 2;

  function savedDraft() {
    const saved = team();
    return {
      team_name: saved?.team_name || "",
      bga_nickname: saved?.claimed_bga_nickname || "",
      slot_ids: (saved?.players || []).map((player) => player.slot_id),
    };
  }

  function isDirty() {
    const saved = savedDraft();
    const key = (value) => [...value.slot_ids].map((id) => id.toUpperCase()).sort().join("|");
    return saved.team_name.trim() !== draft.team_name.trim()
      || (needsNickname() && saved.bga_nickname.trim() !== draft.bga_nickname.trim())
      || key(saved) !== key(draft);
  }

  // An account without a linked BGA profile gives its BGA nickname with the team; the organisers
  // then ask the association captain to link the account to that player.
  const needsNickname = () => Boolean(data.viewer?.authenticated && !data.viewer.bga_linked);
  const nicknameMissing = () => needsNickname() && !draft.bga_nickname.trim();
  const NICKNAME_HINT = "Enter your BGA nickname.";

  function canEdit() {
    const status = season().status;
    if (!data.viewer?.authenticated) return false;
    if (status !== "open" && status !== "late") return false;
    return !team() || team().can_edit;
  }

  // A locked team (main or committed late) can still change its name, at any time.
  const canRename = () => Boolean(data.viewer?.authenticated && team()?.locked && !canEdit());

  // The deadline the countdown runs to, for the current status.
  function clockTarget() {
    const status = season().status;
    if (status === "upcoming") return { label: "Team building opens in", at: season().opens_at };
    if (status === "open") return { label: "Main deadline in", at: season().main_deadline };
    if (status === "late") return { label: "Late entry closes in", at: season().late_deadline };
    return null;
  }

  function renderClock(node) {
    const target = clockTarget();
    if (!target) {
      node.textContent = "Team building is closed";
      return;
    }
    const left = Math.max(0, Date.parse(target.at) - Date.now());
    const days = Math.floor(left / 86400000);
    const hours = Math.floor(left / 3600000) % 24;
    const minutes = Math.floor(left / 60000) % 60;
    const seconds = Math.floor(left / 1000) % 60;
    node.textContent = `${days}d ${String(hours).padStart(2, "0")}h ${String(minutes).padStart(2, "0")}m ${String(seconds).padStart(2, "0")}s`;
    // At the deadline the server state changes: load it again (once per deadline).
    if (left === 0 && reloadedAt !== target.at) {
      reloadedAt = target.at;
      setTimeout(loadState, 1500);
    }
  }

  function renderHead() {
    const head = el("div", "ff-head");
    const titles = el("div");
    titles.append(
      el("h2", "", season().name),
      el("p", "", `Pick ${season().team_size} players · Budget ${credits(season().budget)} credits · Main deadline ${formatUtc(season().main_deadline)}`)
    );
    head.appendChild(titles);
    const clock = el("div", "ff-clock");
    const target = clockTarget();
    clock.appendChild(el("div", "ff-clock-label", target ? target.label : "Status"));
    const value = el("div", "ff-clock-value");
    clock.appendChild(value);
    head.appendChild(clock);
    renderClock(value);
    clearInterval(clockTimer);
    clockTimer = setInterval(() => renderClock(value), 1000);
    return head;
  }

  function signInButton() {
    const button = el("button", "ff-btn light", "Sign in");
    button.type = "button";
    button.addEventListener("click", () => {
      const popup = window.open(`${API_BASE}/auth/google`, "googleAuth", "width=520,height=640,left=100,top=100");
      if (!popup) window.top.location.href = `${API_BASE}/auth/google`;
    });
    return button;
  }

  // One note under the header: what the viewer can do now.
  function renderNotice() {
    const status = season().status;
    const saved = team();
    const note = el("div", "ff-note");
    if (status === "upcoming") {
      note.textContent = `Team building opens ${formatUtc(season().opens_at)}. You can already look at the players and prices.`;
      return note;
    }
    if (saved?.state === "deactivated") {
      note.classList.add("bad");
      note.textContent = "Your team has been deactivated by the league organisers. See the reason under My team.";
      return note;
    }
    if (status === "closed") {
      note.classList.add(saved && saved.locked ? "ok" : "warn");
      note.textContent = saved && saved.locked
        ? "Team building is closed. Your team is in the game."
        : "Team building is closed.";
      return note;
    }
    if (!data.viewer?.authenticated) {
      note.append(
        el("div", "", "Sign in to carcassonne.gg to build your team. One team per account."),
        signInButton()
      );
      return note;
    }
    if (saved?.state === "locked") {
      note.classList.add("ok");
      note.textContent = "Your team is locked and scores all points its players earn in the qualifiers.";
      return note;
    }
    if (saved?.state === "committed") {
      note.classList.add("ok");
      note.textContent = `Your team is committed. It scores matches that start after ${formatUtc(saved.scoring_from)}.`;
      return note;
    }
    if (status === "late") {
      note.classList.add("warn");
      const strong = el("strong", "", "Late entry. ");
      note.append(
        strong,
        `Save keeps a draft that you can still change; it scores nothing. A draft is priced at today's prices: if a player in it gets more expensive and the team goes over budget, replace players before you commit. Commit locks your team for good, and it scores only matches that start after you commit. Late entry closes ${formatUtc(season().late_deadline)}.`
      );
      return note;
    }
    note.textContent = `Save your team as often as you like until ${formatUtc(season().main_deadline)}. A complete team saved by then scores all points its players earn in the qualifiers, including matches already played.`;
    return note;
  }

  function teamBadge() {
    const saved = team();
    const count = draft.slot_ids.length;
    if (saved?.state === "deactivated") return el("span", "ff-badge bad", "Deactivated");
    if (saved?.state === "locked") return el("span", "ff-badge ok", "Locked");
    if (saved?.state === "committed") return el("span", "ff-badge ok", "Committed");
    if (saved?.state === "not_entered") return el("span", "ff-badge bad", "Not entered");
    if (count === season().team_size) return el("span", "ff-badge info", season().status === "late" ? "Ready to commit" : "Complete");
    return el("span", "ff-badge warn", `Draft · ${count}/${season().team_size}`);
  }

  function playerLabel(player, { withStage = false } = {}) {
    const box = el("div", "ff-player");
    if (player.association?.flag) {
      const flag = el("img", "ff-flag");
      flag.src = player.association.flag;
      flag.alt = player.association.name || "";
      flag.title = player.association.name || "";
      box.appendChild(flag);
    }
    box.appendChild(el("span", "ff-player-name", player.nickname));
    if (withStage) box.appendChild(el("span", "ff-tag", [player.stage, player.group ? `Group ${player.group}` : ""].filter(Boolean).join(" · ")));
    if (player.eliminated) box.appendChild(el("span", "ff-tag out", "Eliminated"));
    return box;
  }

  function renderTeamPanel() {
    const panel = el("div", "ff-panel");
    const head = el("div", "ff-panel-head");
    head.append(el("h3", "", "My team"), teamBadge());
    panel.appendChild(head);
    // Deactivated by the league organisers: the team does not score and cannot be changed.
    if (team()?.state === "deactivated") {
      const notice = el("div", "ff-deactivated");
      notice.appendChild(el("strong", "", "Your team has been deactivated by the league organisers."));
      notice.appendChild(el("div", "", "It does not score and is not shown in the leaderboard."));
      if (team().deactivation_reason) notice.appendChild(el("div", "", `Reason: ${team().deactivation_reason}`));
      panel.appendChild(notice);
    }
    const editable = canEdit();

    const field = el("div", "ff-field");
    const label = el("label", "", "Team name");
    label.htmlFor = "ffTeamName";
    const input = el("input", "ff-input");
    input.id = "ffTeamName";
    input.maxLength = 40;
    input.placeholder = "e.g. Meeple Masters";
    input.value = draft.team_name;
    input.disabled = !editable && !canRename();
    input.addEventListener("input", () => {
      draft.team_name = input.value;
      message = null;
      renderActions(panel.querySelector(".ff-actions-box"));
    });
    field.append(label, input);
    panel.appendChild(field);

    if (needsNickname()) {
      const nicknameField = el("div", "ff-field");
      const nicknameLabel = el("label", "", "Your BGA nickname");
      nicknameLabel.htmlFor = "ffBgaNickname";
      const nicknameInput = el("input", "ff-input");
      nicknameInput.id = "ffBgaNickname";
      nicknameInput.maxLength = 40;
      nicknameInput.autocomplete = "nickname";
      nicknameInput.placeholder = "Your nickname on Board Game Arena";
      nicknameInput.value = draft.bga_nickname;
      nicknameInput.disabled = !editable && !canRename();
      nicknameInput.addEventListener("input", () => {
        draft.bga_nickname = nicknameInput.value;
        message = null;
        renderActions(panel.querySelector(".ff-actions-box"));
      });
      nicknameField.append(
        nicknameLabel,
        nicknameInput,
        el("div", "ff-hint", "Your account is not linked to a BGA profile yet. Your association captain will link it by this nickname.")
      );
      panel.appendChild(nicknameField);
    }

    const cost = draftCost();
    const budget = Number(season().budget);
    const metrics = el("div", "ff-metrics");
    const metric = (name, value, className = "", tip = "") => {
      const box = el("div", className);
      const caption = el("span", "", name);
      if (tip) {
        // (i) with a tooltip on hover (and on tap / keyboard focus).
        const info = el("span", "ff-info");
        info.tabIndex = 0;
        info.setAttribute("role", "img");
        info.setAttribute("aria-label", tip);
        info.dataset.tip = tip;
        info.appendChild(el("i", "fa-solid fa-circle-info"));
        caption.append(" ", info);
      }
      box.append(caption, el("strong", "", value));
      return box;
    };
    // Points the picked players have already earned in the qualifiers.
    const earned = draft.slot_ids.reduce((sum, slotId) => sum + (Number(playerBySlot(slotId)?.points) || 0), 0);
    const lateEntry = season().status === "late" || team()?.state === "committed";
    const pointsTip = lateEntry
      ? "Points your players have already earned. A late team scores only matches that start after it is committed."
      : "Points your players have already earned count towards your future ranking.";
    metrics.append(
      metric("Players", `${draft.slot_ids.length} / ${season().team_size}`),
      metric("Cost", `${credits(cost)} / ${credits(budget)}`, halves(cost) > halves(budget) ? "over" : ""),
      metric("Remaining", credits(budget - cost), halves(cost) > halves(budget) ? "over" : ""),
      metric("Points", String(earned), "", pointsTip)
    );
    panel.appendChild(metrics);

    for (let index = 0; index < season().team_size; index += 1) {
      const slotId = draft.slot_ids[index];
      const player = slotId ? playerBySlot(slotId) : null;
      const row = el("div", `ff-slot${slotId ? " filled" : ""}`);
      row.appendChild(el("span", "ff-slot-no", String(index + 1)));
      if (slotId) {
        row.appendChild(player ? playerLabel(player, { withStage: true }) : el("span", "ff-player-name", slotId));
        row.appendChild(el("span", "ff-slot-price", credits(pickPrice(slotId))));
        const remove = el("button", "ff-btn icon");
        remove.type = "button";
        remove.title = "Remove";
        remove.setAttribute("aria-label", `Remove ${player?.nickname || slotId}`);
        remove.appendChild(el("i", "fa-solid fa-xmark"));
        remove.disabled = !editable;
        remove.addEventListener("click", () => togglePlayer(slotId));
        row.appendChild(remove);
      } else {
        row.appendChild(el("span", "ff-slot-empty", "Empty slot — pick a player from the list"));
        row.append(el("span"), el("span"));
      }
      panel.appendChild(row);
    }

    const actions = el("div", "ff-actions-box");
    panel.appendChild(actions);
    renderActions(actions);
    return panel;
  }

  function renderActions(box) {
    if (!box) return;
    box.innerHTML = "";
    if (!canEdit()) {
      // A locked team keeps its players, but its name can still be changed.
      if (canRename()) {
        const named = draft.team_name.trim().length > 0;
        const changed = isDirty();
        const row = el("div", "ff-actions");
        const renameButton = el("button", "ff-btn", needsNickname() ? "Save" : "Save name");
        renameButton.type = "button";
        renameButton.disabled = busy || !named || nicknameMissing() || !changed;
        renameButton.addEventListener("click", () => submit("rename"));
        row.appendChild(renameButton);
        box.appendChild(row);
        if (!named) box.appendChild(el("div", "ff-hint", "Enter a team name."));
        else if (nicknameMissing()) box.appendChild(el("div", "ff-hint", NICKNAME_HINT));
        else box.appendChild(el("div", "ff-hint", "The players of a locked team cannot change, but you can rename it."));
      }
      if (message) box.appendChild(el("div", `ff-message ${message.kind}`, message.text));
      return;
    }
    const status = season().status;
    const full = draft.slot_ids.length === season().team_size;
    const withinBudget = halves(draftCost()) <= halves(season().budget);
    const named = draft.team_name.trim().length > 0;
    const row = el("div", "ff-actions");
    const saveButton = el("button", "ff-btn", "Save");
    saveButton.type = "button";
    saveButton.disabled = busy || !named || nicknameMissing() || !withinBudget || (!isDirty() && Boolean(team()));
    saveButton.addEventListener("click", () => submit("save"));
    row.appendChild(saveButton);
    if (status === "late") {
      const commitButton = el("button", "ff-btn commit", "Commit");
      commitButton.type = "button";
      commitButton.disabled = busy || !named || nicknameMissing() || !withinBudget || !full;
      commitButton.addEventListener("click", () => {
        const ok = window.confirm("Commit locks your team for good. It scores only matches that start after now. Commit?");
        if (ok) submit("commit");
      });
      row.appendChild(commitButton);
    }
    // A saved team that is not locked yet can be deleted (and a new one built).
    if (team()) {
      const deleteButton = el("button", "ff-btn light ff-delete", "Delete team");
      deleteButton.type = "button";
      deleteButton.disabled = busy;
      deleteButton.addEventListener("click", () => {
        const ok = window.confirm("Delete your team? Its players and name are removed. You can build a new team afterwards.");
        if (ok) submit("delete");
      });
      row.appendChild(deleteButton);
    }
    box.appendChild(row);
    const hints = [];
    if (!named) hints.push("Enter a team name.");
    if (nicknameMissing()) hints.push(NICKNAME_HINT);
    if (!withinBudget && repricedPicks().length) {
      const names = repricedPicks().map((slotId) => playerBySlot(slotId)?.nickname || slotId).join(", ");
      hints.push(`Prices have gone up since you saved this draft (${names}): the team now costs ${credits(draftCost())}, over the budget of ${credits(season().budget)}. Replace players to save or commit it.`);
    } else if (!withinBudget) hints.push(`The team is over the budget of ${credits(season().budget)}.`);
    if (!full) hints.push(`A team scores only with ${season().team_size} players; until then it is a draft.`);
    if (status === "late" && full && withinBudget) hints.push("Save keeps a draft; Commit cannot be undone.");
    if (team() && isDirty()) hints.push("You have unsaved changes.");
    hints.forEach((hint) => box.appendChild(el("div", "ff-hint", hint)));
    if (message) box.appendChild(el("div", `ff-message ${message.kind}`, message.text));
  }

  function togglePlayer(slotId) {
    if (!canEdit()) return;
    const key = slotId.toUpperCase();
    const index = draft.slot_ids.findIndex((id) => id.toUpperCase() === key);
    if (index >= 0) draft.slot_ids.splice(index, 1);
    else if (draft.slot_ids.length < season().team_size) draft.slot_ids.push(slotId);
    message = null;
    render();
  }

  function filteredPlayers() {
    const search = filters.search.trim().toLowerCase();
    const rows = data.players.filter((player) => (
      (!search || String(player.nickname).toLowerCase().includes(search))
      && (!filters.stage || player.stage === filters.stage)
      && (!filters.group || player.group === filters.group)
      && (!filters.association || player.association?.id === filters.association)
    ));
    const byName = (left, right) => String(left.nickname).localeCompare(String(right.nickname), undefined, { sensitivity: "base" });
    const sorters = {
      "price-desc": (left, right) => right.price - left.price || byName(left, right),
      "price-asc": (left, right) => left.price - right.price || byName(left, right),
      "points-desc": (left, right) => (right.points || 0) - (left.points || 0) || byName(left, right),
      "points-asc": (left, right) => (left.points || 0) - (right.points || 0) || byName(left, right),
      "picked-desc": (left, right) => (right.picked_by || 0) - (left.picked_by || 0) || byName(left, right),
      "picked-asc": (left, right) => (left.picked_by || 0) - (right.picked_by || 0) || byName(left, right),
      "name-asc": byName,
      "name-desc": (left, right) => byName(right, left),
    };
    return rows.sort(sorters[filters.sort] || sorters[DEFAULT_SORT]);
  }

  // A click on a column header sorts by it in its first order; the next click flips the order.
  // There is no reset click: the default (Price high → low) comes back with a reload or a click on Price.
  const SORT_CYCLES = {
    player: ["name-asc", "name-desc"],
    price: ["price-desc", "price-asc"],
    points: ["points-desc", "points-asc"],
    picked: ["picked-desc", "picked-asc"],
  };

  function nextSort(column) {
    const cycle = SORT_CYCLES[column];
    const index = cycle.indexOf(filters.sort);
    filters.sort = index === -1 ? cycle[0] : cycle[(index + 1) % cycle.length];
  }

  // The arrow a header shows: Price shows the default order too.
  function sortArrow(column) {
    const arrows = {
      player: { "name-asc": "▲", "name-desc": "▼" },
      price: { "price-asc": "▲", "price-desc": "▼" },
      points: { "points-desc": "▼", "points-asc": "▲" },
      picked: { "picked-desc": "▼", "picked-asc": "▲" },
    };
    return arrows[column][filters.sort] || "";
  }

  // Our dropdown (cp-dd from player-hub/tournaments.html) in place of a native select.
  // options: [{ value, label, flag? }]; `searchable` adds a filter field.
  let dropdownsBound = false;

  function dropdown(options, value, onChange, { ariaLabel = "", searchable = false } = {}) {
    if (!dropdownsBound) {
      dropdownsBound = true;
      document.addEventListener("click", (event) => {
        document.querySelectorAll(".ff-dd").forEach((node) => {
          if (!node.contains(event.target)) node.ffClose?.();
        });
      });
    }
    let query = "";
    const root = el("div", "ff-dd");
    const button = el("button", "ff-dd-btn");
    button.type = "button";
    button.setAttribute("aria-haspopup", "listbox");
    if (ariaLabel) button.setAttribute("aria-label", ariaLabel);
    const content = el("span", "ff-dd-btn-content");
    button.append(content, el("span", "ff-dd-chevron", "▾"));
    const menu = el("div", "ff-dd-menu");
    menu.setAttribute("role", "listbox");
    let searchInput = null;
    const close = () => {
      menu.classList.remove("open");
      menu.style.maxHeight = "0px";
      button.classList.remove("open");
    };
    root.ffClose = close;
    const appendLabel = (parent, option) => {
      if (option.flag) {
        const flag = el("img", "ff-dd-flag");
        flag.src = option.flag;
        flag.alt = "";
        parent.appendChild(flag);
      }
      parent.appendChild(el("span", "", option.label));
    };
    const renderOptions = () => {
      menu.querySelectorAll(".ff-dd-option").forEach((node) => node.remove());
      options
        .filter((option) => !query || !option.value || String(option.label).toLowerCase().includes(query))
        .forEach((option) => {
          const item = el("button", `ff-dd-option${option.value === value ? " active" : ""}`);
          item.type = "button";
          item.setAttribute("role", "option");
          item.setAttribute("aria-selected", String(option.value === value));
          appendLabel(item, option);
          item.addEventListener("click", (event) => {
            event.stopPropagation();
            close();
            if (option.value !== value) onChange(option.value);
          });
          menu.appendChild(item);
        });
    };
    if (searchable) {
      const wrap = el("div", "ff-dd-search");
      searchInput = el("input");
      searchInput.type = "text";
      searchInput.placeholder = "Type to filter...";
      searchInput.addEventListener("click", (event) => event.stopPropagation());
      searchInput.addEventListener("input", () => {
        query = searchInput.value.trim().toLowerCase();
        renderOptions();
        menu.style.maxHeight = `${Math.min(menu.scrollHeight, 300)}px`;
      });
      wrap.appendChild(searchInput);
      menu.appendChild(wrap);
    }
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      if (menu.classList.contains("open")) {
        close();
        return;
      }
      document.querySelectorAll(".ff-dd").forEach((node) => {
        if (node !== root) node.ffClose?.();
      });
      if (searchInput) {
        query = "";
        searchInput.value = "";
        renderOptions();
      }
      menu.classList.add("open");
      menu.style.maxHeight = `${Math.min(menu.scrollHeight, 300)}px`;
      button.classList.add("open");
      searchInput?.focus({ preventScroll: true });
    });
    root.addEventListener("keydown", (event) => {
      if (event.key === "Escape") close();
    });
    appendLabel(content, options.find((option) => option.value === value) || options[0]);
    renderOptions();
    root.append(button, menu);
    return root;
  }

  function renderPool() {
    const panel = el("div", "ff-panel");
    const head = el("div", "ff-panel-head");
    head.append(el("h3", "", "Players"), el("span", "ff-tag", `${data.players.length} qualifiers`));
    panel.appendChild(head);

    const bar = el("div", "ff-filters");
    const search = el("input", "ff-input ff-search");
    search.type = "search";
    search.placeholder = "Search player…";
    search.value = filters.search;
    search.setAttribute("aria-label", "Search player");
    search.addEventListener("input", () => {
      filters.search = search.value;
      renderPoolTable(tableBox);
    });
    const stages = season().stages.map((stage) => ({ value: stage, label: stage }));
    const groups = [...new Set(data.players.filter((player) => !filters.stage || player.stage === filters.stage)
      .map((player) => player.group).filter(Boolean))].sort();
    const associations = new Map();
    data.players.forEach((player) => {
      if (player.association) associations.set(player.association.id, player.association);
    });
    const associationOptions = [...associations.values()]
      .sort((left, right) => String(left.name).localeCompare(String(right.name)))
      .map((association) => ({ value: association.id, label: association.name, flag: association.flag }));
    // Changing a filter redraws the panel: the group list depends on the stage, and every dropdown shows its value.
    const setFilter = (field, value) => {
      filters[field] = value;
      if (field === "stage") filters.group = "";
      render();
    };
    bar.append(
      search,
      dropdown([{ value: "", label: "All stages" }, ...stages], filters.stage, (value) => setFilter("stage", value), { ariaLabel: "Stage" }),
      dropdown(
        [{ value: "", label: "All groups" }, ...groups.map((group) => ({ value: group, label: `Group ${group}` }))],
        filters.group,
        (value) => setFilter("group", value),
        { ariaLabel: "Group" }
      ),
      dropdown(
        [{ value: "", label: "All associations" }, ...associationOptions],
        filters.association,
        (value) => setFilter("association", value),
        { ariaLabel: "Association", searchable: true }
      )
    );
    panel.appendChild(bar);
    const tableBox = el("div", "ff-table-wrap");
    panel.appendChild(tableBox);
    renderPoolTable(tableBox);
    return panel;
  }

  function renderPoolTable(box) {
    box.innerHTML = "";
    const rows = filteredPlayers();
    if (!rows.length) {
      box.appendChild(el("div", "ff-empty", data.players.length ? "No players match the filters." : "Prices are not published yet."));
      return;
    }
    const editable = canEdit();
    const full = draft.slot_ids.length >= season().team_size;
    const remaining = halves(season().budget) - halves(draftCost());
    // "Picked": how many teams have the player (before the main deadline every saved team counts).
    const showPicked = data.players.some((player) => player.picked_by !== undefined);
    const table = el("table", "ff-table");
    const thead = el("thead");
    const headRow = el("tr");
    [
      ["Player", "", "player"], ["Stage", "ff-stage-cell"], ["Group", "ff-group-cell"], ["Association", "ff-assoc-cell"], ["Price", "num", "price"],
      ["Pts", "num", "points"], ...(showPicked ? [["Picked", "num", "picked"]] : []), ["", "num"],
    ].forEach(([label, className, sortColumn]) => {
      const th = el("th", className);
      if (sortColumn) {
        const arrow = sortArrow(sortColumn);
        const button = el("button", `ff-sort${arrow ? " active" : ""}`);
        button.type = "button";
        button.title = "Sort";
        button.append(el("span", "", label), el("span", `ff-sort-arrow${arrow ? "" : " idle"}`, arrow || "↕"));
        th.setAttribute("aria-sort", arrow === "▲" ? "ascending" : arrow === "▼" ? "descending" : "none");
        button.addEventListener("click", () => {
          nextSort(sortColumn);
          renderPoolTable(box);
        });
        th.appendChild(button);
      } else {
        th.textContent = label;
      }
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    const tbody = el("tbody");
    rows.forEach((player) => {
      const picked = draft.slot_ids.some((id) => id.toUpperCase() === player.slot_id.toUpperCase());
      const tr = el("tr", [picked ? "picked" : "", player.eliminated ? "out" : ""].filter(Boolean).join(" "));
      const nameCell = el("td");
      const label = playerLabel(player);
      if (player.next_match) {
        const next = el("button", "ff-next-btn", "Next match");
        next.type = "button";
        next.setAttribute("aria-haspopup", "dialog");
        next.setAttribute("aria-label", `Next match of ${player.nickname}`);
        next.addEventListener("click", () => openFantasyMatchModal(player.next_match, next));
        label.appendChild(next);
      }
      nameCell.appendChild(label);
      tr.append(
        nameCell,
        el("td", "ff-stage-cell", player.stage),
        el("td", "ff-group-cell", player.group || "—"),
        el("td", "ff-assoc-cell", player.association?.name || "—"),
        el("td", "num", credits(player.price)),
        el("td", "num", String(player.points ?? 0))
      );
      if (showPicked) tr.appendChild(el("td", "num", String(player.picked_by ?? 0)));
      const actionCell = el("td", "num");
      if (editable) {
        // Text on wide screens, an icon on mobile: + to add, × to remove (as in the My team list).
        const button = el("button", `ff-btn small ff-pick-btn${picked ? " light ff-pick-remove" : ""}`);
        button.type = "button";
        button.setAttribute("aria-label", `${picked ? "Remove" : "Add"} ${player.nickname}`);
        button.append(
          el("i", `fa-solid ${picked ? "fa-xmark" : "fa-plus"} ff-pick-icon`),
          el("span", "ff-pick-text", picked ? "Remove" : "Add")
        );
        if (!picked && full) {
          button.disabled = true;
          button.title = "Your team is full";
        } else if (!picked && halves(player.price) > remaining) {
          button.disabled = true;
          button.title = "Not enough budget left";
        }
        button.addEventListener("click", () => togglePlayer(player.slot_id));
        actionCell.appendChild(button);
      }
      tr.appendChild(actionCell);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    box.appendChild(table);
  }

  // === MATCH DETAILS POPUP (copied from CCL-2027-qualifications.html, same as the duel popup in matches.html) ===
  const BGA_ICON_URL = "https://carcassonne.gg/gallery/bga-logo.png";
  const CARCASSONNE_LAB_ICON_URL = "https://carcassonne.gg/gallery/carcassonne-lab-icon.png";
  let duelDetailsPromise = null;

  // Games, streams and player data of the tournament's duels (the endpoint matches.html uses),
  // plus GG profiles for ratings. Failures leave the popup with the bracket data only.
  function loadDuelDetails() {
    if (duelDetailsPromise) return duelDetailsPromise;
    const fetchOptionalJson = (url) => fetch(url, { cache: "no-store" })
      .then(res => (res.ok ? res.json() : {}))
      .catch(() => ({}));
    duelDetailsPromise = Promise.all([
      fetchOptionalJson(`${API_BASE}/public/main-page-matches?tournament_id=${encodeURIComponent(season().tournament_id)}`),
      fetchOptionalJson(`${API_BASE}/profiles/public`),
      fetchOptionalJson(`${API_BASE}/teams`),
    ]).then(([matchesPayload, profilesPayload, teamsPayload]) => {
      const cclDuelsById = new Map();
      (Array.isArray(matchesPayload?.ccl_duels) ? matchesPayload.ccl_duels : []).forEach(duel => {
        const id = String(duel?.id || "").trim();
        if (id) cclDuelsById.set(id, duel);
      });
      return {
        cclDuelsById,
        playerDetailsById: buildChallengePlayerDetailsIndex(profilesPayload, teamsPayload),
      };
    });
    return duelDetailsPromise;
  }

  function buildBgaAvatarUrl(playerId, avatarValue) {
    const playerIdText = String(playerId || "").trim();
    const avatarText = String(avatarValue || "").trim();
    if (!avatarText) return "";
    if (/^https?:\/\//i.test(avatarText)) {
      // Repair saved BGA photo URLs that use the old 100-million folder boundary.
      return avatarText.replace(
        /^(https?:\/\/x\.boardgamearena\.net\/data\/avatar\/)\d+\/\d+\/\d+\/(\d+)(_\d+\.[a-z0-9]+)(?=[?#]|$)/i,
        (_match, base, photoPlayerId, imageSuffix) => {
          const id = Number(photoPlayerId);
          return `${base}${Math.floor(id / 1000000000)}/${Math.floor(id / 1000000)}/${Math.floor(id / 1000)}/${photoPlayerId}${imageSuffix}`;
        }
      );
    }
    if (avatarText === "x00000") return "https://x.boardgamearena.net/data/avatar/default_184.jpg";

    const defaultMatch = avatarText.match(/^_def_(\d+)$/);
    if (defaultMatch) {
      return `https://x.boardgamearena.net/data/avatar/defaults/default-${defaultMatch[1].padStart(4, "0")}.jpg`;
    }

    if (!/^\d+$/.test(playerIdText)) return "";
    const playerIdNumber = Number(playerIdText);
    if (!Number.isFinite(playerIdNumber)) return "";
    const firstFolder = String(Math.floor(playerIdNumber / 1000000000));
    const secondFolder = String(Math.floor(playerIdNumber / 1000000));
    const thirdFolder = String(Math.floor(playerIdNumber / 1000));
    return `https://x.boardgamearena.net/data/avatar/${firstFolder}/${secondFolder}/${thirdFolder}/${playerIdText}_184.jpg?h=${encodeURIComponent(avatarText)}`;
  }

  function buildChallengePlayerDetailsIndex(profilesPayload, teamsPayload) {
    const profiles = Array.isArray(profilesPayload?.profiles) ? profilesPayload.profiles : [];
    const teamList = Array.isArray(teamsPayload?.teams) ? teamsPayload.teams : [];
    const teamsById = new Map(
      teamList.map((team) => [String(team?.id || "").trim().toUpperCase(), team]).filter(([id]) => Boolean(id))
    );
    const profileId = (profile) => String(profile?.id ?? profile?.player_id ?? "").trim();
    const ratingProfiles = profiles.filter((profile) => {
      const rawElo = String(profile?.gg_elo ?? "").trim();
      return profileId(profile) && rawElo !== "" && Number.isFinite(Number(rawElo)) && Number(rawElo) > 0;
    });
    const fallbackRankById = new Map(
      ratingProfiles
        .slice()
        .sort((a, b) => Number(b.gg_elo) - Number(a.gg_elo))
        .map((profile, index) => [profileId(profile), index + 1])
    );
    const ratingsById = new Map();
    ratingProfiles.forEach((profile) => {
      const id = profileId(profile);
      const position = Number(profile?.gg_rating_position);
      ratingsById.set(id, {
        elo: Math.trunc(Number(profile.gg_elo)),
        rank: Number.isFinite(position) && position > 0
          ? Math.trunc(position)
          : fallbackRankById.get(id),
      });
    });

    return new Map(profiles.map((profile) => {
      const id = profileId(profile);
      const associationId = String(profile?.association || "").trim().toUpperCase();
      const team = teamsById.get(associationId) || null;
      const rating = ratingsById.get(id) || null;
      return [id, {
        id,
        nickname: String(profile?.bga_nickname || profile?.nickname || id).trim(),
        name: String(profile?.name || "").trim(),
        avatar: buildBgaAvatarUrl(id, profile?.avatar),
        flag: String(team?.flag || team?.logo || "").trim(),
        country: String(team?.name || associationId).trim(),
        elo: rating?.elo ?? null,
        rank: rating?.rank ?? null,
        bgaElo: Number.isFinite(Number(profile?.bga_elo)) && Number(profile.bga_elo) > 0
          ? Math.trunc(Number(profile.bga_elo))
          : null,
      }];
    }).filter(([id]) => Boolean(id)));
  }

  function getPlayerInitials(player) {
    const source = String(player?.nickname || player?.name || "?").trim();
    const parts = source.split(/\s+/).filter(Boolean);
    return (parts.length > 1 ? `${parts[0][0]}${parts[1][0]}` : source.slice(0, 2)).toUpperCase();
  }

  function isTruthyOne(value) {
    return value === 1 || value === true || String(value || "").trim() === "1";
  }

  function getCarcassonneLabUrl(value) {
    const raw = String(value || "").trim();
    if (!raw) return "";
    try {
      const url = new URL(raw);
      if (url.protocol !== "https:" || url.hostname !== "www.carcassonnelab.com") return "";
      if (!url.hash.startsWith("#/")) return "";
      return url.href;
    } catch (_error) {
      return "";
    }
  }

  function createMatchFormatBadge(formatValue, badgeClass) {
    const rawFormat = typeof formatValue === "string" ? formatValue.trim() : "";
    const formatKey = rawFormat.toLowerCase();
    if (!rawFormat || !["bo1", "bo3", "bo5"].includes(formatKey)) return null;

    const badge = document.createElement("div");
    badge.className = `${badgeClass} ${formatKey}`;
    badge.textContent = rawFormat;
    return badge;
  }

  // Keep stream links, streamer icons and streamer names index-aligned.
  function normalizeStreamFields(source) {
    const links = Array.isArray(source?.streams) ? source.streams : [];
    const icons = Array.isArray(source?.streamers) ? source.streamers : [];
    const names = Array.isArray(source?.streamer_names) ? source.streamer_names : [];
    const result = { streams: [], streamers: [], streamer_names: [] };
    const count = Math.max(links.length, icons.length);
    for (let index = 0; index < count; index += 1) {
      const link = String(links[index] || "").trim();
      const icon = String(icons[index] || "").trim();
      if (!link && !icon) continue;
      result.streams.push(link);
      result.streamers.push(icon);
      result.streamer_names.push(String(names[index] || "").trim());
    }
    return result;
  }

  function createChallengePlayerCard(player, side) {
    const card = document.createElement("section");
    card.className = `challenge-match-player challenge-match-player--${side}`;
    const eloValue = Number(player?.elo);
    const hasRating = Number.isFinite(eloValue) && eloValue > 0;
    const bgaEloValue = Number(player?.bgaElo);
    const hasBgaRating = Number.isFinite(bgaEloValue) && bgaEloValue > 0;

    const rating = document.createElement("div");
    rating.className = "challenge-match-player__rating";
    const rank = document.createElement("span");
    rank.className = "challenge-match-player__rank";
    rank.textContent = hasRating && player?.rank ? `#${player.rank}` : "New";
    const ratings = document.createElement("span");
    ratings.className = "challenge-match-player__ratings";
    const elo = document.createElement("span");
    elo.className = "challenge-match-player__rating-line";
    if (hasRating) {
      const eloLabel = document.createElement("span");
      eloLabel.textContent = "GG Elo:";
      const eloRating = document.createElement("span");
      eloRating.className = "challenge-match-player__rating-value";
      eloRating.textContent = String(Math.trunc(eloValue));
      elo.appendChild(eloLabel);
      elo.appendChild(eloRating);
    } else {
      elo.classList.add("challenge-match-player__rating-value");
      elo.textContent = "Unrated";
    }
    ratings.appendChild(elo);

    const bgaElo = document.createElement("span");
    bgaElo.className = "challenge-match-player__rating-line";
    const bgaEloLabel = document.createElement("span");
    bgaEloLabel.textContent = "BGA Elo:";
    const bgaEloRating = document.createElement("span");
    bgaEloRating.className = "challenge-match-player__rating-value";
    bgaEloRating.textContent = hasBgaRating ? String(Math.trunc(bgaEloValue)) : "Unrated";
    bgaElo.appendChild(bgaEloLabel);

      info.appendChild(name);

    const countryRow = document.createElement("div");
