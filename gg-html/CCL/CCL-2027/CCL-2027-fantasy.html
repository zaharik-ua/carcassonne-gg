    return card;
  }

  function createChallengeMatchResult(match) {
    const normalizedStatus = String(match?.status || "").trim().toLowerCase();
    const isInProgress = normalizedStatus === "in progress";
    const isCompleted = normalizedStatus === "done" || normalizedStatus === "completed";
    if (!isInProgress && !isCompleted) return null;

    const games = (Array.isArray(match?.games) ? match.games : [])
      .map((game) => {
        const player1Score = game?.player_1_score;
        const player2Score = game?.player_2_score;
        const tableId = String(game?.bga_table_id || "").trim();
        const player1Clock = isTruthyOne(game?.player_1_clock);
        const player2Clock = isTruthyOne(game?.player_2_clock);
        const carcassonneLabUrl = getCarcassonneLabUrl(game?.carcassonne_lab_url);
        const hasPlayer1Score = player1Score !== null && player1Score !== undefined && String(player1Score).trim() !== "";
        const hasPlayer2Score = player2Score !== null && player2Score !== undefined && String(player2Score).trim() !== "";
        return hasPlayer1Score && hasPlayer2Score
          ? { player1Score, player2Score, player1Clock, player2Clock, tableId, carcassonneLabUrl }
          : null;
      })
      .filter(Boolean);

    const hasMatchScore = match?.gw1 !== null && match?.gw1 !== undefined && String(match.gw1).trim() !== ""
      && match?.gw2 !== null && match?.gw2 !== undefined && String(match.gw2).trim() !== "";
    if (!hasMatchScore && !games.length) return null;

    let score1 = hasMatchScore ? match.gw1 : 0;
    let score2 = hasMatchScore ? match.gw2 : 0;
    if (!hasMatchScore) {
      games.forEach((game) => {
        if (game.player1Clock !== game.player2Clock) {
          if (game.player1Clock) score2 += 1;
          if (game.player2Clock) score1 += 1;
          return;
        }
        const gameScore1 = Number(game.player1Score);
        const gameScore2 = Number(game.player2Score);
        if (!Number.isFinite(gameScore1) || !Number.isFinite(gameScore2)) return;
        if (gameScore1 > gameScore2) score1 += 1;
        if (gameScore2 > gameScore1) score2 += 1;
      });
    }

    const result = document.createElement("section");
    result.className = "challenge-match-result";

    const status = document.createElement("div");
    status.className = `challenge-match-result__status${isCompleted ? " challenge-match-result__status--completed" : ""}`;
    status.textContent = isCompleted ? "COMPLETED" : "IN PROGRESS";
    result.appendChild(status);

    const score = document.createElement("div");
    score.className = "challenge-match-result__score";
    score.textContent = `${score1} - ${score2}`;
    result.appendChild(score);

    if (games.length) {
      const gameScores = document.createElement("div");
      gameScores.className = "challenge-match-result__games";
      const bgaRow = document.createElement("div");
      const bgaLinks = document.createElement("div");
      const bgaIcon = document.createElement("img");
      bgaRow.className = "challenge-match-result__games-row";
      bgaLinks.className = "challenge-match-result__games-links";
      bgaIcon.className = "challenge-match-result__games-source-icon";
      bgaIcon.src = BGA_ICON_URL;
      bgaIcon.alt = "BGA";
      bgaIcon.loading = "lazy";
      bgaRow.appendChild(bgaIcon);
      bgaRow.appendChild(bgaLinks);

      const labRow = document.createElement("div");
      const labLinks = document.createElement("div");
      const labIcon = document.createElement("img");
      labRow.className = "challenge-match-result__games-row";
      labLinks.className = "challenge-match-result__games-links";
      labIcon.className = "challenge-match-result__games-source-icon";
      labIcon.src = CARCASSONNE_LAB_ICON_URL;
      labIcon.alt = "CarcassonneLab";
      labIcon.loading = "lazy";
      labRow.appendChild(labIcon);
      labRow.appendChild(labLinks);

      games.forEach((game) => {
        const badge = document.createElement(game.tableId ? "a" : "span");
        badge.className = "challenge-match-result__game";
        const hasClockLoss = game.player1Clock !== game.player2Clock;
        if (hasClockLoss) {
          badge.classList.add("challenge-match-result__game--clock");
          const clock = document.createElement("i");
          clock.className = "fa-regular fa-clock challenge-match-result__game-clock";
          const clockScore = document.createElement("span");
          clockScore.textContent = game.player1Clock ? "0:1" : "1:0";
          badge.appendChild(clock);
          badge.appendChild(clockScore);
        } else {
          const player1Score = Number(game.player1Score);
          const player2Score = Number(game.player2Score);
          if (Number.isFinite(player1Score) && Number.isFinite(player2Score)) {
            if (player1Score > player2Score) {
              badge.classList.add("challenge-match-result__game--player-1");
            } else if (player2Score > player1Score) {
              badge.classList.add("challenge-match-result__game--player-2");
            }
          }
          badge.textContent = `${game.player1Score}:${game.player2Score}`;
        }
        if (game.tableId) {
          badge.href = `https://boardgamearena.com/table?table=${encodeURIComponent(game.tableId)}`;
          badge.target = "_blank";
          badge.rel = "noopener noreferrer";
          badge.title = "Open game on Board Game Arena";
        }
        bgaLinks.appendChild(badge);

        if (game.carcassonneLabUrl) {
          const labBadge = document.createElement("a");
          labBadge.className = badge.className;
          Array.from(badge.childNodes).forEach((node) => {
            labBadge.appendChild(node.cloneNode(true));
          });
          labBadge.href = game.carcassonneLabUrl;
          labBadge.target = "_blank";
          labBadge.rel = "noopener noreferrer";
          labBadge.title = "Review game in CarcassonneLab";
          labBadge.setAttribute(
            "aria-label",
            `Review game ${badge.textContent.trim()} in CarcassonneLab`
          );
          labLinks.appendChild(labBadge);
        }
      });
      gameScores.appendChild(bgaRow);
      if (labLinks.childNodes.length) gameScores.appendChild(labRow);
      result.appendChild(gameScores);
    }

    return result;
  }

  // Streams of the duel, rendered like the main event streams in matches.html.
  function createChallengeMatchStreams(match) {
    if (!Array.isArray(match?.streamers)) return null;
    const streamUrls = Array.isArray(match?.streams) ? match.streams : [];
    const streamerNames = Array.isArray(match?.streamer_names) ? match.streamer_names : [];
    const section = document.createElement("section");
    section.className = "challenge-match-streams";
    match.streamers.forEach((iconUrl, index) => {
      const normalizedIconUrl = String(iconUrl || "").trim();
      const streamerName = String(streamerNames[index] || "").trim();
      if (!normalizedIconUrl && !streamerName) return;
      const streamUrl = String(streamUrls[index] || "").trim();
      const stream = document.createElement(streamUrl ? "a" : "span");
      stream.className = "challenge-match-stream";
      if (streamUrl) {
        stream.href = streamUrl;
        stream.target = "_blank";
        stream.rel = "noopener noreferrer";
      }
      if (normalizedIconUrl) {
        const icon = document.createElement("img");
        icon.className = "stream-icon";
        icon.src = normalizedIconUrl;
        icon.alt = streamerName ? "" : "Stream";
        stream.appendChild(icon);
      }
      if (streamerName) {
        const name = document.createElement("span");
        name.className = "challenge-match-stream__name";
        name.textContent = streamerName;
        stream.title = streamerName;
        stream.appendChild(name);
      }
      section.appendChild(stream);
    });
    return section.childNodes.length ? section : null;
  }

  function closeChallengeMatchModal() {
    const overlay = document.querySelector(".challenge-match-modal-overlay");
    if (!overlay) return;
    const returnFocus = overlay._returnFocus;
    overlay.remove();
    document.removeEventListener("keydown", handleChallengeMatchModalKeydown, true);
    if (returnFocus instanceof HTMLElement) returnFocus.focus({ preventScroll: true });
  }

  // Captured so that Esc closes only the popup, not the fullscreen bracket under it.
  function handleChallengeMatchModalKeydown(event) {
    if (event.key !== "Escape" && event.key !== "Esc") return;
    event.stopPropagation();
    closeChallengeMatchModal();
  }

  function openChallengeMatchModal(match, metaText, returnFocus) {
    closeChallengeMatchModal();
    const overlay = document.createElement("div");
    overlay.className = "challenge-match-modal-overlay";
    overlay._returnFocus = returnFocus;

    const dialog = document.createElement("div");
    dialog.className = "challenge-match-modal";
    dialog.setAttribute("role", "dialog");
    dialog.setAttribute("aria-modal", "true");
    dialog.setAttribute("aria-label", `${match?.team1 || "Player 1"} versus ${match?.team2 || "Player 2"}`);

    const closeButton = document.createElement("button");
    closeButton.type = "button";
    closeButton.className = "challenge-match-modal__close";
    closeButton.setAttribute("aria-label", "Close match details");
    closeButton.innerHTML = "&times;";
    closeButton.addEventListener("click", closeChallengeMatchModal);
    dialog.appendChild(closeButton);

    if (metaText) {
      const meta = document.createElement("div");
      meta.className = "challenge-match-modal__meta";
      meta.textContent = metaText;
      dialog.appendChild(meta);
    }

    const matchCard = document.createElement("div");
    matchCard.className = "challenge-match-card";
    matchCard.appendChild(createChallengePlayerCard(match?.player1Details || {}, "left"));
    const vs = document.createElement("div");
    vs.className = "challenge-match-card__vs";
    const vsContent = document.createElement("div");
    vsContent.className = "challenge-match-card__vs-content";
    const formatBadge = createMatchFormatBadge(match?.format, "challenge-match-format-badge");
    if (formatBadge) {
      formatBadge.classList.add("challenge-match-card__format");
      vs.appendChild(formatBadge);
    }
    const vsLabel = document.createElement("span");
    vsLabel.textContent = "VS";
    vsContent.appendChild(vsLabel);
    vs.appendChild(vsContent);
    matchCard.appendChild(vs);
    matchCard.appendChild(createChallengePlayerCard(match?.player2Details || {}, "right"));
    const matchResult = createChallengeMatchResult(match);
    if (matchResult) matchCard.appendChild(matchResult);
    const matchStreams = createChallengeMatchStreams(match);
    if (matchStreams) matchCard.appendChild(matchStreams);
    dialog.appendChild(matchCard);
    overlay.appendChild(dialog);

    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) closeChallengeMatchModal();
    });
    document.body.appendChild(overlay);
    document.addEventListener("keydown", handleChallengeMatchModalKeydown, true);
    closeButton.focus({ preventScroll: true });
  }


  // ---- Fantasy matches in that popup: a next match from the player list, a played one from the leaderboard.

  // Player of one side: GG profile first, then the duel row of main-page-matches, then this page's data.
  // The flag and country are the CCL association the player plays for, as on the qualifications page.
  function getFantasyPlayerDetails(playerId, cclDuel, side, playerDetailsById, fallback) {
    const id = String(playerId || "").trim();
    const indexed = playerDetailsById.get(id) || null;
    const ccl = cclDuel && String(cclDuel[`player_${side}_id`] || "").trim() === id ? cclDuel : null;
    const poolPlayer = (data?.players || []).find((player) => String(player.player_id || "").trim() === id) || null;
    return {
      id,
      nickname: String(indexed?.nickname || ccl?.[`player_${side}_name`] || poolPlayer?.nickname || fallback?.nickname || id).trim(),
      name: String(indexed?.name || ccl?.[`player_${side}_real_name`] || fallback?.name || "").trim(),
      avatar: String(
        indexed?.avatar
        || buildBgaAvatarUrl(id, ccl?.[`player_${side}_avatar`])
        || buildBgaAvatarUrl(id, fallback?.avatar)
        || ""
      ).trim(),
      flag: String(poolPlayer?.association?.flag || ccl?.[`player_${side}_association_flag`] || indexed?.flag || fallback?.flag || "").trim(),
      country: String(poolPlayer?.association?.name || ccl?.[`player_${side}_association_name`] || indexed?.country || fallback?.country || "").trim(),
      elo: indexed?.elo ?? ccl?.[`player_${side}_gg_elo`] ?? fallback?.elo ?? null,
      rank: indexed?.rank ?? ccl?.[`player_${side}_gg_rank`] ?? fallback?.rank ?? null,
      bgaElo: indexed?.bgaElo ?? ccl?.[`player_${side}_bga_elo`] ?? fallback?.bgaElo ?? null,
    };
  }

  // match: a next_match of the player list or a match of the team details
  // ({ duel_id, player_1_id, player_2_id, dw1?, dw2?, format, status, time_utc, stage, group, round_name }).
  function buildFantasyPopupMatch(match, details) {
    const cclDuel = details.cclDuelsById.get(String(match.duel_id || "").trim()) || null;
    const fallbackById = new Map([match.player, match.opponent].filter((player) => player?.id).map((player) => [String(player.id), player]));
    const player1 = getFantasyPlayerDetails(match.player_1_id, cclDuel, 1, details.playerDetailsById, fallbackById.get(String(match.player_1_id)));
    const player2 = getFantasyPlayerDetails(match.player_2_id, cclDuel, 2, details.playerDetailsById, fallbackById.get(String(match.player_2_id)));
    const hasScore = match.dw1 !== null && match.dw1 !== undefined && match.dw2 !== null && match.dw2 !== undefined;
    return {
      team1: player1.nickname,
      team2: player2.nickname,
      format: String(cclDuel?.duel_format || match.format || "").trim(),
      status: String(cclDuel?.status || match.status || "").trim(),
      gw1: cclDuel ? cclDuel.dw1 : (hasScore ? match.dw1 : null),
      gw2: cclDuel ? cclDuel.dw2 : (hasScore ? match.dw2 : null),
      games: Array.isArray(cclDuel?.games) ? cclDuel.games.filter(Boolean) : [],
      ...normalizeStreamFields(cclDuel),
      player1Details: player1,
      player2Details: player2,
    };
  }

  // "22 Nov 14:30" in the viewer's time, as the qualifications page shows match times.
  function formatPopupTime(iso) {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return "";
    const dayMon = date.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
    const hm = date.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
    return `${dayMon} ${hm}`;
  }

  // "Q3 · Group A · Round 1 · 22 Nov 14:30"; a match without a time shows its deadline.
  function getFantasyPopupMetaText(match) {
    let when = "";
    if (match.time_utc) when = formatPopupTime(match.time_utc);
    else if (match.deadline_utc) when = `Play by ${formatPopupTime(match.deadline_utc)}`;
    return [match.stage, match.group ? `Group ${match.group}` : "", match.round_name, when].filter(Boolean).join(" · ");
  }

  function openFantasyMatchModal(match, returnFocus) {
    loadDuelDetails()
      .catch(() => ({ cclDuelsById: new Map(), playerDetailsById: new Map() }))
      .then((details) => {
        openChallengeMatchModal(buildFantasyPopupMatch(match, details), getFantasyPopupMetaText(match), returnFocus);
      });
  }

  const afterMainDeadline = () => season().status === "late" || season().status === "closed";

  function renderTabs() {
    const bar = el("div", "ff-tabs");
    bar.setAttribute("role", "tablist");
    [["team", data.viewer?.authenticated ? "My team" : "Players"], ["leaderboard", "Leaderboard"]].forEach(([key, label]) => {
      const button = el("button", `ff-tab${tab === key ? " active" : ""}`, label);
      button.type = "button";
      button.setAttribute("role", "tab");
      button.setAttribute("aria-selected", String(tab === key));
      button.addEventListener("click", () => {
        if (tab === key) return;
        tab = key;
        if (tab === "leaderboard" && afterMainDeadline() && !leaderboard && !leaderboardLoading) loadLeaderboard();
        render();
      });
      bar.appendChild(button);
    });
    return bar;
  }

  function render() {
    if (!data) return;
    root.innerHTML = "";
    root.appendChild(renderHead());
    root.appendChild(renderNotice());
    root.appendChild(renderTabs());
    if (tab === "leaderboard") {
      root.appendChild(renderLeaderboard());
      return;
    }
    const grid = el("div", "ff-grid");
    grid.appendChild(data.viewer?.authenticated ? renderTeamPanel() : renderGuestPanel());
    grid.appendChild(renderPool());
    root.appendChild(grid);
  }

  // ---- Leaderboard (public from the main deadline)

  function loadLeaderboard() {
    leaderboardLoading = true;
    leaderboardError = null;
    fetch(LEADERBOARD_URL, { credentials: "include" })
      .then((response) => response.json().then((result) => {
        if (!response.ok || !result?.ok) throw new Error(result?.message || "Failed to load the leaderboard");
        return result;
      }))
      .then((result) => {
        leaderboard = result;
        // Points may have changed: open rows load their teams again.
        teamDetails.clear();
        expanded.forEach((teamId) => loadTeamDetails(teamId));
      })
      .catch((error) => {
        leaderboardError = error.message;
      })
      .finally(() => {
        leaderboardLoading = false;
        if (tab === "leaderboard") render();
      });
  }

  function loadTeamDetails(teamId) {
    teamDetails.set(teamId, { loading: true });
    fetch(teamDetailsUrl(teamId), { credentials: "include" })
      .then((response) => response.json().then((result) => {
        if (!response.ok || !result?.ok) throw new Error(result?.message || "Failed to load the team");
        return result.team;
      }))
      .then((teamData) => teamDetails.set(teamId, { team: teamData }))
      .catch((error) => teamDetails.set(teamId, { error: error.message }))
      .finally(() => {
        if (tab === "leaderboard") render();
      });
  }

  function toggleTeamRow(teamId) {
    if (expanded.has(teamId)) expanded.delete(teamId);
    else {
      expanded.add(teamId);
      if (!teamDetails.has(teamId) || teamDetails.get(teamId).error) loadTeamDetails(teamId);
    }
    render();
  }

  function renderLeaderboard() {
    const panel = el("div", "ff-panel");
    const head = el("div", "ff-panel-head");
    head.appendChild(el("h3", "", "Leaderboard"));
    panel.appendChild(head);
    if (!afterMainDeadline()) {
      panel.appendChild(el("div", "ff-empty", `The leaderboard appears after the main deadline, ${formatUtc(season().main_deadline)}.`));
      // How many complete teams have been saved so far.
      const formed = Number(data.teams_formed) || 0;
      const counter = el("div", "ff-count");
      counter.append(
        el("span", "ff-count-value", String(formed)),
        el("span", "ff-count-label", `${formed === 1 ? "team" : "teams"} formed so far`)
      );
      panel.appendChild(counter);
      return panel;
    }
    if (leaderboardError) {
      panel.appendChild(el("div", "ff-note bad", leaderboardError));
      return panel;
    }
    if (!leaderboard) {
      panel.appendChild(el("div", "ff-empty", "Loading the leaderboard…"));
      return panel;
    }
    if (leaderboard.last_result_at) {
      head.appendChild(el("span", "ff-tag", `Latest result: ${formatUtc(leaderboard.last_result_at)}`));
    }
    if (!leaderboard.teams.length) {
      panel.appendChild(el("div", "ff-empty", "No teams in the game yet."));
      return panel;
    }
    const wrap = el("div", "ff-table-wrap");
    wrap.style.maxHeight = "none";
    const table = el("table", "ff-table");
    const thead = el("thead");
    const headRow = el("tr");
    [["", ""], ["#", "num"], ["Team", ""], ["Owner", ""], ["Points", "num"]]
      .forEach(([label, className]) => headRow.appendChild(el("th", className, label)));
    thead.appendChild(headRow);
    const tbody = el("tbody");
    leaderboard.teams.forEach((row) => {
      const open = expanded.has(row.team_id);
      const tr = el("tr", `ff-lb-row${row.team_id === leaderboard.my_team_id ? " mine" : ""}`);
      tr.tabIndex = 0;
      tr.setAttribute("aria-expanded", String(open));
      const chevron = el("td", "chevron");
      chevron.appendChild(el("i", `fa-solid fa-chevron-${open ? "down" : "right"}`));
      const nameCell = el("td");
      nameCell.appendChild(el("span", "ff-player-name", row.team_name));
      if (row.entry_type === "late") nameCell.append(" ", el("span", "ff-badge warn", "late"));
      tr.append(
        chevron,
        el("td", "num", String(row.rank)),
        nameCell,
        el("td", row.owner ? "" : "ff-tag", row.owner || "Pending verification"),
        el("td", "num", String(row.points))
      );
      tr.addEventListener("click", () => toggleTeamRow(row.team_id));
      tr.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggleTeamRow(row.team_id);
        }
      });
      tbody.appendChild(tr);
      if (open) {
        const detailRow = el("tr", "ff-lb-detail-row");
        const cell = el("td");
        cell.colSpan = 5;
        cell.appendChild(renderTeamDetails(row.team_id));
        detailRow.appendChild(cell);
        tbody.appendChild(detailRow);
      }
    });
    table.append(thead, tbody);
    wrap.appendChild(table);
    panel.appendChild(wrap);
    return panel;
  }

  const STATUS_LABELS = { eliminated: "Eliminated", qualified: "Qualified to League", playing: "" };

  function renderTeamDetails(teamId) {
    const box = el("div", "ff-lb-detail");
    const entry = teamDetails.get(teamId);
    if (!entry || entry.loading) {
      box.appendChild(el("div", "ff-lb-meta", "Loading…"));
      return box;
    }
    if (entry.error) {
      box.appendChild(el("div", "ff-message bad", entry.error));
      return box;
    }
    const details = entry.team;
    const meta = [`Spent ${credits(details.spent)} / ${credits(season().budget)}`];
    if (details.committed_at) meta.push(`Committed ${formatUtc(details.committed_at)}: only matches from then on count`);
    box.appendChild(el("div", "ff-lb-meta", meta.join(" · ")));
    details.players.forEach((player) => {
      const row = el("div", "ff-lb-player");
      const label = el("div", "ff-player");
      if (player.association?.flag) {
        const flag = el("img", "ff-flag");
        flag.src = player.association.flag;
        flag.alt = player.association.name || "";
        flag.title = player.association.name || "";
        label.appendChild(flag);
      }
      label.append(
        el("span", "ff-player-name", player.nickname),
        el("span", "ff-tag", [player.stage, player.group ? `Group ${player.group}` : ""].filter(Boolean).join(" · ")),
        el("span", "ff-tag", `${credits(player.price_at_pick)} cr`)
      );
      if (STATUS_LABELS[player.status]) label.appendChild(el("span", `ff-tag${player.status === "eliminated" ? " out" : ""}`, STATUS_LABELS[player.status]));
      // "5 : 2-1 0-2 2-0": the player's points for this team, then the scores of their matches.
      const score = el("div", "ff-lb-score");
      score.appendChild(el("strong", "", `${player.points} :`));
      if (!player.matches.length) score.appendChild(el("span", "ff-tag", "no matches yet"));
      player.matches.forEach((match) => {
        const [own, opp] = match.score.split("-").map(Number);
        // A click opens the match details popup (the same as on the qualifications page).
        const chip = el("button", `ff-match ${match.counted ? (own > opp ? "win" : "loss") : "skip"}`, match.score);
        chip.type = "button";
        chip.setAttribute("aria-haspopup", "dialog");
        chip.setAttribute("aria-label", `${player.nickname} vs ${match.opponent || "opponent"} ${match.score}, ${match.points} pt${match.points === 1 ? "" : "s"}${match.counted ? "" : ", not counted"}`);
        if (!match.counted) chip.title = "Not counted: played before the team was committed";
        chip.addEventListener("click", () => openFantasyMatchModal(match, chip));
        score.appendChild(chip);
      });
      row.append(label, score);
      box.appendChild(row);
    });
    return box;
  }

  function renderGuestPanel() {
    const panel = el("div", "ff-panel");
    panel.append(
      el("h3", "", "My team"),
      el("div", "ff-hint", `Sign in to pick ${season().team_size} players within a budget of ${credits(season().budget)} credits.`)
    );
    return panel;
  }

  // kind: "save" | "commit" | "rename" (the name only, also of a locked team) | "delete".
  const REQUESTS = {
    save: { url: TEAM_URL, method: "PUT", done: "Team saved." },
    commit: { url: COMMIT_URL, method: "POST", done: "Your team is committed." },
    rename: { url: RENAME_URL, method: "PATCH", done: "Saved." },
    delete: { url: TEAM_URL, method: "DELETE", done: "Your team is deleted." },
  };

  async function submit(kind) {
    if (busy) return;
    const request = REQUESTS[kind];
    busy = true;
    message = null;
    render();
    try {
      const nickname = needsNickname() ? { bga_nickname: draft.bga_nickname.trim() } : {};
      const body = kind === "delete" ? {}
        : kind === "rename" ? { team_name: draft.team_name.trim(), ...nickname }
          : { team_name: draft.team_name.trim(), slot_ids: draft.slot_ids, ...nickname };
      const response = await fetch(request.url, {
        method: request.method,
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) throw new Error(result.message || "Saving failed. Please try again.");
      data.viewer.team = kind === "delete" ? null : result.team;
      draft = savedDraft();
      message = { kind: "ok", text: request.done };
    } catch (error) {
      message = { kind: "bad", text: error.message };
    } finally {
      busy = false;
      render();
    }
  }

  let loadRequest = 0;

  function loadState() {
    const request = ++loadRequest;
    fetch(STATE_URL, { credentials: "include" })
      .then((response) => {
        if (!response.ok) throw new Error("Failed to load Fantasy");
        return response.json();
      })
      .then((result) => {
        if (request !== loadRequest) return;
        if (!result?.ok || !Array.isArray(result.players)) throw new Error("Failed to load Fantasy");
        // Keep unsaved picks when the state reloads for the same viewer (e.g. at a deadline).
        const keepDraft = draft && data && data.viewer?.authenticated === result.viewer?.authenticated && isDirty();
        data = result;
        if (!keepDraft) draft = savedDraft();
        // From the main deadline the page opens on the leaderboard.
        if (!tab) tab = afterMainDeadline() ? "leaderboard" : "team";
        if (tab === "leaderboard" && afterMainDeadline()) loadLeaderboard();
        else leaderboard = null;
        render();
      })
      .catch((error) => {
        if (request !== loadRequest) return;
        console.error("Failed to load CCL Fantasy", error);
        root.innerHTML = "";
        root.appendChild(el("div", "ff-note bad", "Failed to load Fantasy. Please reload the page."));
      });
  }

  // The site header announces sign-in and sign-out without a page reload.
  function onAuthStateChange(event) {
    const authenticated = Boolean(event.detail?.authenticated);
    if (data && authenticated === Boolean(data.viewer?.authenticated)) return;
    draft = null;
    loadState();
  }

  window.addEventListener("gg-auth-state-change", onAuthStateChange);
  try {
    if (window.parent !== window) window.parent.addEventListener("gg-auth-state-change", onAuthStateChange);
  } catch (_error) {
    // Cross-origin parent: only this window's events are heard.
  }

  loadState();

  // Lets the parent page fit the iframe to the content, if it listens.
  if (window.parent !== window && "ResizeObserver" in window) {
    new ResizeObserver(() => {
      window.parent.postMessage({ type: "fantasy:height", height: document.documentElement.scrollHeight }, "*");
    }).observe(document.body);
  }
})();
</script>
