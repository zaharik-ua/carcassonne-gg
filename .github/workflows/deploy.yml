name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            git config --global --add safe.directory /home/carcassonne-gg
            cd /home/carcassonne-gg
            before_sha="$(git rev-parse HEAD)"
            git stash push -m "auto-deploy-$(date +%Y%m%d-%H%M%S)" || true
            git pull --rebase origin main
            after_sha="$(git rev-parse HEAD)"

            if [ "${before_sha}" = "${after_sha}" ]; then
              echo "Production checkout is already up to date; skipping auth-server restart."
              exit 0
            fi

            if git diff --quiet "${before_sha}" "${after_sha}" -- auth-server/; then
              echo "No auth-server changes detected; skipping npm install and service restart."
              exit 0
            fi

            cd /home/carcassonne-gg/auth-server
            test -f /home/carcassonne-gg/auth-server/.env || {
              echo "ERROR: /home/carcassonne-gg/auth-server/.env is missing"
              exit 1
            }
            npm install
            systemctl restart carcassonne-auth.service || {
              systemctl --no-pager --full status carcassonne-auth.service || true
              journalctl --no-pager -xeu carcassonne-auth.service -n 200 || true
              exit 1
            }

            healthy=0
            for attempt in $(seq 1 45); do
              if curl -fsS --max-time 2 http://127.0.0.1:3100/health >/dev/null; then
                healthy=1
                break
              fi
              sleep 1
            done

            if [ "${healthy}" -ne 1 ]; then
              echo "ERROR: auth-server did not become healthy after restart"
              systemctl --no-pager --full status carcassonne-auth.service || true
              journalctl --no-pager -xeu carcassonne-auth.service -n 200 || true
              exit 1
            fi
